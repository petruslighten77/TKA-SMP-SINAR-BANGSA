s":["orientasi","komplikasi","klimaks","resolusi"],"statements":null,"answer":["D"],"explain":"Konflik sudah selesai dan perasaan para tokoh lega. Itulah tahap resolusi atau penyelesaian. **(D)**","passage":2},{"n":16,"type":"KAT","level":"L2","stem":"Tentukan benar atau salah setiap pernyataan berikut berdasarkan penggalan drama.","extra":[],"options":null,"statements":["Pengawas datang lebih awal daripada jadwal yang diketahui Pak Bowo.","Pak Bowo memperlakukan lelaki itu dengan hormat sejak awal.","Drama mengandung ironi karena tamu yang ditunggu ternyata orang yang disuruh menyapu.","Lala menyebutkan bahwa sekolah sudah memiliki bank sampah."],"answer":["B","S","B","S"],"explain":"(1) Benar, pengawas sudah tiba pukul delapan, padahal ditunggu pukul sembilan. (2) Salah, Pak Bowo mengusirnya dan menyuruhnya menyapu. (3) Benar, kenyataan berlawanan dengan dugaan. (4) Salah, Lala berkata tempatnya \"belum ada\" dan bank sampah baru diusulkan. **(B, S, B, S)**","passage":3},{"n":17,"type":"PG","level":"L3","stem":"Amanat yang paling tepat dari penggalan drama \"Tamu Penting\" adalah ….","extra":[],"options":["jangan menilai orang dari penampilannya","tamu harus disambut dengan upacara","siswa tidak perlu ikut menyapu","pengawas harus selalu berpakaian rapi"],"statements":null,"answer":["A"],"explain":"Pak Bowo salah menilai pengawas karena pakaiannya sederhana. **(A)**","passage":3},{"n":18,"type":"PG","level":"L3","stem":"Pertanyaan lelaki itu tentang tempat memilah sampah paling tepat ditafsirkan sebagai ….","extra":[],"options":["keinginannya membeli tempat sampah","caranya mengamati keadaan sekolah yang sebenarnya sebagai bagian dari tugasnya","keinginannya bergabung dengan OSIS","kekesalannya kepada Lala"],"statements":null,"answer":["B"],"explain":"Pengawas datang lebih awal dan berbaur, sehingga dapat melihat kebiasaan sekolah yang sebenarnya, bukan yang disiapkan untuk tamu. **(B)**","passage":3},{"n":19,"type":"PGK","level":"L3","stem":"Pilih **semua** bagian naskah yang termasuk petunjuk lakuan dan menggambarkan perasaan atau sikap tokoh.","extra":[],"options":["\"(mondar-mandir dengan gelisah)\"","\"(tersenyum)\"","\"(menoleh perlahan ke arah belakang kantin)\"","\"Pukul sembilan lewat.\"","\"Halo? Pak Pengawas sudah di mana?\""],"statements":null,"answer":["A","B","C"],"explain":"A, B, dan C adalah petunjuk lakuan yang memperlihatkan perasaan: gelisah, ramah, dan kaget yang perlahan. D hanya keterangan waktu. E adalah dialog. **(A, B, C)**","passage":3},{"n":20,"type":"PG","level":"L2","stem":"Suasana pada akhir penggalan drama tersebut adalah ….","extra":[],"options":["haru","tegang dan mencekam","lucu sekaligus memalukan bagi Pak Bowo","sedih"],"statements":null,"answer":["C"],"explain":"Pak Bowo baru sadar telah menyuruh pengawas menyapu, sedangkan pengawas melambaikan sapu dengan santai. Suasananya lucu sekaligus memalukan bagi Pak Bowo. **(C)**","passage":3},{"n":21,"type":"KAT","level":"L2","stem":"Tentukan benar atau salah setiap pernyataan berikut berdasarkan penggalan drama.","extra":[],"options":null,"statements":["Kirana merasa gugup sebelum tampil.","Bu Ana memarahi Kirana karena gugup.","Kirana akhirnya naik ke panggung sambil membawa teksnya.","Ucapan \"Gemetar itu tanda kamu peduli\" bertujuan menenangkan Kirana."],"answer":["B","S","S","B"],"explain":"(1) Benar, ia meremas kertas dan berkata tangannya gemetar. (2) Salah, Bu Ana menggenggam tangannya dan menenangkan. (3) Salah, ia naik \"tanpa membawa kertasnya\". (4) Benar, kalimat itu mengubah rasa gugup menjadi hal yang wajar. **(B, S, S, B)**","passage":4},{"n":22,"type":"PG","level":"L2","stem":"Kalimat tidak langsung yang tepat untuk dialog Kirana \"Bu, saya tidak bisa. Tangan saya gemetar.\" adalah ….","extra":[],"options":["Kirana berkata kepada Bu Ana bahwa ia tidak bisa karena tangannya gemetar.","Kirana berkata, \"Saya tidak bisa.\"","Bu Ana berkata bahwa tangannya gemetar.","Kirana berkata kepada Bu Ana bahwa saya tidak bisa karena tangan saya gemetar."],"statements":null,"answer":["A"],"explain":"Dalam kalimat tidak langsung, tanda petik dihilangkan, kata hubung \"bahwa\" dipakai, dan kata ganti orang pertama \"saya\" diubah menjadi \"ia\" atau \"-nya\". D salah karena masih memakai \"saya\". **(A)**","passage":4},{"n":23,"type":"PG","level":"L3","stem":"Tindakan Kirana melangkah ke panggung tanpa membawa kertas teksnya menunjukkan bahwa ….","extra":[],"options":["Kirana lupa membawa kertasnya","kertas teks Kirana hilang","Kirana menyerah dan tidak akan berpidato","kepercayaan diri Kirana mulai tumbuh"],"statements":null,"answer":["D"],"explain":"Sebelumnya Kirana takut lupa teks. Ia kini berani tampil tanpa kertas, tanda kepercayaan dirinya tumbuh setelah disemangati. **(D)**","passage":4},{"n":24,"type":"PGK","level":"L3","stem":"Pilih **semua** kalimat narasi yang sesuai dengan isi penggalan drama tersebut.","extra":[],"options":["Di belakang panggung, Kirana meremas kertas teksnya karena gugup.","Bu Ana menggenggam tangan Kirana dan mengingatkan bahwa ia sedang berbagi cerita, bukan melawan juri.","Bu Ana menyuruh Kirana mengundurkan diri dari lomba.","Bu Ana memberi tahu Kirana bahwa ibunya duduk di baris ketiga.","Kirana naik ke panggung sambil membaca teksnya."],"statements":null,"answer":["A","B","D"],"explain":"A, B, dan D sesuai isi drama. C bertentangan dengan dialog Bu Ana. E salah karena Kirana tidak membawa kertasnya. **(A, B, D)**","passage":4},{"n":25,"type":"PG","level":"L2","stem":"Watak Bu Ana yang tergambar dalam penggalan drama adalah ….","extra":[],"options":["pemarah","sabar dan pandai memotivasi","acuh tak acuh","mudah panik"],"statements":null,"answer":["B"],"explain":"Bu Ana menenangkan dengan lembut dan memberi semangat yang tepat sasaran. **(B)**","passage":4},{"n":26,"type":"KAT","level":"L3","stem":"Tentukan benar atau salah setiap pernyataan berikut berdasarkan penggalan drama.","extra":[],"options":null,"statements":["Hendra ingin menjual sawah warisan.","Lastri berperan sebagai tokoh penengah.","Yudi bekerja di kota.","Ucapan Hendra pada akhir penggalan menunjukkan ia menyadari kekeliruannya."],"answer":["B","B","S","B"],"explain":"(1) Benar, Hendra membawa pembeli. (2) Benar, Lastri meredakan perdebatan dan memberi jalan keluar. (3) Salah, yang bekerja di kota adalah Hendra; Yudi menggarap sawah. (4) Benar, ia berkata \"Aku malu\". **(B, B, S, B)**","passage":5},{"n":27,"type":"PG","level":"L3","stem":"Makna ungkapan \"sawah dan saudara jangan sampai sama-sama retak\" adalah ….","extra":[],"options":["sawah harus diairi agar tanahnya tidak retak","saudara harus tinggal dalam satu rumah","persaudaraan harus dijaga agar tidak rusak karena urusan harta","sawah warisan tidak boleh dibagi"],"statements":null,"answer":["C"],"explain":"\"Retak\" pada sawah berarti tanahnya rusak; pada saudara berarti hubungannya rusak. Pesannya: jangan sampai urusan harta merusak persaudaraan. **(C)**","passage":5},{"n":28,"type":"PG","level":"L2","stem":"Berdasarkan ucapan Lastri, alasan Hendra ingin menjual sawah adalah ….","extra":[],"options":["membiayai kuliah anaknya, Dinda","membeli mobil baru","membayar utang Yudi","membangun rumah di desa"],"statements":null,"answer":["A"],"explain":"Lastri berkata, \"Mas Hendra butuh uang untuk biaya kuliah Dinda, kan?\" **(A)**","passage":5},{"n":29,"type":"PGK","level":"L3","stem":"Pilih **semua** pernyataan yang tepat tentang konflik dalam penggalan drama tersebut.","extra":[],"options":["Konflik terjadi antara Hendra dan Yudi.","Konflik dipicu perbedaan pandangan tentang nilai sawah: harta yang bisa dijual atau mata pencaharian dan kenangan.","Konflik mulai diselesaikan melalui musyawarah keluarga.","Konflik berakhir dengan sawah dijual.","Konflik diselesaikan oleh kepala desa."],"statements":null,"answer":["A","B","C"],"explain":"A, B, dan C tepat. D salah, Lastri mengusulkan sawah tidak dijual dan Hendra menerimanya. E salah, tidak ada kepala desa dalam penggalan ini. **(A, B, C)**","passage":5},{"n":30,"type":"PG","level":"L3","stem":"Petunjuk lakuan \"(meletakkan nampan dengan agak keras)\" menunjukkan bahwa Lastri ….","extra":[],"options":["ceroboh dalam bekerja","kesulitan membawa nampan yang berat","ingin segera minum teh","ingin menghentikan perdebatan dan menarik perhatian kedua kakaknya"],"statements":null,"answer":["D"],"explain":"Bunyi nampan yang agak keras membuat kedua kakaknya terdiam, lalu Lastri menyampaikan nasihat Bapak. Ia ingin menghentikan perdebatan. **(D)**","passage":5}]},{"id":"BI13","title":"BI 13 · Sastra: Cerita Rakyat, Hikayat, dan Fabel","intro":"**Fokus:** memahami prosa lama dan cerita rakyat. **Materi:** jenis cerita rakyat (dongeng, legenda, mite, fabel), ciri hikayat (istanasentris, kemustahilan, kata arkais), nilai-nilai dalam cerita, penokohan, konflik, amanat, serta perbandingan hikayat dengan cerpen modern.","passages":["> **Pipit dan Elang Muda**\n>\n> (1) Di tepi Hutan Randu, hiduplah seekor elang muda yang sangat bangga pada sayapnya. Setiap pagi ia terbang rendah di atas sarang-sarang burung kecil sambil berseru, \"Siapa yang bisa terbang setinggi aku?\"\n>\n> (2) Suatu hari, langit mendadak gelap. Angin kencang bertiup dan hujan es turun. Elang muda terbang tinggi untuk menghindarinya, tetapi angin justru menghempaskannya ke semak berduri. Sayapnya terkilir.\n>\n> (3) Seekor pipit yang biasa diejeknya melihat kejadian itu. Tanpa menunggu badai reda, pipit memanggil kawan-kawannya. Mereka membawa daun-daun lebar untuk menutupi tubuh elang dan bergantian mencarikan makanan selama tiga hari.\n>\n> (4) \"Mengapa kalian menolongku? Aku selalu mengejek kalian,\" tanya elang dengan suara lirih.\n>\n> (5) Pipit menjawab, \"Sayap yang kuat memang berguna untuk terbang tinggi. Tetapi hati yang baik berguna untuk turun menolong.\"\n>\n> (6) Sejak hari itu, elang tidak pernah lagi menyombongkan diri. Setiap kali melihat sarang pipit diganggu ular, dialah yang pertama datang mengusirnya.","> **Hikayat Puteri Cahaya Bulan**\n>\n> (1) Sebermula, maka tersebutlah perkataan sebuah negeri bernama Kuala Bentan, rajanya bernama Sultan Mahkota Alam. Baginda beroleh seorang puteri yang amat elok parasnya, Puteri Cahaya Bulan namanya.\n>\n> (2) Hatta, pada suatu masa, negeri itu dilanda kemarau tujuh tahun lamanya. Sawah ladang kering, rakyat pun banyak yang kelaparan. Maka Sultan pun bertitah memanggil segala ahli nujum.\n>\n> (3) Kata ahli nujum, \"Ya Tuanku, hujan tiada akan turun selagi mata air di puncak Gunung Kemuning tersumbat batu besar. Barang siapa sanggup mengangkat batu itu, niscaya pulihlah negeri.\"\n>\n> (4) Syahdan, banyaklah hulubalang yang mencoba, tetapi seorang pun tiada berhasil. Maka Puteri Cahaya Bulan pun memohon izin kepada ayahandanya untuk naik ke gunung. Ia tiada membawa senjata, hanya sebuah serunai pemberian bundanya.\n>\n> (5) Setibanya di puncak, Puteri pun meniup serunai itu tiga kali. Dengan takdir Allah, burung-burung dari segenap penjuru datang berkerumun dan bersama-sama mematuk batu itu hingga terbelah dua. Air pun memancar, dan hujan turunlah tujuh hari tujuh malam lamanya.\n>\n> (6) Maka sukacitalah segala rakyat. Sejak itu, setiap musim tanam rakyat Kuala Bentan menabur biji-bijian di puncak Gunung Kemuning sebagai tanda terima kasih kepada burung-burung.","> **Malin Kundang** (diceritakan kembali)\n>\n> (1) Konon, di sebuah kampung nelayan di pesisir Sumatra Barat, hiduplah seorang janda bersama anak lelakinya, Malin Kundang. Karena hidup serba kekurangan, Malin memutuskan merantau dengan menumpang kapal seorang saudagar. Ibunya melepas kepergiannya dengan berat hati.\n>\n> (2) Bertahun-tahun di rantau, Malin bekerja keras hingga menjadi saudagar kaya dan menikahi seorang perempuan bangsawan. Suatu hari kapalnya yang megah berlabuh di kampung halamannya.\n>\n> (3) Mendengar kabar itu, ibunya bergegas ke dermaga dan memeluk Malin. Namun, Malin malu mengakui perempuan tua berpakaian lusuh itu sebagai ibunya di depan istrinya. Ia mendorong ibunya hingga jatuh, lalu memerintahkan anak buahnya berlayar.\n>\n> (4) Dengan hati hancur, sang ibu berdoa agar Tuhan menunjukkan keadilan-Nya. Tak lama kemudian, badai dahsyat menghantam kapal Malin, dan tubuh Malin perlahan mengeras menjadi batu. Masyarakat setempat meyakini batu yang menyerupai orang bersujud di Pantai Air Manis adalah sisa kisah itu.","> **Kolam di Hutan Jati**\n>\n> (1) Musim kemarau membuat kolam di tengah Hutan Jati tinggal separuh. Para hewan pun berkumpul di bawah pohon jati tertua. Gajah, hewan terbesar di hutan itu, langsung berkata, \"Aku yang paling banyak minum, jadi aku berhak mendapat bagian paling besar.\"\n>\n> (2) Rusa menunduk, monyet bersungut-sungut, dan burung-burung kecil hanya bisa saling pandang. Kalau gajah minum sepuasnya, kolam itu akan kering dalam tiga hari.\n>\n> (3) Kura-kura tua yang sejak tadi diam mengangkat kepalanya. \"Gajah, kakimu kuat dan belalaimu panjang. Di lembah sebelah ada mata air yang tertutup longsoran tanah. Hanya engkau yang mampu membukanya. Kalau mata air itu mengalir ke kolam ini, semua hewan, termasuk engkau, tak akan kehausan lagi.\"\n>\n> (4) Gajah terdiam. Belum pernah ada yang memuji kekuatannya sebagai sesuatu yang bisa menolong. Esok paginya ia pergi ke lembah bersama para monyet yang menunjukkan jalan dan burung-burung yang mengawasi dari udara.\n>\n> (5) Dua hari kemudian, air jernih mengalir ke kolam. Gajah minum paling akhir, dan untuk pertama kalinya ia merasa air itu terasa lebih segar.","> **Teks 1** (penggalan hikayat, diceritakan kembali)\n>\n> Sebermula, adalah seorang penjual kayu yang amat miskin di negeri Inderapura. Pada suatu hari, tatkala ia membelah kayu di tepi sungai, kapaknya terjatuh ke dalam air. Maka menangislah ia. Hatta, muncullah seorang tua berjubah putih dari dalam sungai membawa sebilah kapak emas. \"Inikah kapakmu?\" tanyanya. Maka sembah si penjual kayu, \"Bukan, ya Tuan Hamba, kapak hamba hanyalah kapak besi.\" Maka orang tua itu pun berkenan hatinya, lalu dianugerahkannya kapak emas itu beserta kapak besi miliknya kepada si penjual kayu.\n\n> **Teks 2** (penggalan cerpen)\n>\n> Rafi menemukan dompet cokelat di kursi angkot. Di dalamnya ada uang dua juta rupiah dan kartu pelajar atas nama Wina. Rafi teringat sepatunya yang sudah robek. Namun, ia turun di halte berikutnya, berjalan ke sekolah yang tertera di kartu itu, dan menitipkan dompet kepada satpam. Esoknya, kepala sekolah memanggil Rafi ke depan saat upacara. Ternyata Wina menelepon sekolah Rafi untuk berterima kasih.","> **Timun Mas** (diceritakan kembali)\n>\n> (1) Konon, di sebuah desa di Jawa Tengah hiduplah Mbok Sirni, seorang janda yang sangat menginginkan anak. Suatu hari datanglah raksasa yang memberinya biji mentimun. \"Tanamlah. Kelak engkau akan mendapat anak perempuan. Tetapi saat ia berumur enam belas tahun, serahkan ia kepadaku.\"\n>\n> (2) Dari mentimun emas yang tumbuh, lahirlah bayi perempuan yang dinamai Timun Mas. Makin besar Timun Mas, makin sayang Mbok Sirni kepadanya, dan makin takut pula ia akan janjinya.\n>\n> (3) Atas petunjuk seorang pertapa, Mbok Sirni membekali Timun Mas empat bungkusan: biji mentimun, jarum, garam, dan terasi. Ketika raksasa datang, Timun Mas berlari. Setiap kali raksasa hampir menangkapnya, ia menebar satu bungkusan. Biji mentimun menjadi ladang mentimun yang lebat, jarum menjadi hutan bambu yang tajam, garam menjadi lautan, dan terasi menjadi lautan lumpur mendidih.\n>\n> (4) Raksasa itu akhirnya tenggelam dalam lumpur. Timun Mas pulang dan hidup bahagia bersama ibunya."],"questions":[{"n":1,"type":"PG","level":"L1","stem":"Berdasarkan tokoh dan isinya, teks \"Pipit dan Elang Muda\" termasuk ….","extra":[],"options":["fabel","hikayat","legenda","mite"],"statements":null,"answer":["A"],"explain":"Tokohnya hewan yang berbicara dan bersikap seperti manusia, dan ceritanya membawa pesan moral. Itulah fabel. **(A)**","passage":0},{"n":2,"type":"PG","level":"L2","stem":"Watak elang muda pada awal cerita adalah ….","extra":[],"options":["rendah hati","sombong","penakut","dermawan"],"statements":null,"answer":["B"],"explain":"Elang berseru \"Siapa yang bisa terbang setinggi aku?\" sambil terbang di atas sarang burung kecil. Ia menyombongkan diri. **(B)**","passage":0},{"n":3,"type":"KAT","level":"L2","stem":"Tentukan benar atau salah setiap pernyataan berikut berdasarkan cerita.","extra":[],"options":null,"statements":["Tokoh dalam cerita adalah hewan yang berpikir dan berbicara seperti manusia.","Pipit menolong elang setelah badai reda.","Elang mengalami perubahan watak pada akhir cerita.","Pipit menolong elang seorang diri."],"answer":["B","S","B","S"],"explain":"(1) Benar, pipit dan elang bercakap-cakap. (2) Salah, pipit menolong \"tanpa menunggu badai reda\". (3) Benar, elang berhenti sombong dan justru melindungi pipit. (4) Salah, pipit memanggil kawan-kawannya. **(B, S, B, S)**","passage":0},{"n":4,"type":"PG","level":"L3","stem":"Makna jawaban pipit pada paragraf (5) adalah ….","extra":[],"options":["kekuatan fisik sama sekali tidak berguna","pipit ingin memiliki sayap sekuat elang","kebaikan hati lebih bermakna karena mendorong kita menolong sesama","pipit iri kepada elang"],"statements":null,"answer":["C"],"explain":"Pipit tidak meremehkan sayap kuat, tetapi menegaskan bahwa hati baik membuat kita mau \"turun menolong\". **(C)**","passage":0},{"n":5,"type":"PGK","level":"L3","stem":"Pilih **semua** amanat yang sesuai dengan cerita tersebut.","extra":[],"options":["Jangan menyombongkan kelebihan diri.","Tolonglah sesama walaupun pernah disakiti.","Balaslah setiap ejekan dengan ejekan.","Kebaikan dapat mengubah sikap orang lain.","Yang kuat selalu menang."],"statements":null,"answer":["A","B","D"],"explain":"A, B, dan D tergambar dari perubahan elang dan sikap pipit. C dan E bertentangan dengan isi cerita. **(A, B, D)**","passage":0},{"n":6,"type":"PG","level":"L1","stem":"Kata \"Hatta\" dan \"Syahdan\" dalam hikayat tersebut berfungsi sebagai ….","extra":[],"options":["kata sifat","kata seru","kata ganti","penanda peralihan peristiwa"],"statements":null,"answer":["D"],"explain":"*Hatta* dan *syahdan* adalah kata arkais yang dipakai untuk berpindah ke peristiwa berikutnya, kira-kira bermakna \"kemudian\" atau \"lalu\". **(D)**","passage":1},{"n":7,"type":"PG","level":"L2","stem":"Bagian yang menunjukkan unsur kemustahilan dalam hikayat tersebut adalah ….","extra":[],"options":["negeri dilanda kemarau panjang","Sultan memanggil para ahli nujum","burung-burung mematuk batu besar hingga terbelah dua","rakyat menabur biji-bijian di puncak gunung"],"statements":null,"answer":["C"],"explain":"Burung-burung yang datang karena tiupan serunai lalu membelah batu besar adalah peristiwa yang tidak masuk akal (kemustahilan). **(C)**","passage":1},{"n":8,"type":"PGK","level":"L2","stem":"Pilih **semua** ciri hikayat yang terdapat dalam teks tersebut.","extra":[],"options":["Berpusat pada kehidupan istana (istanasentris).","Mengandung unsur kemustahilan.","Menggunakan kata arkais seperti *sebermula*, *hatta*, dan *syahdan*.","Berlatar kota modern.","Mencantumkan nama pengarang dengan jelas."],"statements":null,"answer":["A","B","C"],"explain":"Ada tokoh sultan dan puteri, peristiwa ajaib, dan kata arkais. Hikayat bersifat anonim, jadi tidak mencantumkan nama pengarang, dan latarnya negeri lama, bukan kota modern. **(A, B, C)**","passage":1},{"n":9,"type":"PG","level":"L3","stem":"Tindakan Puteri Cahaya Bulan naik ke gunung tanpa membawa senjata menunjukkan ….","extra":[],"options":["ketakutan Puteri terhadap hulubalang","keberanian dan kepedulian seorang pemimpin terhadap rakyatnya","kesombongan Puteri terhadap ayahandanya","keinginan Puteri untuk pamer"],"statements":null,"answer":["B"],"explain":"Puteri berangkat setelah para hulubalang gagal, demi menyelamatkan rakyat yang kelaparan. Itu menunjukkan keberanian dan kepedulian. **(B)**","passage":1},{"n":10,"type":"KAT","level":"L3","stem":"Tentukan benar atau salah setiap pernyataan berikut berdasarkan hikayat.","extra":[],"options":null,"statements":["Kemarau melanda negeri Kuala Bentan selama tujuh tahun.","Para hulubalang berhasil mengangkat batu yang menyumbat mata air.","Kebiasaan menabur biji-bijian menunjukkan nilai budaya berterima kasih kepada alam.","Kata \"niscaya\" pada paragraf (3) bermakna \"pasti\"."],"answer":["B","S","B","B"],"explain":"(1) Benar, \"kemarau tujuh tahun lamanya\". (2) Salah, \"seorang pun tiada berhasil\". (3) Benar, menabur biji adalah tanda terima kasih kepada burung. (4) Benar, *niscaya* berarti pasti atau tentu. **(B, S, B, B)**","passage":1},{"n":11,"type":"PG","level":"L2","stem":"Cerita \"Malin Kundang\" termasuk jenis cerita rakyat ….","extra":[],"options":["fabel","legenda","mite","hikayat"],"statements":null,"answer":["B"],"explain":"Cerita dikaitkan dengan asal-usul batu di Pantai Air Manis yang dipercaya masyarakat, jadi termasuk legenda. **(B)**","passage":2},{"n":12,"type":"PG","level":"L2","stem":"Penyebab utama munculnya konflik dalam cerita tersebut adalah ….","extra":[],"options":["Malin malu mengakui ibunya yang miskin di depan istrinya","ibu Malin tidak mau menemui anaknya","kapal Malin rusak diterjang badai","istri Malin mengusir ibu mertuanya"],"statements":null,"answer":["A"],"explain":"Konflik memuncak ketika Malin menolak mengakui ibunya karena malu pada istrinya. **(A)**","passage":2},{"n":13,"type":"PGK","level":"L2","stem":"Pilih **semua** pernyataan yang tepat tentang unsur cerita tersebut.","extra":[],"options":["Latar tempatnya kampung nelayan dan dermaga.","Alurnya maju.","Cerita menggunakan sudut pandang orang pertama.","Terdapat unsur kemustahilan, yaitu tubuh manusia berubah menjadi batu.","Cerita berakhir bahagia bagi semua tokoh."],"statements":null,"answer":["A","B","D"],"explain":"A, B, dan D tepat. C salah, cerita memakai sudut pandang orang ketiga. E salah, Malin berubah menjadi batu dan ibunya patah hati. **(A, B, D)**","passage":2},{"n":14,"type":"PG","level":"L3","stem":"Keputusan Malin untuk merantau mencerminkan ….","extra":[],"options":["kebiasaan para saudagar kaya berwisata","hukuman bagi anak yang nakal","keinginan Malin menghindari ibunya","nilai budaya masyarakat yang mendorong anak muda mencari penghidupan di negeri orang"],"statements":null,"answer":["D"],"explain":"Merantau untuk mengubah nasib adalah nilai budaya yang kuat dalam masyarakat asal cerita ini. **(D)**","passage":2},{"n":15,"type":"PG","level":"L3","stem":"Cerita ini terus diwariskan secara turun-temurun terutama karena berfungsi ….","extra":[],"options":["sebagai hiburan semata tanpa pesan","untuk menakut-nakuti para nelayan","sebagai pesan moral agar anak berbakti dan tidak durhaka kepada orang tua","untuk mempromosikan pantai wisata"],"statements":null,"answer":["C"],"explain":"Akhir cerita yang menimpa Malin menjadi peringatan agar anak tidak durhaka kepada orang tua. **(C)**","passage":2},{"n":16,"type":"KAT","level":"L2","stem":"Tentukan benar atau salah setiap pernyataan berikut berdasarkan cerita.","extra":[],"options":null,"statements":["Gajah awalnya ingin mendapat bagian air paling besar.","Kura-kura menegur gajah dengan kata-kata kasar.","Monyet dan burung ikut membantu gajah membuka mata air.","Kalimat \"air itu terasa lebih segar\" menyiratkan kepuasan batin gajah setelah berbuat untuk bersama."],"answer":["B","S","B","B"],"explain":"(1) Benar, sesuai ucapan gajah. (2) Salah, kura-kura justru memuji kekuatan gajah. (3) Benar, monyet menunjukkan jalan dan burung mengawasi dari udara. (4) Benar, air yang sama terasa \"lebih segar\" karena gajah puas telah berbuat untuk semua. **(B, S, B, B)**","passage":3},{"n":17,"type":"PG","level":"L3","stem":"Cara kura-kura menyelesaikan masalah dalam cerita tersebut adalah ….","extra":[],"options":["menyalahkan gajah di depan semua hewan","mengusulkan undian pembagian air","mengarahkan kekuatan gajah untuk kepentingan bersama dengan cara yang bijak","mengusir gajah dari Hutan Jati"],"statements":null,"answer":["C"],"explain":"Kura-kura tidak memarahi gajah, tetapi menunjukkan cara kekuatan gajah bisa bermanfaat bagi semua. **(C)**","passage":3},{"n":18,"type":"PG","level":"L2","stem":"Watak kura-kura tua dalam cerita tersebut adalah ….","extra":[],"options":["bijaksana","penakut","sombong","licik"],"statements":null,"answer":["A"],"explain":"Kura-kura tenang, mengamati, lalu memberi jalan keluar yang menguntungkan semua pihak. **(A)**","passage":3},{"n":19,"type":"PGK","level":"L3","stem":"Pilih **semua** amanat yang sesuai dengan cerita tersebut.","extra":[],"options":["Kekuatan sebaiknya digunakan untuk menolong.","Masalah bersama dapat diselesaikan dengan kerja sama.","Yang paling besar berhak mendapat paling banyak.","Teguran yang bijak lebih berhasil daripada kemarahan.","Hewan kecil tidak ada gunanya."],"statements":null,"answer":["A","B","D"],"explain":"A, B, dan D sesuai isi cerita. C adalah pendapat gajah yang justru diluruskan. E bertentangan karena monyet dan burung ikut membantu. **(A, B, D)**","passage":3},{"n":20,"type":"PG","level":"L2","stem":"Ciri fabel yang paling tampak dalam cerita tersebut adalah ….","extra":[],"options":["tokohnya raja dan puteri","ada kesaktian senjata pusaka","menggunakan bahasa Melayu klasik","hewan menjadi tokoh yang berpikir dan berbicara seperti manusia untuk menyampaikan pesan moral"],"statements":null,"answer":["D"],"explain":"Fabel memakai tokoh hewan yang bersikap seperti manusia untuk menyampaikan pesan moral. Pilihan lain adalah ciri hikayat. **(D)**","passage":3},{"n":21,"type":"KAT","level":"L3","stem":"Tentukan benar atau salah setiap pernyataan berikut berdasarkan kedua teks.","extra":[],"options":null,"statements":["Kedua teks sama-sama mengangkat nilai kejujuran.","Teks 1 mengandung unsur kemustahilan, sedangkan Teks 2 tidak.","Teks 2 menggunakan bahasa Melayu klasik.","Tokoh dalam kedua teks akhirnya mengambil barang yang bukan miliknya."],"answer":["B","B","S","S"],"explain":"(1) Benar, penjual kayu dan Rafi sama-sama jujur. (2) Benar, Teks 1 menampilkan orang tua yang muncul dari dalam sungai; Teks 2 realistis. (3) Salah, Teks 2 memakai bahasa Indonesia modern. (4) Salah, kedua tokoh menolak mengambil yang bukan miliknya. **(B, B, S, S)**","passage":4},{"n":22,"type":"PG","level":"L2","stem":"Kata \"sembah\" dalam Teks 1 bermakna ….","extra":[],"options":["berkata dengan hormat kepada orang yang dimuliakan","memukul dengan keras","menangis tersedu-sedu","berjalan perlahan"],"statements":null,"answer":["A"],"explain":"Dalam sastra Melayu klasik, *sembah* adalah ucapan penuh hormat kepada orang yang dimuliakan. **(A)**","passage":4},{"n":23,"type":"PG","level":"L3","stem":"Perbedaan balasan atas kejujuran tokoh dalam kedua teks adalah ….","extra":[],"options":["kedua tokoh sama-sama mendapat uang","tokoh Teks 1 mendapat anugerah dari tokoh ajaib, sedangkan tokoh Teks 2 mendapat penghargaan dari lingkungan sosialnya","tokoh Teks 1 tidak mendapat apa-apa","tokoh Teks 2 mendapat kapak emas"],"statements":null,"answer":["B"],"explain":"Penjual kayu diberi kapak emas oleh tokoh ajaib, sedangkan Rafi dihargai di depan teman-temannya. **(B)**","passage":4},{"n":24,"type":"PGK","level":"L3","stem":"Pilih **semua** perbedaan yang tepat antara Teks 1 dan Teks 2.","extra":[],"options":["Teks 1 berlatar negeri pada masa lampau, sedangkan Teks 2 berlatar kehidupan modern.","Teks 1 menggunakan kata pembuka khas hikayat.","Teks 2 memuat detail realistis seperti angkot dan kartu pelajar.","Teks 1 menggunakan sudut pandang orang pertama.","Teks 2 menghadirkan tokoh gaib."],"statements":null,"answer":["A","B","C"],"explain":"A, B (\"Sebermula\"), dan C tepat. D salah, Teks 1 memakai sudut pandang orang ketiga. E salah, tokoh gaib hanya ada di Teks 1. **(A, B, C)**","passage":4},{"n":25,"type":"PG","level":"L3","stem":"Kalimat \"Rafi teringat sepatunya yang sudah robek\" dalam Teks 2 berfungsi untuk ….","extra":[],"options":["menjelaskan hobi Rafi","menunjukkan bahwa Rafi suka berbelanja","memperlihatkan godaan yang dihadapi Rafi sehingga kejujurannya terasa lebih bermakna","menunjukkan bahwa Rafi malas merawat barang"],"statements":null,"answer":["C"],"explain":"Sepatu robek menunjukkan Rafi sebenarnya butuh uang. Karena ada godaan itu, keputusannya mengembalikan dompet menjadi lebih bermakna. **(C)**","passage":4},{"n":26,"type":"KAT","level":"L2","stem":"Tentukan benar atau salah setiap pernyataan berikut berdasarkan cerita.","extra":[],"options":null,"statements":["Raksasa meminta Timun Mas diserahkan saat berumur enam belas tahun.","Bungkusan garam berubah menjadi hutan bambu.","Cerita mengandung unsur kemustahilan.","Bekal untuk Timun Mas disiapkan atas petunjuk seorang pertapa."],"answer":["B","S","B","B"],"explain":"(1) Benar, sesuai ucapan raksasa. (2) Salah, garam menjadi lautan; jarum yang menjadi hutan bambu. (3) Benar, misalnya bayi lahir dari mentimun dan garam menjadi lautan. (4) Benar, tertulis di paragraf (3). **(B, S, B, B)**","passage":5},{"n":27,"type":"PG","level":"L2","stem":"Cerita \"Timun Mas\" termasuk jenis cerita rakyat ….","extra":[],"options":["legenda tentang asal-usul suatu tempat","fabel","mite tentang dewa-dewi","dongeng"],"statements":null,"answer":["D"],"explain":"Timun Mas adalah dongeng: cerita khayalan yang tidak dikaitkan dengan asal-usul tempat (legenda) atau dewa-dewi (mite), dan tokohnya bukan hewan (fabel). **(D)**","passage":5},{"n":28,"type":"PG","level":"L3","stem":"Konflik batin Mbok Sirni pada paragraf (2) adalah pertentangan antara ….","extra":[],"options":["rasa sayang kepada anaknya dan janji yang pernah ia buat kepada raksasa","keinginan menanam mentimun dan menanam padi","rasa takut kepada pertapa dan kepada tetangga","keinginan pindah desa dan bertahan di desa"],"statements":null,"answer":["A"],"explain":"Mbok Sirni makin sayang kepada anaknya, tetapi makin takut pada janjinya kepada raksasa. **(A)**","passage":5},{"n":29,"type":"PGK","level":"L3","stem":"Pilih **semua** nilai yang terkandung dalam cerita tersebut.","extra":[],"options":["kasih sayang seorang ibu","kecerdikan dalam menghadapi bahaya","kehati-hatian dalam membuat janji","ketamakan yang dibenarkan","ajakan membalas dendam"],"statements":null,"answer":["A","B","C"],"explain":"Kasih sayang ibu, akal cerdik menebar bungkusan, dan pelajaran tentang janji yang terburu-buru tergambar dalam cerita. D dan E tidak ada. **(A, B, C)**","passage":5},{"n":30,"type":"PG","level":"L2","stem":"Urutan rintangan yang dihadapi raksasa saat mengejar Timun Mas adalah ….","extra":[],"options":["hutan bambu, ladang mentimun, lautan, lautan lumpur","ladang mentimun, hutan bambu, lautan, lautan lumpur mendidih","lautan, lautan lumpur, ladang mentimun, hutan bambu","ladang mentimun, lautan, hutan bambu, lautan lumpur"],"statements":null,"answer":["B"],"explain":"Urutan bungkusan adalah biji mentimun, jarum, garam, terasi, sehingga rintangannya ladang mentimun, hutan bambu, lautan, lautan lumpur mendidih. **(B)**","passage":5}]},{"id":"BI14","title":"BI 14 · Sastra: Pantun, Syair, dan Gurindam","intro":"**Fokus:** memahami puisi lama. **Materi:** struktur dan ciri pantun (sampiran, isi, rima a-b-a-b, jumlah suku kata), jenis pantun, ciri syair (rima a-a-a-a, semua larik isi), ciri gurindam (dua larik, sebab-akibat), makna, nilai, dan perbandingan ketiganya.","passages":["> **Pantun 1**\n>\n> Pergi ke pasar membeli kain,\\\n> jangan lupa membeli tomat.\\\n> Kalau belajar jangan bermain,\\\n> supaya ilmu menjadi berkat.\n\n> **Pantun 2**\n>\n> Burung pipit terbang ke dahan,\\\n> hinggap sebentar di pohon jati.\\\n> Kalau hidup penuh cobaan,\\\n> sabar dan doa penguat hati.","> **Pantun A**\n>\n> Ikan sepat ikan gabus,\\\n> dimasak ibu di dalam kuali.\\\n> Badan kurus makan terus,\\\n> nasi sebakul habis sekali.\n\n> **Pantun B**\n>\n> Kalau tuan pergi ke pasar,\\\n> belikan saya sebuah peti.\\\n> Kalau tuan sungguh pintar,\\\n> binatang apa tanduknya di kaki?\n\n> **Pantun C**\n>\n> Kayu jati dibuat lemari,\\\n> lemari diisi kain sutra.\\\n> Sahabat sejati dicari-cari,\\\n> di kala susah ia bersama.","> **Syair Anak Dagang**\n>\n> Dengarlah tuan suatu kisah,\\\n> anak dagang meninggalkan rumah,\\\n> berbekal doa ibu yang pasrah,\\\n> menuju negeri di seberang tanah.\n>\n> Siang bekerja tiada berhenti,\\\n> malam belajar sepenuh hati,\\\n> jika lelah ia teringat lagi,\\\n> pesan ibunda di pintu pagi.\n>\n> Tahun berganti musim berlalu,\\\n> ilmu bertambah usaha pun maju,\\\n> namun di hati tersimpan rindu,\\\n> pada kampung dan pada ibu.\n>\n> Wahai anak yang berjalan jauh,\\\n> ingatlah asal janganlah angkuh,\\\n> walau di rantau badan berpeluh,\\\n> pulanglah kelak membawa teduh.","> **Gurindam Budi Pekerti**\n>\n> Apabila rajin membaca buku,\\\n> luaslah ilmu bertambah tahu.\n>\n> Barang siapa suka berbohong,\\\n> percakapannya dianggap kosong.\n>\n> Jika lidah tidak dijaga,\\\n> hati orang terluka juga.\n>\n> Kalau waktu disia-siakan,\\\n> penyesalan datang kemudian.","> **Teks 1**\n>\n> Ke pasar membeli pepaya,\\\n> pepaya manis di dalam peti.\\\n> Hormati guru dan orang tua,\\\n> supaya hidup diberkati.\n\n> **Teks 2**\n>\n> Apabila guru dihormati,\\\n> ilmu pun mudah masuk ke hati.\n\n> **Teks 3**\n>\n> Wahai murid dengarlah pesan,\\\n> guru mengajar penuh kesabaran,\\\n> ilmunya jangan disia-siakan,\\\n> amalkan ia sepanjang zaman.","> **Syair Nelayan Muda**\n>\n> Tersebut kisah nelayan muda,\\\n> tinggal di pantai Kampung Pelanda,\\\n> perahunya kecil layarnya tua,\\\n> namun semangat tiada terkira.\n>\n> Suatu malam badai melanda,\\\n> ombak menggulung bagai raksasa,\\\n> kawan-kawannya pulang bersegera,\\\n> ia berlindung di teluk kuala.\n>\n> Fajar menyingsing badai pun reda,\\\n> nelayan muda selamat sentosa,\\\n> jalanya penuh ikan pelbagai rupa,\\\n> dibaginya rata kepada tetangga.\n>\n> Wahai saudara ambillah tamsil,\\\n> kerja yang tekun membuahkan hasil,\\\n> berbagi rezeki janganlah bakhil,\\\n> Tuhan membalas dengan yang adil."],"questions":[{"n":1,"type":"PG","level":"L1","stem":"Larik pertama dan kedua pada setiap pantun tersebut disebut ….","extra":[],"options":["isi","sampiran","rima","bait"],"statements":null,"answer":["B"],"explain":"Dua larik awal pantun adalah sampiran, yang berfungsi mengantarkan rima. Dua larik akhir adalah isi. **(B)**","passage":0},{"n":2,"type":"PG","level":"L1","stem":"Pola rima kedua pantun tersebut adalah ….","extra":[],"options":["a-a-a-a","a-a-b-b","a-b-a-b","a-b-b-a"],"statements":null,"answer":["C"],"explain":"Pantun 1: kain–tomat–bermain–berkat. Pantun 2: dahan–jati–cobaan–hati. Bunyi akhir larik 1 sama dengan larik 3, dan larik 2 sama dengan larik 4, jadi a-b-a-b. **(C)**","passage":0},{"n":3,"type":"KAT","level":"L2","stem":"Tentukan benar atau salah setiap pernyataan berikut berdasarkan kedua pantun.","extra":[],"options":null,"statements":["Isi Pantun 1 berupa nasihat agar bersungguh-sungguh belajar.","Isi Pantun 2 berupa nasihat agar bersabar dan berdoa ketika menghadapi cobaan.","Sampiran kedua pantun berhubungan langsung secara makna dengan isinya.","Setiap larik kedua pantun terdiri atas 8–12 suku kata."],"answer":["B","B","S","B"],"explain":"(1) Benar, \"Kalau belajar jangan bermain\". (2) Benar, \"sabar dan doa penguat hati\". (3) Salah, sampiran (pasar, burung pipit) tidak berhubungan makna dengan isi. (4) Benar, contohnya \"Per-gi ke pa-sar mem-be-li ka-in\" = 10 suku kata; larik lain 9–10 suku kata. **(B, B, S, B)**","passage":0},{"n":4,"type":"PG","level":"L3","stem":"Perhatikan sampiran berikut: \"Buah mangga di atas peti, / jatuh satu dimakan rusa.\" Isi pantun yang paling tepat untuk melengkapi sampiran tersebut adalah ….","extra":[],"options":["Jagalah lisan sepenuh hati, / agar terhindar dari dosa.","Jagalah lisan setiap waktu, / agar tak ada yang terluka.","Rajin menabung setiap pagi, / agar kelak hidup bahagia.","Jangan berbohong kepada guru, / nanti dimarahi bapak ibu."],"statements":null,"answer":["A"],"explain":"Sampiran berakhir *-ti* (peti) dan *-sa* (rusa). Hanya pilihan A yang berakhir *-ti* (hati) dan *-sa* (dosa) sehingga berima a-b-a-b. **(A)**","passage":0},{"n":5,"type":"PGK","level":"L2","stem":"Pilih **semua** ciri pantun yang benar.","extra":[],"options":["Setiap bait terdiri atas empat larik.","Larik pertama dan kedua adalah sampiran, larik ketiga dan keempat adalah isi.","Berima a-b-a-b.","Semua lariknya merupakan isi dan berima a-a-a-a.","Setiap bait hanya terdiri atas dua larik."],"statements":null,"answer":["A","B","C"],"explain":"Pantun terdiri atas empat larik, ada sampiran dan isi, dan berima a-b-a-b. D adalah ciri syair, E ciri gurindam. **(A, B, C)**","passage":0},{"n":6,"type":"PG","level":"L1","stem":"Berdasarkan isinya, Pantun A termasuk pantun ….","extra":[],"options":["nasihat","jenaka","teka-teki","adat"],"statements":null,"answer":["B"],"explain":"Isi Pantun A (\"badan kurus makan terus\") bertujuan membuat orang tertawa, jadi pantun jenaka. **(B)**","passage":1},{"n":7,"type":"PG","level":"L2","stem":"Jawaban yang tepat untuk teka-teki dalam Pantun B adalah ….","extra":[],"options":["kerbau","kambing","ayam jantan (bertaji)","rusa"],"statements":null,"answer":["C"],"explain":"Ayam jantan memiliki taji di kakinya yang dalam teka-teki disebut \"tanduk di kaki\". **(C)**","passage":1},{"n":8,"type":"PGK","level":"L2","stem":"Pilih **semua** pernyataan yang tepat tentang Pantun C.","extra":[],"options":["Pantun C bertema persahabatan.","Pantun C berima a-b-a-b.","Isinya menyatakan bahwa sahabat sejati hadir ketika kita susah.","Sampirannya membicarakan pertemanan.","Pantun C termasuk pantun jenaka."],"statements":null,"answer":["A","B","C"],"explain":"A, B (lemari–sutra–dicari–bersama), dan C tepat. D salah, sampirannya tentang kayu jati dan lemari. E salah, Pantun C pantun persahabatan. **(A, B, C)**","passage":1},{"n":9,"type":"PG","level":"L2","stem":"Tujuan utama pantun seperti Pantun A adalah ….","extra":[],"options":["menasihati pendengar","menguji kecerdasan pendengar","menyampaikan berita","menghibur pendengar"],"statements":null,"answer":["D"],"explain":"Pantun jenaka dibuat untuk menghibur dan memancing tawa. **(D)**","passage":1},{"n":10,"type":"KAT","level":"L3","stem":"Tentukan benar atau salah setiap pernyataan berikut berdasarkan ketiga pantun.","extra":[],"options":null,"statements":["Pantun B bertujuan menguji ketajaman berpikir pendengar.","Pantun A berima a-a-b-b.","Ketiga pantun sama-sama memiliki sampiran dan isi.","Larik \"nasi sebakul habis sekali\" mengandung unsur berlebihan yang menimbulkan kelucuan."],"answer":["B","S","B","B"],"explain":"(1) Benar, ada pertanyaan yang harus ditebak. (2) Salah, gabus–kuali–terus–sekali berpola a-b-a-b. (3) Benar, semuanya punya dua larik sampiran dan dua larik isi. (4) Benar, menghabiskan nasi sebakul adalah gambaran berlebihan yang lucu. **(B, S, B, B)**","passage":1},{"n":11,"type":"PG","level":"L1","stem":"Pola rima syair tersebut adalah ….","extra":[],"options":["a-a-a-a","a-b-a-b","a-a-b-b","a-b-b-a"],"statements":null,"answer":["A"],"explain":"Setiap bait berakhir dengan bunyi yang sama, misalnya kisah–rumah–pasrah–tanah. **(A)**","passage":2},{"n":12,"type":"PG","level":"L2","stem":"Perbedaan syair dengan pantun yang tampak dari teks tersebut adalah ….","extra":[],"options":["syair memiliki sampiran, sedangkan pantun tidak","pantun berima a-a-a-a, sedangkan syair berima a-b-a-b","semua larik syair merupakan isi, sedangkan pantun memiliki sampiran dan isi","syair hanya terdiri atas dua larik setiap bait"],"statements":null,"answer":["C"],"explain":"Seluruh larik syair menyampaikan cerita dan pesan. Pantun memiliki dua larik sampiran. **(C)**","passage":2},{"n":13,"type":"PGK","level":"L3","stem":"Pilih **semua** nilai yang terkandung dalam syair tersebut.","extra":[],"options":["kerja keras","semangat menuntut ilmu","rasa sayang dan rindu kepada ibu","melupakan asal-usul","sikap angkuh setelah berhasil"],"statements":null,"answer":["A","B","C"],"explain":"Anak dagang bekerja keras, belajar pada malam hari, dan merindukan ibunya. D dan E justru dilarang dalam bait keempat. **(A, B, C)**","passage":2},{"n":14,"type":"PG","level":"L3","stem":"Makna larik \"ingatlah asal janganlah angkuh\" adalah ….","extra":[],"options":["jangan pernah pulang ke kampung","jangan sombong dan melupakan asal-usul walaupun sudah berhasil","jangan bekerja terlalu keras","jangan bergaul dengan orang di rantau"],"statements":null,"answer":["B"],"explain":"\"Ingatlah asal\" berarti jangan lupa asal-usul; \"janganlah angkuh\" berarti jangan sombong, terutama setelah berhasil di rantau. **(B)**","passage":2},{"n":15,"type":"PG","level":"L2","stem":"Bait yang berisi nasihat langsung kepada pembaca adalah bait ….","extra":[],"options":["pertama","kedua","ketiga","keempat"],"statements":null,"answer":["D"],"explain":"Bait keempat dibuka dengan seruan \"Wahai anak …\" lalu memberi nasihat. Bait lainnya bercerita. **(D)**","passage":2},{"n":16,"type":"KAT","level":"L2","stem":"Tentukan benar atau salah setiap pernyataan berikut berdasarkan gurindam.","extra":[],"options":null,"statements":["Setiap bait gurindam terdiri atas dua larik.","Larik pertama berisi syarat atau sebab, sedangkan larik kedua berisi akibatnya.","Setiap bait gurindam berima a-b.","Gurindam memiliki sampiran seperti pantun."],"answer":["B","B","S","S"],"explain":"(1) Benar. (2) Benar, misalnya \"rajin membaca\" (sebab) dan \"luaslah ilmu\" (akibat). (3) Salah, kedua larik berima sama, a-a (buku–tahu, berbohong–kosong). (4) Salah, gurindam tidak bersampiran. **(B, B, S, S)**","passage":3},{"n":17,"type":"PG","level":"L2","stem":"Makna bait ketiga gurindam tersebut adalah ….","extra":[],"options":["setiap orang hendaknya menjaga ucapan agar tidak menyakiti hati orang lain","lidah harus dirawat agar tetap sehat","orang yang pendiam selalu benar","hati orang mudah sakit karena cuaca"],"statements":null,"answer":["A"],"explain":"\"Lidah\" melambangkan ucapan. Ucapan yang tidak dijaga dapat menyakiti hati orang lain. **(A)**","passage":3},{"n":18,"type":"PG","level":"L3","stem":"Larik yang tepat untuk melengkapi gurindam \"…… / tubuh pun sehat badan pun segar.\" adalah ….","extra":[],"options":["Jika olahraga dilakukan dengan benar,","Jika makan tidak teratur,","Barang siapa malas bergerak,","Apabila tidur larut malam,"],"statements":null,"answer":["A"],"explain":"Larik pertama harus menjadi sebab yang menghasilkan akibat baik (sehat, segar) dan berima *-ar* dengan \"segar\". Hanya A yang memenuhi keduanya. **(A)**","passage":3},{"n":19,"type":"PGK","level":"L3","stem":"Pilih **semua** pasangan sebab dan akibat yang sesuai dengan gurindam tersebut.","extra":[],"options":["rajin membaca → ilmu bertambah luas","suka berbohong → ucapannya tidak dipercaya","menyia-nyiakan waktu → menyesal kemudian","menjaga lidah → hati orang terluka","rajin membaca → dijauhi kawan"],"statements":null,"answer":["A","B","C"],"explain":"A, B, dan C sesuai isi gurindam. D terbalik: lidah yang *tidak* dijaga membuat hati orang terluka. E tidak ada dalam gurindam. **(A, B, C)**","passage":3},{"n":20,"type":"PG","level":"L2","stem":"Tema gurindam tersebut adalah ….","extra":[],"options":["keindahan alam","nasihat tentang budi pekerti dan perilaku","kisah kerajaan pada masa lampau","kisah percintaan"],"statements":null,"answer":["B"],"explain":"Keempat bait berisi nasihat tentang perilaku: membaca, jujur, menjaga ucapan, dan menghargai waktu. **(B)**","passage":3},{"n":21,"type":"KAT","level":"L3","stem":"Tentukan benar atau salah setiap pernyataan berikut berdasarkan ketiga teks.","extra":[],"options":null,"statements":["Teks 1 adalah pantun karena memiliki sampiran dan isi.","Teks 2 adalah gurindam karena terdiri atas dua larik yang berhubungan sebab-akibat.","Teks 3 adalah syair karena berima a-a-a-a dan semua lariknya isi.","Ketiga teks memiliki tema yang sama sekali berbeda."],"answer":["B","B","B","S"],"explain":"(1), (2), dan (3) benar sesuai ciri masing-masing. (4) Salah, ketiganya sama-sama tentang menghormati guru dan ilmu. **(B, B, B, S)**","passage":4},{"n":22,"type":"PG","level":"L2","stem":"Tema yang sama dari ketiga teks tersebut adalah ….","extra":[],"options":["keindahan alam","kisah perantauan","menghormati guru dan menghargai ilmu","persahabatan"],"statements":null,"answer":["C"],"explain":"Teks 1 menyebut \"Hormati guru\", Teks 2 \"guru dihormati\", Teks 3 \"guru mengajar … ilmunya jangan disia-siakan\". **(C)**","passage":4},{"n":23,"type":"PG","level":"L3","stem":"Larik \"pepaya manis di dalam peti\" pada Teks 1 tidak berhubungan makna dengan larik isi karena ….","extra":[],"options":["larik itu sebenarnya bagian isi","larik itu berfungsi sebagai sampiran yang mengantarkan bunyi rima","penyair keliru menulis larik itu","pepaya merupakan lambang guru"],"statements":null,"answer":["B"],"explain":"Larik kedua pantun termasuk sampiran. Tugasnya menyiapkan rima (*peti* dengan *diberkati*), bukan menyampaikan makna. **(B)**","passage":4},{"n":24,"type":"PGK","level":"L3","stem":"Pilih **semua** pernyataan yang tepat tentang perbedaan ketiga teks.","extra":[],"options":["Teks 1 dan Teks 3 terdiri atas empat larik, sedangkan Teks 2 dua larik.","Teks 1 berima a-b-a-b, sedangkan Teks 3 berima a-a-a-a.","Teks 2 berima a-a.","Teks 3 memiliki sampiran.","Teks 1 tidak berima."],"statements":null,"answer":["A","B","C"],"explain":"A, B, dan C tepat. D salah, syair tidak bersampiran. E salah, Teks 1 berima a-b-a-b. **(A, B, C)**","passage":4},{"n":25,"type":"PG","level":"L2","stem":"Kata \"ia\" pada larik \"amalkan ia sepanjang zaman\" merujuk pada ….","extra":[],"options":["guru","murid","pesan","ilmu"],"statements":null,"answer":["D"],"explain":"Larik sebelumnya \"ilmunya jangan disia-siakan\". Yang diamalkan adalah ilmu. **(D)**","passage":4},{"n":26,"type":"KAT","level":"L2","stem":"Tentukan benar atau salah setiap pernyataan berikut berdasarkan syair.","extra":[],"options":null,"statements":["Syair menceritakan kisah seorang nelayan muda.","Nelayan muda menjual seluruh hasil tangkapannya ke pasar.","Larik \"ombak menggulung bagai raksasa\" mengandung majas perumpamaan.","Bait keempat berisi nasihat kepada pembaca."],"answer":["B","S","B","B"],"explain":"(1) Benar, sesuai bait pertama. (2) Salah, hasil tangkapan \"dibaginya rata kepada tetangga\". (3) Benar, ada kata pembanding \"bagai\". (4) Benar, bait itu diawali seruan \"Wahai saudara\". **(B, S, B, B)**","passage":5},{"n":27,"type":"PG","level":"L1","stem":"Ungkapan \"ambillah tamsil\" pada bait keempat bermakna ….","extra":[],"options":["ambillah pelajaran atau teladan","ambillah ikan","ambillah perahu","ambillah jala"],"statements":null,"answer":["A"],"explain":"*Tamsil* berarti perumpamaan atau contoh yang dapat diambil pelajarannya. **(A)**","passage":5},{"n":28,"type":"PG","level":"L3","stem":"Berdasarkan isinya, syair tersebut paling tepat digolongkan sebagai syair yang ….","extra":[],"options":["mengisahkan kehidupan istana dan para pangeran","bertema percintaan","mengisahkan suatu peristiwa lalu ditutup dengan nasihat","menceritakan sejarah peperangan"],"statements":null,"answer":["C"],"explain":"Bait 1–3 menceritakan peristiwa nelayan muda menghadapi badai, lalu bait 4 menutupnya dengan nasihat. **(C)**","passage":5},{"n":29,"type":"PGK","level":"L3","stem":"Pilih **semua** nilai yang terkandung dalam syair tersebut.","extra":[],"options":["ketekunan dalam bekerja","kedermawanan atau kesediaan berbagi","keyakinan bahwa Tuhan membalas perbuatan baik","sifat kikir","keserakahan"],"statements":null,"answer":["A","B","C"],"explain":"Nilai ketekunan, berbagi, dan religius tampak di bait 3 dan 4. Kikir dan serakah justru dilarang. **(A, B, C)**","passage":5},{"n":30,"type":"PG","level":"L2","stem":"Kata \"bakhil\" pada larik \"berbagi rezeki janganlah bakhil\" bermakna ….","extra":[],"options":["dermawan","rajin","pemalas","kikir"],"statements":null,"answer":["D"],"explain":"*Bakhil* berarti kikir atau pelit. **(D)**","passage":5}]},{"id":"BI15","title":"BI 15 · Sastra: Campuran dan Lintas Teks","intro":"**Fokus:** membandingkan dan menghubungkan berbagai teks sastra. **Materi:** perbandingan cerpen dan puisi, puisi modern dan pantun, penggalan novel dan ulasannya, alih wahana (narasi ke drama dan drama ke narasi), unsur kebahasaan dalam cerpen, serta nilai dan amanat.","passages":["> **Teks 1** (penggalan cerpen *Kebun Kakek*)\n>\n> Setiap libur sekolah, Dewi menghabiskan pagi di kebun Kakek. Kakek tidak pernah menyuruhnya bekerja; ia hanya memberi Dewi sebuah sekop kecil dan berkata, \"Tanam apa saja yang kamu mau.\" Tiga tahun kemudian, pohon jambu yang dulu Dewi tanam sembarangan di sudut pagar sudah berbuah. Kakek sudah tiada, tetapi setiap kali Dewi memetik jambu itu, ia merasa Kakek masih berdiri di sampingnya sambil tersenyum.\n\n> **Teks 2** (puisi *Warisan*)\n>\n> Kakek tak meninggalkan rumah atau emas\\\n> hanya sekop kecil dan tanah yang gembur\\\n> serta sebatang jambu di sudut pagar\\\n> yang setiap musim\\\n> mengulang-ulang namanya\\\n> di bibir buah yang merah","> **Ronda Malam**\n>\n> *(Pos ronda, tengah malam. Pak Karto dan Udin berjaga. Terdengar suara gaduh dari arah kebun.)*\n>\n> **UDIN:** *(berbisik)* Pak, ada maling!\n>\n> **PAK KARTO:** *(menyalakan senter)* Ssst. Jangan teriak dulu. Kita lihat.\n>\n> *(Senter menyorot seekor kambing yang lepas dari talinya dan sedang memakan tanaman cabai Bu Marni.)*\n>\n> **UDIN:** *(tertawa tertahan)* Malingnya bertanduk, Pak. Yang dicuri cabai.\n>\n> **PAK KARTO:** Besok pagi kita minta Pak Joyo mengganti tali kambingnya. Kalau tidak, nanti Bu Marni yang ikut ronda, bukan kita.","> **Teks A** (puisi *Lampu Belajar*)\n>\n> Lampu kecil di meja kayu\\\n> menjadi matahari kedua bagiku\\\n> saat kampung tertidur\\\n> aku menanam huruf-huruf\\\n> berharap kelak tumbuh\\\n> menjadi jalan keluar dari gelap\n\n> **Teks B** (pantun)\n>\n> Anak dara menumbuk padi,\\\n> padi ditumbuk di dalam lesung.\\\n> Kalau ilmu ditekuni,\\\n> cita-cita takkan urung.","> **Teks 1** (penggalan novel *Jembatan Bambu*)\n>\n> Setiap pagi, Laksmi dan dua belas anak lain menyeberangi Sungai Ciliman lewat jembatan bambu yang bergoyang setiap kali diinjak. Kalau hujan semalam, airnya naik sampai menyentuh lantai bambu, dan mereka harus menyeberang sambil bergandengan tangan. \"Pegang erat, jangan lihat ke bawah,\" kata Laksmi kepada adiknya, padahal ia sendiri gemetar.\n\n> **Teks 2** (penggalan ulasan novel)\n>\n> Novel *Jembatan Bambu* karya Nara Pramesti mengangkat kisah anak-anak desa yang berjuang untuk bersekolah. Kekuatan novel ini terletak pada detail kehidupan desa yang terasa nyata dan tokoh Laksmi yang tangguh sekaligus rapuh. Sayangnya, bagian tengah novel terasa lambat karena terlalu banyak deskripsi pemandangan. Meski demikian, novel ini layak dibaca remaja karena menumbuhkan rasa syukur atas kemudahan bersekolah.","> **Rumah di Ujung Gang**\n>\n> (1) Hujan baru saja reda ketika Fikri tiba di depan rumah tua itu. (2) Pagarnya berkarat, dan halamannya dipenuhi rumput liar setinggi lutut. (3) \"Kamu yakin ini rumahnya?\" tanya Rani sambil merapatkan jaketnya. (4) Fikri mengangguk, lalu mengetuk pintu tiga kali. (5) Tak lama kemudian, pintu berderit terbuka, dan seorang nenek berkebaya biru tersenyum kepada mereka. (6) \"Akhirnya cucu Wiryo datang juga,\" katanya lembut, seolah-olah sudah menunggu bertahun-tahun.","> **Teks 1** (cerita rakyat *Asal Mula Danau Toba*, diceritakan kembali)\n>\n> Seorang petani bernama Toba menangkap ikan besar yang kemudian berubah menjadi perempuan cantik. Perempuan itu bersedia menikah dengannya asalkan Toba berjanji tidak akan pernah mengungkit asal-usulnya. Mereka dikaruniai anak bernama Samosir. Suatu hari Samosir memakan sebagian besar bekal makan siang ayahnya. Karena marah dan lapar, Toba berteriak, \"Dasar anak ikan!\" Seketika hujan turun sangat deras, air menyembur dari tanah, dan desa itu tenggelam menjadi danau.\n\n> **Teks 2** (bagian Teks 1 yang diubah menjadi naskah drama)\n>\n> *(Ladang di tepi bukit, siang terik. Toba menunggu bekal dengan wajah kesal. Samosir datang membawa bakul yang hampir kosong.)*\n>\n> **TOBA:** Mana makan siangku? Kenapa tinggal sedikit?\n>\n> **SAMOSIR:** *(menunduk)* Maaf, Ayah. Aku lapar di jalan.\n>\n> **TOBA:** *(membanting cangkul)* Dasar anak ikan!\n>\n> *(Langit tiba-tiba gelap. Guruh menggelegar.)*"],"questions":[{"n":1,"type":"PG","level":"L2","stem":"Tema yang sama dari kedua teks tersebut adalah ….","extra":[],"options":["kenangan dan warisan kasih sayang seorang kakek","cara menanam pohon jambu","kehidupan petani di desa","pembagian harta warisan"],"statements":null,"answer":["A"],"explain":"Kedua teks menceritakan kakek yang \"mewariskan\" pohon jambu dan kenangan kepada cucunya. **(A)**","passage":0},{"n":2,"type":"PG","level":"L3","stem":"Larik \"mengulang-ulang namanya / di bibir buah yang merah\" pada Teks 2 bermakna ….","extra":[],"options":["buah jambu itu dapat berbicara","setiap kali berbuah, pohon jambu itu menghadirkan kenangan tentang kakek","nama kakek ditulis pada buah jambu","buah jambu itu dijual dengan nama kakek"],"statements":null,"answer":["B"],"explain":"Buah jambu tidak benar-benar menyebut nama. Setiap musim berbuah, pohon itu membuat cucu teringat pada kakek. **(B)**","passage":0},{"n":3,"type":"KAT","level":"L3","stem":"Tentukan benar atau salah setiap pernyataan berikut berdasarkan kedua teks.","extra":[],"options":null,"statements":["Teks 1 berbentuk prosa, sedangkan Teks 2 berbentuk larik dan bait.","Kedua teks menyebutkan bahwa kakek mewariskan rumah dan emas.","Pohon jambu dalam kedua teks dapat dimaknai sebagai simbol kenangan.","Teks 2 menggunakan majas personifikasi."],"answer":["B","S","B","B"],"explain":"(1) Benar, Teks 1 paragraf, Teks 2 larik. (2) Salah, Teks 2 justru menyatakan kakek \"tak meninggalkan rumah atau emas\"; Teks 1 tidak menyebutnya. (3) Benar, pohon jambu selalu mengingatkan pada kakek. (4) Benar, pohon \"mengulang-ulang nama\" dan buah punya \"bibir\". **(B, S, B, B)**","passage":0},{"n":4,"type":"PG","level":"L3","stem":"Perbedaan cara penyampaian kedua teks adalah ….","extra":[],"options":["keduanya menggunakan dialog antartokoh","Teks 1 berbentuk larik, sedangkan Teks 2 berbentuk paragraf","Teks 1 menceritakan peristiwa secara runtut dengan tokoh bernama, sedangkan Teks 2 memadatkan perasaan dalam larik-larik singkat","keduanya ditulis dengan sudut pandang orang pertama"],"statements":null,"answer":["C"],"explain":"Teks 1 bercerita runtut dengan tokoh Dewi dan Kakek, sedangkan Teks 2 memadatkan perasaan dalam larik pendek tanpa alur lengkap. Tidak ada dialog antartokoh di Teks 2, dan Teks 1 memakai orang ketiga. **(C)**","passage":0},{"n":5,"type":"PGK","level":"L3","stem":"Pilih **semua** pernyataan yang sesuai dengan Teks 1.","extra":[],"options":["Kakek memberi Dewi kebebasan menanam apa saja.","Pohon jambu di sudut pagar ditanam oleh Dewi.","Kakek masih hidup ketika pohon jambu itu berbuah.","Dewi merasa dekat dengan Kakek setiap kali memetik jambu.","Kakek menyuruh Dewi bekerja keras setiap hari."],"statements":null,"answer":["A","B","D"],"explain":"A, B, dan D sesuai teks. C salah, \"Kakek sudah tiada\" ketika jambu berbuah. E salah, \"Kakek tidak pernah menyuruhnya bekerja\". **(A, B, D)**","passage":0},{"n":6,"type":"PG","level":"L1","stem":"Bagian *(menyalakan senter)* dalam naskah tersebut disebut ….","extra":[],"options":["dialog","prolog","epilog","petunjuk lakuan"],"statements":null,"answer":["D"],"explain":"Keterangan dalam kurung yang mengatur gerak pemain disebut petunjuk lakuan. **(D)**","passage":1},{"n":7,"type":"PG","level":"L2","stem":"Perubahan suasana dalam penggalan drama tersebut adalah ….","extra":[],"options":["sedih menjadi haru","tegang, lalu berubah menjadi lucu","gembira menjadi marah","sepi menjadi sedih"],"statements":null,"answer":["B"],"explain":"Awalnya tegang (bisikan \"ada maling\"), lalu menjadi lucu ketika yang tersorot hanyalah kambing. **(B)**","passage":1},{"n":8,"type":"PGK","level":"L3","stem":"Jika penggalan drama tersebut diubah menjadi cerpen, pilih **semua** kalimat narasi yang sesuai dengan isinya.","extra":[],"options":["Tengah malam, Pak Karto dan Udin berjaga di pos ronda.","Udin berbisik bahwa ada maling.","Pak Karto berteriak memanggil seluruh warga.","Ternyata suara itu berasal dari kambing lepas yang memakan tanaman cabai Bu Marni.","Pak Joyo tertangkap mencuri kambing."],"statements":null,"answer":["A","B","D"],"explain":"A, B, dan D sesuai isi drama. C salah, Pak Karto justru melarang berteriak. E tidak ada dalam drama. **(A, B, D)**","passage":1},{"n":9,"type":"PG","level":"L3","stem":"Ucapan Udin \"Malingnya bertanduk, Pak. Yang dicuri cabai\" bermakna ….","extra":[],"options":["yang \"mencuri\" ternyata kambing yang sedang memakan cabai","maling itu memakai topeng bertanduk","Udin ketakutan melihat maling","cabai Bu Marni dicuri warga"],"statements":null,"answer":["A"],"explain":"Udin bercanda: \"maling\"-nya bertanduk, yaitu kambing, dan yang \"dicuri\" adalah cabai yang dimakannya. **(A)**","passage":1},{"n":10,"type":"KAT","level":"L2","stem":"Tentukan benar atau salah setiap pernyataan berikut berdasarkan penggalan drama.","extra":[],"options":null,"statements":["Latar waktu drama adalah tengah malam.","Pak Karto langsung berteriak membangunkan warga.","Kambing yang lepas memakan tanaman cabai Bu Marni.","Pak Karto menyarankan agar kambing itu dijual."],"answer":["B","S","B","S"],"explain":"(1) Benar, sesuai petunjuk awal. (2) Salah, ia berkata \"Jangan teriak dulu\". (3) Benar, terlihat dari sorotan senter. (4) Salah, ia menyarankan tali kambing diganti. **(B, S, B, S)**","passage":1},{"n":11,"type":"PG","level":"L2","stem":"Makna ungkapan \"aku menanam huruf-huruf\" dalam Teks A adalah ….","extra":[],"options":["aku menulis huruf di kebun","aku menanam bunga di halaman","aku belajar dengan tekun sedikit demi sedikit","aku menghafal abjad"],"statements":null,"answer":["C"],"explain":"\"Menanam huruf\" adalah kiasan untuk belajar sedikit demi sedikit, berharap hasilnya \"tumbuh\" kelak. **(C)**","passage":2},{"n":12,"type":"PG","level":"L1","stem":"Majas dalam larik \"Lampu kecil di meja kayu / menjadi matahari kedua bagiku\" adalah ….","extra":[],"options":["perumpamaan","metafora","hiperbola","litotes"],"statements":null,"answer":["B"],"explain":"Lampu langsung disebut \"matahari kedua\" tanpa kata pembanding, jadi metafora. **(B)**","passage":2},{"n":13,"type":"PGK","level":"L3","stem":"Pilih **semua** pernyataan yang tepat tentang kedua teks.","extra":[],"options":["Keduanya bertema semangat menuntut ilmu.","Teks A tidak terikat rima, sedangkan Teks B berima a-b-a-b.","Teks B memiliki sampiran.","Teks A memiliki sampiran.","Keduanya terdiri atas empat larik."],"statements":null,"answer":["A","B","C"],"explain":"A, B, dan C tepat. D salah, puisi modern tidak bersampiran. E salah, Teks A terdiri atas enam larik. **(A, B, C)**","passage":2},{"n":14,"type":"PG","level":"L3","stem":"Ungkapan \"jalan keluar dari gelap\" pada Teks A bermakna ….","extra":[],"options":["jalan setapak menuju kota","lampu jalan di kampung","pintu keluar rumah yang gelap","harapan untuk keluar dari kesulitan dan keterbatasan hidup"],"statements":null,"answer":["D"],"explain":"\"Gelap\" melambangkan kesulitan dan keterbatasan. Belajar diharapkan menjadi jalan keluarnya. **(D)**","passage":2},{"n":15,"type":"PG","level":"L1","stem":"Kata \"urung\" pada Teks B bermakna ….","extra":[],"options":["batal","berhasil","tumbuh","terlambat"],"statements":null,"answer":["A"],"explain":"*Urung* berarti batal atau tidak jadi. \"Cita-cita takkan urung\" berarti cita-cita akan tercapai. **(A)**","passage":2},{"n":16,"type":"KAT","level":"L3","stem":"Tentukan benar atau salah setiap pernyataan berikut berdasarkan kedua teks.","extra":[],"options":null,"statements":["Teks 2 menyebutkan kelebihan dan kekurangan novel.","Menurut Teks 2, bagian tengah novel terasa lambat.","Kutipan \"padahal ia sendiri gemetar\" mendukung penilaian bahwa Laksmi tangguh sekaligus rapuh.","Teks 2 tidak menyarankan novel itu dibaca oleh remaja."],"answer":["B","B","B","S"],"explain":"(1) Benar, ada \"Kekuatan …\" dan \"Sayangnya …\". (2) Benar, tertulis jelas. (3) Benar, Laksmi menguatkan adiknya (tangguh) walau gemetar (rapuh). (4) Salah, ulasan menyatakan novel \"layak dibaca remaja\". **(B, B, B, S)**","passage":3},{"n":17,"type":"PG","level":"L2","stem":"Kalimat dalam Teks 2 yang menyatakan kekurangan novel adalah ….","extra":[],"options":["\"Novel *Jembatan Bambu* … mengangkat kisah anak-anak desa …\"","\"Kekuatan novel ini terletak pada detail kehidupan desa …\"","\"Sayangnya, bagian tengah novel terasa lambat …\"","\"… novel ini layak dibaca remaja …\""],"statements":null,"answer":["C"],"explain":"Kata \"Sayangnya\" menandai kekurangan yang dinilai penulis ulasan. **(C)**","passage":3},{"n":18,"type":"PG","level":"L2","stem":"Konflik yang tampak dalam Teks 1 adalah konflik ….","extra":[],"options":["manusia dengan alam, yaitu sungai dan jembatan yang membahayakan perjalanan ke sekolah","Laksmi dengan adiknya","Laksmi dengan gurunya","anak-anak dengan kepala desa"],"statements":null,"answer":["A"],"explain":"Laksmi dan anak-anak lain menghadapi sungai yang airnya naik dan jembatan yang bergoyang. **(A)**","passage":3},{"n":19,"type":"PGK","level":"L3","stem":"Pilih **semua** kutipan dari Teks 1 yang membuktikan bahwa Laksmi \"tangguh sekaligus rapuh\".","extra":[],"options":["\"Pegang erat, jangan lihat ke bawah,\" kata Laksmi kepada adiknya","padahal ia sendiri gemetar","jembatan bambu yang bergoyang setiap kali diinjak","airnya naik sampai menyentuh lantai bambu","Laksmi dan dua belas anak lain"],"statements":null,"answer":["A","B"],"explain":"A menunjukkan ketangguhan (menenangkan adik), B menunjukkan kerapuhan (gemetar). C, D, dan E menggambarkan keadaan, bukan watak Laksmi. **(A, B)**","passage":3},{"n":20,"type":"PG","level":"L3","stem":"Simpulan penulis ulasan dalam Teks 2 adalah ….","extra":[],"options":["novel itu tidak layak dibaca","novel itu terlalu pendek","novel itu hanya cocok untuk orang dewasa","novel itu layak dibaca remaja walaupun memiliki kekurangan"],"statements":null,"answer":["D"],"explain":"Kalimat terakhir ulasan: \"Meski demikian, novel ini layak dibaca remaja …\". **(D)**","passage":3},{"n":21,"type":"KAT","level":"L2","stem":"Tentukan benar atau salah setiap pernyataan berikut berdasarkan penggalan cerpen.","extra":[],"options":null,"statements":["Kalimat (2) menggambarkan latar tempat yang tidak terawat.","Kalimat langsung pada kalimat (3) diucapkan oleh Fikri.","Kata \"lalu\" pada kalimat (4) adalah konjungsi yang menyatakan urutan waktu.","Suasana mencekam bertahan sampai akhir penggalan."],"answer":["B","S","B","S"],"explain":"(1) Benar, pagar berkarat dan rumput liar. (2) Salah, kalimat itu diucapkan Rani. (3) Benar, \"lalu\" menunjukkan urutan peristiwa. (4) Salah, suasana menjadi hangat ketika nenek tersenyum. **(B, S, B, S)**","passage":4},{"n":22,"type":"PG","level":"L3","stem":"Perubahan suasana dari awal hingga akhir penggalan tersebut adalah ….","extra":[],"options":["gembira menjadi sedih","misterius menjadi hangat","marah menjadi tenang","sedih menjadi tegang"],"statements":null,"answer":["B"],"explain":"Rumah tua dan pagar berkarat menimbulkan kesan misterius, kemudian senyum dan ucapan lembut nenek membuat suasana hangat. **(B)**","passage":4},{"n":23,"type":"PG","level":"L1","stem":"Kata \"berderit\" pada kalimat (5) menghadirkan citraan ….","extra":[],"options":["penglihatan","pendengaran","penciuman","perabaan"],"statements":null,"answer":["B"],"explain":"Bunyi pintu berderit ditangkap oleh telinga. **(B)**","passage":4},{"n":24,"type":"PGK","level":"L3","stem":"Pilih **semua** simpulan yang dapat ditarik dari penggalan cerpen tersebut.","extra":[],"options":["Fikri dan Rani belum pernah datang ke rumah itu sebelumnya.","Nenek itu mengenal Wiryo, kerabat Fikri.","Nenek itu sudah lama menantikan kedatangan Fikri.","Rumah itu baru saja dibangun.","Rani adalah nenek Fikri."],"statements":null,"answer":["A","B","C"],"explain":"A tersirat dari pertanyaan Rani \"Kamu yakin ini rumahnya?\". B dan C tersirat dari ucapan nenek. D bertentangan dengan \"rumah tua\". E tidak didukung teks. **(A, B, C)**","passage":4},{"n":25,"type":"PG","level":"L3","stem":"Kelanjutan cerita yang paling logis setelah kalimat (6) adalah ….","extra":[],"options":["Fikri langsung pulang tanpa berkata apa pun.","Rani mengajak Fikri berenang di sungai.","Nenek mempersilakan mereka masuk dan mulai bercerita tentang Wiryo.","Hujan es tiba-tiba turun dengan deras."],"statements":null,"answer":["C"],"explain":"Ucapan nenek yang sudah menunggu \"cucu Wiryo\" paling logis dilanjutkan dengan ajakan masuk dan cerita tentang Wiryo. **(C)**","passage":4},{"n":26,"type":"KAT","level":"L2","stem":"Tentukan benar atau salah setiap pernyataan berikut berdasarkan kedua teks.","extra":[],"options":null,"statements":["Teks 2 mengubah bagian narasi Teks 1 menjadi dialog dan petunjuk lakuan.","Dalam Teks 2, Samosir menyangkal telah memakan bekal ayahnya.","Petunjuk lakuan \"(membanting cangkul)\" menunjukkan kemarahan Toba.","Teks 2 memuat seluruh isi Teks 1 dari awal hingga terbentuknya danau."],"answer":["B","S","B","S"],"explain":"(1) Benar, peristiwa bekal disajikan sebagai dialog dan petunjuk lakuan. (2) Salah, Samosir meminta maaf dan mengaku lapar. (3) Benar, membanting cangkul menunjukkan marah. (4) Salah, Teks 2 hanya mengambil satu bagian cerita. **(B, S, B, S)**","passage":5},{"n":27,"type":"PG","level":"L2","stem":"Berdasarkan isinya, Teks 1 termasuk jenis cerita rakyat ….","extra":[],"options":["fabel","hikayat","legenda","mite tentang dewa-dewi"],"statements":null,"answer":["C"],"explain":"Cerita ini menjelaskan asal-usul suatu tempat (Danau Toba), jadi termasuk legenda. **(C)**","passage":5},{"n":28,"type":"PG","level":"L3","stem":"Peristiwa yang menjadi puncak konflik dalam Teks 1 adalah ….","extra":[],"options":["Toba berteriak \"Dasar anak ikan!\" sehingga melanggar janjinya","Toba menangkap ikan besar","Toba dan perempuan itu menikah","Samosir lahir"],"statements":null,"answer":["A"],"explain":"Konflik memuncak ketika Toba melanggar janji dengan mengungkit asal-usul istrinya. Sesudahnya datang bencana. **(A)**","passage":5},{"n":29,"type":"PGK","level":"L3","stem":"Pilih **semua** amanat yang sesuai dengan cerita tersebut.","extra":[],"options":["Tepatilah janji yang sudah diucapkan.","Kendalikan amarah agar tidak mengucapkan kata-kata yang menyakitkan.","Jangan menghabiskan milik orang lain tanpa izin.","Amarah boleh dilampiaskan kepada anak.","Janji boleh dilanggar ketika sedang lapar."],"statements":null,"answer":["A","B","C"],"explain":"A, B, dan C sesuai isi cerita. D dan E bertentangan dengan pesan cerita. **(A, B, C)**","passage":5},{"n":30,"type":"PG","level":"L3","stem":"Petunjuk lakuan *(Langit tiba-tiba gelap. Guruh menggelegar.)* pada akhir Teks 2 berfungsi untuk ….","extra":[],"options":["menunjukkan cuaca biasa pada siang hari","menggambarkan Toba yang takut hujan","menandai waktu makan siang","membangun suasana tegang sekaligus menandai datangnya akibat dari janji yang dilanggar"],"statements":null,"answer":["D"],"explain":"Langit gelap dan guruh tepat setelah Toba berteriak membangun ketegangan dan menandakan akibat pelanggaran janji. **(D)**","passage":5}]},{"id":"MTK01","title":"MTK 01 · Bilangan Bulat, Pecahan, dan Desimal","intro":"Materi: operasi bilangan bulat (termasuk negatif), membandingkan dan mengurutkan bilangan rasional, operasi pecahan dan desimal, penerapan dalam konteks suhu, kedalaman, waktu, dan keuangan.","passages":[],"questions":[{"n":1,"type":"PG","level":"L1","stem":"Hasil dari −8 + 15 − (−6) adalah ....","extra":[],"options":["−1","1","13","29"],"statements":null,"answer":["C"],"explain":"−8 + 15 = 7. Mengurangi −6 sama dengan menambah 6: 7 + 6 = 13. **(C)**","passage":null},{"n":2,"type":"PG","level":"L2","stem":"Suhu di puncak sebuah gunung pada pagi hari −4°C. Pada siang hari suhunya naik 11°C, lalu pada malam hari turun 9°C dari suhu siang. Berapa suhu pada malam hari?","extra":[],"options":["−6°C","−2°C","2°C","6°C"],"statements":null,"answer":["B"],"explain":"−4 + 11 = 7°C (siang). 7 − 9 = −2°C (malam). **(B)**","passage":null},{"n":3,"type":"KAT","level":"L3","stem":"Dalam sebuah kompetisi yang terdiri atas 40 soal, jawaban benar diberi skor 4, jawaban salah diberi skor −2, dan soal yang tidak dijawab diberi skor −1. Rani menjawab benar 28 soal, salah 8 soal, dan tidak menjawab 4 soal. Tentukan Benar atau Salah untuk setiap pernyataan.","extra":[],"options":null,"statements":["Skor Rani adalah 92.","Jika Rani menjawab keempat soal yang kosong dan semuanya salah, skornya turun 4.","Skor tertinggi yang mungkin diperoleh peserta adalah 160.","Dalam kompetisi ini, skor negatif tidak mungkin terjadi."],"answer":["B","B","B","S"],"explain":"Skor = 28 × 4 + 8 × (−2) + 4 × (−1) = 112 − 16 − 4 = 92 (benar). Empat soal kosong bernilai −4; jika dijawab salah semua bernilai −8, jadi skor turun 4 (benar). Skor maksimum 40 × 4 = 160 (benar). Jika semua salah, skornya −80, jadi skor negatif mungkin (salah). **(B, B, B, S)**","passage":null},{"n":4,"type":"PG","level":"L2","stem":"Urutan bilangan −3/4 ; −0,7 ; −2/3 ; −0,72 dari yang terkecil adalah ....","extra":[],"options":["−3/4 ; −0,72 ; −0,7 ; −2/3","−2/3 ; −0,7 ; −0,72 ; −3/4","−0,7 ; −0,72 ; −3/4 ; −2/3","−3/4 ; −0,7 ; −0,72 ; −2/3"],"statements":null,"answer":["A"],"explain":"Ubah ke desimal: −0,75 ; −0,7 ; −0,666... ; −0,72. Pada bilangan negatif, makin besar angkanya makin kecil nilainya: −0,75 < −0,72 < −0,7 < −0,666.... **(A)**","passage":null},{"n":5,"type":"PGK","level":"L3","stem":"Pilih **semua** pernyataan yang benar.","extra":[],"options":["Hasil kali dua bilangan negatif adalah bilangan positif.","(−2)³ = −8.","−5² = 25.","Hasil bagi bilangan negatif oleh bilangan positif adalah bilangan negatif."],"statements":null,"answer":["A","B","D"],"explain":"A benar. B benar: (−2) × (−2) × (−2) = −8. C salah: −5² = −(5 × 5) = −25; yang hasilnya 25 adalah (−5)². D benar. **(A, B, D)**","passage":null},{"n":6,"type":"PG","level":"L2","stem":"Hasil dari 2 1/3 × (−1 1/2) + 3/4 adalah ....","extra":[],"options":["−4 1/4","2 3/4","−2 3/4","−1 3/4"],"statements":null,"answer":["C"],"explain":"7/3 × (−3/2) = −7/2 = −14/4. −14/4 + 3/4 = −11/4 = −2 3/4. **(C)**","passage":null},{"n":7,"type":"PG","level":"L3","stem":"Sebuah kapal selam berada pada kedalaman 120 m di bawah permukaan laut. Kapal itu naik sejauh 3/8 dari kedalaman tersebut, lalu turun lagi 25 m. Di mana posisi kapal selam sekarang?","extra":[],"options":["50 m di bawah permukaan laut","145 m di bawah permukaan laut","100 m di bawah permukaan laut","70 m di bawah permukaan laut"],"statements":null,"answer":["C"],"explain":"Posisi awal −120 m. Naik 3/8 × 120 = 45 m menjadi −75 m. Turun 25 m menjadi −100 m. **(C)**","passage":null},{"n":8,"type":"PGK","level":"L2","stem":"Pilih **semua** bilangan yang terletak di antara −1/2 dan −1/3.","extra":[],"options":["−0,4","−5/12","−0,3","−3/5"],"statements":null,"answer":["A","B"],"explain":"−1/2 = −0,5 dan −1/3 ≈ −0,333. −0,4 dan −5/12 ≈ −0,417 berada di antaranya. −0,3 lebih besar dari −1/3, dan −3/5 = −0,6 lebih kecil dari −1/2. **(A, B)**","passage":null},{"n":9,"type":"PG","level":"L3","stem":"Waktu Indonesia Barat (WIB) adalah UTC+7, sedangkan waktu New York adalah UTC−5. Saat di Jakarta pukul 20.00 WIB, pukul berapa di New York?","extra":[],"options":["08.00 pada hari yang sama","13.00 pada hari yang sama","03.00 pada hari berikutnya","08.00 pada hari berikutnya"],"statements":null,"answer":["A"],"explain":"Selisih waktu Jakarta dan New York = 7 − (−5) = 12 jam. 20.00 − 12 jam = 08.00 pada hari yang sama. **(A)**","passage":null},{"n":10,"type":"KAT","level":"L3","stem":"Saldo awal kartu uang elektronik Dimas Rp35.000. Berturut-turut terjadi transaksi berikut: membayar tol Rp12.500, membayar parkir Rp8.750, isi ulang Rp50.000, dan belanja Rp27.300. Tentukan Benar atau Salah untuk setiap pernyataan.","extra":[],"options":null,"statements":["Saldo akhir kartu Rp36.450.","Saldo terendah selama transaksi itu Rp13.750.","Total pengeluaran Dimas Rp48.550.","Saldo akhir lebih kecil daripada saldo awal."],"answer":["B","B","B","S"],"explain":"Saldo berturut-turut: 35.000 → 22.500 → 13.750 → 63.750 → 36.450. Saldo terendah 13.750. Pengeluaran 12.500 + 8.750 + 27.300 = 48.550. Saldo akhir 36.450 lebih besar dari saldo awal (4 salah). **(B, B, B, S)**","passage":null},{"n":11,"type":"PG","level":"L2","stem":"Hasil dari 0,25 × 1,2 : 0,05 adalah ....","extra":[],"options":["0,6","6","60","0,06"],"statements":null,"answer":["B"],"explain":"Dari kiri: 0,25 × 1,2 = 0,3. 0,3 : 0,05 = 30 : 5 = 6. **(B)**","passage":null},{"n":12,"type":"PG","level":"L3","stem":"Sebuah tangki berisi air 5/8 bagian. Sebanyak 2/5 dari isi tangki itu dipakai. Kemudian tangki diisi lagi 45 liter sehingga penuh. Berapa liter kapasitas tangki itu?","extra":[],"options":["96 liter","72 liter","120 liter","80 liter"],"statements":null,"answer":["B"],"explain":"Sisa setelah dipakai = 3/5 × 5/8 = 3/8 bagian. Kekurangan agar penuh = 5/8 bagian = 45 liter. 1/8 = 9 liter, jadi kapasitas = 72 liter. **(B)**","passage":null},{"n":13,"type":"PGK","level":"L3","stem":"Diketahui a dan b bilangan bulat dengan a < 0 < b. Pilih **semua** pernyataan yang pasti benar.","extra":[],"options":["a × b < 0","a − b < 0","a + b > 0","b − a > 0"],"statements":null,"answer":["A","B","D"],"explain":"Contoh a = −3, b = 2. a × b negatif (A pasti). a − b = negatif dikurangi positif, makin negatif (B pasti). a + b bisa positif atau negatif, contoh −3 + 2 = −1 (C tidak pasti). b − a = b + |a| > 0 (D pasti). **(A, B, D)**","passage":null},{"n":14,"type":"PG","level":"L2","stem":"Bentuk pecahan biasa paling sederhana dari 0,454545... (45 berulang) adalah ....","extra":[],"options":["45/100","5/11","9/20","4/9"],"statements":null,"answer":["B"],"explain":"Misal x = 0,4545.... Maka 100x = 45,4545.... Kurangkan: 99x = 45, jadi x = 45/99 = 5/11. **(B)**","passage":null},{"n":15,"type":"PG","level":"L3","stem":"Suhu udara terendah di sebuah kota selama 5 hari tercatat −3°C, 2°C, −1°C, 4°C, dan −7°C. Rata-rata suhu terendah selama 5 hari itu adalah ....","extra":[],"options":["1°C","−3°C","−1°C","3,4°C"],"statements":null,"answer":["C"],"explain":"Jumlah = −3 + 2 − 1 + 4 − 7 = −5. Rata-rata = −5 : 5 = −1°C. **(C)**","passage":null},{"n":16,"type":"KAT","level":"L3","stem":"Soal: −12 : (−3) × 2 = .... Dina menjawab −12 : (−6) = 2. Edo menjawab 4 × 2 = 8. Tentukan Benar atau Salah untuk setiap pernyataan.","extra":[],"options":null,"statements":["Jawaban Edo benar.","Dina keliru karena mengerjakan perkalian lebih dahulu.","Hasil dari −12 : (−3) adalah bilangan positif.","Hasil dari −12 : 3 × (−2) adalah −8."],"answer":["B","B","B","S"],"explain":"Perkalian dan pembagian setara dikerjakan dari kiri: −12 : (−3) = 4, lalu 4 × 2 = 8. Edo benar, Dina salah. −12 : 3 × (−2) = −4 × (−2) = 8, bukan −8. **(B, B, B, S)**","passage":null},{"n":17,"type":"PG","level":"L2","stem":"Harga emas Rp1.000.000 per gram. Minggu ini harganya naik 2,5%, lalu minggu berikutnya turun 2% dari harga minggu ini. Berapa harga emas per gram sekarang?","extra":[],"options":["Rp1.005.000","Rp995.000","Rp1.000.500","Rp1.004.500"],"statements":null,"answer":["D"],"explain":"Naik 2,5%: Rp1.025.000. Turun 2% dari 1.025.000 = 20.500, jadi Rp1.004.500. Bukan sekadar naik 0,5% dari harga awal, karena persen turunnya dihitung dari harga yang sudah naik. **(D)**","passage":null},{"n":18,"type":"PG","level":"L2","stem":"Sebuah gedung memiliki lantai 1 sampai 10 di atas tanah dan tiga lantai bawah tanah yang diberi nomor −1, −2, dan −3 (lantai −1 tepat di bawah lantai 1, tanpa lantai 0). Andi naik lift dari lantai 7 turun ke lantai −3, lalu naik 5 lantai. Di lantai berapa Andi sekarang?","extra":[],"options":["Lantai 3","Lantai 2","Lantai −2","Lantai 9"],"statements":null,"answer":["A"],"explain":"Turun ke lantai −3, lalu naik 5 lantai: −2, −1, 1, 2, 3. Karena tidak ada lantai 0, Andi tiba di lantai 3, bukan lantai 2. **(A)**","passage":null},{"n":19,"type":"PGK","level":"L3","stem":"Pilih **semua** pernyataan yang benar.","extra":[],"options":["3/8 < 0,4","7/9 > 0,78","1,25 = 5/4","2/3 + 1/6 = 5/6"],"statements":null,"answer":["A","C","D"],"explain":"3/8 = 0,375 < 0,4 (benar). 7/9 = 0,777... < 0,78 (salah). 1,25 = 5/4 (benar). 4/6 + 1/6 = 5/6 (benar). **(A, C, D)**","passage":null},{"n":20,"type":"PG","level":"L3","stem":"Tiga petani menjual hasil panen. Petani A rugi Rp350.000, petani B untung Rp520.000, dan petani C rugi Rp95.000. Jika hasil ketiganya digabung, keadaannya adalah ....","extra":[],"options":["untung Rp75.000","rugi Rp75.000","untung Rp965.000","rugi Rp445.000"],"statements":null,"answer":["A"],"explain":"−350.000 + 520.000 − 95.000 = +75.000, artinya untung Rp75.000. **(A)**","passage":null},{"n":21,"type":"KAT","level":"L3","stem":"Botol A berisi 0,6 liter jus, botol B berisi 5/8 liter, dan botol C berisi 3/5 liter. Tentukan Benar atau Salah untuk setiap pernyataan.","extra":[],"options":null,"statements":["Isi botol A sama dengan isi botol C.","Botol B berisi jus paling banyak.","Jumlah jus di ketiga botol 1,825 liter.","Selisih isi botol B dan botol A adalah 0,25 liter."],"answer":["B","B","B","S"],"explain":"0,6 = 3/5 (1 benar). 5/8 = 0,625 terbesar (2 benar). 0,6 + 0,625 + 0,6 = 1,825 (3 benar). 0,625 − 0,6 = 0,025, bukan 0,25 (4 salah). **(B, B, B, S)**","passage":null},{"n":22,"type":"PG","level":"L2","stem":"Hasil dari (−3)² − (−2)³ + (−1)⁵ adalah ....","extra":[],"options":["2","18","0","16"],"statements":null,"answer":["D"],"explain":"(−3)² = 9; (−2)³ = −8; (−1)⁵ = −1. 9 − (−8) + (−1) = 9 + 8 − 1 = 16. **(D)**","passage":null},{"n":23,"type":"PG","level":"L2","stem":"Kota A berada pada ketinggian 1.250 m di atas permukaan laut. Dasar danau B berada 85 m di bawah permukaan laut. Berapa selisih ketinggian kedua tempat itu?","extra":[],"options":["1.165 m","1.335 m","−1.335 m","1.250 m"],"statements":null,"answer":["B"],"explain":"Selisih = 1.250 − (−85) = 1.335 m. Selisih jarak selalu bernilai positif. **(B)**","passage":null},{"n":24,"type":"PGK","level":"L2","stem":"Pilih **semua** bentuk yang hasilnya −24.","extra":[],"options":["−4 × 6","(−3) × (−8)","48 : (−2)","−30 + 6"],"statements":null,"answer":["A","C","D"],"explain":"−4 × 6 = −24. (−3) × (−8) = 24. 48 : (−2) = −24. −30 + 6 = −24. **(A, C, D)**","passage":null},{"n":25,"type":"PG","level":"L3","stem":"Perbaikan sebuah jalan dikerjakan selama tiga minggu. Minggu pertama selesai 1/4 bagian. Minggu kedua selesai 2/5 dari sisa jalan. Minggu ketiga selesai 1/3 dari sisa jalan setelah minggu kedua. Berapa bagian jalan yang belum diperbaiki?","extra":[],"options":["1/4","9/20","1/5","3/10"],"statements":null,"answer":["D"],"explain":"Setelah minggu 1 tersisa 3/4. Minggu 2: 2/5 × 3/4 = 3/10, sisa 3/4 − 3/10 = 9/20. Minggu 3: 1/3 × 9/20 = 3/20, sisa 9/20 − 3/20 = 6/20 = 3/10. **(D)**","passage":null},{"n":26,"type":"KAT","level":"L3","stem":"Tentukan Benar atau Salah untuk setiap pernyataan.","extra":[],"options":null,"statements":["Hasil dari −17 : 5 terletak di antara −4 dan −3.","−0,5 lebih besar daripada −0,05.","−2 lebih besar daripada −2,5.","Lawan (invers penjumlahan) dari −3/4 adalah 3/4."],"answer":["B","S","B","B"],"explain":"−17 : 5 = −3,4 (1 benar). −0,5 < −0,05 (2 salah). −2 > −2,5 (3 benar). −3/4 + 3/4 = 0 (4 benar). **(B, S, B, B)**","passage":null},{"n":27,"type":"PG","level":"L2","stem":"Hasil dari 4,8 : 0,16 adalah ....","extra":[],"options":["300","3","30","0,3"],"statements":null,"answer":["C"],"explain":"4,8 : 0,16 = 480 : 16 = 30. **(C)**","passage":null},{"n":28,"type":"PG","level":"L3","stem":"Sebuah tas didiskon 1/4 dari harga awal, kemudian mendapat potongan lagi Rp15.000. Harga akhir tas Rp210.000. Berapa harga awal tas itu?","extra":[],"options":["Rp315.000","Rp280.000","Rp300.000","Rp260.000"],"statements":nu
