hasil observasi menyajikan informasi umum dan objektif tentang suatu objek berdasarkan pengamatan, tanpa cerita pribadi atau ajakan. **(B)**","passage":2},{"n":15,"type":"PG","level":"L2","stem":"Makna kata *merunduk* pada paragraf (3) adalah ....","extra":[],"options":["tegak lurus ke atas","patah di tengah","menunduk atau melengkung ke bawah","mengering"],"statements":null,"answer":["C"],"explain":"Bulir *merunduk* karena berat, artinya menunduk atau melengkung ke bawah. **(C)**","passage":2},{"n":16,"type":"KAT","level":"L3","stem":"Tentukan Benar atau Salah setiap pernyataan berdasarkan berita.","extra":[],"options":null,"statements":["Harga cabai rawit naik Rp35.000 per kilogram.","Kenaikan harga disebabkan hujan yang membuat banyak tanaman cabai busuk.","Pasar murah akan digelar di seluruh kecamatan di kota itu.","Kutipan Darto menjelaskan hubungan antara pasokan dan harga."],"answer":["B","B","S","B"],"explain":"Rp80.000 − Rp45.000 = Rp35.000 (1 benar). (2) sesuai paragraf (2). Pasar murah digelar di lima kecamatan, tidak disebut seluruh kecamatan (3 salah). Kutipan Darto menjelaskan pasokan sedikit membuat harga naik (4 benar). **(B, B, S, B)**","passage":3},{"n":17,"type":"PG","level":"L2","stem":"Kalimat yang merupakan kutipan langsung adalah ....","extra":[],"options":["Warga diimbau tidak membeli cabai secara berlebihan.","Menurut pedagang, kenaikan harga terjadi karena pasokan berkurang.","Dinas Perdagangan akan menggelar pasar murah.","\"Barang sedikit, pembeli tetap banyak. Jadi harga naik,\" kata Darto."],"statements":null,"answer":["D"],"explain":"Kutipan langsung ditandai tanda petik dan sesuai dengan ucapan asli narasumber. **(D)**","passage":3},{"n":18,"type":"PG","level":"L3","stem":"Isi paragraf (3) adalah ....","extra":[],"options":["penyebab kenaikan harga","tanggapan pemerintah dan imbauan bagi warga","kronologi panen cabai","pendapat pedagang"],"statements":null,"answer":["B"],"explain":"Paragraf (3) memuat rencana pasar murah dari Dinas Perdagangan dan imbauan untuk warga. **(B)**","passage":3},{"n":19,"type":"PGK","level":"L3","stem":"Pilih **semua** imbauan atau saran bagi warga yang terdapat dalam berita.","extra":[],"options":["Tidak membeli cabai secara berlebihan.","Menanam cabai di pot.","Memborong cabai sebelum harga naik lagi.","Memakai cabai kering."],"statements":null,"answer":["A","B","D"],"explain":"A, B, dan D tersurat di paragraf (3). Memborong cabai bertentangan dengan imbauan. **(A, B, D)**","passage":3},{"n":20,"type":"PG","level":"L2","stem":"Makna kata *melonjak* pada paragraf (1) adalah ....","extra":[],"options":["naik tajam","turun drastis","tetap stabil","naik perlahan"],"statements":null,"answer":["A"],"explain":"Harga naik dari Rp45.000 ke Rp80.000 dalam dua minggu, jadi *melonjak* berarti naik tajam. **(A)**","passage":3},{"n":21,"type":"KAT","level":"L3","stem":"Tentukan Benar atau Salah setiap pernyataan berdasarkan berita.","extra":[],"options":null,"statements":["Bank sampah sekolah menerima sampah organik.","Sampah yang disetor ditimbang dan dicatat dalam buku tabungan.","Saldo tabungan dapat ditukarkan dengan alat tulis.","Pada minggu pertama terkumpul 85 kilogram sampah."],"answer":["S","B","B","B"],"explain":"Bank sampah menerima sampah anorganik (1 salah). (2), (3), dan (4) tersurat. **(S, B, B, B)**","passage":4},{"n":22,"type":"PG","level":"L2","stem":"Tujuan program bank sampah menurut guru pembina adalah ....","extra":[],"options":["menambah dana sekolah","membeli alat tulis untuk siswa","menumbuhkan kebiasaan memilah sampah","mengurangi kegiatan sekolah"],"statements":null,"answer":["C"],"explain":"Paragraf (3): program ini \"bertujuan menumbuhkan kebiasaan memilah sampah\". **(C)**","passage":4},{"n":23,"type":"PG","level":"L2","stem":"Makna kata *antusias* pada paragraf (3) adalah ....","extra":[],"options":["bersemangat","malas","ragu-ragu","takut"],"statements":null,"answer":["A"],"explain":"*Antusias* berarti bergairah atau bersemangat; dibuktikan dengan siswa yang membawa sampah dari rumah. **(A)**","passage":4},{"n":24,"type":"PGK","level":"L3","stem":"Pilih **semua** unsur berita yang terdapat dalam paragraf (1).","extra":[],"options":["Apa (peristiwanya)","Kapan (waktunya)","Siapa (pelakunya)","Mengapa (tujuannya)"],"statements":null,"answer":["A","B","C"],"explain":"Paragraf (1) memuat siapa (SMP Harapan Bangsa), apa (peresmian bank sampah), dan kapan (Senin, 9/11). Tujuan program baru dijelaskan di paragraf (3). **(A, B, C)**","passage":4},{"n":25,"type":"PG","level":"L3","stem":"Simpulan yang tepat berdasarkan berita adalah ....","extra":[],"options":["Bank sampah hanya dapat dimanfaatkan guru.","Siswa dilarang membawa sampah dari rumah.","Bank sampah memberikan uang tunai kepada siswa.","Program bank sampah disambut baik siswa dan mendorong kebiasaan memilah sampah."],"statements":null,"answer":["D"],"explain":"Siswa antusias dan sampah sudah terkumpul 85 kg pada minggu pertama. Saldo ditukar alat tulis atau biaya kegiatan, bukan uang tunai. **(D)**","passage":4},{"n":26,"type":"KAT","level":"L3","stem":"Tentukan Benar atau Salah setiap pernyataan berdasarkan laporan.","extra":[],"options":null,"statements":["Kunjungan dilakukan pada hari Kamis.","Perjalanan dari sekolah ke museum memakan waktu 1 jam 15 menit.","Siswa dibagi menjadi lima kelompok.","Paragraf (4) berisi saran."],"answer":["B","B","S","B"],"explain":"(1) tersurat. 07.30 sampai 08.45 = 1 jam 15 menit (2 benar). Siswa dibagi empat kelompok (3 salah). Kalimat \"Sebaiknya ...\" adalah saran (4 benar). **(B, B, S, B)**","passage":5},{"n":27,"type":"PG","level":"L2","stem":"Tujuan kunjungan ke museum adalah ....","extra":[],"options":["berwisata dan berbelanja suvenir","mengikuti lomba antarsekolah","menambah pemahaman siswa tentang sejarah perjuangan daerah","mengenal petugas museum"],"statements":null,"answer":["C"],"explain":"Paragraf (1): kegiatan \"bertujuan menambah pemahaman siswa tentang sejarah perjuangan daerah\". **(C)**","passage":5},{"n":28,"type":"PG","level":"L3","stem":"Kalimat yang berisi saran dalam laporan adalah ....","extra":[],"options":["Rombongan berangkat pukul 07.30.","Sebaiknya kegiatan serupa diadakan setiap semester.","Kegiatan berakhir pukul 12.00.","Setiap kelompok dipandu oleh petugas museum."],"statements":null,"answer":["B"],"explain":"Kata *sebaiknya* menandai saran. Pilihan lain berisi fakta kegiatan. **(B)**","passage":5},{"n":29,"type":"PGK","level":"L3","stem":"Pilih **semua** koleksi museum yang dilihat siswa menurut laporan.","extra":[],"options":["Senjata tradisional","Foto-foto perjuangan","Diorama pertempuran","Naskah kuno"],"statements":null,"answer":["A","B","C"],"explain":"Paragraf (2) menyebut senjata tradisional, foto perjuangan, dan diorama pertempuran. Naskah kuno tidak disebut. **(A, B, C)**","passage":5},{"n":30,"type":"PG","level":"L2","stem":"Lama kegiatan, dihitung dari keberangkatan hingga kegiatan berakhir, adalah ....","extra":[],"options":["3 jam 15 menit","4 jam","3 jam 30 menit","4 jam 30 menit"],"statements":null,"answer":["D"],"explain":"Dari pukul 07.30 sampai 12.00 = 4 jam 30 menit. **(D)**","passage":5}]},{"id":"BI04","title":"BI 04 · Teks Prosedur dan Laporan Percobaan","intro":"Fokus: tujuan teks prosedur, bahan dan alat, urutan langkah, kalimat perintah dan larangan, akibat jika langkah dilewati, serta unsur laporan percobaan (tujuan, hipotesis, variabel, data hasil, dan simpulan). Setiap teks dipakai untuk 5 soal.","passages":["> **Cara Membuat Kompos Sederhana dari Sampah Dapur**\n>\n> Bahan dan alat: sampah sayur dan buah, daun kering, tanah, ember bertutup, dan sekop kecil.\n>\n> 1. Lubangi bagian bawah ember sebagai jalan keluar air.\n> 2. Masukkan selapis tanah setebal kira-kira 5 cm ke dasar ember.\n> 3. Potong kecil-kecil sampah sayur dan buah, lalu masukkan ke dalam ember.\n> 4. Tutup sampah basah itu dengan selapis daun kering.\n> 5. Ulangi langkah 3 dan 4 hingga ember hampir penuh.\n> 6. Aduk campuran seminggu sekali agar udara masuk.\n> 7. Setelah 4–6 minggu, kompos siap dipakai jika berwarna cokelat gelap, gembur, dan berbau seperti tanah.\n>\n> Catatan: Jangan memasukkan daging, tulang, atau minyak karena dapat menimbulkan bau busuk dan mengundang tikus.","> **Mencuci Tangan dengan Sabun yang Benar**\n>\n> Mencuci tangan dengan sabun dapat mencegah penyebaran kuman. Lakukan langkah berikut selama sekitar 40–60 detik.\n>\n> 1. Basahi tangan dengan air mengalir, lalu tuangkan sabun secukupnya.\n> 2. Gosok kedua telapak tangan hingga berbusa.\n> 3. Gosok punggung tangan dan sela-sela jari secara bergantian.\n> 4. Gosok ujung-ujung jari dengan posisi saling mengunci.\n> 5. Gosok ibu jari dengan cara memutar di dalam genggaman tangan yang lain.\n> 6. Gosok ujung jari pada telapak tangan dengan gerakan memutar.\n> 7. Bilas tangan dengan air mengalir hingga bersih, lalu keringkan dengan tisu atau handuk bersih.\n>\n> Lakukan kebiasaan ini sebelum makan, setelah dari toilet, dan setelah memegang benda kotor.","> **Laporan Percobaan: Pengaruh Cahaya terhadap Pertumbuhan Kecambah Kacang Hijau**\n>\n> Tujuan: mengetahui pengaruh cahaya terhadap pertumbuhan kecambah kacang hijau.\n>\n> Hipotesis: kecambah di tempat gelap tumbuh lebih tinggi daripada kecambah di tempat terang.\n>\n> Alat dan bahan: 20 biji kacang hijau, 2 gelas plastik, kapas, dan air.\n>\n> Langkah: (1) Rendam biji kacang hijau selama 3 jam. (2) Letakkan kapas basah di dasar kedua gelas, lalu tanam 10 biji di setiap gelas. (3) Simpan gelas A di tempat terang dan gelas B di dalam lemari yang gelap. (4) Siram keduanya dengan jumlah air yang sama setiap hari. (5) Ukur tinggi kecambah setiap hari selama 5 hari.\n>\n> Simpulan: kecambah di tempat gelap tumbuh lebih cepat tinggi, tetapi lemah dan pucat. Hipotesis diterima.\n\nTabel hasil pengamatan pada hari ke-5:\n\n| Gelas | Tempat | Rata-rata tinggi | Keadaan |\n| --- | --- | --- | --- |\n| A | Terang | 6 cm | Daun hijau, batang tegak dan kokoh |\n| B | Gelap | 11 cm | Daun kuning pucat, batang kurus dan mudah rebah |","> **Cara Menggunakan Alat Pemadam Api Ringan (APAR)**\n>\n> APAR dapat dipakai untuk memadamkan api kecil sebelum membesar. Gunakan teknik PASS berikut.\n>\n> 1. Tarik (*pull*) pin pengaman pada bagian atas tabung.\n> 2. Arahkan (*aim*) ujung selang ke dasar api, bukan ke nyala apinya.\n> 3. Tekan (*squeeze*) tuas untuk menyemprotkan isi tabung.\n> 4. Sapukan (*sweep*) semprotan ke kiri dan ke kanan hingga api padam.\n>\n> Sebelum mendekati api, pastikan kamu berdiri sekitar 2–3 meter dari api dan membelakangi jalan keluar. Jika api tidak padam dalam beberapa detik atau makin membesar, segera tinggalkan tempat itu dan hubungi petugas pemadam kebakaran.","> **Laporan Percobaan: Mengapa Telur Dapat Terapung?**\n>\n> Tujuan: mengetahui pengaruh garam terhadap terapungnya telur di dalam air.\n>\n> Alat dan bahan: 3 gelas bening yang sama, 3 butir telur mentah yang sama ukurannya, air 300 ml untuk setiap gelas, garam dapur, dan sendok makan.\n>\n> Langkah: Isi ketiga gelas dengan air yang sama banyak. Gelas 1 tidak diberi garam, gelas 2 diberi 3 sendok makan garam, dan gelas 3 diberi 6 sendok makan garam. Aduk hingga larut, lalu masukkan telur secara perlahan.\n>\n> Hasil: telur di gelas 1 tenggelam di dasar, telur di gelas 2 melayang di tengah, dan telur di gelas 3 terapung di permukaan.\n>\n> Simpulan: makin banyak garam yang dilarutkan, makin besar massa jenis air sehingga telur makin mudah terapung.","> **Pertolongan Pertama pada Luka Bakar Ringan**\n>\n> Luka bakar ringan, misalnya karena tersentuh panci panas, dapat ditangani di rumah dengan langkah berikut.\n>\n> 1. Jauhkan korban dari sumber panas.\n> 2. Alirkan air bersih yang sejuk (bukan air es) ke bagian yang terbakar selama sekitar 20 menit.\n> 3. Lepaskan cincin, jam tangan, atau benda ketat di sekitar luka sebelum kulit membengkak.\n> 4. Tutup luka secara longgar dengan kain kasa bersih.\n> 5. Jangan mengoleskan pasta gigi, mentega, atau kecap karena dapat menyebabkan infeksi.\n> 6. Jangan memecahkan lepuh yang muncul.\n>\n> Segera bawa korban ke fasilitas kesehatan jika luka lebih besar dari telapak tangan korban, mengenai wajah, atau terlihat sangat parah."],"questions":[{"n":1,"type":"PG","level":"L1","stem":"Bahan yang digunakan untuk menutup lapisan sampah basah adalah ....","extra":[],"options":["tanah","daun kering","air","minyak"],"statements":null,"answer":["B"],"explain":"Langkah 4: \"Tutup sampah basah itu dengan selapis daun kering.\" **(B)**","passage":0},{"n":2,"type":"PG","level":"L2","stem":"Menurut teks, campuran kompos diaduk seminggu sekali dengan tujuan ....","extra":[],"options":["agar air keluar","agar ember cepat penuh","agar udara masuk","agar bau busuk muncul"],"statements":null,"answer":["C"],"explain":"Langkah 6: \"Aduk campuran seminggu sekali agar udara masuk.\" **(C)**","passage":0},{"n":3,"type":"KAT","level":"L3","stem":"Tentukan Benar atau Salah setiap pernyataan berdasarkan teks.","extra":[],"options":null,"statements":["Ember dilubangi bagian bawahnya agar air dapat keluar.","Sampah sayur dimasukkan utuh tanpa dipotong.","Kompos yang sudah matang berbau seperti tanah.","Tulang ayam boleh dimasukkan ke dalam ember kompos."],"answer":["B","S","B","S"],"explain":"(1) sesuai langkah 1. Sampah dipotong kecil-kecil (2 salah). (3) sesuai langkah 7. Tulang dilarang menurut catatan (4 salah). **(B, S, B, S)**","passage":0},{"n":4,"type":"PG","level":"L2","stem":"Kalimat pada langkah 3 termasuk kalimat ....","extra":[],"options":["perintah","tanya","berita","seru"],"statements":null,"answer":["A"],"explain":"Langkah 3 diawali verba perintah *potong* dan *masukkan*, ciri kalimat perintah dalam teks prosedur. **(A)**","passage":0},{"n":5,"type":"PG","level":"L3","stem":"Daging dan minyak tidak boleh dimasukkan ke dalam ember kompos karena ....","extra":[],"options":["membuat kompos cepat matang","membuat ember terlalu berat","merusak lapisan daun kering","dapat menimbulkan bau busuk dan mengundang tikus"],"statements":null,"answer":["D"],"explain":"Catatan teks menyebutkan alasannya: menimbulkan bau busuk dan mengundang tikus. **(D)**","passage":0},{"n":6,"type":"PG","level":"L2","stem":"Lama mencuci tangan yang disarankan dalam teks adalah ....","extra":[],"options":["sekitar 10 detik","sekitar 2 detik","sekitar 40–60 detik","sekitar 5 menit"],"statements":null,"answer":["C"],"explain":"Kalimat kedua teks: \"Lakukan langkah berikut selama sekitar 40–60 detik.\" **(C)**","passage":1},{"n":7,"type":"PG","level":"L2","stem":"Langkah yang dilakukan setelah menggosok punggung tangan dan sela-sela jari adalah ....","extra":[],"options":["membilas tangan","menggosok ujung jari dengan posisi saling mengunci","menuangkan sabun","mengeringkan tangan"],"statements":null,"answer":["B"],"explain":"Langkah 3 menggosok punggung tangan dan sela jari, langkah 4 menggosok ujung jari dengan posisi saling mengunci. **(B)**","passage":1},{"n":8,"type":"PGK","level":"L3","stem":"Pilih **semua** waktu mencuci tangan yang disarankan dalam teks.","extra":[],"options":["Sebelum makan","Setelah dari toilet","Hanya ketika tangan tampak kotor","Setelah memegang benda kotor"],"statements":null,"answer":["A","B","D"],"explain":"Kalimat terakhir menyebut sebelum makan, setelah dari toilet, dan setelah memegang benda kotor. Teks tidak membatasi hanya saat tangan tampak kotor. **(A, B, D)**","passage":1},{"n":9,"type":"PG","level":"L3","stem":"Jika langkah 7 tidak dilakukan, akibat yang paling mungkin adalah ....","extra":[],"options":["tangan tidak berbusa","kuman tidak tergosok","tangan menjadi kering","sisa sabun dan kotoran tertinggal di tangan"],"statements":null,"answer":["D"],"explain":"Langkah 7 membilas sabun dan kotoran yang terangkat. Tanpa membilas, sisa sabun dan kotoran tertinggal. **(D)**","passage":1},{"n":10,"type":"KAT","level":"L3","stem":"Tentukan Benar atau Salah setiap pernyataan berdasarkan teks.","extra":[],"options":null,"statements":["Manfaat mencuci tangan dijelaskan pada kalimat pertama teks.","Air yang digunakan sebaiknya air mengalir.","Ibu jari digosok dengan gerakan memutar.","Tangan dibilas sebelum digosok dengan sabun."],"answer":["B","B","B","S"],"explain":"(1), (2), dan (3) sesuai teks. Membilas dilakukan di akhir (langkah 7), setelah tangan digosok (4 salah). **(B, B, B, S)**","passage":1},{"n":11,"type":"PG","level":"L1","stem":"Tujuan percobaan tersebut adalah ....","extra":[],"options":["mengetahui pengaruh cahaya terhadap pertumbuhan kecambah","mengetahui pengaruh air terhadap kecambah","menghitung jumlah biji yang tumbuh","membandingkan dua jenis gelas"],"statements":null,"answer":["A"],"explain":"Bagian tujuan menyatakan: mengetahui pengaruh cahaya terhadap pertumbuhan kecambah kacang hijau. **(A)**","passage":2},{"n":12,"type":"PG","level":"L2","stem":"Hal yang sengaja dibuat berbeda antara gelas A dan gelas B adalah ....","extra":[],"options":["jumlah air siraman","jumlah biji","ada atau tidaknya cahaya","jenis kapas"],"statements":null,"answer":["C"],"explain":"Gelas A di tempat terang, gelas B di tempat gelap. Hanya cahaya yang dibedakan. **(C)**","passage":2},{"n":13,"type":"PGK","level":"L3","stem":"Pilih **semua** hal yang dibuat sama pada kedua gelas.","extra":[],"options":["Jumlah biji kacang hijau","Jumlah air siraman","Tempat penyimpanan","Kapas basah di dasar gelas"],"statements":null,"answer":["A","B","D"],"explain":"Jumlah biji (10), jumlah air siraman, dan kapas basah dibuat sama. Tempat penyimpanan justru dibedakan. **(A, B, D)**","passage":2},{"n":14,"type":"PG","level":"L3","stem":"Pernyataan yang sesuai dengan data hasil percobaan adalah ....","extra":[],"options":["Cahaya tidak berpengaruh terhadap pertumbuhan kecambah.","Kecambah di tempat gelap tumbuh lebih tinggi, tetapi lebih lemah dan pucat.","Kecambah di tempat terang tumbuh lebih tinggi.","Kecambah tidak dapat tumbuh di tempat gelap."],"statements":null,"answer":["B"],"explain":"Tabel menunjukkan kecambah di gelas B (gelap) lebih tinggi (11 cm), tetapi daunnya pucat dan batangnya mudah rebah. **(B)**","passage":2},{"n":15,"type":"PG","level":"L2","stem":"Selisih rata-rata tinggi kecambah di gelas B dan gelas A pada hari ke-5 adalah ....","extra":[],"options":["6 cm","17 cm","11 cm","5 cm"],"statements":null,"answer":["D"],"explain":"11 cm − 6 cm = 5 cm. **(D)**","passage":2},{"n":16,"type":"KAT","level":"L3","stem":"Tentukan Benar atau Salah setiap pernyataan berdasarkan teks.","extra":[],"options":null,"statements":["APAR digunakan untuk memadamkan api yang masih kecil.","Semprotan diarahkan ke bagian atas nyala api.","Pin pengaman ditarik sebelum tuas ditekan.","Pengguna APAR sebaiknya membelakangi jalan keluar."],"answer":["B","S","B","B"],"explain":"(1) tersurat. Semprotan diarahkan ke dasar api (2 salah). Urutan PASS: tarik pin dulu, baru tekan tuas (3 benar). (4) tersurat. **(B, S, B, B)**","passage":3},{"n":17,"type":"PG","level":"L2","stem":"Langkah *sweep* dalam teknik PASS berarti ....","extra":[],"options":["menarik pin pengaman","menekan tuas","menyapukan semprotan ke kiri dan ke kanan","mengarahkan selang ke dasar api"],"statements":null,"answer":["C"],"explain":"Langkah 4: sapukan (*sweep*) semprotan ke kiri dan ke kanan. **(C)**","passage":3},{"n":18,"type":"PG","level":"L3","stem":"Pengguna APAR dianjurkan membelakangi jalan keluar dengan tujuan ....","extra":[],"options":["agar dapat segera menyelamatkan diri jika api membesar","agar mudah melihat api","agar tidak terkena asap","agar tabung terasa ringan"],"statements":null,"answer":["A"],"explain":"Membelakangi jalan keluar memudahkan pengguna menyelamatkan diri jika api tidak dapat dipadamkan. **(A)**","passage":3},{"n":19,"type":"PGK","level":"L3","stem":"Pilih **semua** kata kerja perintah yang terdapat dalam langkah-langkah teks.","extra":[],"options":["tarik","arahkan","padam","tekan"],"statements":null,"answer":["A","B","D"],"explain":"*Tarik*, *arahkan*, dan *tekan* adalah verba perintah. *Padam* bukan kata perintah dalam langkah-langkah itu. **(A, B, D)**","passage":3},{"n":20,"type":"PG","level":"L2","stem":"Menurut teks, tindakan yang tepat jika api makin membesar adalah ....","extra":[],"options":["terus menyemprot sampai tabung habis","mencari APAR lain","menyiram api dengan air","meninggalkan tempat itu dan menghubungi petugas pemadam kebakaran"],"statements":null,"answer":["D"],"explain":"Kalimat terakhir: \"segera tinggalkan tempat itu dan hubungi petugas pemadam kebakaran\". **(D)**","passage":3},{"n":21,"type":"KAT","level":"L3","stem":"Tentukan Benar atau Salah setiap pernyataan berdasarkan teks.","extra":[],"options":null,"statements":["Jumlah air pada setiap gelas sama.","Telur di gelas 2 terapung di permukaan air.","Banyaknya garam adalah hal yang sengaja dibuat berbeda.","Simpulan menyatakan bahwa garam membuat telur menjadi lebih berat."],"answer":["B","S","B","S"],"explain":"(1) tersurat. Telur di gelas 2 melayang di tengah (2 salah). Jumlah garam dibuat berbeda 0, 3, dan 6 sendok (3 benar). Simpulan membahas massa jenis air, bukan berat telur (4 salah). **(B, S, B, S)**","passage":4},{"n":22,"type":"PG","level":"L2","stem":"Fungsi gelas 1 yang tidak diberi garam dalam percobaan adalah ....","extra":[],"options":["sebagai pembanding","untuk melarutkan garam","untuk menyimpan telur","untuk menambah garam"],"statements":null,"answer":["A"],"explain":"Gelas tanpa garam menjadi pembanding (kontrol) untuk melihat pengaruh garam. **(A)**","passage":4},{"n":23,"type":"PG","level":"L2","stem":"Makna kata *melayang* dalam hasil percobaan adalah ....","extra":[],"options":["terbang di udara","tenggelam di dasar gelas","berada di antara dasar dan permukaan air","terapung di permukaan air"],"statements":null,"answer":["C"],"explain":"Dalam percobaan, telur yang melayang berada di tengah, di antara dasar dan permukaan air. **(C)**","passage":4},{"n":24,"type":"PGK","level":"L3","stem":"Pilih **semua** hal yang membuat percobaan itu adil (sebanding).","extra":[],"options":["Ukuran telur sama.","Jumlah air sama.","Jumlah garam berbeda.","Jenis gelas sama."],"statements":null,"answer":["A","B","D"],"explain":"Ukuran telur, jumlah air, dan jenis gelas disamakan agar perbandingan adil. Jumlah garam sengaja dibedakan karena itulah yang diuji. **(A, B, D)**","passage":4},{"n":25,"type":"PG","level":"L3","stem":"Jika ada gelas keempat berisi 300 ml air yang diberi 9 sendok makan garam, hasil yang paling mungkin adalah ....","extra":[],"options":["telur tenggelam","telur tetap terapung","telur pecah","telur melayang di tengah"],"statements":null,"answer":["B"],"explain":"Sesuai simpulan, makin banyak garam, telur makin mudah terapung. Dengan 9 sendok garam, telur tetap terapung. **(B)**","passage":4},{"n":26,"type":"KAT","level":"L3","stem":"Tentukan Benar atau Salah setiap pernyataan berdasarkan teks.","extra":[],"options":null,"statements":["Luka bakar sebaiknya didinginkan dengan air es.","Cincin dilepaskan sebelum kulit membengkak.","Lepuh sebaiknya dipecahkan agar cepat kering.","Luka bakar yang mengenai wajah perlu segera dibawa ke fasilitas kesehatan."],"answer":["S","B","S","B"],"explain":"Teks meminta air sejuk, bukan air es (1 salah). (2) sesuai langkah 3. Lepuh tidak boleh dipecahkan (3 salah). (4) sesuai kalimat terakhir. **(S, B, S, B)**","passage":5},{"n":27,"type":"PG","level":"L2","stem":"Menurut teks, pasta gigi tidak boleh dioleskan pada luka bakar karena ....","extra":[],"options":["harganya mahal","terasa dingin","membuat luka cepat sembuh","dapat menyebabkan infeksi"],"statements":null,"answer":["D"],"explain":"Langkah 5: dapat menyebabkan infeksi. **(D)**","passage":5},{"n":28,"type":"PG","level":"L3","stem":"Kalimat \"Jangan memecahkan lepuh yang muncul\" termasuk kalimat ....","extra":[],"options":["larangan","ajakan","berita","tanya"],"statements":null,"answer":["A"],"explain":"Kalimat yang diawali *jangan* adalah kalimat larangan. **(A)**","passage":5},{"n":29,"type":"PGK","level":"L3","stem":"Pilih **semua** keadaan yang membuat korban perlu segera dibawa ke fasilitas kesehatan.","extra":[],"options":["Luka lebih besar dari telapak tangan korban.","Luka mengenai wajah.","Luka kecil di ujung jari yang sudah didinginkan.","Luka terlihat sangat parah."],"statements":null,"answer":["A","B","D"],"explain":"Kalimat terakhir menyebut luka lebih besar dari telapak tangan, mengenai wajah, atau sangat parah. Luka kecil yang sudah didinginkan dapat ditangani di rumah. **(A, B, D)**","passage":5},{"n":30,"type":"PG","level":"L2","stem":"Langkah pertama dalam menolong korban luka bakar ringan adalah ....","extra":[],"options":["menutup luka dengan kasa","menjauhkan korban dari sumber panas","mengalirkan air sejuk","melepaskan cincin"],"statements":null,"answer":["B"],"explain":"Langkah 1: jauhkan korban dari sumber panas. **(B)**","passage":5}]},{"id":"BI05","title":"BI 05 · Teks Persuasi, Iklan, dan Slogan","intro":"Fokus: ajakan dan alasan pendukung dalam teks persuasi, kata-kata persuasif, jenis dan tujuan iklan (niaga dan layanan masyarakat), bahasa iklan yang berlebihan, kelengkapan informasi, ciri slogan yang baik, serta pengumuman yang bersifat mengajak. Produk dan lembaga dalam teks bersifat rekaan. Setiap teks dipakai untuk 5 soal.","passages":["> **Lima Belas Menit yang Mengubah Banyak Hal**\n>\n> (1) Banyak siswa mengaku tidak punya waktu untuk membaca. Padahal, kita bisa menghabiskan lebih dari dua jam sehari untuk menggulir media sosial. Jika lima belas menit saja dari waktu itu dipakai untuk membaca buku, dalam setahun kita dapat menuntaskan belasan buku.\n>\n> (2) Membaca secara rutin melatih konsentrasi, menambah kosakata, dan membantu kita memahami soal-soal panjang dengan lebih cepat. Kemampuan ini sangat berguna, terutama menjelang ujian yang banyak menuntut pemahaman bacaan.\n>\n> (3) Oleh karena itu, mari mulai dari sekarang. Pilih satu buku yang kamu sukai, tentukan waktu yang sama setiap hari, dan letakkan ponsel di tempat lain selama membaca. Lima belas menit memang singkat, tetapi jika dilakukan setiap hari, manfaatnya akan sangat besar.","> **BOTOL MINUM LESTARIGO**\n>\n> Teman setia untuk sekolah, olahraga, dan perjalanan!\n>\n> - Menjaga minuman tetap dingin hingga 12 jam\n> - Bahan baja tahan karat, bebas BPA\n> - Tutup antibocor, mudah dibawa ke mana saja\n> - Tersedia 5 warna cerah\n>\n> Paling keren se-Indonesia! Dapatkan potongan 20% untuk pembelian di toko resmi selama bulan November.\n>\n> *Kurangi sampah plastik, mulai dari botolmu!*","> **Matikan Sebelum Pergi!**\n>\n> Tahukah kamu? Lampu, kipas, dan pengisi daya yang dibiarkan menyala atau tetap tercolok saat tidak dipakai tetap menyedot listrik.\n>\n> Langkah kecil, dampak besar:\n>\n> 1. Matikan lampu saat meninggalkan ruangan.\n> 2. Cabut pengisi daya setelah baterai penuh.\n> 3. Manfaatkan cahaya matahari pada siang hari.\n>\n> Hemat listrik, hemat biaya, selamatkan bumi.\n>\n> Pesan ini disampaikan oleh Dinas Lingkungan Hidup Kota Sejahtera.","> SMP Nusa Bakti mengadakan lomba slogan bertema \"Kebersihan Lingkungan Sekolah\". Berikut empat karya peserta.\n>\n> (1) \"Sekolah bersih, belajar pun nyaman.\"\n>\n> (2) \"Kebersihan sekolah adalah tanggung jawab bersama seluruh warga sekolah, baik siswa, guru, maupun petugas kebersihan, setiap hari tanpa kecuali.\"\n>\n> (3) \"Buang sampah pada tempatnya, jangan sembarangan, nanti dimarahi guru.\"\n>\n> (4) \"Sampah dipilah, bumi tak lelah.\"","> **Ayo Bersepeda ke Sekolah!**\n>\n> (1) Setiap pagi, jalan di sekitar sekolah kita dipadati kendaraan bermotor yang mengantar siswa. Asap knalpot dan kemacetan membuat suasana pagi terasa sesak.\n>\n> (2) Bersepeda ke sekolah dapat menjadi solusinya. Bersepeda tidak menghasilkan asap, menyehatkan jantung, dan melatih kemandirian. Bagi siswa yang rumahnya kurang dari 5 km dari sekolah, bersepeda bahkan sering lebih cepat daripada terjebak macet.\n>\n> (3) Tentu saja, keselamatan tetap yang utama. Gunakan helm, pastikan rem berfungsi baik, dan patuhi rambu lalu lintas. Sekolah pun hendaknya menyediakan tempat parkir sepeda yang aman.\n>\n> (4) Jadi, tunggu apa lagi? Mulailah bersepeda ke sekolah minggu ini, dan ajak temanmu untuk ikut serta.","> **DICARI: Calon Jurnalis Muda!**\n>\n> Suka menulis, memotret, atau penasaran dengan berita di sekitarmu? Bergabunglah dengan Ekstrakurikuler Jurnalistik SMP Cahaya Ilmu!\n>\n> Di sini kamu akan:\n>\n> - belajar menulis berita dan melakukan wawancara,\n> - mengelola majalah dinding dan media sosial sekolah,\n> - mengikuti lomba jurnalistik tingkat kota.\n>\n> Pendaftaran: Senin–Sabtu, 16–21 November, di ruang OSIS, pukul 12.00–14.00.\n>\n> Syarat: siswa kelas 7 dan 8, membawa satu contoh tulisan atau foto karya sendiri.\n>\n> Kuota terbatas, hanya 25 orang!"],"questions":[{"n":1,"type":"PG","level":"L1","stem":"Ajakan utama dalam teks tersebut adalah ....","extra":[],"options":["mengurangi media sosial sepenuhnya","membaca buku setidaknya lima belas menit setiap hari","membeli buku-buku baru","belajar keras menjelang ujian"],"statements":null,"answer":["B"],"explain":"Judul, contoh hitungan, dan paragraf (3) mengarah pada ajakan membaca lima belas menit setiap hari. Teks tidak meminta berhenti bermedia sosial sepenuhnya. **(B)**","passage":0},{"n":2,"type":"PG","level":"L2","stem":"Kata yang menandai kalimat ajakan dalam teks adalah ....","extra":[],"options":["padahal","terutama","mari","jika"],"statements":null,"answer":["C"],"explain":"*Mari* adalah kata ajakan. *Padahal* menyatakan pertentangan, *jika* menyatakan syarat. **(C)**","passage":0},{"n":3,"type":"KAT","level":"L3","stem":"Tentukan Benar atau Salah setiap pernyataan berdasarkan teks.","extra":[],"options":null,"statements":["Menurut penulis, membaca lima belas menit sehari dapat membuat kita menuntaskan belasan buku dalam setahun.","Membaca rutin membantu memahami soal panjang dengan lebih cepat.","Penulis menyarankan membaca sambil memegang ponsel.","Teks ini bertujuan memengaruhi pembaca agar melakukan sesuatu."],"answer":["B","B","S","B"],"explain":"(1) dan (2) tersurat. Penulis justru menyarankan meletakkan ponsel di tempat lain (3 salah). Teks persuasi bertujuan memengaruhi pembaca (4 benar). **(B, B, S, B)**","passage":0},{"n":4,"type":"PG","level":"L2","stem":"Fungsi paragraf (2) dalam teks tersebut adalah ....","extra":[],"options":["memaparkan manfaat membaca sebagai alasan pendukung ajakan","menceritakan pengalaman pribadi penulis","menyampaikan ajakan secara langsung","menyimpulkan seluruh isi teks"],"statements":null,"answer":["A"],"explain":"Paragraf (2) berisi manfaat membaca yang menjadi alasan mengapa ajakan itu perlu diikuti. **(A)**","passage":0},{"n":5,"type":"PG","level":"L3","stem":"Isi paragraf (3) adalah ....","extra":[],"options":["pengenalan masalah","fakta tentang media sosial","manfaat membaca","ajakan beserta langkah-langkah yang dapat dilakukan"],"statements":null,"answer":["D"],"explain":"Paragraf (3) diawali \"mari mulai dari sekarang\" lalu memberi langkah: memilih buku, menentukan waktu, dan menjauhkan ponsel. **(D)**","passage":0},{"n":6,"type":"PG","level":"L2","stem":"Iklan tersebut termasuk jenis ....","extra":[],"options":["iklan layanan masyarakat","iklan niaga (komersial)","iklan pengumuman sekolah","iklan berita duka"],"statements":null,"answer":["B"],"explain":"Iklan menawarkan produk dan potongan harga untuk dijual, ciri iklan niaga. **(B)**","passage":1},{"n":7,"type":"PG","level":"L2","stem":"Bagian iklan yang menggunakan bahasa berlebihan dan sulit dibuktikan adalah ....","extra":[],"options":["Menjaga minuman tetap dingin hingga 12 jam.","Tersedia 5 warna cerah.","Paling keren se-Indonesia!","Tutup antibocor, mudah dibawa ke mana saja."],"statements":null,"answer":["C"],"explain":"\"Paling keren se-Indonesia\" adalah klaim berlebihan yang tidak dapat diukur. Pilihan lain berupa keterangan produk yang dapat diperiksa. **(C)**","passage":1},{"n":8,"type":"PGK","level":"L3","stem":"Pilih **semua** informasi yang terdapat dalam iklan.","extra":[],"options":["Lama minuman tetap dingin","Harga botol","Besar potongan harga","Banyaknya pilihan warna"],"statements":null,"answer":["A","C","D"],"explain":"Iklan menyebut 12 jam, potongan 20%, dan 5 warna. Harga botol tidak dicantumkan. **(A, C, D)**","passage":1},{"n":9,"type":"PG","level":"L3","stem":"Informasi penting yang belum tercantum sehingga calon pembeli perlu mencari tahu sendiri adalah ....","extra":[],"options":["bahan pembuat botol","jumlah pilihan warna","kegunaan botol","harga normal dan alamat toko resmi"],"statements":null,"answer":["D"],"explain":"Iklan menyebut potongan 20% di toko resmi, tetapi tidak menyebut harga normal maupun lokasi toko. **(D)**","passage":1},{"n":10,"type":"KAT","level":"L3","stem":"Tentukan Benar atau Salah setiap pernyataan berdasarkan iklan.","extra":[],"options":null,"statements":["Iklan menawarkan potongan harga 20% selama bulan November.","Botol itu terbuat dari plastik.","Kalimat penutup iklan mengaitkan produk dengan isu lingkungan.","Iklan menyebutkan harga setelah potongan."],"answer":["B","S","B","S"],"explain":"(1) tersurat. Botol berbahan baja tahan karat (2 salah). Penutup \"Kurangi sampah plastik\" mengaitkan dengan lingkungan (3 benar). Harga tidak disebutkan sama sekali (4 salah). **(B, S, B, S)**","passage":1},{"n":11,"type":"PG","level":"L1","stem":"Pihak yang menyampaikan iklan tersebut adalah ....","extra":[],"options":["Dinas Lingkungan Hidup Kota Sejahtera","perusahaan listrik swasta","toko lampu","sekolah"],"statements":null,"answer":["A"],"explain":"Kalimat terakhir menyebut pesan disampaikan oleh Dinas Lingkungan Hidup Kota Sejahtera. **(A)**","passage":2},{"n":12,"type":"PG","level":"L2","stem":"Tujuan iklan tersebut adalah ....","extra":[],"options":["menjual lampu hemat energi","menginformasikan tarif listrik","mengajak masyarakat menghemat listrik","mengumumkan pemadaman listrik"],"statements":null,"answer":["C"],"explain":"Seluruh isi iklan mengajak mematikan dan mencabut alat listrik yang tidak dipakai. **(C)**","passage":2},{"n":13,"type":"PGK","level":"L3","stem":"Pilih **semua** tindakan yang sesuai dengan pesan iklan.","extra":[],"options":["Mencabut pengisi daya setelah baterai penuh.","Membiarkan kipas menyala saat keluar kamar.","Membuka tirai pada siang hari agar ruangan terang.","Mematikan lampu saat meninggalkan ruangan."],"statements":null,"answer":["A","C","D"],"explain":"A, C, dan D sesuai langkah 1–3. Membiarkan kipas menyala bertentangan dengan pesan iklan. **(A, C, D)**","passage":2},{"n":14,"type":"PG","level":"L3","stem":"Makna ungkapan \"Langkah kecil, dampak besar\" dalam iklan adalah ....","extra":[],"options":["langkah kaki saat berjalan harus pendek","kebiasaan sederhana dapat memberi manfaat besar","dampak buruk penggunaan listrik","biaya listrik sangat mahal"],"statements":null,"answer":["B"],"explain":"Tindakan sederhana seperti mematikan lampu, jika dibiasakan, menghemat banyak listrik. **(B)**","passage":2},{"n":15,"type":"PG","level":"L2","stem":"Ciri iklan layanan masyarakat yang tampak pada iklan tersebut adalah ....","extra":[],"options":["menawarkan barang dengan harga diskon","mencantumkan harga produk","memuat nomor rekening pembayaran","berisi ajakan demi kepentingan umum tanpa menjual produk"],"statements":null,"answer":["D"],"explain":"Iklan layanan masyarakat mengajak demi kepentingan umum dan tidak menjual barang. **(D)**","passage":2},{"n":16,"type":"KAT","level":"L3","stem":"Tentukan Benar atau Salah setiap pernyataan tentang slogan-slogan tersebut.","extra":[],"options":null,"statements":["Slogan (1) singkat dan sesuai dengan tema.","Slogan (2) kurang tepat karena terlalu panjang.","Slogan (3) paling tepat karena berisi larangan yang tegas.","Slogan (4) menggunakan persamaan bunyi pada akhir bagiannya."],"answer":["B","B","S","B"],"explain":"Slogan (1) singkat dan sesuai tema. Slogan (2) terlalu panjang. Slogan (3) memakai alasan takut dimarahi guru, kurang mendidik, sehingga bukan yang paling tepat (3 salah). Slogan (4) berima *pilah–lelah* (4 benar). **(B, B, S, B)**","passage":3},{"n":17,"type":"PG","level":"L2","stem":"Ciri slogan yang baik adalah ....","extra":[],"options":["singkat, padat, menarik, dan mudah diingat","panjang dan rinci","memuat data statistik","berbentuk cerita"],"statements":null,"answer":["A"],"explain":"Slogan yang baik singkat, padat, menarik, dan mudah diingat. **(A)**","passage":3},{"n":18,"type":"PG","level":"L3","stem":"Makna slogan (4) adalah ....","extra":[],"options":["sampah boleh dibuang ke sungai","bumi tidak pernah lelah","memilah sampah membantu menjaga kelestarian bumi","sampah tidak perlu dipilah"],"statements":null,"answer":["C"],"explain":"Memilah sampah memudahkan daur ulang dan mengurangi beban lingkungan, sehingga bumi \"tak lelah\". **(C)**","passage":3},{"n":19,"type":"PGK","level":"L3","stem":"Pilih **semua** slogan yang singkat, mudah diingat, dan bernada positif.","extra":[],"options":["Slogan (1)","Slogan (2)","Slogan (3)","Slogan (4)"],"statements":null,"answer":["A","D"],"explain":"Slogan (1) dan (4) singkat, mudah diingat, dan positif. Slogan (2) terlalu panjang, slogan (3) bernada menakut-nakuti. **(A, D)**","passage":3},{"n":20,"type":"PG","level":"L2","stem":"Slogan yang paling tepat untuk tema \"hemat air\" adalah ....","extra":[],"options":["\"Air itu dingin dan segar.\"","\"Air merupakan kebutuhan pokok manusia yang harus digunakan dengan bijaksana setiap hari oleh semua orang.\"","\"Jangan buang air.\"","\"Hemat air hari ini, cukup air esok hari.\""],"statements":null,"answer":["D"],"explain":"Pilihan D singkat, berima, dan jelas mengajak menghemat air. A tidak berisi ajakan, B terlalu panjang, C bermakna ganda. **(D)**","passage":3},{"n":21,"type":"KAT","level":"L3","stem":"Tentukan Benar atau Salah setiap pernyataan berdasarkan teks.","extra":[],"options":null,"statements":["Paragraf (1) memaparkan masalah yang melatarbelakangi ajakan.","Menurut penulis, bersepeda cocok untuk semua siswa tanpa memandang jarak rumah.","Penulis mengingatkan pentingnya keselamatan saat bersepeda.","Kata *hendaknya* pada paragraf (3) menandai saran."],"answer":["B","S","B","B"],"explain":"(1) benar. Penulis membatasi pada rumah yang kurang dari 5 km (2 salah). (3) tersurat. *Hendaknya* menandai saran (4 benar). **(B, S, B, B)**","passage":4},{"n":22,"type":"PG","level":"L2","stem":"Kalimat yang merupakan alasan pendukung ajakan bersepeda adalah ....","extra":[],"options":["Bersepeda tidak menghasilkan asap, menyehatkan jantung, dan melatih kemandirian.","Jalan di sekitar sekolah dipadati kendaraan.","Gunakan helm saat bersepeda.","Jadi, tunggu apa lagi?"],"statements":null,"answer":["A"],"explain":"Pilihan A berisi manfaat bersepeda yang menjadi alasan. B adalah masalah, C saran keselamatan, D ajakan penutup. **(A)**","passage":4},{"n":23,"type":"PG","level":"L2","stem":"Pertanyaan \"Jadi, tunggu apa lagi?\" pada paragraf (4) berfungsi untuk ....","extra":[],"options":["meminta pembaca menjawab pertanyaan","mendorong pembaca untuk segera bertindak","menanyakan waktu yang tepat","menunjukkan keraguan penulis"],"statements":null,"answer":["B"],"explain":"Pertanyaan itu adalah pertanyaan retoris yang tidak menuntut jawaban, tetapi mendorong pembaca segera bertindak. **(B)**","passage":4},{"n":24,"type":"PGK","level":"L3","stem":"Pilih **semua** hal yang disarankan penulis demi keselamatan bersepeda.","extra":[],"options":["Memakai helm","Memastikan rem berfungsi baik","Bersepeda bergerombol di tengah jalan","Mematuhi rambu lalu lintas"],"statements":null,"answer":["A","B","D"],"explain":"Paragraf (3) menyebut helm, rem, dan rambu lalu lintas. Bergerombol di tengah jalan berbahaya. **(A, B, D)**","passage":4},{"n":25,"type":"PG","level":"L3","stem":"Pihak yang diajak atau diberi saran dalam teks tersebut adalah ....","extra":[],"options":["hanya guru","polisi lalu lintas","siswa dan pihak sekolah","orang tua saja"],"statements":null,"answer":["C"],"explain":"Siswa diajak bersepeda, dan sekolah disarankan menyediakan parkir sepeda. **(C)**","passage":4},{"n":26,"type":"KAT","level":"L3","stem":"Tentukan Benar atau Salah setiap pernyataan berdasarkan pengumuman.","extra":[],"options":null,"statements":["Pendaftaran dilakukan di ruang OSIS.","Siswa kelas 9 dapat mendaftar.","Pendaftar harus membawa contoh karya sendiri.","Pendaftaran juga dibuka pada hari Minggu."],"answer":["B","S","B","S"],"explain":"(1) dan (3) tersurat. Syarat hanya untuk kelas 7 dan 8 (2 salah). Pendaftaran Senin–Sabtu, tidak termasuk Minggu (4 salah). **(B, S, B, S)**","passage":5},{"n":27,"type":"PG","level":"L2","stem":"Kalimat \"Kuota terbatas, hanya 25 orang!\" bertujuan untuk ....","extra":[],"options":["menakut-nakuti pembaca","memberi tahu jumlah guru pembina","menjelaskan syarat pendaftaran","mendorong pembaca segera mendaftar"],"statements":null,"answer":["D"],"explain":"Menyebut kuota terbatas membuat pembaca merasa perlu segera mendaftar sebelum kehabisan tempat. **(D)**","passage":5},{"n":28,"type":"PG","level":"L3","stem":"Siswa yang memenuhi syarat pendaftaran adalah ....","extra":[],"options":["Andi, kelas 9, membawa foto karyanya sendiri","Sinta, kelas 8, membawa contoh tulisan karyanya sendiri","Budi, kelas 7, membawa artikel yang diunduh dari internet","Rina, kelas 8, datang mendaftar pukul 15.00"],"statements":null,"answer":["B"],"explain":"Sinta memenuhi syarat kelas dan membawa karya sendiri. Andi kelas 9, Budi membawa karya orang lain, dan Rina datang di luar jam pendaftaran. **(B)**","passage":5},{"n":29,"type":"PGK","level":"L3","stem":"Pilih **semua** kegiatan yang akan dilakukan anggota ekstrakurikuler jurnalistik.","extra":[],"options":["Belajar menulis berita","Mengelola majalah dinding","Mencetak buku pelajaran","Mengikuti lomba jurnalistik"],"statements":null,"answer":["A","B","D"],"explain":"Ketiga kegiatan pada daftar disebutkan, kecuali mencetak buku pelajaran. **(A, B, D)**","passage":5},{"n":30,"type":"PG","level":"L2","stem":"Kalimat pembuka \"Suka menulis, memotret, atau penasaran dengan berita di sekitarmu?\" berfungsi untuk ....","extra":[],"options":["menarik perhatian sasaran pembaca","menyampaikan syarat pendaftaran","menutup pengumuman","menyebutkan waktu pendaftaran"],"statements":null,"answer":["A"],"explain":"Pertanyaan pembuka menyapa siswa yang memiliki minat tertentu agar tertarik membaca pengumuman. **(A)**","passage":5}]},{"id":"BI06","title":"BI 06 · Teks Diskusi, Opini, dan Editorial","intro":"Fokus: isu dan sudut pandang, argumen pendukung dan penentang, simpulan dan rekomendasi, fakta dan opini, ciri editorial dan surat pembaca, konjungsi pertentangan, serta tanggapan yang santun. Nama tempat dan tokoh dalam teks bersifat rekaan. Setiap teks dipakai untuk 5 soal.","passages":["> **Ponsel di Sekolah: Dilarang atau Diatur?**\n>\n> (1) Beberapa sekolah mulai mempertimbangkan larangan membawa ponsel ke sekolah. Kebijakan ini menimbulkan perdebatan di kalangan guru, siswa, dan orang tua.\n>\n> (2) Pihak yang setuju berpendapat bahwa ponsel sering mengganggu konsentrasi di kelas. Notifikasi media sosial dan gim membuat siswa sulit fokus. Selain itu, ponsel dapat menjadi sarana perundungan siber dan menyontek saat ulangan.\n>\n> (3) Sebaliknya, pihak yang tidak setuju menganggap ponsel bermanfaat sebagai sumber belajar, misalnya untuk mencari informasi atau mengakses kelas daring. Orang tua juga membutuhkan ponsel untuk menghubungi anak, terutama dalam keadaan darurat.\n>\n> (4) Kedua pandangan itu sama-sama memiliki alasan yang kuat. Jalan tengahnya, sekolah dapat mengizinkan siswa membawa ponsel, tetapi ponsel dikumpulkan selama jam pelajaran dan hanya digunakan untuk kegiatan belajar atas izin guru.","> **Jangan Biarkan Bahasa Ibu Menghilang**\n>\n> (1) Saya sering mendengar teman-teman sebaya lebih fasih berbahasa Inggris daripada berbahasa daerah orang tua mereka. Kemampuan berbahasa asing memang penting. Namun, menurut saya, kehilangan bahasa daerah berarti kehilangan sebagian jati diri.\n>\n> (2) Bahasa daerah menyimpan kearifan lokal, seperti peribahasa, nyanyian, dan cara masyarakat memandang alam. Jika tidak ada lagi penuturnya, pengetahuan itu ikut lenyap. Banyak bahasa daerah di Indonesia kini hanya dituturkan oleh orang-orang tua.\n>\n> (3) Karena itu, saya mengusulkan agar keluarga membiasakan berbahasa daerah di rumah, setidaknya pada waktu makan bersama. Sekolah juga dapat mengadakan pentas seni yang menggunakan bahasa daerah. Bahasa Indonesia tetap kita junjung sebagai bahasa persatuan, tetapi bahasa ibu jangan sampai dilupakan.","> **Tajuk Rencana: Pasar Bersih Dimulai dari Kantong Belanja**\n>\n> (1) Tumpukan sampah plastik di Pasar Raya Kota Sejahtera kembali dikeluhkan warga. Setiap hari, petugas mengangkut berton-ton sampah, dan sebagian besar berupa kantong plastik sekali pakai.\n>\n> (2) Pemerintah kota sebenarnya telah menerbitkan imbauan pengurangan kantong plastik sejak tahun lalu. Sayangnya, imbauan itu belum diikuti pengawasan dan sosialisasi yang memadai. Pedagang masih membagikan kantong plastik secara gratis karena takut kehilangan pembeli.\n>\n> (3) Kami berpendapat, masalah ini tidak bisa diselesaikan dengan imbauan semata. Pemerintah perlu menyediakan kantong belanja kain dengan harga terjangkau, memberi insentif bagi pedagang yang tidak memakai plastik, serta menyosialisasikannya secara terus-menerus. Di sisi lain, pembeli juga harus mulai membawa tas belanja sendiri. Pasar yang bersih adalah tanggung jawab bersama.","> **Perlukah PR Dihapus?**\n>\n> (1) Belakangan ini muncul usulan agar sekolah menghapus pekerjaan rumah (PR). Usulan tersebut menuai tanggapan yang beragam.\n>\n> (2) Pendukung penghapusan PR berpendapat bahwa siswa sudah belajar seharian di sekolah. Waktu di rumah sebaiknya dipakai untuk beristirahat, berolahraga, membantu orang tua, dan mengembangkan minat. PR yang terlalu banyak juga dapat menimbulkan stres dan membuat siswa tidur larut malam.\n>\n> (3) Di sisi lain, pihak yang menolak penghapusan menilai PR melatih kedisiplinan dan tanggung jawab. PR juga membantu siswa mengulang materi agar lebih melekat di ingatan. Tanpa PR, sebagian siswa mungkin tidak membuka buku sama sekali di rumah.\n>\n> (4) Dengan mempertimbangkan kedua pendapat itu, PR sebaiknya tidak dihapus, tetapi dibatasi jumlahnya dan dirancang lebih bermakna, misalnya berupa proyek kecil atau kegiatan membaca.","> **Jalan Rusak di Depan SMP Pelita**\n>\n> Yth. Redaksi Harian Sejahtera,\n>\n> (1) Saya adalah orang tua siswa SMP Pelita di Jalan Melati. Sudah tiga bulan jalan di depan sekolah rusak parah. Lubang-lubangnya cukup dalam dan tergenang air saat hujan.\n>\n> (2) Pekan lalu, dua siswa terjatuh dari sepeda karena roda masuk ke lubang yang tertutup genangan. Untungnya, mereka hanya mengalami luka ringan. Namun, kejadian ini dapat terulang dan menimbulkan korban yang lebih parah.\n>\n> (3) Melalui surat ini, saya memohon agar dinas terkait segera memperbaiki jalan tersebut. Sementara menunggu perbaikan, sebaiknya dipasang tanda peringatan di sekitar lubang.\n>\n> Hormat saya, Dewi Lestari, warga Kelurahan Sukamaju","> **Tajuk Rencana: Jari yang Melukai**\n>\n> (1) Kasus perundungan siber di kalangan pelajar makin sering kita dengar. Ejekan di kolom komentar, penyebaran foto tanpa izin, hingga pengucilan dari grup percakapan dapat membuat korban merasa tertekan, malu, dan enggan bersekolah.\n>\n> (2) Berbeda dengan perundungan langsung, perundungan siber dapat terjadi kapan saja dan dilihat banyak orang. Jejak digitalnya pun sulit dihapus. Ironisnya, banyak pelaku menganggap perbuatannya hanya bercanda.\n>\n> (3) Kami memandang, sekolah dan keluarga perlu bekerja sama. Sekolah dapat memasukkan etika bermedia sosial ke dalam kegiatan pembelajaran dan menyediakan saluran pengaduan yang aman. Orang tua perlu mendampingi anak saat menggunakan media sosial. Bagi kita semua, berpikirlah sebelum mengetik, karena jari dapat melukai lebih dalam daripada yang kita kira."],"questions":[{"n":1,"type":"PG","level":"L1","stem":"Isu yang dibahas dalam teks tersebut adalah ....","extra":[],"options":["perundungan siber di sekolah","larangan membawa ponsel ke sekolah","pelaksanaan kelas daring","kecurangan saat ulangan"],"statements":null,"answer":["B"],"explain":"Paragraf (1) memperkenalkan isu larangan membawa ponsel ke sekolah. Pilihan lain hanya bagian dari argumen. **(B)**","passage":0},{"n":2,"type":"PG","level":"L2","stem":"Argumen pihak yang tidak setuju dengan larangan ponsel adalah ....","extra":[],"options":["Ponsel mengganggu konsentrasi di kelas.","Ponsel dapat menjadi sarana menyontek.","Ponsel bermanfaat sebagai sumber belajar dan alat komunikasi darurat.","Notifikasi media sosial membuat siswa sulit fokus."],"statements":null,"answer":["C"],"explain":"Paragraf (3) memuat argumen pihak yang tidak setuju: sumber belajar dan komunikasi darurat. Pilihan A, B, dan D adalah argumen pihak yang setuju. **(C)**","passage":0},{"n":3,"type":"KAT","level":"L3","stem":"Tentukan Benar atau Salah setiap pernyataan berdasarkan teks.","extra":[],"options":null,"statements":["Paragraf (2) berisi argumen pihak yang setuju dengan larangan.","Kata *sebaliknya* pada paragraf (3) menandai peralihan ke pendapat yang berbeda.","Penulis memihak sepenuhnya pada larangan ponsel.","Paragraf (4) berisi simpulan berupa jalan tengah."],"answer":["B","B","S","B"],"explain":"(1) dan (2) benar. Penulis menawarkan jalan tengah, tidak memihak sepenuhnya (3 salah). (4) benar. **(B, B, S, B)**","passage":0},{"n":4,"type":"PG","level":"L2","stem":"Teks tersebut termasuk teks diskusi karena ....","extra":[],"options":["menyajikan dua pandangan berbeda tentang satu isu lalu memberikan simpulan","menceritakan pengalaman pribadi penulis","menjelaskan proses terjadinya sesuatu","mengajak pembaca membeli produk"],"statements":null,"answer":["A"],"explain":"Teks diskusi menampilkan isu, argumen dari dua sisi, lalu simpulan atau rekomendasi. **(A)**","passage":0},{"n":5,"type":"PG","level":"L3","stem":"Rekomendasi penulis dalam teks tersebut adalah ....","extra":[],"options":["ponsel dilarang dibawa ke sekolah","ponsel boleh dipakai kapan saja di sekolah","orang tua tidak perlu menghubungi anak","ponsel boleh dibawa, tetapi dikumpulkan selama pelajaran dan dipakai atas izin guru"],"statements":null,"answer":["D"],"explain":"Paragraf (4) mengusulkan ponsel tetap boleh dibawa, tetapi dikumpulkan selama pelajaran. **(D)**","passage":0},{"n":6,"type":"PG","level":"L2","stem":"Pendapat utama penulis dalam teks tersebut adalah ....","extra":[],"options":["kehilangan bahasa daerah berarti kehilangan sebagian jati diri","bahasa Inggris tidak penting dipelajari","bahasa Indonesia tidak perlu digunakan","sekolah harus melarang bahasa asing"],"statements":null,"answer":["A"],"explain":"Pendapat utama ditandai \"menurut saya\" pada paragraf (1). Penulis tetap menganggap bahasa asing penting. **(A)**","passage":1},{"n":7,"type":"PG","level":"L2","stem":"Makna *kearifan lokal* pada paragraf (2) adalah ....","extra":[],"options":["kekayaan alam suatu daerah","pengetahuan dan nilai bijak yang hidup dalam masyarakat setempat","peraturan pemerintah daerah","makanan khas daerah"],"statements":null,"answer":["B"],"explain":"*Kearifan lokal* adalah pengetahuan dan nilai bijak masyarakat setempat, dicontohkan dengan peribahasa, nyanyian, dan cara memandang alam. **(B)**","passage":1},{"n":8,"type":"PGK","level":"L3","stem":"Pilih **semua** usulan penulis.","extra":[],"options":["Keluarga berbahasa daerah di rumah, setidaknya saat makan bersama.","Sekolah mengadakan pentas seni berbahasa daerah.","Bahasa Indonesia di sekolah diganti dengan bahasa daerah.","Pelajaran bahasa Inggris dihapuskan."],"statements":null,"answer":["A","B"],"explain":"Paragraf (3) mengusulkan berbahasa daerah di rumah dan pentas seni. Penulis tetap menjunjung bahasa Indonesia dan tidak menolak bahasa Inggris. **(A, B)**","passage":1},{"n":9,"type":"PG","level":"L3","stem":"Kalimat yang merupakan fakta dalam teks adalah ....","extra":[] uhan energi 2.150 kkal."],"questions":[{"n":1,"type":"PG","level":"L1","stem":"Hari dengan jumlah pengunjung terbanyak adalah ....","extra":[],"options":["Selasa","Rabu","Kamis","Senin"],"statements":null,"answer":["B"],"explain":"Kolom jumlah: Rabu 73 orang, paling banyak. **(B)**","passage":0},{"n":2,"type":"PG","level":"L2","stem":"Jumlah pengunjung kelas 9 selama lima hari adalah ....","extra":[],"options":["98 orang","100 orang","97 orang","295 orang"],"statements":null,"answer":["A"],"explain":"12 + 15 + 28 + 35 + 8 = 98 orang. **(A)**","passage":0},{"n":3,"type":"KAT","level":"L3","stem":"Tentukan Benar atau Salah setiap pernyataan berdasarkan tabel.","extra":[],"options":null,"statements":["Pengunjung paling sedikit terjadi pada hari Jumat.","Pengunjung kelas 9 paling banyak pada hari Kamis.","Setiap hari, pengunjung kelas 7 selalu lebih banyak daripada kelas 9.","Total pengunjung selama lima hari adalah 295 orang."],"answer":["B","B","S","B"],"explain":"Jumat 30 orang, paling sedikit (1 benar). Kelas 9 terbanyak Kamis, 35 orang (2 benar). Pada Rabu dan Kamis kelas 9 lebih banyak daripada kelas 7 (3 salah). 55 + 67 + 73 + 70 + 30 = 295 (4 benar). **(B, B, S, B)**","passage":0},{"n":4,"type":"PG","level":"L2","stem":"Simpulan yang sesuai dengan data pada tabel adalah ....","extra":[],"options":["Kelas 8 selalu paling sedikit pengunjungnya.","Jumat adalah hari dengan pengunjung terbanyak.","Kunjungan kelas 9 meningkat dari Senin sampai Kamis.","Kelas 7 paling sering berkunjung setiap hari."],"statements":null,"answer":["C"],"explain":"Kelas 9: 12, 15, 28, 35 dari Senin sampai Kamis, terus naik. Pada Senin kelas 9 lebih sedikit dari kelas 8, jadi A salah. **(C)**","passage":0},{"n":5,"type":"PG","level":"L3","stem":"Rata-rata jumlah pengunjung perpustakaan per hari pada minggu tersebut adalah ....","extra":[],"options":["55 orang","60 orang","73 orang","59 orang"],"statements":null,"answer":["D"],"explain":"295 : 5 = 59 orang. **(D)**","passage":0},{"n":6,"type":"PG","level":"L1","stem":"Kelas yang mengumpulkan sampah terpilah paling banyak adalah ....","extra":[],"options":["9C","9E","9A","9B"],"statements":null,"answer":["A"],"explain":"Batang tertinggi milik kelas 9C, yaitu 50 kg. **(A)**","passage":1},{"n":7,"type":"PG","level":"L2","stem":"Selisih sampah yang dikumpulkan kelas 9C dan kelas 9D adalah ....","extra":[],"options":["15 kg","28 kg","22 kg","50 kg"],"statements":null,"answer":["C"],"explain":"50 − 28 = 22 kg. **(C)**","passage":1},{"n":8,"type":"PGK","level":"L3","stem":"Pilih **semua** kelas yang mengumpulkan sampah lebih dari 40 kg.","extra":[],"options":["9A","9B","9C","9E"],"statements":null,"answer":["A","C","D"],"explain":"9A (42), 9C (50), dan 9E (45) lebih dari 40 kg. 9B hanya 35 kg. **(A, C, D)**","passage":1},{"n":9,"type":"PG","level":"L3","stem":"Persentase sampah yang dikumpulkan kelas 9C terhadap jumlah seluruh sampah kelima kelas adalah ....","extra":[],"options":["20%","25%","50%","40%"],"statements":null,"answer":["B"],"explain":"Total = 42 + 35 + 50 + 28 + 45 = 200 kg. 50/200 × 100% = 25%. **(B)**","passage":1},{"n":10,"type":"KAT","level":"L3","stem":"Tentukan Benar atau Salah setiap pernyataan berdasarkan diagram.","extra":[],"options":null,"statements":["Kelas 9D mengumpulkan sampah paling sedikit.","Jumlah sampah kelima kelas 200 kg.","Kelas 9E mengumpulkan sampah dua kali lipat kelas 9D.","Rata-rata sampah per kelas 40 kg."],"answer":["B","B","S","B"],"explain":"9D paling sedikit, 28 kg (1 benar). Total 200 kg (2 benar). Dua kali 28 adalah 56, bukan 45 (3 salah). 200 : 5 = 40 kg (4 benar). **(B, B, S, B)**","passage":1},{"n":11,"type":"PG","level":"L1","stem":"Suhu maksimum tertinggi dalam minggu itu terjadi pada hari ....","extra":[],"options":["Senin","Selasa","Sabtu","Minggu"],"statements":null,"answer":["D"],"explain":"Titik tertinggi pada hari Minggu, 35 °C. **(D)**","passage":2},{"n":12,"type":"PG","level":"L2","stem":"Kenaikan suhu terbesar antara dua hari yang berurutan terjad :[],"options":["24 orang","40 orang","64 orang","16 orang"],"statements":null,"answer":["D"],"explain":"10% × 160 = 16 orang. **(D)**","passage":3},{"n":18,"type":"PG","level":"L3","stem":"Selisih banyak siswa yang hobinya olahraga dan membaca adalah ....","extra":[],"options":["40 orang","25 orang","64 orang","24 orang"],"statements":null,"answer":["A"],"explain":"Olahraga 64 orang, membaca 24 orang. Selisih 40 orang. **(A)**","passage":3},{"n":19,"type":"PGK","level":"L3","stem":"Pilih **semua** hobi yang dipilih oleh kurang dari 20% siswa.","extra":[],"options":["Membaca","Musik","Menggambar","Lainnya"],"statements":null,"answer":["A","C","D"],"explain":"Membaca 15%, menggambar 10%, dan lainnya 10% kurang dari 20%. Musik 25%. **(A, C, D)**","passage":3},{"n":20,"type":"PG","level":"L2","stem":"Diagram lingkaran paling tepat digunakan untuk menyajikan ....","extra":[],"options":["perubahan data dari waktu ke waktu","perbandingan bagian-bagian terhadap keseluruhan","urutan langkah suatu kegiatan","hubungan dua variabel"],"statements":null,"answer":["B"],"explain":"Diagram lingkaran menunjukkan besar setiap bagian terhadap keseluruhan (100%). Perubahan dari waktu ke waktu lebih tepat dengan grafik garis. **(B)**","passage":3},{"n":21,"type":"KAT","level":"L3","stem":"Tentukan Benar atau Salah setiap pernyataan berdasarkan infografis.","extra":[],"options":null,"statements":["Menyikat gigi dengan gelas menghemat sekitar 5,5 liter air dibandingkan dengan keran terbuka.","Keran bocor 1 tetes per detik membuang sekitar 15 liter air per hari.","Mencuci motor dengan ember memakai air lima kali lebih banyak daripada dengan selang.","Infografis mengajak pembaca memperbaiki kebocoran."],"answer":["B","B","S","B"],"explain":"6 − 0,5 = 5,5 liter (1 benar). (2) tersurat. Ember ± 20 liter, selang ± 100 liter; justru selang lima kali lebih banyak (3 salah). (4) tersurat pada ajakan. **(B, B, S, B)**","passage":4},{"n":22,"type":"PG","level":"L2","stem":"Jika keran bocor itu tidak  **(B, B, B, S)**","passage":5},{"n":27,"type":"PG","level":"L2","stem":"Energi yang diperoleh dari 2 kemasan susu tersebut adalah ....","extra":[],"options":["140 kkal","200 kkal","280 kkal","420 kkal"],"statements":null,"answer":["C"],"explain":"2 × 140 = 280 kkal. **(C)**","passage":5},{"n":28,"type":"PG","level":"L3","stem":"Simpulan yang tepat berdasarkan tabel adalah ....","extra":[],"options":["Susu ini tidak mengandung lemak.","Protein adalah kandungan terbesar dalam satuan gram.","Susu ini bebas gula.","Sebagian besar karbohidratnya berupa gula sehingga sebaiknya tidak dikonsumsi berlebihan."],"statements":null,"answer":["D"],"explain":"Gula 17 g dari karbohidrat total 20 g, jadi sebagian besar karbohidratnya gula. Susu ini mengandung lemak 5 g, dan kandungan terbesar dalam gram adalah karbohidrat. **(D)**","passage":5},{"n":29,"type":"PGK","level":"L3","stem":"Pilih **semua** informasi yang tercantum dalam tabel.","extra":[],"options":["Energi total","Vitamin C","Natrium","Lemak total"],"statements":null,"answer":["A","C","D"],"explain":"Energi total, natrium, dan lemak total tercantum. Vitamin C tidak ada dalam tabel. **(A, C, D)**","passage":5},{"n":30,"type":"PG","level":"L2","stem":"Singkatan AKG pada tabel adalah ....","extra":[],"options":["Angka Kecukupan Gizi","Angka Kebutuhan Gula","Asupan Kalori Gizi","Angka Kandungan Gula"],"statements":null,"answer":["A"],"explain":"AKG adalah Angka Kecukupan Gizi. **(A)**","passage":5}]},{"id":"BI08","title":"BI 08 · Campuran dan Lintas Teks (Informasi)","intro":"Fokus: membandingkan dua teks tentang topik yang sama (persamaan, perbedaan, informasi yang hanya ada di salah satu teks, sudut pandang), teks biografi, ulasan buku, notulen rapat, dan surat dinas. Nama sekolah, tokoh rekaan, dan peristiwa dalam berita bersifat rekaan, kecuali biografi tokoh nasional. Setiap teks atau pasangan teks dipakai untuk 5 soal.","passages":["> **Teks A — Potensi Energi Surya di Indonesia**\n>\n> (1) Indonesia berada di garis khatulistiwa sehingga menerima sinar matahari hampir sepanjang tahun. Kondisi ini membuat energi surya sangat potensial untuk dikembangkan. Panel surya mengubah cahaya matahari menjadi listrik tanpa menghasilkan asap.\n>\n> (2) Meskipun demikian, biaya awal pemasangan panel surya masih tergolong mahal. Selain itu, listrik yang dihasilkan bergantung pada cuaca, sehingga diperlukan baterai untuk menyimpan energi pada malam hari atau saat mendung.\n\n> **Teks B — SMP Negeri 7 Sukamaju Pasang Panel Surya**\n>\n> SMP Negeri 7 Sukamaju memasang 20 panel surya di atap gedung sekolah, Jumat (6/11). Panel itu mampu memenuhi sekitar 40% kebutuhan listrik sekolah pada siang hari. Kepala sekolah, Rudi Hartono, mengatakan bahwa dana pemasangan berasal dari bantuan program sekolah hijau. \"Tagihan listrik bulan pertama turun cukup banyak. Selain hemat, siswa juga bisa belajar langsung tentang energi terbarukan,\" katanya.","> **Ki Hajar Dewantara, Bapak Pendidikan Nasional**\n>\n> (1) Ki Hajar Dewantara lahir di Yogyakarta pada 2 Mei 1889 dengan nama Raden Mas Soewardi Soerjaningrat. Ia dikenal sebagai wartawan yang berani mengkritik pemerintah kolonial Belanda melalui tulisan-tulisannya. Karena tulisannya yang tajam, ia pernah diasingkan ke Belanda.\n>\n> (2) Sepulang dari pengasingan, ia mendirikan Perguruan Taman Siswa pada 3 Juli 1922. Sekolah ini memberi kesempatan pendidikan kepada rakyat biasa, yang pada masa itu sulit bersekolah di sekolah-sekolah Belanda.\n>\n> (3) Ajarannya yang terkenal berbunyi *ing ngarsa sung tuladha, ing madya mangun karsa, tut wuri handayani*, yang berarti di depan memberi teladan, di tengah membangun semangat, dan di belakang memberi dorongan. Semboyan *tut wuri handayani* kini menjadi bagian dari logo kementerian yang mengurus pendidikan.\n>\n> (4) Setelah Indonesia merdeka, ia menjadi menteri pendidikan (saat itu disebut Menteri Pengajaran) yang pertama. Untuk menghormati jasanya, tanggal lahirnya diperingati sebagai Hari Pendidikan Nasional.","> **Ulasan Novel *Layang-Layang di Atas Bukit***\n>\n> (1) Novel karya Sinta Maharani ini bercerita tentang Bayu, remaja desa yang bermimpi mengikuti festival layang-layang tingkat nasional. Dengan bahan seadanya, ia dan kakeknya merancang layang-layang raksasa berbentuk burung enggang.\n>\n> (2) Kelebihan novel ini terletak pada bahasanya yang sederhana dan deskripsi alam pedesaan yang hidup. Hubungan hangat antara Bayu dan kakeknya juga digambarkan dengan menyentuh.\n>\n> (3) Namun, alur pada bagian tengah terasa lambat karena terlalu banyak adegan persiapan yang mirip. Beberapa tokoh pendukung juga kurang berkembang.\n>\n> (4) Secara keseluruhan, novel setebal 180 halaman ini layak dibaca remaja yang menyukai kisah perjuangan dan keluarga.","> **NOTULEN RAPAT OSIS SMP CERIA**\n>\n> Hari, tanggal: Rabu, 11 November 2026\\\n> Waktu: pukul 13.00–14.30\\\n> Tempat: Ruang OSIS\\\n> Pimpinan rapat: Aldi (Ketua OSIS)\\\n> Peserta: 14 pengurus OSIS (termasuk Ketua OSIS) dan 1 guru pembina\\\n> Agenda: Persiapan Pentas Seni Akhir Semester\n>\n> Hasil rapat:\n>\n> 1. Pentas seni dilaksanakan pada Sabtu, 12 Desember 2026, di aula sekolah.\n> 2. Setiap kelas wajib menampilkan satu pertunjukan berdurasi paling lama 10 menit.\n> 3. Pendaftaran penampil ditutup pada 28 November 2026.\n> 4. Dana kegiatan berasal dari kas OSIS dan sumbangan sukarela.\n> 5. Rapat lanjutan diadakan pada Rabu, 25 November 2026.\n>\n> Notulis: Rara","> **Berita 1 — Festival Kuliner Nusantara Dongkrak Omzet UMKM**\n>\n> Festival Kuliner Nusantara di Alun-Alun Kota Sejahtera, Sabtu–Minggu (7–8/11), dikunjungi sekitar 20.000 orang. Panitia menyebutkan lebih dari 80 pedagang UMKM ikut serta dan omzet mereka naik hingga dua kali lipat. Wali kota berencana menjadikan festival ini agenda tahunan.\n\n> **Berita 2 — Usai Festival, Warga Keluhkan Macet dan Sampah**\n>\n> Festival Kuliner Nusantara akhir pekan lalu menyisakan masalah. Warga sekitar alun-alun mengeluhkan kemacetan hingga malam hari dan tumpukan sampah yang baru dibersihkan keesokan harinya. \"Acaranya bagus, tetapi pengaturan parkir dan sampah harus lebih baik,\" kata Bu Yanti, warga setempat.","> **SMP CERIA**\\\n> Jalan Kenanga No. 5, Kota Sejahtera\n>\n> Nomor: 045/SMP-C/XI/2026\\\n> Hal: Undangan Pertemuan Orang Tua\n>\n> Yth. Bapak/Ibu Orang Tua/Wali Siswa Kelas 9\n>\n> Dengan hormat,\n>\n> Sehubungan dengan persiapan Tes Kemampuan Akademik (TKA), kami mengundang Bapak/Ibu untuk hadir pada:\n>\n> hari, tanggal: Sabtu, 21 November 2026\\\n> waktu: pukul 08.00–10.00\\\n> tempat: Aula SMP Ceria\\\n> acara: penjelasan jadwal TKA dan program pendampingan belajar\n>\n> Mengingat pentingnya acara tersebut, kami mengharapkan kehadiran Bapak/Ibu tepat waktu. Atas perhatian Bapak/Ibu, kami ucapkan terima kasih.\n>\n> Kota Sejahtera, 14 November 2026\\\n> Kepala SMP Ceria,\\\n> Drs. Bambang Wijaya"],"questions":[{"n":1,"type":"PG","level":"L2","stem":"Persamaan isi teks A dan teks B adalah ....","extra":[],"options":["sama-sama membahas kelemahan panel surya","sama-sama membahas pemanfaatan energi surya","sama-sama menyebut jumlah panel yang dipasang","sama-sama berisi pendapat kepala sekolah"],"statements":null,"answer":["B"],"explain":"Teks A membahas potensi energi surya, teks B membahas pemasangan panel surya di sekolah. Keduanya tentang pemanfaatan energi surya. **(B)**","passage":0},{"n":2,"type":"PG","level":"L2","stem":"Informasi yang terdapat dalam teks A, tetapi tidak terdapat dalam teks B adalah ....","extra":[],"options":["sumber dana pemasangan panel","jumlah panel yang dipasang","kelemahan panel surya, seperti biaya awal yang mahal","penurunan tagihan listrik sekolah"],"statements":null,"answer":["C"],"explain":"Kelemahan berupa biaya awal mahal dan ketergantungan pada cuaca hanya dibahas di teks A. Pilihan A, B, dan D hanya ada di teks B. **(C)**","passage":0},{"n":3,"type":"KAT","level":"L3","stem":"Tentukan Benar atau Salah setiap pernyataan berdasarkan kedua teks.","extra":[],"options":null,"statements":["Teks A menyebutkan bahwa Indonesia menerima sinar matahari hampir sepanjang tahun.","Teks B menyebutkan bahwa panel surya memenuhi seluruh kebutuhan listrik sekolah.","Teks B memberi contoh nyata pemanfaatan energi surya yang dibahas dalam teks A.","Kedua teks sama-sama menyebutkan perlunya baterai."],"answer":["B","S","B","S"],"explain":"(1) benar. Panel hanya memenuhi sekitar 40% kebutuhan pada siang hari (2 salah). (3) benar. Baterai hanya disebut di teks A (4 salah). **(B, S, B, S)**","passage":0},{"n":4,"type":"PG","level":"L3","stem":"Simpulan yang dapat ditarik dari kedua teks adalah ....","extra":[],"options":["Energi surya bermanfaat dan dapat diterapkan di sekolah, meskipun biaya awalnya besar.","Panel surya dapat dipasang tanpa biaya.","Energi surya tidak cocok untuk Indonesia.","Semua sekolah sudah memakai panel surya."],"statements":null,"answer":["A"],"explain":"Teks A menjelaskan manfaat dan kendala biaya; teks B menunjukkan penerapan berhasil dengan bantuan dana. **(A)**","passage":0},{"n":5,"type":"PG","level":"L2","stem":"Perbedaan teks A dan teks B adalah ....","extra":[],"options":["Teks A berupa berita, teks B berupa artikel.","Teks A berisi kutipan narasumber, teks B tidak.","Teks A membahas sekolah tertentu, teks B membahas Indonesia secara umum.","Teks A berupa artikel informasi umum, teks B berupa berita tentang peristiwa tertentu."],"statements":null,"answer":["D"],"explain":"Teks A menyajikan informasi umum, teks B melaporkan peristiwa di sekolah tertentu lengkap dengan waktu dan narasumber. **(D)**","passage":0},{"n":6,"type":"PG","level":"L1","stem":"Nama asli Ki Hajar Dewantara adalah ....","extra":[],"options":["Raden Mas Soetomo","Raden Ajeng Kartini","Raden Mas Soewardi Soerjaningrat","Ki Bagus Hadikusumo"],"statements":null,"answer":["C"],"explain":"Paragraf (1) menyebut nama lahirnya Raden Mas Soewardi Soerjaningrat. **(C)**","passage":1},{"n":7,"type":"PG","level":"L2","stem":"Makna semboyan *tut wuri handayani* menurut teks adalah ....","extra":[],"options":["di belakang memberi dorongan","di depan memberi teladan","di tengah membangun semangat","belajar sepanjang hayat"],"statements":null,"answer":["A"],"explain":"Paragraf (3): *tut wuri handayani* berarti di belakang memberi dorongan. **(A)**","passage":1},{"n":8,"type":"PGK","level":"L3","stem":"Pilih **semua** peran Ki Hajar Dewantara yang disebutkan dalam teks.","extra":[],"options":["Wartawan yang mengkritik pemerintah kolonial","Pendiri Perguruan Taman Siswa","Menteri pendidikan pertama","Presiden pertama Indonesia"],"statements":null,"answer":["A","B","C"],"explain":"Teks menyebut wartawan, pendiri Taman Siswa, dan menteri pendidikan pertama. Ia bukan presiden. **(A, B, C)**","passage":1},{"n":9,"type":"PG","level":"L3","stem":"Teladan yang dapat diambil dari tokoh dalam teks adalah ....","extra":[],"options":["kegemaran bepergian ke luar negeri","keberanian dan kepedulian memperjuangkan pendidikan bagi rakyat","keinginan menjadi pejabat","kebiasaan menulis cerita fiksi"],"statements":null,"answer":["B"],"explain":"Ia berani mengkritik penjajah dan membuka pendidikan bagi rakyat biasa. **(B)**","passage":1},{"n":10,"type":"KAT","level":"L3","stem":"Tentukan Benar atau Salah setiap pernyataan berdasarkan teks.","extra":[],"options":null,"statements":["Ki Hajar Dewantara lahir di Yogyakarta.","Taman Siswa didirikan sebelum ia diasingkan ke Belanda.","Hari Pendidikan Nasional diperingati setiap 2 Mei.","Peristiwa dalam teks disusun berdasarkan urutan waktu."],"answer":["B","S","B","B"],"explain":"(1) benar. Taman Siswa didirikan sepulang dari pengasingan, jadi sesudahnya (2 salah). Hari Pendidikan Nasional diperingati pada tanggal lahirnya, 2 Mei (3 benar). Teks bergerak dari kelahiran, pengasingan, Taman Siswa, hingga setelah merdeka (4 benar). **(B, S, B, B)**","passage":1},{"n":11,"type":"PG","level":"L1","stem":"Tokoh utama dalam novel yang diulas adalah ....","extra":[],"options":["kakek Bayu","Sinta Maharani","burung enggang","Bayu"],"statements":null,"answer":["D"],"explain":"Novel bercerita tentang Bayu dan mimpinya. Sinta Maharani adalah pengarang. **(D)**","passage":2},{"n":12,"type":"PG","level":"L2","stem":"Kelemahan novel menurut pengulas adalah ....","extra":[],"options":["alur bagian tengah lambat dan tokoh pendukung kurang berkembang","bahasanya sulit dipahami","deskripsi alamnya kurang hidup","hubungan antartokoh kurang menyentuh"],"statements":null,"answer":["A"],"explain":"Paragraf (3) menyebut alur tengah lambat dan tokoh pendukung kurang berkembang. **(A)**","passage":2},{"n":13,"type":"PGK","level":"L3","stem":"Pilih **semua** kelebihan novel yang disebutkan pengulas.","extra":[],"options":["Bahasanya sederhana.","Deskripsi alam pedesaannya hidup.","Tokoh pendukungnya berkembang dengan baik.","Hubungan Bayu dan kakeknya digambarkan menyentuh."],"statements":null,"answer":["A","B","D"],"explain":"Paragraf (2) menyebut bahasa sederhana, deskripsi alam hidup, dan hubungan Bayu–kakek yang menyentuh. Tokoh pendukung justru kurang berkembang. **(A, B, D)**","passage":2},{"n":14,"type":"PG","level":"L3","stem":"Dalam struktur teks ulasan, paragraf (4) berfungsi sebagai ....","extra":[],"options":["identitas buku","sinopsis cerita","simpulan dan rekomendasi","analisis kelemahan"],"statements":null,"answer":["C"],"explain":"Paragraf (4) diawali \"Secara keseluruhan\" dan berisi penilaian akhir serta rekomendasi. **(C)**","passage":2},{"n":15,"type":"PG","level":"L2","stem":"Pembaca yang direkomendasikan untuk membaca novel tersebut adalah ....","extra":[],"options":["anak usia dini","remaja yang menyukai kisah perjuangan dan keluarga","pembaca yang menyukai kisah horor","para pembuat layang-layang profesional"],"statements":null,"answer":["B"],"explain":"Paragraf (4): layak dibaca remaja yang menyukai kisah perjuangan dan keluarga. **(B)**","passage":2},{"n":16,"type":"KAT","level":"L3","stem":"Tentukan Benar atau Salah setiap pernyataan berdasarkan notulen.","extra":[],"options":null,"statements":["Rapat berlangsung selama satu setengah jam.","Rapat dipimpin oleh guru pembina.","Setiap kelas boleh menampilkan pertunjukan lebih dari 10 menit.","Pentas seni dilaksanakan di aula sekolah."],"answer":["B","S","S","B"],"explain":"13.00–14.30 = 1 jam 30 menit (1 benar). Rapat dipimpin Aldi, Ketua OSIS (2 salah). Durasi paling lama 10 menit (3 salah). (4) sesuai hasil rapat nomor 1. **(B, S, S, B)**","passage":3},{"n":17,"type":"PG","level":"L2","stem":"Fungsi notulen tersebut adalah ....","extra":[],"options":["mengundang peserta rapat","mengumumkan pentas seni kepada siswa","meminta dana kegiatan","mencatat jalannya dan hasil rapat"],"statements":null,"answer":["D"],"explain":"Notulen adalah catatan jalannya rapat dan keputusan yang dihasilkan. **(D)**","passage":3},{"n":18,"type":"PG","level":"L3","stem":"Jumlah orang yang hadir dalam rapat tersebut adalah ....","extra":[],"options":["15 orang","14 orang","16 orang","13 orang"],"statements":null,"answer":["A"],"explain":"14 pengurus (termasuk ketua) + 1 guru pembina = 15 orang. **(A)**","passage":3},{"n":19,"type":"PGK","level":"L3","stem":"Pilih **semua** keputusan yang dihasilkan rapat.","extra":[],"options":["Setiap kelas wajib menampilkan satu pertunjukan.","Pentas seni diadakan di lapangan sekolah.","Dana kegiatan berasal dari kas OSIS dan sumbangan sukarela.","Rapat lanjutan diadakan pada 25 November 2026."],"statements":null,"answer":["A","C","D"],"explain":"Keputusan nomor 2, 4, dan 5 sesuai pilihan A, C, dan D. Pentas diadakan di aula, bukan lapangan. **(A, C, D)**","passage":3},{"n":20,"type":"PG","level":"L2","stem":"Selang waktu antara penutupan pendaftaran penampil dan pelaksanaan pentas seni adalah ....","extra":[],"options":["7 hari","12 hari","14 hari","21 hari"],"statements":null,"answer":["C"],"explain":"Dari 28 November ke 12 Desember: 2 hari tersisa di November + 12 hari di Desember = 14 hari. **(C)**","passage":3},{"n":21,"type":"KAT","level":"L3","stem":"Tentukan Benar atau Salah setiap pernyataan berdasarkan kedua berita.","extra":[],"options":null,"statements":["Kedua berita membahas peristiwa yang sama.","Berita 1 menonjolkan dampak positif festival.","Berita 2 menolak penyelenggaraan festival.","Berita 2 menyoroti masalah kemacetan dan sampah."],"answer":["B","B","S","B"],"explain":"Keduanya tentang festival yang sama (1 benar). Berita 1 menonjolkan pengunjung banyak dan omzet naik (2 benar). Bu Yanti menyebut \"acaranya bagus\", jadi tidak menolak (3 salah). (4) benar. **(B, B, S, B)**","passage":4},{"n":22,"type":"PG","level":"L2","stem":"Perbedaan sudut pandang kedua berita adalah ....","extra":[],"options":["Berita 1 menyoroti sampah, berita 2 menyoroti omzet pedagang.","Berita 1 menyoroti keberhasilan dan manfaat ekonomi, berita 2 menyoroti dampak bagi warga sekitar.","Keduanya hanya membahas kemacetan.","Berita 1 berisi keluhan warga, berita 2 berisi rencana wali kota."],"statements":null,"answer":["B"],"explain":"Berita 1 dari sisi keberhasilan dan ekonomi, berita 2 dari sisi warga yang terdampak. **(B)**","passage":4},{"n":23,"type":"PG","level":"L2","stem":"Informasi yang hanya terdapat dalam berita 1 adalah ....","extra":[],"options":["keluhan kemacetan","tumpukan sampah","pendapat Bu Yanti","jumlah pengunjung festival"],"statements":null,"answer":["D"],"explain":"Jumlah pengunjung (20.000 orang) hanya disebut di berita 1. Pilihan lain hanya ada di berita 2. **(D)**","passage":4},{"n":24,"type":"PGK","level":"L3","stem":"Berdasarkan kedua berita, pilih **semua** hal yang sebaiknya diperhatikan panitia pada festival berikutnya.","extra":[],"options":["Memperbaiki pengaturan parkir","Mengelola sampah dengan lebih baik","Menghentikan festival","Tetap melibatkan pedagang UMKM"],"statements":null,"answer":["A","B","D"],"explain":"Masukan dari berita 2 (parkir, sampah) dan manfaat dari berita 1 (UMKM) perlu dipertahankan. Kedua berita tidak menyarankan festival dihentikan. **(A, B, D)**","passage":4},{"n":25,"type":"PG","level":"L3","stem":"Sikap Bu Yanti terhadap festival tersebut adalah ....","extra":[],"options":["mendukung festival, tetapi meminta perbaikan pengaturan parkir dan sampah","menolak festival diadakan lagi","tidak peduli terhadap festival","hanya memuji panitia"],"statements":null,"answer":["A"],"explain":"Bu Yanti menilai acaranya bagus, tetapi meminta perbaikan pengaturan parkir dan sampah. **(A)**","passage":4},{"n":26,"type":"KAT","level":"L3","stem":"Tentukan Benar atau Salah setiap pernyataan berdasarkan surat.","extra":[],"options":null,"statements":["Surat ditujukan kepada orang tua atau wali siswa kelas 9.","Acara berlangsung selama dua jam.","Surat ditulis pada hari yang sama dengan pelaksanaan acara.","Surat ini termasuk surat dinas karena dikeluarkan oleh lembaga dan memiliki nomor surat."],"answer":["B","B","S","B"],"explain":"(1) benar. 08.00–10.00 = 2 jam (2 benar). Surat ditulis 14 November, acara 21 November (3 salah). (4) benar. **(B, B, S, B)**","passage":5},{"n":27,"type":"PG","level":"L2","stem":"Tujuan surat tersebut adalah ....","extra":[],"options":["mengumumkan hasil TKA","meminta sumbangan dana sekolah","mengundang orang tua menghadiri pertemuan tentang persiapan TKA","memberitahukan libur sekolah"],"statements":null,"answer":["C"],"explain":"Paragraf pembuka isi: \"kami mengundang Bapak/Ibu\" terkait persiapan TKA. **(C)**","passage":5},{"n":28,"type":"PG","level":"L3","stem":"Salam pembuka dalam surat tersebut adalah ....","extra":[],"options":["Yth. Bapak/Ibu Orang Tua/Wali Siswa Kelas 9","Dengan hormat,","Atas perhatian Bapak/Ibu, kami ucapkan terima kasih.","Kepala SMP Ceria,"],"statements":null,"answer":["B"],"explain":"Salam pembuka surat dinas adalah \"Dengan hormat\". Pilihan A adalah alamat tujuan, C adalah salam penutup. **(B)**","passage":5},{"n":29,"type":"PGK","level":"L3","stem":"Pilih **semua** bagian surat dinas yang terdapat dalam surat tersebut.","extra":[],"options":["Lampiran","Kop surat","Nomor surat","Salam pembuka"],"statements":null,"answer":["B","C","D"],"explain":"Surat memuat kop (nama dan alamat sekolah), nomor surat, dan salam pembuka. Baris lampiran tidak ada. **(B, C, D)**","passage":5},{"n":30,"type":"PG","level":"L2","stem":"Jarak antara tanggal penulisan surat dan tanggal pelaksanaan acara adalah ....","extra":[],"options":["5 hari","6 hari","14 hari","7 hari"],"statements":null,"answer":["D"],"explain":"14 November ke 21 November = 7 hari. **(D)**","passage":5}]},{"id":"BI09","title":"BI 09 · Sastra: Cerpen (1)","intro":"**Fokus:** memahami dan menafsirkan cerpen. **Materi:** sudut pandang, penokohan dan teknik penggambarannya, latar, alur, konflik, majas, amanat, serta unsur intrinsik dan ekstrinsik.","passages":["> **Sepatu Kanvas**\n>\n> (1) Sudah tiga bulan aku menyisihkan uang jajan di kaleng biskuit bekas. Setiap pulang sekolah, kuhitung lembaran dan kepingnya di bawah lampu dapur yang redup. Targetku satu: sepatu kanvas putih yang dipajang di toko Pak Darmo, persis seperti milik teman-teman di tim futsal.\n>\n> (2) Sore itu Laras, adikku, pulang dengan mata sembap. Sol sepatunya menganga seperti mulut ikan. \"Besok lomba lari tingkat kecamatan, Kak,\" katanya pelan, lalu buru-buru masuk kamar sebelum aku sempat bertanya lebih jauh.\n>\n> (3) Malamnya aku tidak bisa tidur. Kaleng biskuit itu seolah menatapku dari atas lemari. Ibu sedang menunggu gaji bulan depan, dan Ayah masih bekerja di kapal yang baru pulang dua minggu lagi. Kalau uang itu kupakai, sepatu impianku harus menunggu lagi. Kalau tidak, Laras akan berlari dengan sepatu yang menganga.\n>\n> (4) Pagi-pagi sekali aku mengayuh sepeda ke pasar. Ketika Laras membuka kotak sepatu di meja makan, ia berteriak kecil, lalu memelukku sampai aku hampir jatuh dari kursi. Sepatu kanvasku harus menunggu, mungkin tiga bulan lagi, mungkin lebih.\n>\n> (5) Sorenya Laras pulang membawa piala kecil juara dua. Ia meletakkannya di atas lemari, tepat di samping kaleng biskuit yang kini kosong. Anehnya, aku merasa ka
