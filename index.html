leng itu tidak pernah sepenuh hari itu.","> **Galangan di Ujung Kampung**\n>\n> (1) Di ujung Kampung Watulimo, suara palu Pak Rusdi masih terdengar setiap pagi, beradu dengan debur ombak yang tak pernah lelah. Sudah empat puluh tahun lelaki itu membuat perahu kayu, dan tangannya kini lebih mirip akar pohon: keras, cokelat, penuh guratan.\n>\n> (2) \"Kek, orang dari perusahaan datang lagi,\" kata Damar sambil menyerahkan amplop putih. Di dalamnya ada tawaran harga untuk tanah galangan perahu itu, cukup untuk membeli tiga rumah di kota.\n>\n> (3) Pak Rusdi hanya melirik amplop itu, lalu kembali mengamplas lambung perahu. \"Kalau galangan ini dijual, siapa yang membuat perahu untuk nelayan sini? Mereka tidak bisa melaut dengan brosur hotel.\"\n>\n> (4) Damar terdiam. Ia tahu teman-temannya sudah pindah ke kota dan bekerja di pabrik. Ia juga tahu, di kampung ini, tinggal kakeknya satu-satunya pembuat perahu.\n>\n> (5) Malam itu Damar membuka buku catatannya dan mulai menggambar rangka perahu, garis demi garis, seperti yang tadi siang diajarkan kakeknya. Di luar, lampu-lampu proyek di bukit seberang menyala terang, terlalu terang untuk kampung yang biasanya hanya diterangi bulan.","> **Amplop Cokelat**\n>\n> (1) Amplop cokelat itu kutemukan terselip di antara buku-buku lama saat aku membereskan rak sebelum pindah tugas. Tulisan tangannya miring dan rapi: *Untuk Wulan, dibuka kalau kamu sudah jadi guru.*\n>\n> (2) Aku tersenyum. Ingatanku melayang ke ruang kelas VII yang atapnya bocor setiap musim hujan. Waktu itu aku murid yang paling sering dihukum karena tidak mengerjakan PR. Bukan karena malas; sepulang sekolah aku harus menjaga warung ibu sampai malam.\n>\n> (3) Hanya Bu Sekar yang bertanya mengapa. Setelah tahu, ia tidak memberiku keringanan nilai, tetapi memberiku waktu: setiap istirahat kedua aku boleh mengerjakan PR di perpustakaan sementara ia memeriksa tugas di meja sebelah. \"Rajin itu bukan soal tidak pernah terlambat, Wulan. Rajin itu soal tidak berhenti,\" katanya suatu hari.\n>\n> (4) Kubuka amplop itu perlahan. Isinya hanya satu kalimat: *Sekarang giliranmu bertanya \"mengapa\" kepada muridmu.*\n>\n> (5) Besok pagi aku akan berangkat ke sekolah baruku di pedalaman. Di dalam tas, di samping rencana pelajaran, kusimpan surat itu baik-baik.","> **Rapat Pukul Tujuh**\n>\n> (1) Undangan rapat warga Gang Kenanga tertulis jelas: pukul 19.00 tepat, membahas jadwal ronda. Pukul 19.00, balai warga baru berisi tiga orang: Pak Sastro sang ketua RT, Bu Ratmi yang menyiapkan teh, dan Dimas, anak SMP yang ditugasi mencatat notulen.\n>\n> (2) Pukul 19.40 warga mulai berdatangan sambil tertawa-tawa. \"Wah, tepat waktu sekali kita,\" kata Pak Gondo sambil menepuk perutnya yang bulat. Bu Ratmi tersenyum kecut, lalu menuang teh yang sudah dingin untuk ketiga kalinya.\n>\n> (3) Rapat akhirnya dimulai pukul 20.15. Setiap kali jadwal ronda dibacakan, selalu ada yang berhalangan. Pak Gondo ada arisan pada hari Selasa, Pak Yoyok lembur pada hari Kamis, dan hampir semua orang punya acara pada malam Minggu.\n>\n> (4) Dimas menatap catatannya yang penuh coretan. Lalu ia mengangkat tangan. \"Pak, bagaimana kalau jadwal rondanya disamakan saja dengan jam rapat? Mulainya dimundurkan empat puluh menit, pasti semua bisa.\"\n>\n> (5) Balai mendadak sunyi. Beberapa bapak menunduk menatap gelas teh masing-masing. Pak Sastro berdeham, lalu untuk pertama kalinya malam itu tersenyum lebar. Jadwal ronda selesai disusun dalam sepuluh menit.","> **Benang Nenek**\n>\n> (1) Bunyi kayu beradu dari kolong rumah panggung sudah menjadi lagu pagi bagi Ina. Di sana Nenek duduk berselonjor di depan alat tenun, menarik dan merapatkan benang satu demi satu.\n>\n> (2) \"Satu kain begini butuh berapa lama, Nek?\" tanya Ina. \"Tiga bulan, kalau tidak ada upacara adat dan panen,\" jawab Nenek tanpa mengangkat kepala. \"Setiap motif punya cerita. Yang ini burung, artinya kita boleh pergi jauh, tetapi selalu pulang.\"\n>\n> (3) Minggu lalu Kak Rani, sepupu Ina yang tinggal di kota, datang membawa kabar. Ia ingin mencetak motif tenun Nenek di atas kain pabrik agar bisa dijual murah dan banyak. \"Biar motif kampung kita terkenal, Nek.\"\n>\n> (4) Nenek meletakkan alat tenunnya. Lama ia memandangi Kak Rani. \"Motif boleh terkenal, Rani. Tetapi kalau orang hanya kenal gambarnya, mereka tidak akan pernah tahu ceritanya.\"\n>\n> (5) Sore itu Ina duduk di samping Nenek dan meminta diajari menenun. Jarinya kaku dan benangnya kusut berkali-kali. Nenek tertawa kecil. \"Benang kusut itu biasa. Yang penting, kamu tahu ceritanya.\"","> **Loket Terakhir**\n>\n> (1) Setiap pagi, selama tiga puluh dua tahun, Pak Wiryo membuka loket karcis Stasiun Kedunglegi pukul lima tepat. Ia hafal wajah para pelanggannya: mahasiswa yang selalu membayar dengan uang receh, ibu penjual sayur yang naik kereta pertama, juga anak SMP berkacamata yang selalu bertanya jadwal meski sudah tahu jawabannya.\n>\n> (2) Hari ini adalah hari terakhirnya bekerja. Di samping loket, dua mesin tiket otomatis baru saja dipasang, layarnya berkedip-kedip ramah kepada siapa saja.\n>\n> (3) Para penumpang lewat seperti biasa. Sebagian besar langsung menempelkan kartu di mesin tanpa menoleh. Pak Wiryo tidak tersinggung. Dalam hati ia bahkan kagum: mesin itu tidak pernah salah memberi kembalian.\n>\n> (4) Menjelang siang, anak SMP berkacamata itu muncul. Ia tidak menuju mesin, tetapi mengetuk kaca loket. \"Pak, kereta ke kota jam berapa?\" Pak Wiryo tertawa, lalu menjawab seperti biasa. Anak itu menyerahkan selembar gambar: loket kecil dengan seorang lelaki tua berpeci di baliknya, bertuliskan *Terima kasih sudah menjawab setiap hari.*\n>\n> (5) Sore itu, ketika loket ditutup untuk terakhir kalinya, gambar itu sudah tidak ada di meja. Petugas baru hanya menemukan sebuah peci hitam tergantung rapi di paku dinding."],"questions":[{"n":1,"type":"PG","level":"L1","stem":"Sudut pandang yang digunakan dalam cerpen tersebut adalah ….","extra":[],"options":["orang pertama pelaku utama","orang pertama pelaku sampingan","orang ketiga serba tahu","orang ketiga terbatas"],"statements":null,"answer":["A"],"explain":"Pencerita memakai kata ganti \"aku\" dan dialah yang mengalami peristiwa utama (menabung lalu membelikan sepatu), jadi sudut pandangnya orang pertama pelaku utama. **(A)**","passage":0},{"n":2,"type":"PG","level":"L3","stem":"Makna kalimat \"aku merasa kaleng itu tidak pernah sepenuh hari itu\" pada paragraf (5) adalah ….","extra":[],"options":["tokoh aku sudah mengisi kembali kalengnya dengan uang","tokoh aku merasakan kepuasan batin karena pengorbanannya membuahkan kebahagiaan adiknya","tokoh aku menyesal karena tabungannya habis","piala Laras lebih mahal daripada sepatu kanvas"],"statements":null,"answer":["B"],"explain":"Secara harfiah kaleng itu kosong. Kata \"penuh\" di sini kiasan: hati tokoh aku terasa penuh karena pengorbanannya membuat adiknya bahagia dan berprestasi. **(B)**","passage":0},{"n":3,"type":"KAT","level":"L2","stem":"Tentukan benar atau salah setiap pernyataan berikut berdasarkan cerpen.","extra":[],"options":null,"statements":["Konflik utama cerpen adalah konflik batin tokoh aku antara keinginan pribadi dan kebutuhan adiknya.","Latar waktu tokoh aku membeli sepatu untuk Laras adalah malam hari.","Kalimat \"Sol sepatunya menganga seperti mulut ikan\" mengandung majas perumpamaan.","Pengarang menggambarkan Laras secara langsung sebagai anak yang manja."],"answer":["B","S","B","S"],"explain":"(1) Benar, tokoh aku bimbang antara sepatu impiannya dan kebutuhan Laras. (2) Salah, ia membeli sepatu \"pagi-pagi sekali\". (3) Benar, ada kata pembanding \"seperti\". (4) Salah, Laras tidak digambarkan manja; ia justru menahan sedih dan tidak meminta. **(B, S, B, S)**","passage":0},{"n":4,"type":"PG","level":"L3","stem":"Puncak konflik batin tokoh aku paling jelas tergambar pada paragraf ….","extra":[],"options":["(1)","(2)","(3)","(5)"],"statements":null,"answer":["C"],"explain":"Paragraf (3) memuat pertentangan paling tajam dalam batin tokoh: \"Kalau uang itu kupakai … Kalau tidak …\". Paragraf (4) sudah berisi penyelesaian (keputusan membeli sepatu). **(C)**","passage":0},{"n":5,"type":"PGK","level":"L3","stem":"Pilih **semua** amanat yang sesuai dengan isi cerpen.","extra":[],"options":["Kepedulian kepada keluarga dapat didahulukan di atas keinginan pribadi.","Menabung hanya berguna jika hasilnya dinikmati sendiri.","Kebahagiaan dapat diperoleh dengan memberi.","Seorang kakak harus selalu menuruti semua kemauan adiknya.","Kesediaan menunda keinginan adalah tanda kedewasaan."],"statements":null,"answer":["A","C","E"],"explain":"A, C, dan E sesuai dengan tindakan dan perasaan tokoh. B bertentangan dengan isi cerita. D berlebihan: tokoh aku menolong karena kebutuhan yang mendesak, bukan menuruti semua kemauan. **(A, C, E)**","passage":0},{"n":6,"type":"PG","level":"L2","stem":"Watak Pak Rusdi yang teguh pendirian paling jelas digambarkan melalui ….","extra":[],"options":["uraian langsung pengarang tentang sifatnya","ucapan dan tindakannya ketika menanggapi tawaran perusahaan","pendapat Damar tentang kakeknya","gambaran keadaan rumahnya"],"statements":null,"answer":["B"],"explain":"Keteguhan Pak Rusdi tampak dari sikapnya yang hanya melirik amplop, terus bekerja, dan ucapannya tentang nelayan. Ini penggambaran tidak langsung (dramatik) lewat ucapan dan tindakan. **(B)**","passage":1},{"n":7,"type":"PG","level":"L3","stem":"Kalimat \"lampu-lampu proyek di bukit seberang menyala terang, terlalu terang untuk kampung yang biasanya hanya diterangi bulan\" berfungsi untuk ….","extra":[],"options":["menunjukkan bahwa kampung sudah memiliki listrik yang memadai","menggambarkan Damar yang sulit tidur","memuji keindahan proyek di bukit seberang","mengisyaratkan bahwa perubahan yang mengancam kehidupan kampung sudah dekat"],"statements":null,"answer":["D"],"explain":"Lampu proyek yang \"terlalu terang\" dikontraskan dengan kampung yang biasanya diterangi bulan. Kontras ini mengisyaratkan pembangunan yang mulai mendesak kehidupan kampung. **(D)**","passage":1},{"n":8,"type":"PGK","level":"L3","stem":"Pilih **semua** pernyataan yang tepat tentang unsur intrinsik cerpen tersebut.","extra":[],"options":["Latar tempatnya adalah galangan perahu di kampung pesisir.","Cerpen menggunakan sudut pandang orang ketiga.","Konfliknya adalah pilihan antara mempertahankan galangan dan menerima tawaran perusahaan.","Cerpen menggunakan alur mundur.","Frasa \"ombak yang tak pernah lelah\" mengandung majas personifikasi."],"statements":null,"answer":["A","B","C","E"],"explain":"A, B, C, dan E tepat. Cerita bergerak maju (pagi, siang, malam), sehingga D salah. \"Ombak yang tak pernah lelah\" memberi sifat manusia (lelah) kepada benda mati, jadi termasuk personifikasi. **(A, B, C, E)**","passage":1},{"n":9,"type":"PG","level":"L3","stem":"Tindakan Damar pada paragraf (5) paling tepat ditafsirkan sebagai ….","extra":[],"options":["tanda bahwa Damar mulai bersiap meneruskan keahlian kakeknya","keinginan Damar menjadi perancang hotel","bukti bahwa Damar menyerah dan ingin pindah ke kota","cara Damar mengisi waktu karena bosan"],"statements":null,"answer":["A"],"explain":"Damar menggambar rangka perahu \"seperti yang tadi siang diajarkan kakeknya\" setelah menyadari kakeknya pembuat perahu terakhir. Ini isyarat bahwa ia mulai mewarisi keahlian itu. **(A)**","passage":1},{"n":10,"type":"KAT","level":"L2","stem":"Tentukan benar atau salah setiap pernyataan berikut berdasarkan cerpen.","extra":[],"options":null,"statements":["Ungkapan \"tangannya kini lebih mirip akar pohon\" menggambarkan tangan seorang pekerja keras.","Teks menyatakan bahwa Damar mendesak kakeknya menjual tanah galangan.","Ucapan \"Mereka tidak bisa melaut dengan brosur hotel\" mengandung sindiran.","Tawaran perusahaan bernilai cukup untuk membeli tiga rumah di kota."],"answer":["B","S","B","B"],"explain":"(1) Benar, perbandingan dengan akar pohon menegaskan tangan yang keras karena kerja. (2) Salah, Damar hanya terdiam; teks tidak menyebut ia mendesak. (3) Benar, ucapan itu menyindir rencana hotel yang tidak berguna bagi nelayan. (4) Benar, tertulis di paragraf (2). **(B, S, B, B)**","passage":1},{"n":11,"type":"PG","level":"L2","stem":"Alur cerpen \"Amplop Cokelat\" adalah ….","extra":[],"options":["maju, karena peristiwa diceritakan berurutan dari masa kecil sampai dewasa","mundur seluruhnya, karena semua peristiwa terjadi di masa lalu","campuran, karena cerita masa kini disela kenangan masa lalu tokoh","tunggal tanpa kilas balik"],"statements":null,"answer":["C"],"explain":"Cerita dimulai pada masa kini (menemukan amplop), lalu kilas balik ke masa SMP di paragraf (2)–(3), kemudian kembali ke masa kini. Itu alur campuran. **(C)**","passage":2},{"n":12,"type":"PG","level":"L3","stem":"Pesan Bu Sekar dalam surat itu paling tepat dimaknai bahwa Wulan diharapkan ….","extra":[],"options":["menghukum murid yang tidak mengerjakan PR","peduli mencari tahu latar belakang masalah muridnya sebelum menilai","sering mengajukan pertanyaan ketika mengajar","menulis surat untuk setiap muridnya"],"statements":null,"answer":["B"],"explain":"Bu Sekar dulu \"bertanya mengapa\" sehingga tahu Wulan harus menjaga warung. Pesannya meminta Wulan melakukan hal yang sama: mencari tahu penyebab masalah murid sebelum menilainya. **(B)**","passage":2},{"n":13,"type":"PGK","level":"L2","stem":"Pilih **semua** watak Bu Sekar yang tergambar dalam cerpen.","extra":[],"options":["peduli","tegas tetapi adil","pemarah","bijaksana","pilih kasih"],"statements":null,"answer":["A","B","D"],"explain":"Peduli (bertanya dan memberi waktu), tegas tetapi adil (tidak memberi keringanan nilai, tetapi memberi kesempatan), bijaksana (nasihat tentang rajin). Tidak ada bukti ia pemarah atau pilih kasih. **(A, B, D)**","passage":2},{"n":14,"type":"PG","level":"L3","stem":"Ucapan \"Rajin itu bukan soal tidak pernah terlambat. Rajin itu soal tidak berhenti\" paling sesuai dengan sikap ….","extra":[],"options":["tetap berusaha walaupun menghadapi kesulitan","selalu datang paling pagi ke sekolah","menyerah jika tugas terasa berat","mengerjakan tugas tepat waktu tanpa pengecualian"],"statements":null,"answer":["A"],"explain":"\"Tidak berhenti\" berarti terus berusaha meskipun ada hambatan, seperti Wulan yang tetap mengerjakan PR walau harus menjaga warung. **(A)**","passage":2},{"n":15,"type":"PG","level":"L2","stem":"Suasana yang paling terasa pada paragraf (5) adalah ….","extra":[],"options":["haru dan penuh tekad","tegang dan mencekam","sedih dan putus asa","riang dan jenaka"],"statements":null,"answer":["A"],"explain":"Wulan menyimpan surat \"baik-baik\" sebelum berangkat bertugas ke pedalaman. Suasananya haru (kenangan pada gurunya) sekaligus penuh tekad. **(A)**","passage":2},{"n":16,"type":"KAT","level":"L2","stem":"Tentukan benar atau salah setiap pernyataan berikut berdasarkan cerpen.","extra":[],"options":null,"statements":["Ucapan Pak Gondo \"Wah, tepat waktu sekali kita\" mengandung majas ironi.","Rapat dimulai tepat pukul 19.00 sesuai undangan.","Dimas adalah ketua RT Gang Kenanga.","Cerpen ini mengkritik kebiasaan menyepelekan waktu dengan cara yang jenaka."],"answer":["B","S","S","B"],"explain":"(1) Benar, warga terlambat 40 menit tetapi menyebut diri \"tepat waktu\"; itu ironi. (2) Salah, rapat baru dimulai pukul 20.15. (3) Salah, ketua RT adalah Pak Sastro; Dimas pencatat notulen. (4) Benar, kritik disampaikan lewat kejadian lucu. **(B, S, S, B)**","passage":3},{"n":17,"type":"PG","level":"L3","stem":"Balai mendadak sunyi setelah Dimas menyampaikan usulnya karena ….","extra":[],"options":["warga tidak mendengar usul Dimas dengan jelas","warga marah karena Dimas masih anak-anak","warga tersindir oleh usul yang menyinggung kebiasaan mereka datang terlambat","warga sedang sibuk menikmati teh"],"statements":null,"answer":["C"],"explain":"Usul Dimas memundurkan jam ronda \"empat puluh menit\" menyindir keterlambatan warga. Warga menunduk karena tersindir. **(C)**","passage":3},{"n":18,"type":"PG","level":"L2","stem":"Berdasarkan cerpen, rapat dimulai terlambat … dari waktu yang tertulis di undangan.","extra":[],"options":["40 menit","60 menit","75 menit","85 menit"],"statements":null,"answer":["C"],"explain":"Undangan pukul 19.00, rapat dimulai 20.15. Selisihnya 1 jam 15 menit = 75 menit. **(C)**","passage":3},{"n":19,"type":"PGK","level":"L3","stem":"Pilih **semua** pernyataan yang tepat tentang penokohan dalam cerpen.","extra":[],"options":["Dimas digambarkan kritis dan berani menyampaikan pendapat.","Kesabaran Bu Ratmi tampak dari tindakannya menuang teh berulang kali.","Pak Gondo digambarkan sebagai warga yang disiplin waktu.","Senyum lebar Pak Sastro menunjukkan ia senang dengan usul Dimas.","Semua warga digambarkan antusias membagi jadwal ronda sejak awal."],"statements":null,"answer":["A","B","D"],"explain":"A, B, dan D sesuai teks. C salah karena Pak Gondo datang terlambat. E salah karena hampir semua warga berhalangan ketika jadwal dibacakan. **(A, B, D)**","passage":3},{"n":20,"type":"PG","level":"L2","stem":"Tema cerpen \"Rapat Pukul Tujuh\" adalah ….","extra":[],"options":["persahabatan para remaja","kedisiplinan waktu dalam kehidupan bermasyarakat","keamanan kampung dari pencurian","perjuangan seorang ketua RT"],"statements":null,"answer":["B"],"explain":"Seluruh peristiwa berpusat pada keterlambatan warga dan sindiran terhadapnya, jadi temanya kedisiplinan waktu dalam bermasyarakat. **(B)**","passage":3},{"n":21,"type":"KAT","level":"L2","stem":"Tentukan benar atau salah setiap pernyataan berikut berdasarkan cerpen.","extra":[],"options":null,"statements":["Kak Rani menolak gagasan mencetak motif tenun di atas kain pabrik.","Ungkapan \"lagu pagi\" untuk bunyi kayu beradu merupakan ungkapan kiasan.","Menurut Nenek, satu kain tenun dapat selesai dalam tiga minggu.","Cerpen mengandung nilai budaya berupa tradisi menenun yang diwariskan antargenerasi."],"answer":["S","B","S","B"],"explain":"(1) Salah, Kak Rani justru yang mengusulkan gagasan itu. (2) Benar, bunyi kayu tidak sungguh-sungguh lagu. (3) Salah, Nenek menyebut tiga bulan. (4) Benar, Nenek mengajari Ina menenun dan menceritakan makna motif. **(S, B, S, B)**","passage":4},{"n":22,"type":"PG","level":"L3","stem":"Ucapan Nenek pada paragraf (4) menunjukkan pandangannya bahwa ….","extra":[],"options":["kain tenun sebaiknya tidak pernah dijual kepada orang luar","Kak Rani tidak memahami cara menenun","kain pabrik lebih bermutu daripada kain tenun","nilai tenun tidak hanya terletak pada gambarnya, tetapi juga pada makna di baliknya"],"statements":null,"answer":["D"],"explain":"Nenek tidak menolak motif menjadi terkenal (\"Motif boleh terkenal\"), tetapi khawatir orang hanya mengenal gambar tanpa cerita dan maknanya. **(D)**","passage":4},{"n":23,"type":"PG","level":"L2","stem":"Konflik antara Nenek dan Kak Rani termasuk konflik ….","extra":[],"options":["manusia dengan alam","manusia dengan dirinya sendiri","manusia dengan Tuhan","manusia dengan manusia"],"statements":null,"answer":["D"],"explain":"Pertentangan terjadi antara dua tokoh yang berbeda pandangan (tradisi dan makna dibandingkan produksi massal), jadi konflik manusia dengan manusia. **(D)**","passage":4},{"n":24,"type":"PGK","level":"L3","stem":"Pilih **semua** unsur ekstrinsik yang dapat ditemukan dalam cerpen tersebut.","extra":[],"options":["nilai budaya berupa tradisi menenun","nilai sosial berupa kedekatan antargenerasi dalam keluarga","sudut pandang orang ketiga","latar tempat di kolong rumah panggung","nilai ekonomi yang berkaitan dengan rencana menjual kain murah"],"statements":null,"answer":["A","B","E"],"explain":"Unsur ekstrinsik berupa nilai-nilai di luar struktur cerita: budaya, sosial, dan ekonomi. Sudut pandang dan latar adalah unsur intrinsik. **(A, B, E)**","passage":4},{"n":25,"type":"PG","level":"L3","stem":"Kalimat \"Benang kusut itu biasa. Yang penting, kamu tahu ceritanya\" paling tepat dimaknai ….","extra":[],"options":["kesalahan saat belajar itu wajar; yang terpenting adalah memahami makna warisan budaya","Ina tidak berbakat menenun","benang yang kusut tidak perlu dirapikan","Nenek tidak peduli pada hasil tenunan Ina"],"statements":null,"answer":["A"],"explain":"\"Benang kusut\" melambangkan kesalahan wajar ketika belajar, sedangkan \"tahu ceritanya\" berarti memahami makna di balik tradisi. **(A)**","passage":4},{"n":26,"type":"KAT","level":"L3","stem":"Tentukan benar atau salah setiap pernyataan berikut berdasarkan cerpen.","extra":[],"options":null,"statements":["Pengarang menggunakan sudut pandang orang ketiga yang mengetahui isi hati tokoh.","Mesin tiket otomatis dapat dimaknai sebagai simbol perubahan zaman.","Pak Wiryo marah karena para penumpang lebih memilih mesin.","Anak SMP itu bertanya jadwal karena benar-benar tidak tahu jam keberangkatan kereta."],"answer":["B","B","S","S"],"explain":"(1) Benar, pencerita tahu isi hati Pak Wiryo (\"Dalam hati ia bahkan kagum\"). (2) Benar, mesin menggantikan pekerjaan loket. (3) Salah, teks menyebut ia tidak tersinggung. (4) Salah, anak itu bertanya \"meski sudah tahu jawabannya\". **(B, B, S, S)**","passage":5},{"n":27,"type":"PG","level":"L3","stem":"Akhir cerpen \"Loket Terakhir\" termasuk ….","extra":[],"options":["akhir tertutup, karena dijelaskan bahwa Pak Wiryo pindah ke kota","akhir yang menegangkan, karena peci Pak Wiryo hilang","akhir tragis, karena Pak Wiryo meninggal dunia","akhir terbuka, karena pembaca dibiarkan menafsirkan makna gambar yang dibawa pergi dan peci yang ditinggalkan"],"statements":null,"answer":["D"],"explain":"Cerita tidak menjelaskan ke mana Pak Wiryo pergi atau mengapa pecinya ditinggalkan. Pembaca diberi ruang menafsirkan, jadi akhir terbuka. **(D)**","passage":5},{"n":28,"type":"PG","level":"L2","stem":"Anak SMP itu tetap mengetuk loket pada paragraf (4) karena ….","extra":[],"options":["ia tidak bisa menggunakan mesin tiket","ia ingin menyapa dan berterima kasih kepada Pak Wiryo dengan caranya sendiri","ia tersesat di stasiun","ia ingin membeli karcis yang lebih murah"],"statements":null,"answer":["B"],"explain":"Anak itu sebenarnya sudah tahu jadwal. Pertanyaan rutin dan gambar yang ia berikan adalah caranya menyapa dan berterima kasih. **(B)**","passage":5},{"n":29,"type":"PGK","level":"L3","stem":"Pilih **semua** watak Pak Wiryo yang tergambar dalam cerpen.","extra":[],"options":["tekun dan setia pada pekerjaannya","lapang dada menerima perubahan","pendendam","ramah dan memperhatikan pelanggan","malas"],"statements":null,"answer":["A","B","D"],"explain":"Tekun dan setia (32 tahun membuka loket pukul lima tepat), lapang dada (tidak tersinggung, malah kagum pada mesin), ramah dan memperhatikan pelanggan (hafal wajah mereka). **(A, B, D)**","passage":5},{"n":30,"type":"PG","level":"L3","stem":"Amanat yang paling sesuai dengan cerpen \"Loket Terakhir\" adalah ….","extra":[],"options":["teknologi baru harus ditolak demi menjaga tradisi","pekerja yang sudah tua sebaiknya segera pensiun","kemajuan teknologi tidak sepenuhnya dapat menggantikan kehangatan hubungan antarmanusia","penumpang sebaiknya selalu membeli karcis di loket"],"statements":null,"answer":["C"],"explain":"Mesin bekerja tanpa salah, tetapi yang dikenang anak itu adalah kehadiran Pak Wiryo. Amanatnya: teknologi tidak sepenuhnya menggantikan hubungan antarmanusia. **(C)**","passage":5}]},{"id":"BI10","title":"BI 10 · Sastra: Cerpen (2) dan Penggalan Novel","intro":"**Fokus:** menafsirkan cerpen dan penggalan novel serta membandingkan dua teks sastra. **Materi:** penokohan, latar, konflik, majas, simbol, nilai (moral, sosial, budaya, religius), tahapan alur, dan unsur ekstrinsik.","passages":["> **Enam Puluh Dua Anak Tangga** (penggalan novel *Langit di Atas Pelabuhan*)\n>\n> (1) Arum menghitung tangga besi menuju lantai empat rumah susun itu: enam puluh dua anak tangga. Di desa, rumahnya hanya punya tiga anak tangga kayu, dan di bawahnya ayam-ayam tidur berdesakan.\n>\n> (2) Dari jendela kamar yang sempit, ia bisa melihat derek-derek pelabuhan yang berdiri seperti jerapah raksasa, menunduk mengangkat peti kemas siang dan malam. Di salah satu derek itu, Ayah kini bekerja.\n>\n> (3) \"Di sekolah baru jangan diam saja,\" pesan Ibu sambil merapikan seragam Arum yang masih berbau toko. Arum mengangguk, padahal dalam hati ia sudah memutuskan untuk duduk di bangku paling belakang dan tidak bicara kepada siapa pun.\n>\n> (4) Hari pertama berjalan persis seperti rencananya. Tidak ada yang mengajaknya bicara, dan ia tidak mengajak siapa pun bicara. Namun, ketika bel pulang berbunyi, seorang anak perempuan berambut ikal menghampirinya. \"Kamu yang tinggal di Blok C, kan? Ayahku juga kerja di derek nomor tujuh.\"\n>\n> (5) Arum tidak tahu harus menjawab apa. Ia hanya tahu, untuk pertama kalinya sejak pindah, enam puluh dua anak tangga itu terasa tidak terlalu tinggi.","> **Kotak Titipan**\n>\n> (1) Setiap kali hujan turun deras di Jalan Mawar, warung nasi Mak Isah berubah menjadi tempat berteduh. Tukang ojek, pemulung, dan pelajar yang kehujanan berdesakan di bawah terpal birunya sambil bercanda.\n>\n> (2) Di sudut meja ada kotak kayu bertuliskan *Titipan*. Siapa pun boleh memasukkan uang ke dalamnya, dan siapa pun yang sedang tidak punya uang boleh makan dengan membayar dari kotak itu. Mak Isah tidak pernah menghitung isinya.\n>\n> (3) \"Nanti rugi, Mak,\" kata Joko, keponakannya yang baru lulus kuliah ekonomi. Ia sudah membuat tabel pemasukan dan pengeluaran di ponselnya. \"Kotak ini bisa dicurangi orang.\"\n>\n> (4) Mak Isah tertawa sambil mengaduk sayur asem. \"Rezeki itu sudah ada yang mengatur, Jok. Tugas kita jujur dan berbagi. Kalau ada yang curang, itu urusan dia dengan Tuhannya.\"\n>\n> (5) Malam itu Joko diam-diam menghitung isi kotak dan mencocokkannya dengan catatan makan sebulan terakhir. Ternyata uang yang dimasukkan orang lebih banyak daripada nilai makanan yang dibayar dari kotak itu. Joko menghapus tabel di ponselnya, lalu memasukkan selembar uang ke kotak sebelum pulang.","> **Danau Cokelat** (penggalan novel *Sungai yang Berpindah*)\n>\n> (1) Air Sungai Lawe naik setinggi pinggang orang dewasa dalam semalam. Ketika pagi datang, Bima berdiri di atap rumahnya bersama Ibu dan dua adiknya, memandangi kampung yang berubah menjadi danau cokelat.\n>\n> (2) \"Dulu sungai ini tidak pernah semarah ini,\" gumam Kakek Lanang dari atap sebelah. Suaranya hampir tenggelam oleh deru air. \"Waktu hutan di hulu masih rapat, hujan sebulan pun ia tetap sabar.\"\n>\n> (3) Bima teringat truk-truk pengangkut kayu yang setiap malam melintas di jalan desa. Dulu ia senang menghitungnya dari jendela; sekarang ia merasa setiap truk itu membawa pergi sepotong pagar yang melindungi kampungnya.\n>\n> (4) Menjelang siang, perahu karet relawan datang. Bima membantu mengangkat adik-adiknya ke perahu, lalu menoleh sekali lagi ke rumahnya. Di dinding ruang tamu, yang kini hanya tampak bagian atasnya, masih tergantung piagam juara lomba menggambar miliknya: gambar sungai jernih dengan hutan lebat di kedua tepinya.","> **Radio Kakek**\n>\n> (1) Radio tua di meja Kakek sudah tiga minggu bisu. Sejak itu Kakek lebih sering duduk di teras, memandangi jalan tanpa berkata apa-apa. \"Radio itu teman Kakek sejak belum ada televisi di kampung ini,\" kata Ibu kepada Nadia.\n>\n> (2) Nadia membuka penutup belakang radio dengan obeng milik Ayah. Debu tebal menyembur, dan di dalamnya ia menemukan kabel kecil yang putus. Ia memotret bagian itu, lalu mencari video perbaikan radio di internet.\n>\n> (3) Dua malam ia begadang, belajar menyolder dari Pak Harun, tukang servis di ujung gang. Jarinya sempat melepuh terkena ujung solder, tetapi ia tetap mencoba. \"Pelan-pelan, Nduk. Tukang yang buru-buru biasanya kerja dua kali,\" kata Pak Harun.\n>\n> (4) Minggu pagi, Nadia meletakkan radio itu kembali di meja Kakek dan memutar tombolnya. Suara penyiar berita pagi mengalir, sedikit berdesis, tetapi jelas.\n>\n> (5) Kakek berdiri lama di ambang pintu. Lalu ia duduk, memejamkan mata, dan mengetuk-ngetukkan jarinya ke meja mengikuti lagu keroncong yang diputar sesudah berita. Pagi itu, untuk pertama kalinya dalam tiga minggu, teras rumah kosong.","> **Teks 1** (penggalan cerpen *Pukul Empat*)\n>\n> Setiap pukul empat pagi, aku mendengar Ibu menyalakan kompor. Bunyinya seperti batuk kecil, lalu api biru menyala. Sebelum matahari terbit, dua ratus kue lapis sudah tersusun di nampan, siap dititipkan ke warung-warung. Aku tidak pernah melihat Ibu tidur siang. Kadang aku bertanya-tanya, kapan sebenarnya Ibu beristirahat.\n\n> **Teks 2** (penggalan novel *Perempuan Penjahit Malam*)\n>\n> Mesin jahit tua itu berderak sepanjang malam, menjahit sunyi kampung menjadi baju-baju seragam pesanan sekolah. Bu Salmah tahu matanya tidak lagi setajam dulu; ia harus mendekatkan kain hingga hampir menyentuh hidung. Namun, setiap kali melihat foto wisuda anak sulungnya di dinding, jari-jarinya bergerak lebih cepat, seakan-akan lelah hanyalah tamu yang tidak pernah ia persilakan masuk.","> **Map Biru** (penggalan novel *Lapangan Tanah Merah*)\n>\n> (1) Papan pengumuman itu dipasang di pinggir Lapangan Tanah Merah pada hari Senin: *Lahan ini akan dibangun menjadi area parkir pasar. Pengerjaan dimulai bulan depan.*\n>\n> (2) Sasa membacanya tiga kali, berharap huruf-hurufnya berubah. Di lapangan inilah tim sepak bola putri Kelurahan Sukamaju berlatih setiap sore, dengan gawang dari bambu dan bola yang sudah dua kali ditambal.\n>\n> (3) \"Sudahlah, Sa. Kita bisa latihan di gang,\" kata Tiwi sambil menendang kerikil. Anak-anak lain mengangguk lesu.\n>\n> (4) Sasa menggeleng. Malam itu ia menulis surat kepada lurah, lengkap dengan data: berapa anak yang berlatih di sana setiap minggu, piala apa saja yang pernah diraih, dan foto anak-anak kecil yang belajar bersepeda di pinggir lapangan pada hari Minggu. Ia juga meminta tanda tangan dukungan dari para tetangga.\n>\n> (5) Dalam tiga hari terkumpul dua ratus empat belas tanda tangan. Kamis pagi, Sasa berdiri di depan kantor kelurahan dengan map biru di tangan. Jantungnya berdebar lebih keras daripada saat menendang penalti di final tahun lalu."],"questions":[{"n":1,"type":"PG","level":"L1","stem":"Majas yang terdapat dalam frasa \"derek-derek pelabuhan yang berdiri seperti jerapah raksasa\" adalah ….","extra":[],"options":["personifikasi","perumpamaan (simile)","hiperbola","metafora"],"statements":null,"answer":["B"],"explain":"Derek dibandingkan dengan jerapah memakai kata pembanding \"seperti\", jadi majas perumpamaan (simile). **(B)**","passage":0},{"n":2,"type":"PG","level":"L2","stem":"Watak Arum pada paragraf (3) digambarkan melalui ….","extra":[],"options":["isi hati atau pikiran tokoh","ciri fisik tokoh","pendapat tokoh lain","keadaan tempat tinggal tokoh"],"statements":null,"answer":["A"],"explain":"\"Dalam hati ia sudah memutuskan …\" menunjukkan watak tertutup Arum lewat isi hatinya. **(A)**","passage":0},{"n":3,"type":"KAT","level":"L2","stem":"Tentukan benar atau salah setiap pernyataan berikut berdasarkan penggalan novel.","extra":[],"options":null,"statements":["Latar tempat utama penggalan adalah rumah susun dan sekolah di kota pelabuhan.","Arum langsung akrab dengan teman-teman barunya pada hari pertama.","Kalimat terakhir menunjukkan perasaan Arum menjadi lebih ringan.","Rumah Arum di desa memiliki enam puluh dua anak tangga."],"answer":["B","S","B","S"],"explain":"(1) Benar, peristiwa terjadi di rumah susun dan sekolah; desa hanya muncul dalam ingatan. (2) Salah, \"Tidak ada yang mengajaknya bicara\". (3) Benar, tangga \"tidak terlalu tinggi\" menandai hati yang lebih ringan. (4) Salah, rumah di desa hanya punya tiga anak tangga. **(B, S, B, S)**","passage":0},{"n":4,"type":"PG","level":"L3","stem":"Kalimat \"enam puluh dua anak tangga itu terasa tidak terlalu tinggi\" menyiratkan bahwa ….","extra":[],"options":["tangga rumah susun itu baru saja diperbaiki","Arum pindah ke lantai yang lebih rendah","Arum mulai merasa punya teman sehingga beban menyesuaikan diri terasa lebih ringan","tubuh Arum sudah lebih kuat"],"statements":null,"answer":["C"],"explain":"Jumlah anak tangga tidak berubah; yang berubah adalah perasaan Arum setelah ada teman yang menyapanya. Tangga menjadi lambang beratnya menyesuaikan diri. **(C)**","passage":0},{"n":5,"type":"PGK","level":"L3","stem":"Pilih **semua** nilai yang dapat diteladani dari penggalan novel tersebut.","extra":[],"options":["keberanian menyesuaikan diri di lingkungan baru","pentingnya membuka diri terhadap orang lain","lebih aman menyendiri di tempat baru","persahabatan dapat berawal dari kesamaan kecil","orang kota pasti tidak ramah"],"statements":null,"answer":["A","B","D"],"explain":"A, B, dan D sesuai dengan perubahan yang dialami Arum. C bertentangan dengan pesan cerita. E tidak didukung teks karena justru ada anak yang menyapa Arum. **(A, B, D)**","passage":0},{"n":6,"type":"PG","level":"L2","stem":"Nilai yang paling menonjol dalam ucapan Mak Isah pada paragraf (4) adalah nilai ….","extra":[],"options":["estetika","budaya","pendidikan","religius"],"statements":null,"answer":["D"],"explain":"Ucapan \"Rezeki itu sudah ada yang mengatur\" dan \"urusan dia dengan Tuhannya\" menunjukkan keyakinan kepada Tuhan, jadi nilai religius. **(D)**","passage":1},{"n":7,"type":"PG","level":"L3","stem":"Joko menghapus tabel di ponselnya karena ….","extra":[],"options":["memori ponselnya penuh","kekhawatirannya tidak terbukti sehingga ia menjadi yakin pada cara Mak Isah","Mak Isah menyuruhnya menghapus tabel itu","tabel yang ia buat salah hitung"],"statements":null,"answer":["B"],"explain":"Joko khawatir kotak dicurangi. Setelah menghitung, ternyata uang yang masuk lebih banyak daripada yang terpakai. Kekhawatirannya tidak terbukti, sehingga ia meninggalkan cara pandang untung-rugi. **(B)**","passage":1},{"n":8,"type":"PGK","level":"L3","stem":"Pilih **semua** pernyataan yang tepat tentang pandangan Joko dan Mak Isah.","extra":[],"options":["Joko awalnya memandang warung dari sisi untung dan rugi.","Mak Isah mengutamakan kejujuran dan berbagi.","Joko sejak awal mendukung adanya kotak titipan.","Mak Isah menghitung isi kotak setiap malam.","Pada akhir cerita Joko ikut berbagi."],"statements":null,"answer":["A","B","E"],"explain":"A, B, dan E sesuai teks. C salah karena Joko awalnya khawatir rugi. D salah karena Mak Isah \"tidak pernah menghitung isinya\". **(A, B, E)**","passage":1},{"n":9,"type":"PG","level":"L3","stem":"Kotak titipan dalam cerpen tersebut dapat dimaknai sebagai simbol ….","extra":[],"options":["kepercayaan dan kepedulian antarwarga","cara Mak Isah mencari keuntungan","hukuman bagi orang yang curang","tempat menyimpan uang belanja"],"statements":null,"answer":["A"],"explain":"Kotak hanya berjalan jika warga saling percaya dan mau berbagi, jadi kotak itu melambangkan kepercayaan dan kepedulian antarwarga. **(A)**","passage":1},{"n":10,"type":"KAT","level":"L2","stem":"Tentukan benar atau salah setiap pernyataan berikut berdasarkan cerpen.","extra":[],"options":null,"statements":["Joko adalah anak kandung Mak Isah.","Suasana pada paragraf (1) ramai dan hangat meskipun hujan turun.","Isi kotak ternyata lebih sedikit daripada nilai makanan yang dibayar dari kotak.","Cerpen menggunakan sudut pandang orang ketiga."],"answer":["S","B","S","B"],"explain":"(1) Salah, Joko adalah keponakannya. (2) Benar, orang-orang berteduh berdesakan sambil bercanda. (3) Salah, isinya justru lebih banyak. (4) Benar, tokoh disebut dengan nama dan kata \"ia\". **(S, B, S, B)**","passage":1},{"n":11,"type":"PG","level":"L2","stem":"Konflik utama dalam penggalan novel tersebut adalah konflik ….","extra":[],"options":["manusia dengan alam, yaitu banjir yang dikaitkan dengan rusaknya hutan","manusia dengan dirinya sendiri, yaitu Bima yang ragu mengungsi","manusia dengan manusia, yaitu Bima dan Kakek Lanang","manusia dengan relawan yang terlambat datang"],"statements":null,"answer":["A"],"explain":"Tokoh berhadapan dengan banjir, dan Kakek Lanang mengaitkannya dengan hutan di hulu yang tidak lagi rapat. Itu konflik manusia dengan alam. **(A)**","passage":2},{"n":12,"type":"PG","level":"L3","stem":"Kalimat \"setiap truk itu membawa pergi sepotong pagar yang melindungi kampungnya\" bermakna ….","extra":[],"options":["truk-truk itu merusak pagar rumah warga","penebangan hutan menghilangkan perlindungan alami kampung dari banjir","truk-truk itu mengangkut pagar kayu ke kota","Bima kesal karena truk berisik setiap malam"],"statements":null,"answer":["B"],"explain":"Truk pengangkut kayu menandakan penebangan hutan. Hutan adalah \"pagar\" alami yang melindungi kampung dari banjir. **(B)**","passage":2},{"n":13,"type":"PGK","level":"L2","stem":"Pilih **semua** kutipan yang mengandung majas personifikasi.","extra":[],"options":["\"Dulu sungai ini tidak pernah semarah ini\"","\"hujan sebulan pun ia tetap sabar\"","\"kampung yang berubah menjadi danau cokelat\"","\"Air Sungai Lawe naik setinggi pinggang orang dewasa\"","\"Bima membantu mengangkat adik-adiknya ke perahu\""],"statements":null,"answer":["A","B"],"explain":"Sungai yang \"marah\" dan \"sabar\" diberi sifat manusia, jadi personifikasi. C adalah metafora (kampung disebut danau). D dan E kalimat biasa. **(A, B)**","passage":2},{"n":14,"type":"PG","level":"L3","stem":"Detail piagam bergambar sungai jernih pada paragraf (4) berfungsi untuk ….","extra":[],"options":["menunjukkan bahwa Bima pandai menggambar","menghadirkan kontras yang ironis antara gambaran alam yang lestari dan kenyataan banjir","menjelaskan bahwa rumah Bima sangat besar","menandakan bahwa Bima akan pindah ke kota"],"statements":null,"answer":["B"],"explain":"Gambar sungai jernih dan hutan lebat bertolak belakang dengan kenyataan kampung yang tenggelam. Kontras ini menimbulkan ironi dan menegaskan pesan lingkungan. **(B)**","passage":2},{"n":15,"type":"PG","level":"L2","stem":"Unsur ekstrinsik yang paling menonjol dalam penggalan novel tersebut adalah ….","extra":[],"options":["isu lingkungan, yaitu dampak penebangan hutan","latar tempat di atap rumah","tokoh Kakek Lanang","alur yang bergerak maju"],"statements":null,"answer":["A"],"explain":"Unsur ekstrinsik berasal dari luar struktur cerita, misalnya isu sosial atau lingkungan. Latar, tokoh, dan alur termasuk unsur intrinsik. **(A)**","passage":2},{"n":16,"type":"KAT","level":"L2","stem":"Tentukan benar atau salah setiap pernyataan berikut berdasarkan cerpen.","extra":[],"options":null,"statements":["Nadia belajar menyolder dari ayahnya.","Perubahan sikap Kakek setelah radionya rusak menunjukkan betapa berartinya radio itu baginya.","Ucapan Pak Harun mengandung nasihat agar bekerja dengan sabar dan teliti.","Kalimat \"teras rumah kosong\" menunjukkan bahwa Kakek pergi meninggalkan rumah."],"answer":["S","B","B","S"],"explain":"(1) Salah, Nadia belajar dari Pak Harun. (2) Benar, Kakek menjadi murung sejak radionya bisu. (3) Benar, \"Pelan-pelan\" adalah nasihat untuk sabar dan teliti. (4) Salah, Kakek justru sedang menikmati radio di dalam rumah. **(S, B, B, S)**","passage":3},{"n":17,"type":"PG","level":"L3","stem":"Makna kalimat \"Pagi itu, untuk pertama kalinya dalam tiga minggu, teras rumah kosong\" adalah ….","extra":[],"options":["Kakek pergi ke rumah Pak Harun","teras rumah baru saja dibersihkan","Kakek kembali bersemangat menikmati radionya di dalam rumah dan tidak lagi termenung di teras","Nadia memindahkan kursi dari teras"],"statements":null,"answer":["C"],"explain":"Selama tiga minggu Kakek termenung di teras. Kini ia duduk menikmati radio di meja, sehingga teras kosong. Itu tanda semangatnya pulih. **(C)**","passage":3},{"n":18,"type":"PG","level":"L2","stem":"Watak Nadia yang paling tepat berdasarkan cerpen adalah ….","extra":[],"options":["manja dan ceroboh","penakut","peduli dan pantang menyerah","acuh tak acuh"],"statements":null,"answer":["C"],"explain":"Nadia memperbaiki radio karena peduli pada Kakek, dan ia tetap berusaha walau kesulitan. **(C)**","passage":3},{"n":19,"type":"PGK","level":"L3","stem":"Pilih **semua** kutipan yang menjadi bukti watak pantang menyerah Nadia.","extra":[],"options":["\"Dua malam ia begadang, belajar menyolder\"","\"Jarinya sempat melepuh terkena ujung solder, tetapi ia tetap mencoba\"","\"Ia memotret bagian itu, lalu mencari video perbaikan radio di internet\"","\"Kakek berdiri lama di ambang pintu\"","\"Radio tua di meja Kakek sudah tiga minggu bisu\""],"statements":null,"answer":["A","B","C"],"explain":"A, B, dan C menunjukkan usaha Nadia yang terus-menerus walau sulit dan sakit. D dan E tidak berkaitan dengan watak Nadia. **(A, B, C)**","passage":3},{"n":20,"type":"PG","level":"L3","stem":"Amanat yang paling sesuai dengan cerpen \"Radio Kakek\" adalah ….","extra":[],"options":["barang lama sebaiknya segera diganti dengan yang baru","anak-anak tidak boleh memperbaiki barang elektronik","belajar dari internet lebih baik daripada belajar dari orang lain","perhatian kecil yang tulus dapat mengembalikan semangat orang yang kita sayangi"],"statements":null,"answer":["D"],"explain":"Usaha kecil Nadia memperbaiki radio mengembalikan kegembiraan Kakek. Pilihan lain tidak didukung cerita. **(D)**","passage":3},{"n":21,"type":"KAT","level":"L3","stem":"Tentukan benar atau salah setiap pernyataan berikut berdasarkan kedua penggalan.","extra":[],"options":null,"statements":["Teks 1 menggunakan sudut pandang orang pertama, sedangkan Teks 2 orang ketiga.","Kedua teks sama-sama menggambarkan kerja keras seorang ibu.","Ungkapan \"lelah hanyalah tamu yang tidak pernah ia persilakan masuk\" mengandung majas personifikasi.","Latar waktu kedua teks sama-sama siang hari."],"answer":["B","B","B","S"],"explain":"(1) Benar, Teks 1 memakai \"aku\" dan Teks 2 memakai nama tokoh. (2) Benar, keduanya menampilkan ibu yang bekerja keras. (3) Benar, lelah diperlakukan seperti tamu (manusia). (4) Salah, Teks 1 pukul empat pagi dan Teks 2 malam hari. **(B, B, B, S)**","passage":4},{"n":22,"type":"PG","level":"L3","stem":"Perbedaan cara penggambaran tokoh ibu dalam kedua teks adalah ….","extra":[],"options":["keduanya digambarkan melalui dialog tokoh","Teks 1 melalui ciri fisik, sedangkan Teks 2 melalui dialog","Teks 1 melalui pengamatan anaknya, sedangkan Teks 2 melalui pencerita yang mengetahui pikiran dan perasaan tokoh","keduanya digambarkan melalui pendapat tetangga"],"statements":null,"answer":["C"],"explain":"Dalam Teks 1 ibu dilihat dari mata anaknya (\"aku mendengar\", \"aku tidak pernah melihat\"). Dalam Teks 2 pencerita tahu isi pikiran Bu Salmah (\"Bu Salmah tahu matanya …\"). **(C)**","passage":4},{"n":23,"type":"PG","level":"L1","stem":"Majas dalam kalimat \"Bunyinya seperti batuk kecil\" adalah ….","extra":[],"options":["metafora","hiperbola","litotes","perumpamaan (simile)"],"statements":null,"answer":["D"],"explain":"Ada kata pembanding \"seperti\", jadi majas perumpamaan (simile). **(D)**","passage":4},{"n":24,"type":"PGK","level":"L3","stem":"Pilih **semua** persamaan kedua penggalan tersebut.","extra":[],"options":["Sama-sama menampilkan ibu yang bekerja pada waktu orang lain beristirahat.","Sama-sama merupakan penggalan novel.","Sama-sama mengandung nilai moral kerja keras dan pengorbanan.","Sama-sama menggunakan sudut pandang orang pertama.","Sama-sama menggunakan majas untuk menghidupkan gambaran suasana kerja."],"statements":null,"answer":["A","C","E"],"explain":"A, C, dan E benar: ibu bekerja dini hari dan malam, ada nilai kerja keras, dan ada majas (simile di Teks 1, personifikasi dan metafora di Teks 2). B salah karena Teks 1 penggalan cerpen. D salah karena Teks 2 memakai sudut pandang orang ketiga. **(A, C, E)**","passage":4},{"n":25,"type":"PG","level":"L3","stem":"Ungkapan \"menjahit sunyi kampung menjadi baju-baju seragam\" paling tepat dimaknai ….","extra":[],"options":["Bu Salmah menjahit seragam di tengah keheningan malam kampung","Bu Salmah menjahit kain bertuliskan kata \"sunyi\"","kampung itu dijahit menjadi pakaian","Bu Salmah tidak menyukai keramaian"],"statements":null,"answer":["A"],"explain":"Ungkapan itu kiasan. Bu Salmah menjahit sepanjang malam ketika kampung sunyi, dan hasilnya baju seragam. **(A)**","passage":4},{"n":26,"type":"KAT","level":"L2","stem":"Tentukan benar atau salah setiap pernyataan berikut berdasarkan penggalan novel.","extra":[],"options":null,"statements":["Pengumuman menyebutkan lahan akan dijadikan area parkir pasar.","Tiwi mendukung rencana Sasa menulis surat sejak awal.","Kalimat \"Jantungnya berdebar lebih keras daripada saat menendang penalti\" menggambarkan ketegangan Sasa.","Sasa mengumpulkan dua ratus empat belas tanda tangan dalam seminggu."],"answer":["B","S","B","S"],"explain":"(1) Benar, sesuai bunyi pengumuman. (2) Salah, Tiwi justru mengajak menyerah. (3) Benar, perbandingan dengan saat penalti menegaskan rasa tegang. (4) Salah, tanda tangan terkumpul dalam tiga hari. **(B, S, B, S)**","passage":5},{"n":27,"type":"PG","level":"L2","stem":"Watak Sasa yang paling menonjol adalah ….","extra":[],"options":["mudah putus asa","gigih dan berpikir runtut","pemarah","pendiam dan pasrah"],"statements":null,"answer":["B"],"explain":"Sasa tidak menyerah dan menyusun surat yang lengkap dengan data. Itu menunjukkan watak gigih dan berpikir runtut. **(B)**","passage":5},{"n":28,"type":"PG","level":"L3","stem":"Penggalan tersebut paling mungkin berada pada tahap alur ….","extra":[],"options":["pengenalan, karena hanya memperkenalkan tokoh dan tempat","penyelesaian, karena konflik sudah berakhir","peningkatan konflik menuju klimaks, karena Sasa mulai bertindak dan ketegangan memuncak menjelang pertemuan di kelurahan","antiklimaks, karena lapangan batal dibangun"],"statements":null,"answer":["C"],"explain":"Konflik sudah muncul (pengumuman) dan terus meningkat (surat, tanda tangan), lalu berhenti tepat sebelum pertemuan yang menentukan. Belum ada penyelesaian. **(C)**","passage":5},{"n":29,"type":"PGK","level":"L2","stem":"Pilih **semua** data yang disertakan Sasa dalam suratnya kepada lurah.","extra":[],"options":["jumlah anak yang berlatih setiap minggu","piala yang pernah diraih","foto anak-anak kecil belajar bersepeda","biaya pembangunan area parkir","nama kontraktor pembangunan"],"statements":null,"answer":["A","B","C"],"explain":"Paragraf (4) menyebut jumlah anak yang berlatih, piala, dan foto anak-anak bersepeda. Biaya dan nama kontraktor tidak disebutkan. **(A, B, C)**","passage":5},{"n":30,"type":"PG","level":"L3","stem":"Nilai sosial yang paling menonjol dalam penggalan novel tersebut adalah ….","extra":[],"options":["kepatuhan mutlak pada setiap pengumuman","persaingan antartim sepak bola","kebiasaan berlatih di gang","kepedulian dan partisipasi warga dalam memperjuangkan ruang bersama"],"statements":null,"answer":["D"],"explain":"Sasa dan para tetangga bersama-sama memperjuangkan lapangan yang dipakai banyak orang. Itu kepedulian dan partisipasi warga. **(D)**","passage":5}]},{"id":"BI11","title":"BI 11 · Sastra: Puisi","intro":"**Fokus:** memahami dan menafsirkan puisi modern. **Materi:** tema, makna konotatif dan diksi, majas, citraan (imaji), rima, suasana, sikap penyair, amanat, serta perbandingan dua puisi.","passages":["> **Ibu di Ladang Pagi**\n>\n> Embun masih tidur di pucuk ilalang\\\n> ketika langkah ibu membangunkan pematang\\\n> caping tua menampung cahaya pertama\\\n> dan peluh menjadi doa yang tak bersuara\n>\n> Di punggungnya, bakul berisi harapan\\\n> sayur dan cabai untuk pasar di seberang\\\n> ia tak pernah menghitung jarak pulang\\\n> sebab rindu anak-anak adalah jalan paling terang\n>\n> Ibu, kaulah musim yang tak pernah gagal panen\\\n> meski kemarau kerap singgah tanpa pesan","> **Kota Pukul Tujuh**\n>\n> Klakson berebut pagi di simpang empat\\\n> gedung-gedung menelan matahari bulat-bulat\\\n> di trotoar, seorang bocah menjajakan koran\\\n> berita hari ini: harga naik lagi, katanya, sudah biasa\n>\n> Kami berlari mengejar jam\\\n> yang tak pernah mau menunggu\\\n> di layar ponsel, kabar dunia berganti setiap detik\\\n> tapi tak ada yang sempat bertanya\\\n> apakah bocah itu sudah sarapan","> **Surat untuk Hutan**\n>\n> Kepada hutan yang dulu memelukku\\\n> maafkan kami yang lupa mengetuk pintu\\\n> kami datang dengan gergaji dan janji\\\n> lalu pulang membawa sunyi\n>\n> Kepada sungai yang dulu bernyanyi\\\n> maafkan kami yang menyumbat suaramu\\\n> dengan plastik, dengan lupa, dengan malas\\\n> yang kami bungkus rapi setiap hari\n>\n> Kepada anak cucu yang belum lahir\\\n> maafkan kami\\\n> jika kelak kalian hanya mengenal pohon\\\n> dari gambar di buku pelajaran","> **Di Peron Pukul Lima**\n>\n> Ayah berangkat dengan kereta pukul lima\\\n> membawa tas lusuh dan pesan yang sederhana:\\\n> \"Jaga ibumu, rajinlah ke sekolah\"\\\n> lalu peluit menggunting pagi menjadi dua\n>\n> Sejak itu, setiap Jumat aku menunggu\\\n> suara di ujung telepon yang selalu berkata baik-baik saja\\\n> padahal batuknya terdengar sampai ke sini\\\n> menyeberangi tiga provinsi\n>\n> Ayah, aku belajar membaca\\\n> dari jarak di antara kita:\\\n> bahwa cinta kadang berupa kepergian\\\n> dan rindu adalah ongkos yang kita bayar bersama","> **Puisi A: Hujan**\n>\n> Hujan turun seperti ribuan jarum perak\\\n> menjahit atap-atap rumah yang retak\\\n> anak-anak berlari tanpa alas kaki\\\n> tertawa, seolah langit sedang membagi hadiah\n\n> **Puisi B: Kemarau**\n>\n> Sawah-sawah merekah seperti bibir yang haus\\\n> padi menunduk bukan karena berisi\\\n> petani menatap langit berhari-hari\\\n> menghitung awan yang tak kunjung singgah","> **Sekolah di Garis Batas**\n>\n> Di sekolah kayu dekat garis batas\\\n> bendera dikibarkan dengan tali rafia\\\n> tiang bambunya miring sedikit\\\n> tapi hormat anak-anak selalu tegak lurus\n>\n> Mereka menghafal nama-nama pulau\\\n> yang belum pernah mereka lihat\\\n> menyanyikan lagu kebangsaan\\\n> dengan suara yang lebih keras dari angin pegunungan\n>\n> Ibu guru menulis di papan:\\\n> \"Indonesia bukan hanya di peta\"\\\n> lalu menunjuk dada murid-muridnya\\\n> satu per satu"],"questions":[{"n":1,"type":"PG","level":"L2","stem":"Tema puisi \"Ibu di Ladang Pagi\" adalah ….","extra":[],"options":["perjuangan dan kasih sayang ibu","keindahan alam pedesaan","kehidupan pasar tradisional","musim kemarau di desa"],"statements":null,"answer":["A"],"explain":"Seluruh puisi menggambarkan ibu yang bekerja sejak subuh di ladang demi anak-anaknya, jadi temanya perjuangan dan kasih sayang ibu. **(A)**","passage":0},{"n":2,"type":"PG","level":"L1","stem":"Larik \"caping tua menampung cahaya pertama\" terutama menggunakan citraan ….","extra":[],"options":["pendengaran","penglihatan","penciuman","perabaan"],"statements":null,"answer":["B"],"explain":"Caping dan cahaya adalah hal yang dapat dilihat, sehingga citraannya penglihatan. **(B)**","passage":0},{"n":3,"type":"KAT","level":"L2","stem":"Tentukan benar atau salah setiap pernyataan berikut berdasarkan puisi.","extra":[],"options":null,"statements":["Larik \"Embun masih tidur di pucuk ilalang\" mengandung majas personifikasi.","Bait kedua berima a-b-a-b.","Larik \"kaulah musim yang tak pernah gagal panen\" mengandung majas metafora.","Puisi menggambarkan ibu yang sering mengeluh karena lelah."],"answer":["B","S","B","S"],"explain":"(1) Benar, embun diberi sifat manusia (tidur). (2) Salah, akhir larik bait kedua adalah harapan, seberang, pulang, terang, jadi bukan pola a-b-a-b. (3) Benar, ibu langsung disebut \"musim yang tak pernah gagal panen\" tanpa kata pembanding. (4) Salah, ibu justru digambarkan bekerja tanpa mengeluh (\"doa yang tak bersuara\"). **(B, S, B, S)**","passage":0},{"n":4,"type":"PG","level":"L3","stem":"Makna larik \"meski kemarau kerap singgah tanpa pesan\" dalam hubungannya dengan larik sebelumnya adalah ….","extra":[],"options":["musim kemarau sering datang tiba-tiba ke ladang","ibu tidak menyukai musim kemarau","walaupun kesulitan hidup sering datang tiba-tiba, ibu tetap memberi hasil bagi keluarganya","ibu sering kedatangan tamu tanpa kabar"],"statements":null,"answer":["C"],"explain":"Kemarau melambangkan masa sulit yang datang tiba-tiba. Larik sebelumnya menyebut ibu tidak pernah \"gagal panen\", artinya ibu selalu bisa mencukupi keluarga. **(C)**","passage":0},{"n":5,"type":"PGK","level":"L3","stem":"Pilih **semua** pasangan ungkapan dan makna yang tepat.","extra":[],"options":["\"bakul berisi harapan\": dagangan yang menjadi sumber harapan keluarga","\"peluh menjadi doa\": kerja keras sebagai bentuk doa","\"langkah ibu membangunkan pematang\": ibu berteriak membangunkan petani","\"rindu anak-anak adalah jalan paling terang\": rindu kepada anak menjadi penuntun dan penyemangat ibu untuk pulang","\"caping tua\": ibu yang sudah renta dan sakit"],"statements":null,"answer":["A","B","D"],"explain":"A, B, dan D tepat. C salah, \"membangunkan pematang\" berarti kedatangan ibu memulai hari di sawah. E salah, \"caping tua\" hanya menunjukkan caping yang sudah lama dipakai; tidak ada keterangan ibu sakit. **(A, B, D)**","passage":0},{"n":6,"type":"PG","level":"L2","stem":"Majas dalam larik \"gedung-gedung menelan matahari bulat-bulat\" adalah ….","extra":[],"options":["perumpamaan","litotes","personifikasi","ironi"],"statements":null,"answer":["C"],"explain":"Gedung (benda mati) diberi kemampuan manusia, yaitu menelan. **(C)**","passage":1},{"n":7,"type":"PG","level":"L3","stem":"Kritik yang disampaikan penyair melalui puisi tersebut adalah ….","extra":[],"options":["kota terlalu indah untuk ditinggalkan","masyarakat kota yang sibuk sering abai terhadap sesama yang kurang beruntung","anak-anak sebaiknya tidak membaca koran","ponsel membuat orang selalu terlambat"],"statements":null,"answer":["B"],"explain":"Larik akhir \"tak ada yang sempat bertanya / apakah bocah itu sudah sarapan\" menyindir warga kota yang terlalu sibuk sampai tidak peduli pada bocah penjual koran. **(B)**","passage":1},{"n":8,"type":"PGK","level":"L3","stem":"Pilih **semua** pernyataan yang tepat tentang puisi tersebut.","extra":[],"options":["Penggunaan kata \"kami\" membuat pembaca ikut tersindir.","Suasana puisi tergesa-gesa dan ironis.","Puisi terikat rima yang teratur di setiap bait.","Larik \"Klakson berebut pagi\" menghadirkan citraan pendengaran.","Puisi bertema keindahan alam pedesaan."],"statements":null,"answer":["A","B","D"],"explain":"A, B, dan D tepat. C salah, rima puisi ini tidak teratur. E salah, latarnya kota, bukan desa. **(A, B, D)**","passage":1},{"n":9,"type":"PG","level":"L3","stem":"Larik \"berita hari ini: harga naik lagi, katanya, sudah biasa\" mengandung ….","extra":[],"options":["pujian terhadap pemerintah","informasi resmi tentang harga barang","ajakan untuk berhemat","sindiran bahwa kesulitan hidup sudah dianggap hal yang lumrah"],"statements":null,"answer":["D"],"explain":"Kata \"katanya, sudah biasa\" menunjukkan kenaikan harga dianggap lumrah. Penyair menyindir sikap pasrah tersebut. **(D)**","passage":1},{"n":10,"type":"KAT","level":"L2","stem":"Tentukan benar atau salah setiap pernyataan berikut berdasarkan puisi.","extra":[],"options":null,"statements":["Larik \"jam / yang tak pernah mau menunggu\" mengandung majas personifikasi.","Bocah dalam puisi digambarkan menjajakan koran.","Puisi ini termasuk puisi lama karena terikat jumlah larik dan rima.","Larik terakhir menunjukkan bahwa semua orang di kota peduli pada bocah itu."],"answer":["B","B","S","S"],"explain":"(1) Benar, jam diberi sifat manusia (tidak mau menunggu). (2) Benar, tertulis di bait pertama. (3) Salah, puisi ini puisi modern (bebas) yang tidak terikat jumlah larik dan rima. (4) Salah, justru \"tak ada yang sempat bertanya\". **(B, B, S, S)**","passage":1},{"n":11,"type":"PG","level":"L1","stem":"Pengulangan kata \"Kepada …\" di awal setiap bait merupakan majas ….","extra":[],"options":["anafora","epifora","hiperbola","litotes"],"statements":null,"answer":["A"],"explain":"Pengulangan kata di awal larik atau bait disebut anafora. Epifora adalah pengulangan di akhir. **(A)**","passage":2},{"n":12,"type":"PG","level":"L3","stem":"Makna larik \"kami datang dengan gergaji dan janji / lalu pulang membawa sunyi\" adalah ….","extra":[],"options":["manusia datang ke hutan untuk berburu, lalu pulang dengan tenang","manusia menebang hutan dengan berbagai janji, lalu meninggalkan hutan yang gundul dan sepi","manusia berjanji tidak akan datang lagi ke hutan","manusia membawa gergaji untuk memperbaiki rumah"],"statements":null,"answer":["B"],"explain":"\"Gergaji\" melambangkan penebangan, \"janji\" melambangkan janji pembangunan, dan \"sunyi\" adalah hutan yang hilang kehidupannya. **(B)**","passage":2},{"n":13,"type":"PGK","level":"L3","stem":"Pilih **semua** sikap penyair yang tergambar dalam puisi.","extra":[],"options":["menyesal","menyalahkan anak cucu","prihatin terhadap kerusakan lingkungan","bangga atas pembangunan","khawatir akan masa depan"],"statements":null,"answer":["A","C","E"],"explain":"Penyair berulang kali meminta maaf (menyesal), menggambarkan kerusakan hutan dan sungai (prihatin), dan cemas anak cucu hanya mengenal pohon dari gambar (khawatir). **(A, C, E)**","passage":2},{"n":14,"type":"PG","level":"L2","stem":"Suasana yang paling terasa dalam puisi tersebut adalah ….","extra":[],"options":["gembira","tegang","marah meluap","haru dan penuh penyesalan"],"statements":null,"answer":["D"],"explain":"Permintaan maaf yang berulang dan bayangan masa depan tanpa pohon menimbulkan suasana haru dan penuh penyesalan. **(D)**","passage":2},{"n":15,"type":"PG","level":"L3","stem":"Larik \"dengan plastik, dengan lupa, dengan malas\" menyiratkan bahwa ….","extra":[],"options":["plastik adalah satu-satunya penyebab pencemaran","penyair malas membersihkan sungai","pencemaran sungai disebabkan oleh benda dan juga oleh sikap manusia yang abai","sungai sengaja dibungkus dengan rapi"],"statements":null,"answer":["C"],"explain":"Plastik adalah benda, sedangkan \"lupa\" dan \"malas\" adalah sikap. Penyair menegaskan bahwa sikap abai manusia ikut mencemari sungai. **(C)**","passage":2},{"n":16,"type":"KAT","level":"L2","stem":"Tentukan benar atau salah setiap pernyataan berikut berdasarkan puisi.","extra":[],"options":null,"statements":["Ayah berangkat dengan kereta pukul lima.","Larik \"peluit menggunting pagi menjadi dua\" menggambarkan perpisahan yang memisahkan kehidupan sebelum dan sesudah kepergian ayah.","Di telepon, ayah mengaku sedang sakit parah.","Aku-lirik dalam puisi adalah seorang anak."],"answer":["B","B","S","B"],"explain":"(1) Benar, sesuai larik pertama. (2) Benar, bunyi peluit menandai saat yang membelah hidup aku-lirik menjadi sebelum dan sesudah ayah pergi. (3) Salah, ayah \"selalu berkata baik-baik saja\". (4) Benar, aku-lirik mendapat pesan \"Jaga ibumu, rajinlah ke sekolah\". **(B, B, S, B)**","passage":3},{"n":17,"type":"PG","level":"L3","stem":"Makna larik \"padahal batuknya terdengar sampai ke sini / menyeberangi tiga provinsi\" adalah ….","extra":[],"options":["suara batuk ayah sangat keras","aku-lirik dapat merasakan bahwa ayahnya sedang tidak baik walaupun mengaku baik-baik saja","ayah sebenarnya tinggal dekat rumah","sambungan telepon sedang rusak"],"statements":null,"answer":["B"],"explain":"Batuk itu tidak mungkin benar-benar terdengar sejauh tiga provinsi. Maknanya, aku-lirik merasakan keadaan ayahnya yang tidak baik walaupun ayah menutupinya. **(B)**","passage":3},{"n":18,"type":"PG","level":"L2","stem":"Majas dalam larik \"rindu adalah ongkos yang kita bayar bersama\" adalah ….","extra":[],"options":["metafora","perumpamaan","personifikasi","hiperbola"],"statements":null,"answer":["A"],"explain":"Rindu langsung disamakan dengan ongkos tanpa kata pembanding, jadi metafora. **(A)**","passage":3},{"n":19,"type":"PGK","level":"L3","stem":"Pilih **semua** penafsiran yang sesuai dengan isi puisi.","extra":[],"options":["Ayah merantau demi keluarganya.","Aku-lirik memahami bahwa kepergian ayah adalah wujud cinta.","Ayah pergi karena bertengkar dengan keluarga.","Ayah berusaha tampak kuat agar keluarganya tidak khawatir.","Aku-lirik menyalahkan ayahnya karena pergi."],"statements":null,"answer":["A","B","D"],"explain":"A, B, dan D sesuai dengan pesan ayah, larik \"cinta kadang berupa kepergian\", dan ayah yang selalu berkata baik-baik saja. C dan E tidak didukung puisi. **(A, B, D)**","passage":3},{"n":20,"type":"PG","level":"L2","stem":"Tema puisi \"Di Peron Pukul Lima\" adalah ….","extra":[],"options":["persahabatan di stasiun","keindahan perjalanan dengan kereta","kasih sayang dan pengorbanan keluarga yang terpisah jarak","kenakalan seorang anak"],"statements":null,"answer":["C"],"explain":"Puisi berkisah tentang ayah yang merantau dan anak yang merindukannya, jadi temanya kasih sayang dan pengorbanan keluarga yang terpisah jarak. **(C)**","passage":3},{"n":21,"type":"KAT","level":"L3","stem":"Tentukan benar atau salah setiap pernyataan berikut berdasarkan kedua puisi.","extra":[],"options":null,"statements":["Kedua puisi sama-sama menggunakan majas perumpamaan.","Suasana Puisi A gembira, sedangkan suasana Puisi B muram dan cemas.","Larik \"padi menunduk bukan karena berisi\" menyiratkan padi layu karena kekeringan.","Kedua puisi sama-sama bertema kebahagiaan petani saat panen."],"answer":["B","B","B","S"],"explain":"(1) Benar, ada \"seperti ribuan jarum perak\" dan \"seperti bibir yang haus\". (2) Benar, anak-anak tertawa pada Puisi A; petani menatap langit berhari-hari pada Puisi B. (3) Benar, padi biasanya menunduk karena berisi; di sini menunduk karena layu. (4) Salah, Puisi B menggambarkan kekeringan dan Puisi A tidak membahas panen. **(B, B, B, S)**","passage":4},{"n":22,"type":"PG","level":"L3","stem":"Larik \"seolah langit sedang membagi hadiah\" menunjukkan bahwa bagi anak-anak, hujan ….","extra":[],"options":["dianggap anugerah yang menggembirakan","dianggap bencana yang menakutkan","membuat mereka tidak bisa bermain","menyebabkan atap rumah bocor"],"statements":null,"answer":["A"],"explain":"Anak-anak tertawa dan hujan disebut seperti \"hadiah\", jadi hujan dianggap anugerah yang menggembirakan. **(A)**","passage":4},{"n":23,"type":"PG","level":"L1","stem":"Larik \"Sawah-sawah merekah seperti bibir yang haus\" terutama menghadirkan citraan ….","extra":[],"options":["pendengaran","perabaan","pengecapan","penglihatan"],"statements":null,"answer":["D"],"explain":"Sawah yang merekah (retak) adalah hal yang tampak oleh mata. **(D)**","passage":4},{"n":24,"type":"PGK","level":"L3","stem":"Pilih **semua** pernyataan yang tepat tentang perbandingan kedua puisi.","extra":[],"options":["Puisi A memandang hujan dari sudut anak-anak.","Puisi B memandang kemarau dari sudut petani.","Keduanya menggambarkan hubungan manusia dengan alam.","Puisi A menggambarkan banjir yang menghanyutkan rumah.","Puisi B diakhiri dengan turunnya hujan deras."],"statements":null,"answer":["A","B","C"],"explain":"A, B, dan C tepat. D salah, Puisi A tidak menggambarkan banjir. E salah, Puisi B berakhir dengan awan yang \"tak kunjung singgah\". **(A, B, C)**","passage":4},{"n":25,"type":"PG","level":"L3","stem":"Larik \"menghitung awan yang tak kunjung singgah\" bermakna ….","extra":[],"options":["petani sedang belajar berhitung","petani terus berharap datangnya hujan yang tak kunjung turun","awan di langit terlalu banyak","petani sedang menunggu tamu"],"statements":null,"answer":["B"],"explain":"Awan adalah tanda hujan. \"Tak kunjung singgah\" berarti hujan yang diharapkan petani belum juga datang. **(B)**","passage":4},{"n":26,"type":"KAT","level":"L3","stem":"Tentukan benar atau salah setiap pernyataan berikut berdasarkan puisi.","extra":[],"options":null,"statements":["Kontras antara \"tiang bambunya miring\" dan \"hormat anak-anak selalu tegak lurus\" menegaskan semangat kebangsaan di tengah keterbatasan.","Sekolah dalam puisi memiliki fasilitas yang lengkap dan modern.","Larik \"dengan suara yang lebih keras dari angin pegunungan\" mengandung majas hiperbola.","Murid-murid sudah pernah mengunjungi semua pulau yang mereka hafalkan."],"answer":["B","S","B","S"],"explain":"(1) Benar, sarana yang miring dikontraskan dengan sikap hormat yang tegak. (2) Salah, ada tali rafia, tiang bambu, dan sekolah kayu. (3) Benar, perbandingan dengan angin pegunungan melebih-lebihkan suara. (4) Salah, pulau-pulau itu \"belum pernah mereka lihat\". **(B, S, B, S)**","passage":5},{"n":27,"type":"PG","level":"L3","stem":"Makna tindakan ibu guru menulis \"Indonesia bukan hanya di peta\" lalu menunjuk dada murid-muridnya adalah ….","extra":[],"options":["rasa cinta tanah air ada di dalam hati setiap warganya","peta Indonesia harus digambar di dada","murid harus menghafal peta Indonesia","murid-murid sedang dihukum"],"statements":null,"answer":["A"],"explain":"Menunjuk dada berarti menunjuk hati. Indonesia tidak hanya berupa wilayah di peta, tetapi juga rasa cinta di hati warganya. **(A)**","passage":5},{"n":28,"type":"PG","level":"L2","stem":"Tema puisi \"Sekolah di Garis Batas\" adalah ….","extra":[],"options":["kesedihan anak-anak di pegunungan","keindahan alam perbatasan","semangat kebangsaan di daerah perbatasan","kehidupan seorang guru di kota"],"statements":null,"answer":["C"],"explain":"Puisi menggambarkan anak-anak di perbatasan yang menghormat bendera dan bernyanyi lagu kebangsaan dengan semangat. **(C)**","passage":5},{"n":29,"type":"PGK","level":"L2","stem":"Pilih **semua** kata atau frasa yang menggambarkan keterbatasan sarana sekolah.","extra":[],"options":["tali rafia","tiang bambunya miring","sekolah kayu","lagu kebangsaan","nama-nama pulau"],"statements":null,"answer":["A","B","C"],"explain":"Tali rafia, tiang bambu yang miring, dan sekolah kayu menunjukkan sarana yang sederhana. Lagu kebangsaan dan nama pulau tidak berkaitan dengan sarana. **(A, B, C)**","passage":5},{"n":30,"type":"PG","level":"L3","stem":"Amanat yang paling sesuai dengan puisi tersebut adalah ….","extra":[],"options":["menghafal nama pulau adalah kewajiban utama siswa","guru harus selalu bersikap tegas","sekolah sebaiknya hanya dibangun di kota","cinta tanah air tidak bergantung pada kelengkapan fasilitas"],"statements":null,"answer":["D"],"explain":"Dengan sarana yang serba terbatas, anak-anak tetap bersemangat. Amanatnya: cinta tanah air tidak bergantung pada kelengkapan fasilitas. **(D)**","passage":5}]},{"id":"BI12","title":"BI 12 · Sastra: Naskah Drama","intro":"**Fokus:** memahami dan menafsirkan penggalan naskah drama. **Materi:** dialog, prolog, petunjuk lakuan (kramagung), peran tokoh (protagonis, antagonis, tritagonis), konflik, tahapan alur drama, suasana, amanat, serta mengubah dialog menjadi narasi.","passages":["> **Uang Kas**\n>\n> *(Ruang kelas IX-B saat jam istirahat. Rina, bendahara kelas, mengobrak-abrik tasnya dengan wajah pucat. Bima dan Sinta masuk.)*\n>\n> **RINA:** Uang kas hilang! Tadi pagi masih ada di dompet ini. Tiga ratus ribu!\n>\n> **BIMA:** *(menatap ke arah pintu)* Tadi aku lihat Dodi duduk di bangkumu. Pasti dia.\n>\n> **SINTA:** Jangan asal tuduh, Bim. Kita belum tahu apa-apa.\n>\n> **BIMA:** Tapi siapa lagi? Dia kan sering tidak bawa uang jajan.\n>\n> *(Dodi masuk membawa buku. Semua terdiam.)*\n>\n> **DODI:** Kenapa kalian melihatku seperti itu?\n>\n> **SINTA:** Rin, coba periksa tas kecilmu yang satu lagi. Tadi pagi kamu bilang mau memindahkan dompet karena ritsletingnya rusak.\n>\n> **RINA:** *(membuka tas kecil, lalu menunduk)* Ada …. Maaf, aku lupa.\n>\n> **BIMA:** *(menggaruk kepala, lalu mendekati Dodi)* Dod, aku … minta maaf. Aku sudah berprasangka buruk.\n>\n> **DODI:** *(tersenyum tipis)* Tidak apa-apa. Lain kali tanya dulu, ya.","> **Lampu Padam**\n>\n> *(Malam hari di ruang makan. Ayah, Ibu, Tari, dan Andi duduk mengelilingi meja. Semua sibuk dengan ponsel masing-masing. Nenek, yang baru datang dari desa, memandangi mereka.)*\n>\n> **NENEK:** Sayur lodehnya enak, Ndi?\n>\n> **ANDI:** *(tanpa mengangkat kepala)* Hmm. Enak, Nek.\n>\n> **NENEK:** Nenek belum menuangkannya ke piringmu.\n>\n> *(Tari tertawa kecil, lalu kembali menatap ponselnya. Tiba-tiba lampu padam. Hanya layar-layar ponsel yang menyala.)*\n>\n> **AYAH:** Wah, baterai ponselku tinggal lima persen.\n>\n> **IBU:** Punyaku juga. Ayo matikan saja, hemat baterai.\n>\n> *(Satu per satu layar padam. Hening. Nenek menyalakan lilin dan meletakkannya di tengah meja.)*\n>\n> **NENEK:** Dulu, waktu belum ada listrik di desa, kami makan sambil bercerita. Siapa yang mau mulai?\n>\n> **TARI:** *(ragu-ragu)* Tadi … aku dapat nilai seratus untuk ulangan Matematika.\n>\n> **AYAH:** Sungguh? Kenapa tidak cerita dari tadi?\n>\n> **TARI:** *(pelan)* Ayah sedang sibuk.\n>\n> *(Ayah terdiam, lalu meletakkan ponselnya terbalik di meja, walaupun lampu sudah kembali menyala.)*","> **Sumur Pak Darsa**\n>\n> *Prolog: Desa Kalisari dilanda kemarau panjang. Satu-satunya sumur yang masih berair adalah milik Pak Darsa. Malam ini warga berkumpul di balai desa.*\n>\n> *(Balai desa. Pak Kades duduk di depan. Warga berdesakan. Pak Darsa berdiri dengan tangan bersedekap.)*\n>\n> **BU WARNI:** Pak Darsa, anak-anak kami sudah tiga hari tidak mandi. Izinkan kami mengambil air di sumur Bapak.\n>\n> **PAK DARSA:** Sumur itu saya gali dengan uang sendiri. Kalau semua orang mengambil air, sumurnya bisa kering. Lalu keluarga saya minum apa?\n>\n> **PAK KADES:** Kekhawatiran Pak Darsa masuk akal. Tapi warga juga butuh air. Bagaimana kalau kita atur giliran? Setiap keluarga dua ember sehari.\n>\n> **PAK DARSA:** *(diam sejenak)* Lalu siapa yang menjamin sumur saya tidak rusak?\n>\n> **GILANG:** *(pemuda, mengangkat tangan)* Kami, Pak. Para pemuda siap bergantian menjaga dan membersihkan sumur. Kami juga akan memasang katrol baru supaya talinya tidak cepat putus.\n>\n> *(Warga berbisik-bisik setuju. Pak Darsa memandangi wajah-wajah di depannya cukup lama.)*\n>\n> **PAK DARSA:** *(menghela napas)* Baiklah. Mulai besok pagi. Tapi dua ember, tidak lebih.\n>\n> *(Warga bertepuk tangan. Bu Warni menyalami Pak Darsa dengan mata berkaca-kaca.)*","> **Tamu Penting**\n>\n> *(Halaman SMP Harapan Jaya, pagi hari. Pak Bowo, wakil kepala sekolah, mondar-mandir dengan gelisah. Para siswa sibuk menyapu.)*\n>\n> **PAK BOWO:** Cepat, cepat! Pengawas dari dinas datang pukul sembilan. Semua harus bersih!\n>\n> *(Seorang lelaki bertopi lusuh dan berkemeja sederhana masuk, lalu memungut sampah plastik di dekat gerbang.)*\n>\n> **PAK BOWO:** Pak, Pak! Jangan berdiri di situ. Sebentar lagi ada tamu penting. Kalau mau membantu, sapu saja daun-daun di belakang kantin.\n>\n> **LELAKI:** *(tersenyum)* Baik, Pak.\n>\n> *(Lelaki itu menyapu bersama para siswa sambil mengobrol dengan Lala dan Dito.)*\n>\n> **LELAKI:** Tempat sampahnya cuma satu, ya? Lalu kalian memilah sampah di mana?\n>\n> **LALA:** Belum ada tempatnya, Pak. Tapi kami sudah mengusulkan bank sampah ke OSIS.\n>\n> *(Pukul sembilan lewat. Pak Bowo menelepon.)*\n>\n> **PAK BOWO:** Halo? Pak Pengawas sudah di mana? … Sudah di sekolah sejak pukul delapan? *(menoleh perlahan ke arah belakang kantin)*\n>\n> *(Lelaki bertopi lusuh itu melambaikan sapu ke arah Pak Bowo.)*","> **Di Belakang Panggung**\n>\n> *(Belakang panggung lomba pidato tingkat kabupaten. Kirana meremas kertas teksnya.)*\n>\n> **KIRANA:** Bu, saya tidak bisa. Tangan saya gemetar.\n>\n> **BU ANA:** *(menggenggam tangan Kirana)* Gemetar itu tanda kamu peduli. Ingat, kamu tidak sedang melawan juri. Kamu sedang berbagi cerita.\n>\n> **KIRANA:** Kalau saya lupa teks?\n>\n> **BU ANA:** Lihat mata penonton di baris ketiga. Di sana ibumu duduk.\n>\n> *(Pembawa acara memanggil nama Kirana. Kirana menarik napas panjang, lalu melangkah ke panggung tanpa membawa kertasnya.)*","> **Sawah Warisan**\n>\n> *(Teras rumah joglo peninggalan almarhum Bapak, sore hari. Hendra, kakak sulung yang bekerja di kota, duduk berhadapan dengan Yudi, adiknya yang menggarap sawah. Lastri, si bungsu, datang membawa teh.)*\n>\n> **HENDRA:** Sudah ada pembeli yang mau membayar mahal. Uangnya bisa kita bagi tiga. Kamu bisa buka usaha, Yud.\n>\n> **YUDI:** *(suara meninggi)* Usaha apa, Mas? Saya ini petani. Sawah itu bukan cuma tanah. Itu tempat Bapak mengajari kita menanam padi.\n>\n> **HENDRA:** Jangan bawa-bawa perasaan. Zaman sudah berubah.\n>\n> **LASTRI:** *(meletakkan nampan dengan agak keras)* Mas, Yudi, Bapak dulu selalu bilang, sawah dan saudara jangan sampai sama-sama retak.\n>\n> *(Keduanya terdiam.)*\n>\n> **LASTRI:** Mas Hendra butuh uang untuk biaya kuliah Dinda, kan? Bagaimana kalau sawah tidak dijual, hasil panennya kita bagi, dan Mas meminjam dulu dari tabungan kelompok tani yang Yudi kelola?\n>\n> **YUDI:** *(pelan)* Saya … bisa bicarakan dengan kelompok.\n>\n> **HENDRA:** *(lama menatap sawah di kejauhan)* Aku malu. Aku datang membawa pembeli, kalian membawa jalan keluar."],"questions":[{"n":1,"type":"PG","level":"L1","stem":"Keterangan yang ditulis miring di dalam tanda kurung, seperti *(menatap ke arah pintu)*, disebut ….","extra":[],"options":["dialog","prolog","petunjuk lakuan (kramagung)","epilog"],"statements":null,"answer":["C"],"explain":"Keterangan dalam kurung yang mengatur gerak, mimik, atau suasana disebut petunjuk lakuan atau kramagung. **(C)**","passage":0},{"n":2,"type":"PG","level":"L2","stem":"Tokoh yang berperan sebagai penengah (tritagonis) dalam penggalan drama tersebut adalah ….","extra":[],"options":["Rina","Sinta","Bima","Dodi"],"statements":null,"answer":["B"],"explain":"Sinta mencegah tuduhan (\"Jangan asal tuduh\") dan memberi jalan keluar (memeriksa tas kecil). Itulah peran penengah. **(B)**","passage":0},{"n":3,"type":"KAT","level":"L2","stem":"Tentukan benar atau salah setiap pernyataan berikut berdasarkan penggalan drama.","extra":[],"options":null,"statements":["Konflik dipicu oleh prasangka Bima terhadap Dodi.","Uang kas ternyata diambil oleh Dodi.","Latar tempat dan waktu drama adalah ruang kelas saat jam istirahat.","Petunjuk lakuan \"(menggaruk kepala, lalu mendekati Dodi)\" menunjukkan Bima merasa canggung dan menyesal."],"answer":["B","S","B","B"],"explain":"(1) Benar, Bima langsung menuduh Dodi. (2) Salah, uangnya ada di tas kecil Rina. (3) Benar, sesuai petunjuk di awal. (4) Benar, gerak menggaruk kepala menunjukkan rasa canggung, dan ia lalu meminta maaf. **(B, S, B, B)**","passage":0},{"n":4,"type":"PG","level":"L3","stem":"Perubahan watak Bima dari awal hingga akhir penggalan drama adalah ….","extra":[],"options":["awalnya mudah berprasangka, lalu berani mengakui kesalahan","sejak awal hingga akhir bijaksana","pemarah dan tidak mau meminta maaf","penakut dan pendiam"],"statements":null,"answer":["A"],"explain":"Bima mula-mula menuduh tanpa bukti, tetapi pada akhir drama ia mendekati Dodi dan meminta maaf. **(A)**","passage":0},{"n":5,"type":"PGK","level":"L3","stem":"Pilih **semua** amanat yang sesuai dengan penggalan drama tersebut.","extra":[],"options":["Jangan menuduh orang lain tanpa bukti.","Periksalah dahulu sebelum mengambil kesimpulan.","Orang yang tidak membawa uang jajan patut dicurigai.","Beranilah meminta maaf ketika berbuat salah.","Bendahara kelas tidak perlu teliti."],"statements":null,"answer":["A","B","D"],"explain":"A, B, dan D tergambar dari kejadian dan ucapan Dodi \"Lain kali tanya dulu\". C adalah prasangka yang justru dikritik. E bertentangan dengan pesan cerita. **(A, B, D)**","passage":0},{"n":6,"type":"PG","level":"L3","stem":"Ucapan Nenek \"Nenek belum menuangkannya ke piringmu\" menunjukkan bahwa ….","extra":[],"options":["Nenek lupa menyiapkan makanan","Nenek menyindir Andi yang menjawab tanpa memperhatikan","Nenek marah besar kepada Andi","Nenek tidak suka sayur lodeh"],"statements":null,"answer":["B"],"explain":"Andi menjawab \"enak\" padahal lodeh belum dituang ke piringnya. Ucapan Nenek menyindir Andi yang tidak memperhatikan karena sibuk dengan ponsel. **(B)**","passage":1},{"n":7,"type":"PG","level":"L3","stem":"Tindakan Ayah meletakkan ponselnya terbalik walaupun lampu sudah menyala menunjukkan bahwa ….","extra":[],"options":["ponsel Ayah rusak","baterai ponsel Ayah sudah habis","Ayah tersadar dan memilih memberi perhatian kepada keluarganya","Ayah marah kepada Tari"],"statements":null,"answer":["C"],"explain":"Ayah tidak lagi terpaksa mematikan ponsel karena baterai atau listrik. Ia sengaja menelungkupkan ponsel setelah sadar bahwa ia tidak tahu kabar baik anaknya. **(C)**","passage":1},{"n":8,"type":"PGK","level":"L2","stem":"Pilih **semua** pernyataan yang tepat tentang unsur drama \"Lampu Padam\".","extra":[],"options":["Latar waktunya malam hari.","Lilin di tengah meja dapat dimaknai sebagai simbol kebersamaan.","Konflik utamanya adalah kurangnya komunikasi dalam keluarga akibat ponsel.","Nenek digambarkan berwatak pemarah.","Drama berakhir dengan pertengkaran keluarga."],"statements":null,"answer":["A","B","C"],"explain":"A, B, dan C tepat. D salah, Nenek justru menyindir dengan lembut dan mengajak bercerita. E salah, drama berakhir dengan kesadaran Ayah. **(A, B, C)**","passage":1},{"n":9,"type":"PG","level":"L2","stem":"Tema penggalan drama \"Lampu Padam\" adalah ….","extra":[],"options":["pemadaman listrik di kota","makanan khas desa","prestasi Matematika seorang siswa","pentingnya kebersamaan dan komunikasi dalam keluarga"],"statements":null,"answer":["D"],"explain":"Seluruh adegan menunjukkan keluarga yang baru benar-benar berbicara ketika ponsel dimatikan. **(D)**","passage":1},{"n":10,"type":"KAT","level":"L3","stem":"Tentukan benar atau salah setiap pernyataan berikut berdasarkan penggalan drama.","extra":[],"options":null,"statements":["Tari mendapat nilai seratus untuk ulangan Matematika.","Ucapan Tari \"Ayah sedang sibuk\" mengandung kritik halus terhadap Ayah.","Ibu menolak mematikan ponselnya.","Nenek menyalakan lampu darurat ketika listrik padam."],"answer":["B","B","S","S"],"explain":"(1) Benar, sesuai ucapan Tari. (2) Benar, Tari tidak bercerita karena Ayah selalu sibuk. (3) Salah, Ibu justru mengajak mematikan ponsel. (4) Salah, Nenek menyalakan lilin. **(B, B, S, S)**","passage":1},{"n":11,"type":"PG","level":"L1","stem":"Bagian \"Prolog\" pada awal penggalan drama berfungsi untuk ….","extra":[],"options":["memberi gambaran awal tentang latar dan masalah yang akan dihadapi tokoh","menutup cerita dengan kesimpulan","menyampaikan dialog antartokoh","menjelaskan nasib tokoh setelah cerita berakhir"],"statements":null,"answer":["A"],"explain":"Prolog adalah bagian pembuka yang memberi gambaran latar (kemarau, sumur) dan masalah sebelum dialog dimulai. Penutup disebut epilog. **(A)**","passage":2},{"n":12,"type":"PG","level":"L2","stem":"Konflik utama dalam penggalan drama tersebut adalah pertentangan antara ….","extra":[],"options":["Pak Kades dan Gilang","kekhawatiran Pak Darsa akan sumurnya dan kebutuhan warga akan air","Bu Warni dan anak-anaknya","warga desa dan pemerintah kabupaten"],"statements":null,"answer":["B"],"explain":"Pak Darsa khawatir sumurnya kering atau rusak, sedangkan warga sangat membutuhkan air. **(B)**","passage":2},{"n":13,"type":"PGK","level":"L3","stem":"Pilih **semua** pernyataan yang tepat tentang peran tokoh.","extra":[],"options":["Pak Kades berperan sebagai penengah.","Gilang menawarkan jalan keluar atas kekhawatiran Pak Darsa.","Bu Warni mewakili warga yang membutuhkan air.","Pak Darsa sama sekali tidak mau berkompromi hingga akhir.","Gilang menolak usul Pak Kades."],"statements":null,"answer":["A","B","C"],"explain":"A, B, dan C tepat. D salah, Pak Darsa akhirnya setuju. E salah, Gilang justru mendukung usul giliran dengan menawarkan jaminan. **(A, B, C)**","passage":2},{"n":14,"type":"PG","level":"L3","stem":"Pak Darsa akhirnya mengizinkan warga mengambil air karena ….","extra":[],"options":["dipaksa oleh Pak Kades","diberi uang oleh warga","kekhawatirannya dijawab dengan aturan giliran dan jaminan perawatan dari para pemuda","takut kepada Bu Warni"],"statements":null,"answer":["C"],"explain":"Dua kekhawatiran Pak Darsa terjawab: sumur bisa kering (dijawab dengan giliran dua ember) dan sumur bisa rusak (dijawab dengan jaminan pemuda). **(C)**","passage":2},{"n":15,"type":"PG","level":"L3","stem":"Bagian \"(Warga bertepuk tangan. Bu Warni menyalami Pak Darsa dengan mata berkaca-kaca.)\" termasuk tahap ….","extra":[],"option
