0: 2n + 5m = 250. Substitusi n = 80 − m: 160 + 3m = 250, m = 30. **(A)**","passage":null},{"n":8,"type":"PGK","level":"L2","stem":"Pilih **semua** pasangan (x, y) yang memenuhi persamaan 2x + y = 8.","extra":[],"options":["(0, 8)","(3, 2)","(4, 1)","(−1, 10)"],"statements":null,"answer":["A","B","D"],"explain":"A: 0 + 8 = 8. B: 6 + 2 = 8. C: 8 + 1 = 9. D: −2 + 10 = 8. **(A, B, D)**","passage":null},{"n":9,"type":"PG","level":"L3","stem":"Lima tahun yang lalu umur ayah 7 kali umur anaknya. Lima tahun yang akan datang umur ayah 3 kali umur anaknya. Umur ayah sekarang adalah ....","extra":[],"options":["35 tahun","40 tahun","45 tahun","50 tahun"],"statements":null,"answer":["B"],"explain":"Ayah a, anak c: a − 5 = 7(c − 5) dan a + 5 = 3(c + 5). Jadi a = 7c − 30 dan a = 3c + 10. 7c − 30 = 3c + 10, c = 10, a = 40 tahun. **(B)**","passage":null},{"n":10,"type":"KAT","level":"L3","stem":"Diketahui SPLDV 3x + 2y = 12 dan 6x + 4y = k. Tentukan Benar atau Salah untuk setiap pernyataan.","extra":[],"options":null,"statements":["Jika k = 24, SPLDV itu mempunyai tak hingga banyak penyelesaian.","Jika k = 20, SPLDV itu tidak mempunyai penyelesaian.","Grafik kedua persamaan memiliki gradien yang sama.","Untuk k = 24, pasangan (3, 2) adalah salah satu penyelesaiannya."],"answer":["B","B","B","S"],"explain":"Persamaan kedua adalah 2 kali persamaan pertama jika k = 24, jadi garisnya berimpit (1 benar). Jika k = 20, garisnya sejajar tidak berimpit (2 benar). Gradien keduanya −3/2 (3 benar). (3, 2): 9 + 4 = 13 ≠ 12 (4 salah). **(B, B, B, S)**","passage":null},{"n":11,"type":"PG","level":"L2","stem":"Diketahui x + 2y = 8 dan 3x − 2y = 8. Nilai y adalah ....","extra":[],"options":["4","3","2","1"],"statements":null,"answer":["C"],"explain":"Jumlahkan: 4x = 16, x = 4. Lalu 4 + 2y = 8, y = 2. **(C)**","passage":null},{"n":12,"type":"PG","level":"L3","stem":"Keliling sebuah persegi panjang 46 cm. Panjangnya 5 cm lebih dari dua kali lebarnya. Luas persegi panjang itu adalah ....","extra":[],"options":["96 cm²","120 cm²","84 cm²","102 cm²"],"statements":null,"answer":["D"],"explain":"p + l = 23 dan p = 2l + 5. 3l + 5 = 23, l = 6, p = 17. Luas = 102 cm². **(D)**","passage":null},{"n":13,"type":"PGK","level":"L3","stem":"Sebuah perahu menempuh 36 km searah arus sungai dalam 2 jam, lalu kembali menempuh 36 km melawan arus dalam 3 jam. Pilih **semua** pernyataan yang benar.","extra":[],"options":["Kecepatan perahu di air tenang 15 km/jam.","Kecepatan arus sungai 3 km/jam.","Di air tenang, perahu itu menempuh 36 km dalam 2,4 jam.","Kecepatan arus sungai 6 km/jam."],"statements":null,"answer":["A","B","C"],"explain":"Searah arus: v + a = 36 : 2 = 18. Melawan arus: v − a = 36 : 3 = 12. v = 15 km/jam, a = 3 km/jam (A, B benar; D salah). 36 : 15 = 2,4 jam (C benar). **(A, B, C)**","passage":null},{"n":14,"type":"PG","level":"L2","stem":"Diketahui y = 2x − 1 dan 3x + y = 14. Nilai x + y adalah ....","extra":[],"options":["8","7","9","10"],"statements":null,"answer":["A"],"explain":"3x + 2x − 1 = 14, 5x = 15, x = 3, y = 5. x + y = 8. **(A)**","passage":null},{"n":15,"type":"PG","level":"L3","stem":"Jika pembilang sebuah pecahan ditambah 1, nilainya menjadi 1/2. Jika penyebutnya ditambah 3, nilainya menjadi 1/3. Pecahan itu adalah ....","extra":[],"options":["4/9","3/8","5/12","5/11"],"statements":null,"answer":["C"],"explain":"Pecahan a/b: (a + 1)/b = 1/2 memberi b = 2a + 2; a/(b + 3) = 1/3 memberi b = 3a − 3. 2a + 2 = 3a − 3, a = 5, b = 12. Pecahan 5/12. **(C)**","passage":null},{"n":16,"type":"KAT","level":"L3","stem":"Sebuah toko kue membuat kue A dan kue B. Satu kue A memerlukan 2 butir telur dan 100 g mentega. Satu kue B memerlukan 3 butir telur dan 50 g mentega. Tersedia 30 butir telur dan 1.100 g mentega, dan semua bahan itu habis terpakai. Misalkan a = banyak kue A dan b = banyak kue B. Tentukan Benar atau Salah untuk setiap pernyataan.","extra":[],"options":null,"statements":["Model masalahnya 2a + 3b = 30 dan 100a + 50b = 1.100.","Banyak kue A yang dibuat 9 buah.","Banyak kue B yang dibuat 5 buah.","Banyak kue seluruhnya 13 buah."],"answer":["B","B","S","B"],"explain":"Model (1) benar. Sederhanakan: 2a + 3b = 30 dan 2a + b = 22. Kurangkan: 2b = 8, b = 4, a = 9 (2 benar, 3 salah). Total 9 + 4 = 13 (4 benar). **(B, B, S, B)**","passage":null},{"n":17,"type":"PG","level":"L2","stem":"Diketahui 4x + 3y = 25 dan 2x + 3y = 17. Nilai x − y adalah ....","extra":[],"options":["7","1","−1","2"],"statements":null,"answer":["B"],"explain":"Kurangkan: 2x = 8, x = 4. 8 + 3y = 17, y = 3. x − y = 1. **(B)**","passage":null},{"n":18,"type":"PG","level":"L2","stem":"Uang Rina Rp10.000 lebih banyak daripada uang Sari. Jumlah uang mereka Rp70.000. Uang Sari adalah ....","extra":[],"options":["Rp30.000","Rp40.000","Rp35.000","Rp25.000"],"statements":null,"answer":["A"],"explain":"r = s + 10.000 dan r + s = 70.000. 2s + 10.000 = 70.000, s = Rp30.000. **(A)**","passage":null},{"n":19,"type":"PGK","level":"L3","stem":"Bayu menyelesaikan SPLDV x + y = 7 dan 2x − y = 5. Ia menjumlahkan kedua persamaan sehingga 3x = 12 dan x = 4, lalu menulis y = 7 + 4 = 11. Pilih **semua** pernyataan yang benar.","extra":[],"options":["Nilai x = 4 sudah benar.","Nilai y yang benar adalah 3.","Bayu salah ketika menyubstitusikan x ke persamaan pertama.","Pasangan (4, 11) memenuhi persamaan 2x − y = 5."],"statements":null,"answer":["A","B","C"],"explain":"x = 4 benar (A). Seharusnya y = 7 − 4 = 3 (B), Bayu menjumlahkan padahal harus mengurangkan (C). (4, 11): 8 − 11 = −3, bukan 5 (D salah). **(A, B, C)**","passage":null},{"n":20,"type":"PG","level":"L3","stem":"Sebuah celengan berisi 40 koin yang terdiri atas koin Rp500 dan Rp1.000. Jumlah nilai uangnya Rp27.000. Banyak koin Rp500 adalah ....","extra":[],"options":["14","20","24","26"],"statements":null,"answer":["D"],"explain":"a + b = 40 dan 500a + 1.000b = 27.000, atau a + 2b = 54. Kurangkan: b = 14, a = 26. **(D)**","passage":null},{"n":21,"type":"KAT","level":"L3","stem":"Sebuah warung menjual dua paket. Paket A berisi 2 porsi nasi dan 1 gelas teh seharga Rp27.000. Paket B berisi 1 porsi nasi dan 2 gelas teh seharga Rp21.000. Tentukan Benar atau Salah untuk setiap pernyataan.","extra":[],"options":null,"statements":["Harga 1 porsi nasi Rp11.000.","Harga 1 gelas teh Rp6.000.","Harga 3 porsi nasi dan 3 gelas teh Rp48.000.","Paket A Rp6.000 lebih mahal daripada paket B."],"answer":["B","S","B","B"],"explain":"2n + t = 27.000 dan n + 2t = 21.000. Jumlahkan: 3(n + t) = 48.000, n + t = 16.000. Kurangkan: n − t = 6.000. Jadi n = 11.000 dan t = 5.000 (1 benar, 2 salah). 3(n + t) = 48.000 (3 benar). 27.000 − 21.000 = 6.000 (4 benar). **(B, S, B, B)**","passage":null},{"n":22,"type":"PG","level":"L2","stem":"Titik potong garis y = x + 1 dan y = −2x + 7 adalah ....","extra":[],"options":["(3, 2)","(1, 2)","(2, 3)","(2, 5)"],"statements":null,"answer":["C"],"explain":"x + 1 = −2x + 7, 3x = 6, x = 2, y = 3. **(C)**","passage":null},{"n":23,"type":"PG","level":"L2","stem":"Pasangan (a, b) adalah penyelesaian dari 5x − 2y = 11 dan x + 2y = 1. Nilai a + b adalah ....","extra":[],"options":["2","2,5","1","1,5"],"statements":null,"answer":["D"],"explain":"Jumlahkan: 6x = 12, x = 2. 2 + 2y = 1, y = −1/2. a + b = 2 − 0,5 = 1,5. **(D)**","passage":null},{"n":24,"type":"PGK","level":"L2","stem":"Pilih **semua** persamaan yang merupakan persamaan linear dua variabel.","extra":[],"options":["2x + 3y = 6","x² + y = 4","y = 5x","3x − 7 = 2"],"statements":null,"answer":["A","C"],"explain":"A dan C berpangkat satu dengan dua variabel. B memuat x². D hanya satu variabel. **(A, C)**","passage":null},{"n":25,"type":"PG","level":"L3","stem":"Tarif taksi terdiri atas biaya awal tetap ditambah biaya per km. Untuk jarak 5 km penumpang membayar Rp32.000, dan untuk jarak 12 km membayar Rp63.500. Biaya untuk jarak 20 km adalah ....","extra":[],"options":["Rp90.000","Rp99.500","Rp104.000","Rp95.000"],"statements":null,"answer":["B"],"explain":"Selisih 7 km = 63.500 − 32.000 = 31.500, jadi per km Rp4.500. Biaya awal = 32.000 − 5 × 4.500 = 9.500. Untuk 20 km: 9.500 + 90.000 = Rp99.500. **(B)**","passage":null},{"n":26,"type":"KAT","level":"L3","stem":"SPLDV ax + by = 10 dan bx + ay = 8 mempunyai penyelesaian x = 2 dan y = 1. Tentukan Benar atau Salah untuk setiap pernyataan.","extra":[],"options":null,"statements":["Nilai a = 4.","Nilai b = 3.","Nilai a × b = 6.","Persamaan kedua menjadi 2x + 4y = 8."],"answer":["B","S","S","B"],"explain":"Substitusi (2, 1): 2a + b = 10 dan 2b + a = 8. Dari kedua persamaan: a = 4, b = 2 (1 benar, 2 salah). a × b = 8 (3 salah). Persamaan kedua: 2x + 4y = 8 (4 benar). **(B, S, S, B)**","passage":null},{"n":27,"type":"PG","level":"L2","stem":"Diketahui 3x − y = 5 dan x + y = 7. Nilai 2x + y adalah ....","extra":[],"options":["9","11","10","13"],"statements":null,"answer":["C"],"explain":"Jumlahkan: 4x = 12, x = 3, y = 4. 2x + y = 10. **(C)**","passage":null},{"n":28,"type":"PG","level":"L3","stem":"Kopi jenis A seharga Rp80.000 per kg dicampur dengan kopi jenis B seharga Rp120.000 per kg. Hasilnya 10 kg kopi campuran seharga Rp96.000 per kg. Banyak kopi jenis A dalam campuran itu adalah ....","extra":[],"options":["4 kg","6 kg","5 kg","7 kg"],"statements":null,"answer":["B"],"explain":"a + b = 10 dan 80a + 120b = 960 (dalam ribuan). Sederhanakan: 2a + 3b = 24. Substitusi a = 10 − b: 20 + b = 24, b = 4, a = 6 kg. **(B)**","passage":null},{"n":29,"type":"PGK","level":"L3","stem":"Jumlah angka-angka sebuah bilangan dua angka adalah 9. Jika kedua angkanya ditukar, bilangan baru 27 lebih besar daripada bilangan semula. Pilih **semua** pernyataan yang benar.","extra":[],"options":["Bilangan semula adalah 36.","Angka puluhan bilangan semula adalah 6.","Bilangan setelah angkanya ditukar adalah 63.","Bilangan semula habis dibagi 9."],"statements":null,"answer":["A","C","D"],"explain":"Bilangan 10p + s: p + s = 9 dan (10s + p) − (10p + s) = 27, jadi s − p = 3. p = 3, s = 6: bilangan 36 (A), puluhannya 3 (B salah), ditukar menjadi 63 (C), 36 habis dibagi 9 (D). **(A, C, D)**","passage":null},{"n":30,"type":"PG","level":"L3","stem":"Harga 3 kg apel dan 2 kg jeruk Rp95.000. Harga 2 kg apel dan 3 kg jeruk Rp80.000. Harga 1 kg apel dan 1 kg jeruk adalah ....","extra":[],"options":["Rp30.000","Rp40.000","Rp17.500","Rp35.000"],"statements":null,"answer":["D"],"explain":"Jumlahkan kedua persamaan: 5 apel + 5 jeruk = 175.000, jadi 1 apel + 1 jeruk = Rp35.000. **(D)**","passage":null}]},{"id":"MTK09","title":"MTK 09 · Persamaan dan Fungsi Kuadrat","intro":"Materi: bentuk umum persamaan kuadrat, menentukan akar dengan pemfaktoran, melengkapkan kuadrat sempurna, dan rumus ABC, diskriminan dan jenis akar, jumlah dan hasil kali akar, grafik fungsi kuadrat (titik potong, sumbu simetri, titik puncak), serta nilai maksimum dan minimum dalam masalah kontekstual.","passages":[],"questions":[{"n":1,"type":"PG","level":"L1","stem":"Akar-akar persamaan x² − 9 = 0 adalah ....","extra":[],"options":["3 saja","−3 dan 3","−9 dan 9","0 dan 9"],"statements":null,"answer":["B"],"explain":"x² = 9, jadi x = 3 atau x = −3. **(B)**","passage":null},{"n":2,"type":"PG","level":"L2","stem":"Penyelesaian dari x² − 5x + 6 = 0 adalah ....","extra":[],"options":["−2 dan −3","1 dan 6","2 dan 3","−1 dan 6"],"statements":null,"answer":["C"],"explain":"(x − 2)(x − 3) = 0, jadi x = 2 atau x = 3. **(C)**","passage":null},{"n":3,"type":"KAT","level":"L3","stem":"Perhatikan grafik fungsi kuadrat f berikut.","extra":["[[FIG:ff3dbbc4-59f3|Grafik fungsi kuadrat f]]","Tentukan Benar atau Salah untuk setiap pernyataan."],"options":null,"statements":["Grafik f memotong sumbu-x di titik (−1, 0) dan (3, 0).","Titik puncak grafik f adalah (1, −4).","Sumbu simetri grafik f adalah garis x = 2.","Grafik f memotong sumbu-y di titik (0, 3)."],"answer":["B","B","S","S"],"explain":"Dari grafik, titik potong sumbu-x (−1, 0) dan (3, 0) (1 benar), titik puncak (1, −4) (2 benar). Sumbu simetri melalui puncak, yaitu x = 1 (3 salah). Grafik memotong sumbu-y di (0, −3) (4 salah). Grafik ini adalah y = x² − 2x − 3. **(B, B, S, S)**","passage":null},{"n":4,"type":"PG","level":"L2","stem":"Persamaan sumbu simetri grafik y = 2x² − 8x + 5 adalah ....","extra":[],"options":["x = 2","x = −2","x = 4","x = 8"],"statements":null,"answer":["A"],"explain":"x = −b/(2a) = 8/4 = 2. **(A)**","passage":null},{"n":5,"type":"PGK","level":"L3","stem":"Pilih **semua** persamaan yang salah satu akarnya x = −2.","extra":[],"options":["x² + 5x + 6 = 0","x² − 4 = 0","x² + 2x = 0","x² − x − 2 = 0"],"statements":null,"answer":["A","B","C"],"explain":"A: (x + 2)(x + 3) = 0. B: x = ±2. C: x(x + 2) = 0. D: (x − 2)(x + 1) = 0, akarnya 2 dan −1. **(A, B, C)**","passage":null},{"n":6,"type":"PG","level":"L2","stem":"Nilai diskriminan dan jenis akar persamaan 3x² − 4x + 2 = 0 adalah ....","extra":[],"options":["40; dua akar real berbeda","8; dua akar real berbeda","−8; dua akar real kembar","−8; tidak mempunyai akar real"],"statements":null,"answer":["D"],"explain":"D = b² − 4ac = 16 − 24 = −8. D < 0 berarti tidak ada akar real. **(D)**","passage":null},{"n":7,"type":"PG","level":"L3","stem":"Sebuah bola dilempar vertikal ke atas. Tingginya setelah t detik adalah h(t) = 20t − 5t² meter. Tinggi maksimum bola adalah ....","extra":[],"options":["40 m","20 m","15 m","25 m"],"statements":null,"answer":["B"],"explain":"Puncak pada t = −b/(2a) = −20/(−10) = 2 detik. h(2) = 40 − 20 = 20 m. **(B)**","passage":null},{"n":8,"type":"PGK","level":"L2","stem":"Pilih **semua** yang merupakan persamaan kuadrat.","extra":[],"options":["x² − 3x = 0","2x + 5 = 0","(x − 1)² = 4","x³ − x = 0"],"statements":null,"answer":["A","C"],"explain":"Persamaan kuadrat berpangkat tertinggi 2. A dan C (x² − 2x + 1 = 4). B linear, D berpangkat 3. **(A, C)**","passage":null},{"n":9,"type":"PG","level":"L3","stem":"Sebuah persegi panjang memiliki panjang (x + 3) cm dan lebar x cm. Luasnya 40 cm². Keliling persegi panjang itu adalah ....","extra":[],"options":["13 cm","30 cm","26 cm","40 cm"],"statements":null,"answer":["C"],"explain":"x(x + 3) = 40, x² + 3x − 40 = 0, (x + 8)(x − 5) = 0, x = 5 (panjang tidak negatif). Ukuran 8 cm × 5 cm, keliling 26 cm. **(C)**","passage":null},{"n":10,"type":"KAT","level":"L3","stem":"Diketahui persamaan kuadrat x² − 6x + k = 0. Tentukan Benar atau Salah untuk setiap pernyataan.","extra":[],"options":null,"statements":["Jika k = 9, persamaan itu mempunyai dua akar kembar.","Jika k = 5, akar-akarnya 1 dan 5.","Jika k = 10, persamaan itu tidak mempunyai akar real.","Jumlah akar-akarnya bergantung pada nilai k."],"answer":["B","B","B","S"],"explain":"k = 9: D = 36 − 36 = 0, akar kembar (1 benar). k = 5: (x − 1)(x − 5) = 0 (2 benar). k = 10: D = 36 − 40 < 0 (3 benar). Jumlah akar = −b/a = 6, tidak bergantung pada k (4 salah). **(B, B, B, S)**","passage":null},{"n":11,"type":"PG","level":"L2","stem":"Persamaan x² + 8x + 7 = 0 diubah dengan melengkapkan kuadrat sempurna menjadi (x + 4)² = p. Nilai p adalah ....","extra":[],"options":["7","16","23","9"],"statements":null,"answer":["D"],"explain":"x² + 8x = −7. Tambahkan 16 pada kedua ruas: (x + 4)² = 9. **(D)**","passage":null},{"n":12,"type":"PG","level":"L3","stem":"Dengan rumus ABC, akar-akar persamaan 2x² − 3x − 1 = 0 adalah ....","extra":[],"options":["x = (3 ± √17)/4","x = (−3 ± √17)/4","x = (3 ± 1)/4","x = (3 ± √17)/2"],"statements":null,"answer":["A"],"explain":"a = 2, b = −3, c = −1. D = 9 + 8 = 17. x = (3 ± √17)/4. **(A)**","passage":null},{"n":13,"type":"PGK","level":"L3","stem":"Diketahui f(x) = −x² + 4x + 5. Pilih **semua** pernyataan yang benar.","extra":[],"options":["Grafiknya terbuka ke bawah.","Nilai maksimum fungsi itu 9.","Grafiknya memotong sumbu-x di (−1, 0) dan (5, 0).","Grafiknya memotong sumbu-y di (0, −5)."],"statements":null,"answer":["A","B","C"],"explain":"a = −1 < 0, terbuka ke bawah (A). Puncak x = 2, f(2) = −4 + 8 + 5 = 9 (B). −x² + 4x + 5 = 0 sama dengan (x − 5)(x + 1) = 0 (C). f(0) = 5, jadi memotong sumbu-y di (0, 5) (D salah). **(A, B, C)**","passage":null},{"n":14,"type":"PG","level":"L2","stem":"Diketahui f(x) = 2x² − x + 1. Nilai f(−3) adalah ....","extra":[],"options":["16","22","20","14"],"statements":null,"answer":["B"],"explain":"f(−3) = 2(9) + 3 + 1 = 22. **(B)**","passage":null},{"n":15,"type":"PG","level":"L3","stem":"Hasil kali dua bilangan asli berurutan adalah 156. Jumlah kedua bilangan itu adalah ....","extra":[],"options":["23","27","25","26"],"statements":null,"answer":["C"],"explain":"n(n + 1) = 156, n² + n − 156 = 0, (n − 12)(n + 13) = 0, n = 12. Bilangannya 12 dan 13, jumlahnya 25. **(C)**","passage":null},{"n":16,"type":"KAT","level":"L3","stem":"Pak Hadi memagari kebun berbentuk persegi panjang di samping tembok rumah dengan kawat 40 m. Sisi yang menempel tembok tidak dipagari. Lebar kebun (sisi yang tegak lurus tembok) x m, sehingga luasnya L(x) = x(40 − 2x). Tentukan Benar atau Salah untuk setiap pernyataan.","extra":[],"options":null,"statements":["L(x) = 40x − 2x².","Luas maksimum dicapai saat x = 10.","Luas maksimum kebun itu 200 m².","Luas kebun untuk x = 15 lebih besar daripada untuk x = 8."],"answer":["B","B","B","S"],"explain":"x(40 − 2x) = 40x − 2x² (1 benar). Puncak x = 40/4 = 10 (2 benar). L(10) = 10 × 20 = 200 m² (3 benar). L(15) = 150 dan L(8) = 192, jadi x = 15 lebih kecil (4 salah). **(B, B, B, S)**","passage":null},{"n":17,"type":"PG","level":"L2","stem":"Persamaan kuadrat yang akar-akarnya 4 dan −1 adalah ....","extra":[],"options":["x² + 3x − 4 = 0","x² − 5x + 4 = 0","x² − 3x − 4 = 0","x² + 3x + 4 = 0"],"statements":null,"answer":["C"],"explain":"(x − 4)(x + 1) = x² − 3x − 4. **(C)**","passage":null},{"n":18,"type":"PG","level":"L2","stem":"Titik puncak grafik f(x) = x² − 6x + 8 adalah ....","extra":[],"options":["(3, −1)","(−3, −1)","(3, 8)","(6, 8)"],"statements":null,"answer":["A"],"explain":"x = 6/2 = 3, f(3) = 9 − 18 + 8 = −1. Puncak (3, −1). **(A)**","passage":null},{"n":19,"type":"PGK","level":"L3","stem":"Dewi menyelesaikan x² = 5x dengan membagi kedua ruas dengan x, sehingga ia memperoleh x = 5. Pilih **semua** pernyataan yang benar.","extra":[],"options":["x = 5 merupakan salah satu penyelesaian.","Dewi kehilangan penyelesaian x = 0.","Cara yang tepat: x² − 5x = 0, lalu x(x − 5) = 0.","Persamaan itu hanya mempunyai satu penyelesaian."],"statements":null,"answer":["A","B","C"],"explain":"Membagi dengan x tidak boleh karena x bisa 0. x(x − 5) = 0 memberi x = 0 atau x = 5, jadi ada dua penyelesaian. **(A, B, C)**","passage":null},{"n":20,"type":"PG","level":"L3","stem":"Akar-akar persamaan x² − 7x + 10 = 0 adalah α dan β. Nilai α² + β² adalah ....","extra":[],"options":["49","69","39","29"],"statements":null,"answer":["D"],"explain":"α + β = 7 dan αβ = 10. α² + β² = 7² − 2 × 10 = 29. **(D)**","passage":null},{"n":21,"type":"KAT","level":"L3","stem":"Laba sebuah usaha (dalam ribu rupiah) dari penjualan x barang dinyatakan dengan L(x) = −x² + 40x − 300. Tentukan Benar atau Salah untuk setiap pernyataan.","extra":[],"options":null,"statements":["Laba maksimum diperoleh saat terjual 20 barang.","Laba maksimumnya Rp100.000.","Jika terjual 10 barang, usaha itu rugi.","Usaha itu untung jika banyak barang yang terjual lebih dari 10 dan kurang dari 30."],"answer":["B","B","S","B"],"explain":"Puncak x = 40/2 = 20 (1 benar), L(20) = −400 + 800 − 300 = 100 ribu (2 benar). L(10) = −100 + 400 − 300 = 0, impas, tidak rugi (3 salah). L(x) = −(x − 10)(x − 30) positif untuk 10 < x < 30 (4 benar). **(B, B, S, B)**","passage":null},{"n":22,"type":"PG","level":"L2","stem":"Akar-akar persamaan 2x² + 7x + 3 = 0 adalah ....","extra":[],"options":["1/2 dan 3","−1/2 dan −3","−1 dan −3/2","1/2 dan −3"],"statements":null,"answer":["B"],"explain":"(2x + 1)(x + 3) = 0, jadi x = −1/2 atau x = −3. **(B)**","passage":null},{"n":23,"type":"PG","level":"L2","stem":"Grafik y = x² + 2x − 8 memotong sumbu-y di titik ....","extra":[],"options":["(−8, 0)","(0, 8)","(0, −8)","(2, 0)"],"statements":null,"answer":["C"],"explain":"Memotong sumbu-y saat x = 0: y = −8. **(C)**","passage":null},{"n":24,"type":"PGK","level":"L2","stem":"Pilih **semua** nilai x yang memenuhi (x − 2)² = 9.","extra":[],"options":["5","−1","1","11"],"statements":null,"answer":["A","B"],"explain":"x − 2 = 3 atau x − 2 = −3, jadi x = 5 atau x = −1. **(A, B)**","passage":null},{"n":25,"type":"PG","level":"L3","stem":"Sebuah kolam berbentuk persegi bersisi 12 m dikelilingi jalan setapak yang lebarnya sama di semua sisi. Luas jalan setapak itu 52 m². Lebar jalan setapak adalah ....","extra":[],"options":["2 m","1,5 m","4 m","1 m"],"statements":null,"answer":["D"],"explain":"Lebar jalan a: (12 + 2a)² − 144 = 52, (12 + 2a)² = 196, 12 + 2a = 14, a = 1 m. **(D)**","passage":null},{"n":26,"type":"KAT","level":"L3","stem":"Diketahui fungsi f(x) = x² − 4x + c. Tentukan Benar atau Salah untuk setiap pernyataan.","extra":[],"options":null,"statements":["Sumbu simetri grafiknya x = 2, berapa pun nilai c.","Jika c = 4, grafiknya memotong sumbu-x di dua titik berbeda.","Jika c = 3, grafiknya memotong sumbu-x di x = 1 dan x = 3.","Jika c = 7, nilai minimum fungsinya 7."],"answer":["B","S","B","S"],"explain":"Sumbu simetri x = 4/2 = 2 (1 benar). c = 4: (x − 2)², menyinggung di satu titik (2 salah). c = 3: (x − 1)(x − 3) (3 benar). Nilai minimum f(2) = 4 − 8 + 7 = 3 (4 salah). **(B, S, B, S)**","passage":null},{"n":27,"type":"PG","level":"L2","stem":"Salah satu akar persamaan x² + px − 12 = 0 adalah 3. Nilai p adalah ....","extra":[],"options":["1","−1","4","−4"],"statements":null,"answer":["A"],"explain":"9 + 3p − 12 = 0, 3p = 3, p = 1. **(A)**","passage":null},{"n":28,"type":"PG","level":"L3","stem":"Sebuah batu dijatuhkan dari ketinggian 80 m. Tingginya setelah t detik adalah h(t) = 80 − 5t² meter. Batu itu sampai di tanah setelah ....","extra":[],"options":["16 detik","4 detik","8 detik","2 detik"],"statements":null,"answer":["B"],"explain":"80 − 5t² = 0, t² = 16, t = 4 detik. **(B)**","passage":null},{"n":29,"type":"PGK","level":"L3","stem":"Pilih **semua** persamaan yang mempunyai dua akar real berbeda.","extra":[],"options":["x² − 4x + 4 = 0","x² + x − 1 = 0","2x² + 3x + 5 = 0","x² − 2 = 0"],"statements":null,"answer":["B","D"],"explain":"A: D = 0 (kembar). B: D = 1 + 4 = 5 > 0. C: D = 9 − 40 < 0. D: D = 8 > 0. **(B, D)**","passage":null},{"n":30,"type":"PG","level":"L3","stem":"Grafik sebuah fungsi kuadrat melalui titik (0, 3) dan mempunyai titik puncak (2, −1). Rumus fungsi itu adalah ....","extra":[],"options":["y = x² + 4x + 3","y = −x² + 4x + 3","y = x² − 4x − 1","y = x² − 4x + 3"],"statements":null,"answer":["D"],"explain":"Bentuk puncak: y = a(x − 2)² − 1. Melalui (0, 3): 3 = 4a − 1, a = 1. y = x² − 4x + 4 − 1 = x² − 4x + 3. **(D)**","passage":null}]},{"id":"MTK10","title":"MTK 10 · Sudut, Garis Sejajar, Segitiga, dan Teorema Pythagoras","intro":"Materi: hubungan antarsudut (berpelurus, berpenyiku, bertolak belakang), sudut pada dua garis sejajar yang dipotong garis lain, jumlah sudut dan sudut luar segitiga, ketaksamaan segitiga, teorema Pythagoras dan tripel Pythagoras, jenis segitiga berdasarkan sisi, segitiga siku-siku istimewa, serta jarak dua titik dan masalah kontekstual.","passages":[],"questions":[{"n":1,"type":"PG","level":"L1","stem":"Pelurus sudut 65° adalah ....","extra":[],"options":["25°","115°","125°","295°"],"statements":null,"answer":["B"],"explain":"Sudut berpelurus berjumlah 180°: 180° − 65° = 115°. **(B)**","passage":null},{"n":2,"type":"PG","level":"L2","stem":"Besar sudut-sudut sebuah segitiga adalah (2x)°, (3x)°, dan (4x)°. Besar sudut terbesarnya adalah ....","extra":[],"options":["60°","90°","80°","100°"],"statements":null,"answer":["C"],"explain":"2x + 3x + 4x = 180, x = 20. Sudut terbesar 4 × 20 = 80°. **(C)**","passage":null},{"n":3,"type":"KAT","level":"L3","stem":"Perhatikan gambar berikut. Garis k sejajar garis l.","extra":["[[FIG:8021c3eb-d347|Garis k ∥ l dipotong garis m di titik P dan Q]]","Tentukan Benar atau Salah untuk setiap pernyataan."],"options":null,"statements":["Sudut di P dan sudut di Q yang ditandai merupakan pasangan sudut dalam berseberangan.","Nilai x = 30.","Besar sudut (2x + 10)° adalah 70°.","Pelurus sudut (3x − 20)° besarnya 120°."],"answer":["B","B","B","S"],"explain":"Sudut di P (kanan garis m, di antara k dan l) dan sudut di Q (kiri garis m, di antara k dan l) adalah sudut dalam berseberangan, jadi sama besar (1 benar). 3x − 20 = 2x + 10, x = 30 (2 benar). 2(30) + 10 = 70° (3 benar). Pelurusnya 180° − 70° = 110° (4 salah). **(B, B, B, S)**","passage":null},{"n":4,"type":"PG","level":"L2","stem":"Panjang sisi-sisi siku-siku sebuah segitiga siku-siku adalah 9 cm dan 12 cm. Panjang sisi miringnya adalah ....","extra":[],"options":["15 cm","21 cm","13 cm","18 cm"],"statements":null,"answer":["A"],"explain":"√(9² + 12²) = √(81 + 144) = √225 = 15 cm. **(A)**","passage":null},{"n":5,"type":"PGK","level":"L3","stem":"Pilih **semua** kelompok bilangan yang merupakan tripel Pythagoras.","extra":[],"options":["5, 12, 13","8, 15, 17","6, 8, 11","7, 24, 25"],"statements":null,"answer":["A","B","D"],"explain":"25 + 144 = 169; 64 + 225 = 289; 36 + 64 = 100 ≠ 121; 49 + 576 = 625. **(A, B, D)**","passage":null},{"n":6,"type":"PG","level":"L2","stem":"Dua sudut dalam sebuah segitiga besarnya 50° dan 65°. Besar sudut luar pada titik sudut ketiga adalah ....","extra":[],"options":["65°","125°","50°","115°"],"statements":null,"answer":["D"],"explain":"Sudut luar = jumlah dua sudut dalam yang tidak bersisian: 50° + 65° = 115°. **(D)**","passage":null},{"n":7,"type":"PG","level":"L3","stem":"Sebuah tangga sepanjang 5 m bersandar pada tembok. Kaki tangga berjarak 1,4 m dari tembok. Tinggi ujung atas tangga dari lantai adalah ....","extra":[],"options":["4,8 m","3,6 m","5,2 m","4,6 m"],"statements":null,"answer":["A"],"explain":"Tinggi = √(5² − 1,4²) = √(25 − 1,96) = √23,04 = 4,8 m. **(A)**","passage":null},{"n":8,"type":"PGK","level":"L2","stem":"Dua garis sejajar dipotong oleh sebuah garis lain. Pilih **semua** pasangan sudut yang selalu sama besar.","extra":[],"options":["Sudut sehadap","Sudut dalam berseberangan","Sudut dalam sepihak","Sudut luar berseberangan"],"statements":null,"answer":["A","B","D"],"explain":"Sudut sehadap, dalam berseberangan, dan luar berseberangan sama besar. Sudut dalam sepihak berjumlah 180°, tidak selalu sama besar. **(A, B, D)**","passage":null},{"n":9,"type":"PG","level":"L3","stem":"Sebuah segitiga sama kaki memiliki panjang kaki 13 cm dan alas 10 cm. Luas segitiga itu adalah ....","extra":[],"options":["65 cm²","120 cm²","60 cm²","130 cm²"],"statements":null,"answer":["C"],"explain":"Tinggi = √(13² − 5²) = 12 cm. Luas = 1/2 × 10 × 12 = 60 cm². **(C)**","passage":null},{"n":10,"type":"KAT","level":"L3","stem":"Sebuah segitiga memiliki panjang sisi 6 cm, 8 cm, dan 10 cm. Tentukan Benar atau Salah untuk setiap pernyataan.","extra":[],"options":null,"statements":["Segitiga itu adalah segitiga siku-siku.","Luas segitiga itu 30 cm².","Sudut terbesar segitiga itu berhadapan dengan sisi 10 cm.","Segitiga dengan sisi 6 cm, 8 cm, dan 11 cm juga segitiga siku-siku."],"answer":["B","S","B","S"],"explain":"36 + 64 = 100, jadi siku-siku (1 benar). Luas = 1/2 × 6 × 8 = 24 cm², bukan 30 (2 salah). Sudut terbesar (90°) berhadapan dengan sisi terpanjang (3 benar). 36 + 64 = 100 < 121, jadi segitiga 6, 8, 11 tumpul (4 salah). **(B, S, B, S)**","passage":null},{"n":11,"type":"PG","level":"L2","stem":"Segitiga dengan panjang sisi 5 cm, 6 cm, dan 8 cm termasuk segitiga ....","extra":[],"options":["lancip","siku-siku","tumpul","sama kaki"],"statements":null,"answer":["C"],"explain":"Sisi terpanjang 8: 8² = 64 > 5² + 6² = 61, jadi segitiga tumpul. **(C)**","passage":null},{"n":12,"type":"PG","level":"L3","stem":"Sebuah kapal berlayar 12 km ke utara, lalu 16 km ke timur. Jarak kapal dari titik keberangkatan adalah ....","extra":[],"options":["28 km","20 km","24 km","4 km"],"statements":null,"answer":["B"],"explain":"Jarak = √(12² + 16²) = √400 = 20 km. **(B)**","passage":null},{"n":13,"type":"PGK","level":"L3","stem":"Sudut A dan sudut B saling berpenyiku. Besar sudut A sama dengan 15° lebih dari dua kali sudut B. Pilih **semua** pernyataan yang benar.","extra":[],"options":["Besar sudut B adalah 25°.","Besar sudut A adalah 65°.","Pelurus sudut A besarnya 115°.","Penyiku sudut B besarnya 75°."],"statements":null,"answer":["A","B","C"],"explain":"A + B = 90 dan A = 2B + 15. 3B + 15 = 90, B = 25°, A = 65°. Pelurus A = 115°. Penyiku B = 65°, bukan 75°. **(A, B, C)**","passage":null},{"n":14,"type":"PG","level":"L2","stem":"Sebuah persegi panjang berukuran 24 cm × 7 cm. Panjang diagonalnya adalah ....","extra":[],"options":["31 cm","17 cm","26 cm","25 cm"],"statements":null,"answer":["D"],"explain":"√(24² + 7²) = √(576 + 49) = √625 = 25 cm. **(D)**","passage":null},{"n":15,"type":"PG","level":"L3","stem":"Besar sudut terkecil yang dibentuk jarum jam dan jarum menit pada pukul 04.30 adalah ....","extra":[],"options":["30°","45°","60°","75°"],"statements":null,"answer":["B"],"explain":"Jarum menit di angka 6 (180°). Jarum jam bergerak 30° per jam, jadi pada pukul 04.30 berada di 4,5 × 30° = 135°. Selisihnya 45°. **(B)**","passage":null},{"n":16,"type":"KAT","level":"L3","stem":"Sebuah segitiga siku-siku memiliki sudut 30° dan 60°, dengan panjang sisi miring 10 cm. Tentukan Benar atau Salah untuk setiap pernyataan.","extra":[],"options":null,"statements":["Sisi di depan sudut 30° panjangnya 5 cm.","Sisi di depan sudut 60° panjangnya 5√3 cm.","Keliling segitiga itu (15 + 5√3) cm.","Luas segitiga itu 25√3 cm²."],"answer":["B","B","B","S"],"explain":"Pada segitiga 30°-60°-90°, perbandingan sisi 1 : √3 : 2. Sisi di depan 30° = 5 cm (1), di depan 60° = 5√3 cm (2). Keliling 10 + 5 + 5√3 = 15 + 5√3 (3). Luas = 1/2 × 5 × 5√3 = 12,5√3 cm² (4 salah). **(B, B, B, S)**","passage":null},{"n":17,"type":"PG","level":"L2","stem":"Panjang sisi miring segitiga siku-siku sama kaki yang sisi siku-sikunya 6 cm adalah ....","extra":[],"options":["12 cm","6√3 cm","6√2 cm","36 cm"],"statements":null,"answer":["C"],"explain":"√(6² + 6²) = √72 = 6√2 cm. **(C)**","passage":null},{"n":18,"type":"PG","level":"L2","stem":"Dua sudut yang saling bertolak belakang besarnya (3x + 10)° dan (5x − 30)°. Nilai x adalah ....","extra":[],"options":["20","10","25","40"],"statements":null,"answer":["A"],"explain":"Sudut bertolak belakang sama besar: 3x + 10 = 5x − 30, x = 20. **(A)**","passage":null},{"n":19,"type":"PGK","level":"L3","stem":"Pilih **semua** pernyataan yang benar tentang segitiga.","extra":[],"options":["Jumlah besar ketiga sudut dalam segitiga 180°.","Sebuah segitiga dapat memiliki dua sudut tumpul.","Besar sudut luar sama dengan jumlah dua sudut dalam yang tidak bersisian dengannya.","Setiap sudut segitiga sama sisi besarnya 60°."],"statements":null,"answer":["A","C","D"],"explain":"A, C, dan D benar. Dua sudut tumpul saja sudah lebih dari 180°, jadi B salah. **(A, C, D)**","passage":null},{"n":20,"type":"PG","level":"L3","stem":"Panjang diagonal-diagonal sebuah belah ketupat 16 cm dan 12 cm. Keliling belah ketupat itu adalah ....","extra":[],"options":["28 cm","48 cm","20 cm","40 cm"],"statements":null,"answer":["D"],"explain":"Diagonal belah ketupat berpotongan tegak lurus dan saling membagi dua: sisi = √(8² + 6²) = 10 cm. Keliling = 40 cm. **(D)**","passage":null},{"n":21,"type":"KAT","level":"L3","stem":"Diketahui titik A(1, 2) dan B(7, 10) pada bidang koordinat. Tentukan Benar atau Salah untuk setiap pernyataan.","extra":[],"options":null,"statements":["Jarak titik A ke titik B adalah 10 satuan.","Selisih absis kedua titik adalah 6.","Titik tengah ruas garis AB adalah (3, 4).","Jarak titik A ke titik asal O(0, 0) adalah √5 satuan."],"answer":["B","B","S","B"],"explain":"AB = √(6² + 8²) = 10 (1 benar), selisih absis 7 − 1 = 6 (2 benar). Titik tengah ((1 + 7)/2, (2 + 10)/2) = (4, 6) (3 salah). OA = √(1 + 4) = √5 (4 benar). **(B, B, S, B)**","passage":null},{"n":22,"type":"PG","level":"L2","stem":"Dua garis sejajar dipotong garis lain sehingga terbentuk sepasang sudut dalam sepihak yang besarnya (2x + 20)° dan (x + 40)°. Nilai x adalah ....","extra":[],"options":["20","60","40","50"],"statements":null,"answer":["C"],"explain":"Sudut dalam sepihak berjumlah 180°: 3x + 60 = 180, x = 40. **(C)**","passage":null},{"n":23,"type":"PG","level":"L2","stem":"Tinggi segitiga sama sisi yang panjang sisinya 8 cm adalah ....","extra":[],"options":["8√3 cm","4 cm","4√2 cm","4√3 cm"],"statements":null,"answer":["D"],"explain":"Tinggi = √(8² − 4²) = √48 = 4√3 cm. **(D)**","passage":null},{"n":24,"type":"PGK","level":"L2","stem":"Pilih **semua** kelompok panjang ruas garis yang dapat membentuk segitiga.","extra":[],"options":["3 cm, 4 cm, 8 cm","5 cm, 5 cm, 9 cm","2 cm, 3 cm, 5 cm","6 cm, 7 cm, 12 cm"],"statements":null,"answer":["B","D"],"explain":"Syarat: jumlah dua sisi terpendek lebih dari sisi terpanjang. A: 7 < 8. B: 10 > 9. C: 5 = 5 (tidak). D: 13 > 12. **(B, D)**","passage":null},{"n":25,"type":"PG","level":"L3","stem":"Seorang anak menerbangkan layang-layang dengan benang sepanjang 50 m yang terentang lurus. Jarak mendatar dari anak ke titik tepat di bawah layang-layang 30 m. Tangan anak berada 1,5 m di atas tanah. Tinggi layang-layang dari tanah adalah ....","extra":[],"options":["40 m","41,5 m","58,3 m","38,5 m"],"statements":null,"answer":["B"],"explain":"Tinggi layang-layang dari tangan = √(50² − 30²) = 40 m. Ditambah tinggi tangan: 41,5 m. **(B)**","passage":null},{"n":26,"type":"KAT","level":"L3","stem":"Diketahui persegi panjang ABCD dengan AB = 15 cm dan BC = 8 cm. Tentukan Benar atau Salah untuk setiap pernyataan.","extra":[],"options":null,"statements":["Panjang diagonal AC adalah 17 cm.","Luas segitiga ABC adalah 60 cm².","Jarak titik B ke diagonal AC adalah 120/17 cm.","Keliling segitiga ABC adalah 38 cm."],"answer":["B","B","B","S"],"explain":"AC = √(225 + 64) = 17 (1 benar). Luas ABC = 1/2 × 15 × 8 = 60 (2 benar). Jarak B ke AC = 2 × luas : AC = 120/17 (3 benar). Keliling = 15 + 8 + 17 = 40 cm (4 salah). **(B, B, B, S)**","passage":null},{"n":27,"type":"PG","level":"L2","stem":"Penyiku sudut 34° adalah ....","extra":[],"options":["56°","146°","66°","34°"],"statements":null,"answer":["A"],"explain":"90° − 34° = 56°. **(A)**","passage":null},{"n":28,"type":"PG","level":"L3","stem":"Pada segitiga ABC, besar sudut luar di titik C adalah 120°, dan besar ∠A tiga kali besar ∠B. Besar ∠A adalah ....","extra":[],"options":["30°","90°","60°","120°"],"statements":null,"answer":["B"],"explain":"∠A + ∠B = sudut luar di C = 120°. 3∠B + ∠B = 120°, ∠B = 30°, ∠A = 90°. **(B)**","passage":null},{"n":29,"type":"PGK","level":"L3","stem":"Rani mencari panjang sisi siku-siku sebuah segitiga siku-siku yang sisi miringnya 13 cm dan sisi siku-siku lainnya 5 cm. Ia menulis √(13² + 5²) = √194. Pilih **semua** pernyataan yang benar.","extra":[],"options":["Rani seharusnya mengurangkan, bukan menjumlahkan.","Panjang sisi yang dicari 12 cm.","Hasil Rani lebih panjang daripada sisi miring, sehingga pasti salah.","Rumus yang benar untuk sisi siku-siku a adalah a = √(c² + b²)."],"statements":null,"answer":["A","B","C"],"explain":"Sisi siku-siku = √(13² − 5²) = √144 = 12 cm. √194 ≈ 13,9 lebih panjang dari sisi miring, padahal sisi miring selalu terpanjang. D salah karena tandanya harus minus. **(A, B, C)**","passage":null},{"n":30,"type":"PG","level":"L3","stem":"Sebuah tiang bendera setinggi 8 m ditahan oleh 4 utas tali dari ujung atas tiang ke tanah. Setiap tali menyentuh tanah pada jarak 6 m dari kaki tiang. Panjang tali seluruhnya paling sedikit ....","extra":[],"options":["10 m","56 m","48 m","40 m"],"statements":null,"answer":["D"],"explain":"Satu tali = √(8² + 6²) = 10 m. Empat tali = 40 m. **(D)**","passage":null}]},{"id":"MTK11","title":"MTK 11 · Kesebangunan, Kekongruenan, dan Transformasi","intro":"Materi: syarat bangun sebangun dan kongruen, segitiga sebangun (termasuk garis sejajar sisi dan segitiga siku-siku dengan garis tinggi), perbandingan keliling dan luas, penerapan kesebangunan (bayangan, model, foto), serta transformasi geometri: translasi, refleksi, rotasi, dan dilatasi pada bidang koordinat.","passages":[],"questions":[{"n":1,"type":"PG","level":"L1","stem":"Bayangan titik (3, −2) oleh translasi (4, 5) adalah ....","extra":[],"options":["(7, 3)","(−1, −7)","(7, −7)","(12, −10)"],"statements":null,"answer":["A"],"explain":"(3 + 4, −2 + 5) = (7, 3). **(A)**","passage":null},{"n":2,"type":"PG","level":"L2","stem":"Bayangan titik (−4, 1) oleh refleksi terhadap sumbu-y adalah ....","extra":[],"options":["(−4, −1)","(4, 1)","(4, −1)","(1, −4)"],"statements":null,"answer":["B"],"explain":"Refleksi terhadap sumbu-y: (x, y) menjadi (−x, y). Hasilnya (4, 1). **(B)**","passage":null},{"n":3,"type":"KAT","level":"L3","stem":"Perhatikan gambar berikut.","extra":["[[FIG:0a79ca9d-dd1c|Segitiga ABC dengan DE ∥ BC]]","Tentukan Benar atau Salah untuk setiap pernyataan."],"options":null,"statements":["Segitiga ADE sebangun dengan segitiga ABC.","Nilai x = 9.","Perbandingan luas segitiga ADE dan segitiga ABC adalah 4 : 25.","Jika AE = 5 cm, maka EC = 7,5 cm."],"answer":["B","S","B","B"],"explain":"DE ∥ BC sehingga segitiga ADE sebangun dengan ABC (1 benar). AD/AB = DE/BC: 4/10 = 6/x, x = 15, bukan 9 (2 salah). Perbandingan luas = (4/10)² = 4/25 (3 benar). AE/AC = 2/5, jadi AC = 12,5 cm dan EC = 7,5 cm (4 benar). **(B, S, B, B)**","passage":null},{"n":4,"type":"PG","level":"L2","stem":"Sebuah foto berukuran 20 cm × 30 cm (lebar × tinggi) ditempel pada karton yang sebangun dengan foto. Lebar karton di sebelah kiri, kanan, dan atas foto masing-masing 2 cm. Lebar karton di bawah foto adalah ....","extra":[],"options":["2 cm","3 cm","4 cm","6 cm"],"statements":null,"answer":["C"],"explain":"Lebar karton 2 + 20 + 2 = 24 cm. Sebangun: tinggi karton = 24 × 30/20 = 36 cm. Sisa bawah = 36 − 2 − 30 = 4 cm. **(C)**","passage":null},{"n":5,"type":"PGK","level":"L3","stem":"Pilih **semua** pasangan bangun yang pasti sebangun.","extra":[],"options":["Dua persegi","Dua persegi panjang","Dua segitiga sama sisi","Dua lingkaran"],"statements":null,"answer":["A","C","D"],"explain":"Persegi, segitiga sama sisi, dan lingkaran selalu sebangun karena bentuknya tetap, hanya ukurannya yang berbeda. Dua persegi panjang belum tentu sebangun (misalnya 1 × 2 dan 1 × 5). **(A, C, D)**","passage":null},{"n":6,"type":"PG","level":"L2","stem":"Pada saat yang sama, bayangan sebuah tiang 6 m dan bayangan seorang anak setinggi 1,2 m adalah 1,5 m. Tinggi tiang itu adalah ....","extra":[],"options":["7,5 m","3,6 m","5,4 m","4,8 m"],"statements":null,"answer":["D"],"explain":"Tinggi/bayangan sama: t/6 = 1,2/1,5, t = 4,8 m. **(D)**","passage":null},{"n":7,"type":"PG","level":"L3","stem":"Bayangan titik (2, 5) oleh rotasi 90° berlawanan arah jarum jam dengan pusat O(0, 0) adalah ....","extra":[],"options":["(5, −2)","(−2, −5)","(−5, 2)","(2, −5)"],"statements":null,"answer":["C"],"explain":"Rotasi 90° berlawanan arah jarum jam: (x, y) menjadi (−y, x). (2, 5) menjadi (−5, 2). **(C)**","passage":null},{"n":8,"type":"PGK","level":"L2","stem":"Pilih **semua** syarat yang cukup untuk menyatakan dua segitiga kongruen.","extra":[],"options":["Ketiga pasang sisi yang bersesuaian sama panjang (sisi, sisi, sisi).","Ketiga pasang sudut yang bersesuaian sama besar (sudut, sudut, sudut).","Dua pasang sisi dan sudut apitnya sama (sisi, sudut, sisi).","Dua pasang sudut dan sisi di antaranya sama (sudut, sisi, sudut)."],"statements":null,"answer":["A","C","D"],"explain":"Sisi-sisi-sisi, sisi-sudut-sisi, dan sudut-sisi-sudut menjamin kongruen. Sudut-sudut-sudut hanya menjamin sebangun. **(A, C, D)**","passage":null},{"n":9,"type":"PG","level":"L3","stem":"Sebuah persegi panjang berukuran 3 cm × 5 cm didilatasi dengan faktor skala 3. Luas bayangannya adalah ....","extra":[],"options":["45 cm²","135 cm²","15 cm²","405 cm²"],"statements":null,"answer":["B"],"explain":"Ukuran bayangan 9 cm × 15 cm, luas 135 cm² (atau 15 × 3² = 135). **(B)**","passage":null},{"n":10,"type":"KAT","level":"L3","stem":"Segitiga ABC kongruen dengan segitiga PQR. Diketahui AB = PQ, ∠A = ∠P = 50°, dan ∠B = ∠Q = 70°. Tentukan Benar atau Salah untuk setiap pernyataan.","extra":[],"options":null,"statements":["Besar ∠R adalah 60°.","BC = QR.","AC = PQ.","Luas kedua segitiga sama."],"answer":["B","B","S","B"],"explain":"∠R = ∠C = 180° − 50° − 70° = 60° (1 benar). Sisi bersesuaian: BC = QR (2 benar), AC = PR, bukan PQ (3 salah). Segitiga kongruen memiliki luas sama (4 benar). **(B, B, S, B)**","passage":null},{"n":11,"type":"PG","level":"L2","stem":"Bayangan titik (6, −3) oleh dilatasi dengan pusat O(0, 0) dan faktor skala −2 adalah ....","extra":[],"options":["(12, −6)","(−12, 6)","(3, −1,5)","(−3, 1,5)"],"statements":null,"answer":["B"],"explain":"(−2 × 6, −2 × (−3)) = (−12, 6). **(B)**","passage":null},{"n":12,"type":"PG","level":"L3","stem":"Segitiga ABC siku-siku di A. Garis AD tegak lurus BC dengan D pada BC. Jika BD = 4 cm dan DC = 9 cm, panjang AD adalah ....","extra":[],"options":["6 cm","13 cm","36 cm","6,5 cm"],"statements":null,"answer":["A"],"explain":"Segitiga ABD sebangun dengan CAD, sehingga AD² = BD × DC = 36, AD = 6 cm. **(A)**","passage":null},{"n":13,"type":"PGK","level":"L3","stem":"Translasi T memetakan titik A(2, 3) ke A'(−1, 7). Pilih **semua** pernyataan yang benar.","extra":[],"options":["Translasi itu adalah T = (−3, 4).","Bayangan titik B(5, 0) oleh T adalah (2, 4).","Jarak AA' adalah 5 satuan.","Translasi mengubah ukuran bangun."],"statements":null,"answer":["A","B","C"],"explain":"T = (−1 − 2, 7 − 3) = (−3, 4) (A). B(5, 0) menjadi (2, 4) (B). Jarak = √(9 + 16) = 5 (C). Translasi hanya menggeser, ukuran tetap (D salah). **(A, B, C)**","passage":null},{"n":14,"type":"PG","level":"L2","stem":"Sebuah model mobil panjangnya 18 cm dan tingginya 6 cm. Panjang mobil sebenarnya 4,5 m. Tinggi mobil sebenarnya adalah ....","extra":[],"options":["1,2 m","2 m","1,5 m","1,8 m"],"statements":null,"answer":["C"],"explain":"Faktor skala = 450 cm : 18 cm = 25. Tinggi = 6 × 25 = 150 cm = 1,5 m. **(C)**","passage":null},{"n":15,"type":"PG","level":"L3","stem":"Titik (3, −1) direfleksikan terhadap garis y = x, lalu hasilnya direfleksikan terhadap sumbu-x. Bayangan akhirnya adalah ....","extra":[],"options":["(1, 3)","(−3, 1)","(3, 1)","(−1, −3)"],"statements":null,"answer":["D"],"explain":"Refleksi terhadap y = x: (3, −1) menjadi (−1, 3). Refleksi terhadap sumbu-x: (−1, 3) menjadi (−1, −3). **(D)**","passage":null},{"n":16,"type":"KAT","level":"L3","stem":"Persegi panjang P berukuran 6 cm × 9 cm dan persegi panjang Q berukuran 8 cm × 12 cm. Tentukan Benar atau Salah untuk setiap pernyataan.","extra":[],"options":null,"statements":["Persegi panjang P dan Q sebangun.","Faktor skala dari P ke Q adalah 4/3.","Perbandingan keliling P dan Q adalah 3 : 4.","Perbandingan luas P dan Q adalah 3 : 4."],"answer":["B","B","B","S"],"explain":"6/8 = 9/12 = 3/4, jadi sebangun (1) dengan faktor skala P ke Q = 4/3 (2). Perbandingan keliling = perbandingan sisi = 3 : 4 (3). Perbandingan luas = 3² : 4² = 9 : 16 (4 salah). **(B, B, B, S)**","passage":null},{"n":17,"type":"PG","level":"L2","stem":"Bayangan garis y = 2x + 1 oleh translasi (0, 3) adalah ....","extra":[],"options":["y = 2x − 2","y = 2x + 4","y = 2x + 7","y = 5x + 1"],"statements":null,"answer":["B"],"explain":"Translasi (0, 3) menggeser grafik 3 satuan ke atas: y = 2x + 1 + 3 = 2x + 4. **(B)**","passage":null},{"n":18,"type":"PG","level":"L2","stem":"Pada segitiga ABC, titik D terletak pada AB dan titik E pada AC sehingga DE sejajar BC. Jika AD = 3 cm, AB = 12 cm, dan AE = 4 cm, panjang AC adalah ....","extra":[],"options":["16 cm","12 cm","9 cm","13 cm"],"statements":null,"answer":["A"],"explain":"AD/AB = AE/AC: 3/12 = 4/AC, AC = 16 cm. **(A)**","passage":null},{"n":19,"type":"PGK","level":"L3","stem":"Lina berkata, \"Dua segitiga yang ketiga pasang sudutnya sama besar pasti kongruen.\" Pilih **semua** pernyataan yang benar.","extra":[],"options":["Pendapat Lina salah.","Kedua segitiga itu pasti sebangun.","Contoh penyangkalnya: segitiga sama sisi bersisi 2 cm dan segitiga sama sisi bersisi 5 cm.","Kedua segitiga itu pasti memiliki luas yang sama."],"statements":null,"answer":["A","B","C"],"explain":"Sudut-sudut sama hanya menjamin sebangun, tidak kongruen (A, B benar). Contoh C tepat. Luasnya bisa berbeda (D salah). **(A, B, C)**","passage":null},{"n":20,"type":"PG","level":"L3","stem":"Persegi ABCD dengan titik A(2, 4) didilatasi dengan pusat O(0, 0) sehingga bayangan titik A adalah A'(5, 10). Jika luas ABCD 16 cm², luas bayangannya adalah ....","extra":[],"options":["40 cm²","100 cm²","64 cm²","80 cm²"],"statements":null,"answer":["B"],"explain":"Faktor skala k = 5/2 = 2,5. Luas bayangan = 16 × 2,5² = 16 × 6,25 = 100 cm². **(B)**","passage":null},{"n":21,"type":"KAT","level":"L3","stem":"Titik P(4, −3) dirotasi 180° dengan pusat O(0, 0) menghasilkan P'. Tentukan Benar atau Salah untuk setiap pernyataan.","extra":[],"options":null,"statements":["Koordinat P' adalah (−4, 3).","Rotasi 180° dengan pusat O sama hasilnya dengan pencerminan terhadap titik O.","Jarak O ke P' adalah 5 satuan.","Rotasi titik P sebesar 90° searah jarum jam dengan pusat O menghasilkan (3, 4)."],"answer":["B","B","B","S"],"explain":"Rotasi 180°: (x, y) menjadi (−x, −y) = (−4, 3) (1 benar), sama dengan pencerminan terhadap titik O (2 benar). OP' = √(16 + 9) = 5 (3 benar). Rotasi 90° searah jarum jam: (x, y) menjadi (y, −x) = (−3, −4), bukan (3, 4) (4 salah). **(B, B, B, S)**","passage":null},{"n":22,"type":"PG","level":"L2","stem":"Segitiga ABC kongruen dengan segitiga DEF, dengan A bersesuaian dengan D, B dengan E, dan C dengan F. Jika ∠A = 45° dan ∠E = 75°, besar ∠F adalah ....","extra":[],"options":["75°","45°","60°","105°"],"statements":null,"answer":["C"],"explain":"∠B = ∠E = 75°. ∠F = ∠C = 180° − 45° − 75° = 60°. **(C)**","passage":null},{"n":23,"type":"PG","level":"L2","stem":"Bayangan titik (5, 2) oleh refleksi terhadap garis x = 1 adalah ....","extra":[],"options":["(−5, 2)","(5, 0)","(7, 2)","(−3, 2)"],"statements":null,"answer":["D"],"explain":"Jarak titik ke garis x = 1 adalah 4 satuan ke kanan, jadi bayangannya 4 satuan ke kiri: x = 1 − 4 = −3. Hasilnya (−3, 2). **(D)**","passage":null},{"n":24,"type":"PGK","level":"L2","stem":"Pilih **semua** transformasi yang selalu menghasilkan bayangan yang kongruen dengan bangun semula.","extra":[],"options":["Translasi","Refleksi","Rotasi","Dilatasi dengan faktor skala 2"],"statements":null,"answer":["A","B","C"],"explain":"Translasi, refleksi, dan rotasi tidak mengubah bentuk dan ukuran. Dilatasi faktor 2 mengubah ukuran. **(A, B, C)**","passage":null},{"n":25,"type":"PG","level":"L3","stem":"Pada saat yang sama, sebuah tongkat setinggi 2 m memiliki bayangan 1,5 m, sedangkan bayangan sebuah gedung 24 m. Tinggi gedung itu adalah ....","extra":[],"options":["18 m","36 m","32 m","28 m"],"statements":null,"answer":["C"],"explain":"t/24 = 2/1,5, t = 32 m. **(C)**","passage":null},{"n":26,"type":"KAT","level":"L3","stem":"Trapesium ABCD memiliki AB sejajar DC dengan AB = 18 cm dan DC = 6 cm. Diagonal AC dan BD berpotongan di titik O. Tentukan Benar atau Salah untuk setiap pernyataan.","extra":[],"options":null,"statements":["Segitiga OAB sebangun dengan segitiga OCD.","Jika OC = 4 cm, maka OA = 12 cm.","Perbandingan luas segitiga OCD dan segitiga OAB adalah 1 : 3.","Jika tinggi trapesium 8 cm, jarak titik O ke sisi DC adalah 2 cm."],"answer":["B","B","S","B"],"explain":"AB ∥ DC sehingga segitiga OAB sebangun dengan OCD, faktor 18 : 6 = 3 (1 benar). OA = 3 × OC = 12 (2 benar). Perbandingan luas 1² : 3² = 1 : 9 (3 salah). Tinggi terbagi 1 : 3, jarak O ke DC = 8 × 1/4 = 2 cm (4 benar). **(B, B, S, B)**","passage":null},{"n":27,"type":"PG","level":"L2","stem":"Bayangan titik A(−2, 3) oleh dilatasi dengan pusat O(0, 0) dan faktor skala 3 adalah ....","extra":[],"options":["(−6, 9)","(1, 6)","(−2/3, 1)","(6, −9)"],"statements":null,"answer":["A"],"explain":"(3 × (−2), 3 × 3) = (−6, 9). **(A)**","passage":null},{"n":28,"type":"PG","level":"L3","stem":"Pada segitiga PQR, titik S terletak pada PQ dan titik T pada PR sehingga ST sejajar QR. Diketahui PS = 8 cm, SQ = 12 cm, dan ST = 10 cm. Panjang QR adalah ....","extra":[],"options":["15 cm","22 cm","30 cm","25 cm"],"statements":null,"answer":["D"],"explain":"PQ = 20 cm. PS/PQ = ST/QR: 8/20 = 10/QR, QR = 25 cm. **(D)**","passage":null},{"n":29,"type":"PGK","level":"L3","stem":"Pilih **semua** titik yang tidak berpindah tempat ketika direfleksikan terhadap garis y = x.","extra":[],"options":["(2, 2)","(−3, −3)","(0, 0)","(1, −1)"],"statements":null,"answer":["A","B","C"],"explain":"Refleksi terhadap y = x menukar koordinat: (a, b) menjadi (b, a). Titik tetap jika a = b. (1, −1) menjadi (−1, 1). **(A, B, C)**","passage":null},{"n":30,"type":"PG","level":"L3","stem":"Segitiga dengan titik sudut (0, 0), (4, 0), dan (0, 3) didilatasi dengan pusat O(0, 0) dan faktor skala 2, lalu ditranslasi (1, 1). Luas bayangan akhirnya adalah ....","extra":[],"options":["24 satuan luas","12 satuan luas","6 satuan luas","48 satuan luas"],"statements":null,"answer":["A"],"explain":"Luas awal = 1/2 × 4 × 3 = 6. Dilatasi faktor 2 mengalikan luas dengan 4 menjadi 24. Translasi tidak mengubah luas. **(A)**","passage":null}]},{"id":"MTK12","title":"MTK 12 · Lingkaran dan Bangun Ruang Sisi Datar","intro":"Materi: unsur lingkaran, keliling dan luas lingkaran, panjang busur dan luas juring, sudut pusat dan sudut keliling, segi empat tali busur, garis singgung lingkaran, serta unsur, luas permukaan, dan volume kubus, balok, prisma, dan limas dalam konteks sehari-hari. Gunakan π = 22/7 atau 3,14 sesuai soal.","passages":[],"questions":[{"n":1,"type":"PG","level":"L1","stem":"Keliling lingkaran yang berjari-jari 7 cm adalah .... (π = 22/7)","extra":[],"options":["22 cm","44 cm","154 cm","88 cm"],"statements":null,"answer":["B"],"explain":"K = 2 × 22/7 × 7 = 44 cm. **(B)**","passage":null},{"n":2,"type":"PG","level":"L2","stem":"Luas juring dengan sudut pusat 90° pada lingkaran berjari-jari 14 cm adalah .... (π = 22/7)","extra":[],"options":["154 cm²","308 cm²","44 cm²","616 cm²"],"statements":null,"answer":["A"],"explain":"Luas lingkaran = 22/7 × 14 × 14 = 616 cm². Juring 90° = 1/4 × 616 = 154 cm². **(A)**","passage":null},{"n":3,"type":"KAT","level":"L3","stem":"Perhatikan gambar berikut.","extra":["[[FIG:3007cd16-25f5|Lingkaran berpusat O dengan ∠AOB = 110°]]","Tentukan Benar atau Salah untuk setiap pernyataan."],"options":null,"statements":["∠ACB adalah sudut keliling yang menghadap busur AB yang sama dengan sudut pusat ∠AOB.","Besar ∠ACB adalah 55°.","Setiap sudut keliling lain yang menghadap busur AB yang sama juga besarnya 55°.","Segitiga AOB adalah segitiga sama sisi."],"answer":["B","B","B","S"],"explain":"∠ACB dan ∠AOB menghadap busur AB yang sama (1 benar). Sudut keliling = 1/2 sudut pusat = 55° (2 benar), dan semua sudut keliling yang menghadap busur yang sama besarnya sama (3 benar). OA = OB (jari-jari) tetapi sudut puncaknya 110°, jadi segitiga AOB sama kaki, bukan sama sisi (4 salah). **(B, B, B, S)**","passage":null},{"n":4,"type":"PG","level":"L2","stem":"Volume balok berukuran 12 cm × 8 cm × 5 cm adalah ....","extra":[],"options":["400 cm³","520 cm³","480 cm³","240 cm³"],"statements":null,"answer":["C"],"explain":"V = 12 × 8 × 5 = 480 cm³. **(C)**","passage":null},{"n":5,"type":"PGK","level":"L3","stem":"Pilih **semua** pernyataan yang benar tentang prisma segi enam.","extra":[],"options":["Banyak sisinya 8.","Banyak rusuknya 18.","Banyak titik sudutnya 12.","Banyak sisi tegaknya 8."],"statements":null,"answer":["A","B","C"],"explain":"Prisma segi-n memiliki n + 2 sisi, 3n rusuk, dan 2n titik sudut. Untuk n = 6: 8 sisi, 18 rusuk, 12 titik sudut. Sisi tegaknya 6, bukan 8. **(A, B, C)**","passage":null},{"n":6,"type":"PG","level":"L2","stem":"Luas permukaan kubus dengan panjang rusuk 9 cm adalah ....","extra":[],"options":["729 cm²","324 cm²","54 cm²","486 cm²"],"statements":null,"answer":["D"],"explain":"LP = 6 × 9² = 6 × 81 = 486 cm². **(D)**","passage":null},{"n":7,"type":"PG","level":"L3","stem":"Sebuah akuarium berbentuk balok berukuran 60 cm × 40 cm × 50 cm berisi air 3/4 bagian. Volume air dalam akuarium itu adalah ....","extra":[],"options":["120 liter","90 liter","60 liter","900 liter"],"statements":null,"answer":["B"],"explain":"Volume akuarium = 60 × 40 × 50 = 120.000 cm³. Air = 3/4 × 120.000 = 90.000 cm³ = 90 liter. **(B)**","passage":null},{"n":8,"type":"PGK","level":"L2","stem":"Pilih **semua** pernyataan yang benar tentang lingkaran.","extra":[],"options":["Panjang diameter sama dengan dua kali jari-jari.","Tali busur terpanjang adalah diameter.","Apotema adalah ruas garis dari pusat yang tegak lurus tali busur.","Besar sudut keliling sama dengan dua kali sudut pusat yang menghadap busur yang sama."],"statements":null,"answer":["A","B","C"],"explain":"A, B, dan C benar. Yang benar: sudut pusat = 2 × sudut keliling, jadi D terbalik. **(A, B, C)**","passage":null},{"n":9,"type":"PG","level":"L3","stem":"Sebuah roda berjari-jari 35 cm berputar sebanyak 200 kali. Jarak yang ditempuh roda itu adalah .... (π = 22/7)","extra":[],"options":["220 m","440 m","700 m","44 m"],"statements":null,"answer":["B"],"explain":"Keliling roda = 2 × 22/7 × 35 = 220 cm. Jarak = 200 × 220 = 44.000 cm = 440 m. **(B)**","passage":null},{"n":10,"type":"KAT","level":"L3","stem":"Sebuah limas memiliki alas berbentuk persegi dengan sisi 12 cm dan tinggi limas 8 cm. Tentukan Benar atau Salah untuk setiap pernyataan.","extra":[],"options":null,"statements":["Volume limas itu 384 cm³.","Tinggi segitiga pada sisi tegaknya 10 cm.","Luas permukaan limas itu 432 cm².","Jika tinggi limas dijadikan 2 kali semula, volumenya menjadi 4 kali semula."],"answer":["B","B","S","S"],"explain":"V = 1/3 × 144 × 8 = 384 cm³ (1 benar). Tinggi segitiga sisi tegak = √(8² + 6²) = 10 cm (2 benar). LP = 144 + 4 × (1/2 × 12 × 10) = 144 + 240 = 384 cm², bukan 432 (3 salah). Volume sebanding dengan tinggi, jadi menjadi 2 kali (4 salah). **(B, B, S, S)**","passage":null},{"n":11,"type":"PG","level":"L2","stem":"Panjang busur dengan sudut pusat 60° pada lingkaran berjari-jari 21 cm adalah .... (π = 22/7)","extra":[],"options":["44 cm","66 cm","22 cm","11 cm"],"statements":null,"answer":["C"],"explain":"Panjang busur = 60/360 × 2 × 22/7 × 21 = 1/6 × 132 = 22 cm. **(C)**","passage":null},{"n":12,"type":"PG","level":"L3","stem":"Sebuah prisma tegak memiliki alas berbentuk segitiga siku-siku dengan sisi siku-siku 6 cm dan 8 cm. Tinggi prisma 10 cm. Luas permukaan prisma itu adalah ....","extra":[],"options":["288 cm²","240 cm²","480 cm²","264 cm²"],"statements":null,"answer":["A"],"explain":"Sisi miring alas = 10 cm. LP = 2 × (1/2 × 6 × 8) + (6 + 8 + 10) × 10 = 48 + 240 = 288 cm². **(A)**","passage":null},{"n":13,"type":"PGK","level":"L3","stem":"Sebuah kubus memiliki panjang rusuk 6 cm. Pilih **semua** pernyataan yang benar.","extra":[],"options":["Panjang diagonal sisinya 6√2 cm.","Panjang diagonal ruangnya 6√3 cm.","Volumenya 216 cm³.","Luas sebuah bidang diagonalnya 72 cm²."],"statements":null,"answer":["A","B","C"],"explain":"Diagonal sisi 6√2 (A), diagonal ruang 6√3 (B), volume 6³ = 216 (C). Bidang diagonal berukuran 6 × 6√2, luasnya 36√2 ≈ 50,9 cm², bukan 72 (D salah). **(A, B, C)**","passage":null},{"n":14,"type":"PG","level":"L2","stem":"AB adalah diameter sebuah lingkaran dan C adalah titik pada lingkaran (selain A dan B). Besar ∠ACB adalah ....","extra":[],"options":["45°","180°","60°","90°"],"statements":null,"answer":["D"],"explain":"Sudut keliling yang menghadap diameter selalu 90° (setengah dari sudut pusat 180°). **(D)**","passage":null},{"n":15,"type":"PG","level":"L3","stem":"Sebuah balok bervolume 360 cm³ memiliki panjang 10 cm dan lebar 6 cm. Luas permukaan balok itu adalah ....","extra":[],"options":["360 cm²","156 cm²","312 cm²","296 cm²"],"statements":null,"answer":["C"],"explain":"Tinggi = 360 : (10 × 6) = 6 cm. LP = 2(10 × 6 + 10 × 6 + 6 × 6) = 2(60 + 60 + 36) = 312 cm². **(C)**","passage":null},{"n":16,"type":"KAT","level":"L3","stem":"Kerangka sebuah balok berukuran 15 cm × 10 cm × 5 cm dibuat dari kawat. Tentukan Benar atau Salah untuk setiap pernyataan.","extra":[],"options":null,"statements":["Kawat yang diperlukan untuk satu kerangka 120 cm.","Dengan kawat 6 m dapat dibuat tepat 5 kerangka.","Volume balok itu 750 cm³.","Jika semua rusuknya dijadikan 2 kali, kawat yang diperlukan menjadi 4 kali."],"answer":["B","B","B","S"],"explain":"Kawat = 4 × (15 + 10 + 5) = 120 cm (1 benar). 600 : 120 = 5 kerangka (2 benar). V = 15 × 10 × 5 = 750 cm³ (3 benar). Panjang kawat sebanding dengan panjang rusuk, jadi menjadi 2 kali (4 salah). **(B, B, B, S)**","passage":null},{"n":17,"type":"PG","level":"L2","stem":"Luas lingkaran yang berdiameter 20 cm adalah .... (π = 3,14)","extra":[],"options":["62,8 cm²","314 cm²","1.256 cm²","31,4 cm²"],"statements":null,"answer":["B"],"explain":"r = 10 cm. L = 3,14 × 100 = 314 cm². **(B)**","passage":null},{"n":18,"type":"PG","level":"L2","stem":"Banyak titik sudut limas segi lima adalah ....","extra":[],"options":["6","5","10","7"],"statements":null,"answer":["A"],"explain":"Limas segi lima: 5 titik sudut pada alas + 1 titik puncak = 6. **(A)**","passage":null},{"n":19,"type":"PGK","level":"L3","stem":"ABCD adalah segi empat tali busur dengan ∠A = 75° dan ∠B = 110°. Pilih **semua** pernyataan yang benar.","extra":[],"options":["∠C = 105°","∠D = 70°","∠A + ∠C = 180°","∠B + ∠D = 360°"],"statements":null,"answer":["A","B","C"],"explain":"Pada segi empat tali busur, sudut yang berhadapan berjumlah 180°: ∠C = 180° − 75° = 105° dan ∠D = 180° − 110° = 70°. ∠B + ∠D = 180°, bukan 360°. **(A, B, C)**","passage":null},{"n":20,"type":"PG","level":"L3","stem":"Sebuah kolam berbentuk balok berukuran 5 m × 3 m × 1,2 m diisi air dengan debit 20 liter per menit. Waktu yang diperlukan sampai kolam penuh adalah ....","extra":[],"options":["15 jam","9 jam","18 jam","12 jam"],"statements":null,"answer":["A"],"explain":"V = 5 × 3 × 1,2 = 18 m³ = 18.000 liter. Waktu = 18.000 : 20 = 900 menit = 15 jam. **(A)**","passage":null},{"n":21,"type":"KAT","level":"L3","stem":"Titik P berada di luar lingkaran yang berpusat di O dengan jari-jari 6 cm. Jarak OP = 10 cm, dan PA adalah garis singgung lingkaran di titik A. Tentukan Benar atau Salah untuk setiap pernyataan.","extra":[],"options":null,"statements":["Panjang PA = 8 cm.","Besar ∠OAP = 90°.","Luas segitiga OAP = 48 cm².","Jika PB adalah garis singgung kedua dari P, maka PB = PA."],"answer":["B","B","S","B"],"explain":"Jari-jari tegak lurus garis singgung, jadi ∠OAP = 90° (2 benar) dan PA = √(10² − 6²) = 8 cm (1 benar). Luas OAP = 1/2 × 6 × 8 = 24 cm² (3 salah). Dua garis singgung dari satu titik sama panjang (4 benar). **(B, B, S, B)**","passage":null},{"n":22,"type":"PG","level":"L2","stem":"Keliling sebuah lingkaran 88 cm. Jari-jari lingkaran itu adalah .... (π = 22/7)","extra":[],"options":["7 cm","28 cm","14 cm","44 cm"],"statements":null,"answer":["C"],"explain":"2 × 22/7 × r = 88, jadi r = 88 × 7/44 = 14 cm. **(C)**","passage":null},{"n":23,"type":"PG","level":"L2","stem":"Alas sebuah prisma berbentuk segitiga dengan panjang alas 10 cm dan tinggi 6 cm. Tinggi prisma 15 cm. Volume prisma itu adalah ....","extra":[],"options":["900 cm³","300 cm³","225 cm³","450 cm³"],"statements":null,"answer":["D"],"explain":"Luas alas = 1/2 × 10 × 6 = 30 cm². V = 30 × 15 = 450 cm³. **(D)**","passage":null},{"n":24,"type":"PGK","level":"L2","stem":"Pilih **semua** bangun ruang sisi datar.","extra":[],"options":["Kubus","Tabung","Limas segitiga","Kerucut"],"statements":null,"answer":["A","C"],"explain":"Kubus dan limas segitiga semua sisinya datar. Tabung dan kerucut memiliki sisi lengkung. **(A, C)**","passage":null},{"n":25,"type":"PG","level":"L3","stem":"Sebuah taman berbentuk lingkaran berdiameter 28 m. Di sekeliling taman (di luar taman) dibuat jalan selebar 3,5 m. Luas jalan itu adalah .... (π = 22/7)","extra":[],"options":["616 m²","346,5 m²","962,5 m²","308 m²"],"statements":null,"answer":["B"],"explain":"Jari-jari taman 14 m, jari-jari luar 17,5 m. Luas jalan = 22/7 × (17,5² − 14²) = 22/7 × 110,25 = 346,5 m². **(B)**","passage":null},{"n":26,"type":"KAT","level":"L3","stem":"Sebuah kubus kayu berusuk 12 cm dicat seluruh permukaannya, lalu dipotong menjadi kubus-kubus kecil berusuk 3 cm tanpa sisa. Tentukan Benar atau Salah untuk setiap pernyataan.","extra":[],"options":null,"statements":["Banyak kubus kecil yang terbentuk 64 buah.","Jumlah luas permukaan semua kubus kecil 4 kali luas permukaan kubus besar.","Banyak kubus kecil yang sama sekali tidak terkena cat ada 8 buah.","Banyak kubus kecil yang terkena cat pada tepat tiga sisinya ada 4 buah."],"answer":["B","B","B","S"],"explain":"12 : 3 = 4 kubus tiap rusuk, total 4³ = 64 (1 benar). Luas total kecil = 64 × 6 × 9 = 3.456 cm², besar = 6 × 144 = 864 cm², 4 kali (2 benar). Tidak terkena cat = (4 − 2)³ = 8 (3 benar). Tiga sisi tercat hanya kubus di titik sudut, ada 8 (4 salah). **(B, B, B, S)**","passage":null},{"n":27,"type":"PG","level":"L2","stem":"Besar sudut pusat sebuah lingkaran 140°. Besar sudut keliling yang menghadap busur yang sama adalah ....","extra":[],"options":["140°","280°","70°","40°"],"statements":null,"answer":["C"],"explain":"Sudut keliling = 1/2 × 140° = 70°. **(C)**","passage":null},{"n":28,"type":"PG","level":"L3","stem":"Sebuah kardus berukuran 60 cm × 40 cm × 30 cm akan diisi kotak-kotak kecil berbentuk kubus berusuk 10 cm. Banyak kotak kecil paling banyak yang dapat dimasukkan adalah ....","extra":[],"options":["72","60","48","80"],"statements":null,"answer":["A"],"explain":"60 : 10 = 6, 40 : 10 = 4, 30 : 10 = 3. Banyak kotak = 6 × 4 × 3 = 72. **(A)**","passage":null},{"n":29,"type":"PGK","level":"L3","stem":"Budi menghitung volume limas dengan alas persegi bersisi 6 cm dan tinggi 10 cm sebagai 6 × 6 × 10 = 360 cm³. Pilih **semua** pernyataan yang benar.","extra":[],"options":["Budi lupa mengalikan dengan 1/3.","Volume yang benar 120 cm³.","Rumus yang dipakai Budi adalah rumus volume balok dengan alas dan tinggi yang sama.","Volume limas sama dengan volume balok yang alas dan tingginya sama."],"statements":null,"answer":["A","B","C"],"explain":"Volume limas = 1/3 × luas alas × tinggi = 1/3 × 36 × 10 = 120 cm³. Budi memakai rumus balok tanpa 1/3. Volume limas hanya 1/3 volume balok dengan alas dan tinggi sama. **(A, B, C)**","passage":null},{"n":30,"type":"PG","level":"L3","stem":"Perbandingan panjang, lebar, dan tinggi sebuah balok 3 : 2 : 1. Volume balok itu 384 cm³. Luas permukaannya adalah ....","extra":[],"options":["384 cm²","176 cm²","448 cm²","352 cm²"],"statements":null,"answer":["D"],"explain":"p = 3k, l = 2k, t = k. 6k³ = 384, k³ = 64, k = 4: ukuran 12 × 8 × 4. LP = 2(96 + 48 + 32) = 352 cm². **(D)**","passage":null}]},{"id":"MTK13","title":"MTK 13 · Bangun Ruang Sisi Lengkung","intro":"Materi: unsur dan jaring-jaring tabung, kerucut, dan bola; luas permukaan dan volume tabung, kerucut, bola, dan setengah bola; bangun gabungan; pengaruh perubahan ukuran terhadap luas dan volume; serta masalah kontekstual (kaleng, tangki, es krim, tumpeng, perpindahan air). Gunakan π = 22/7 atau 3,14 sesuai soal.","passages":[],"questions":[{"n":1,"type":"PG","level":"L1","stem":"Volume tabung dengan jari-jari 7 cm dan tinggi 10 cm adalah .... (π = 22/7)","extra":[],"options":["1.540 cm³","440 cm³","154 cm³","3.080 cm³"],"statements":null,"answer":["A"],"explain":"V = 22/7 × 7 × 7 × 10 = 1.540 cm³. **(A)**","passage":null},{"n":2,"type":"PG","level":"L2","stem":"Luas permukaan bola berjari-jari 7 cm adalah .... (π = 22/7)","extra":[],"options":["154 cm²","308 cm²","616 cm²","1.437,3 cm²"],"statements":null,"answer":["C"],"explain":"L = 4 × 22/7 × 7 × 7 = 616 cm². **(C)**","passage":null},{"n":3,"type":"KAT","level":"L3","stem":"Perhatikan bangun gabungan berikut.","extra":["[[FIG:d21507a1-bea6|Kerucut (tinggi 24 cm) di atas tabung (tinggi 10 cm), jari-jari 7 cm]]","Tentukan Benar atau Salah untuk setiap pernyataan."],"options":null,"statements":["Panjang garis pelukis kerucut 25 cm.","Volume bangun gabungan itu 2.772 cm³.","Luas permukaan bangun gabungan itu 1.144 cm².","Volume bagian kerucut lebih besar daripada volume bagian tabung."],"answer":["B","B","B","S"],"explain":"s = √(7² + 24²) = 25 cm (1 benar). V tabung = 154 × 10 = 1.540, V kerucut = 1/3 × 154 × 24 = 1.232, total 2.772 cm³ (2 benar). Luas = alas tabung 154 + selimut tabung 2 × 22/7 × 7 × 10 = 440 + selimut kerucut 22/7 × 7 × 25 = 550, total 1.144 cm² (3 benar). 1.232 < 1.540 (4 salah). **(B, B, B, S)**","passage":null},{"n":4,"type":"PG","level":"L2","stem":"Volume kerucut dengan jari-jari alas 6 cm dan tinggi 14 cm adalah .... (π = 22/7)","extra":[],"options":["1.584 cm³","528 cm³","264 cm³","792 cm³"],"statements":null,"answer":["B"],"explain":"V = 1/3 × 22/7 × 6 × 6 × 14 = 528 cm³. **(B)**","passage":null},{"n":5,"type":"PGK","level":"L3","stem":"Pilih **semua** pernyataan yang benar tentang tabung.","extra":[],"options":["Tabung memiliki 3 sisi: 2 sisi berbentuk lingkaran dan 1 selimut.","Jaring-jaring selimut tabung berbentuk persegi panjang.","Tabung memiliki titik sudut.","Tabung memiliki 2 rusuk lengkung."],"statements":null,"answer":["A","B","D"],"explain":"Tabung punya 3 sisi, selimutnya berupa persegi panjang jika dibuka, dan 2 rusuk lengkung (keliling alas dan tutup). Tabung tidak memiliki titik sudut. **(A, B, D)**","passage":null},{"n":6,"type":"PG","level":"L2","stem":"Volume bola berjari-jari 3 cm adalah .... (π = 3,14)","extra":[],"options":["37,68 cm³","28,26 cm³","339,12 cm³","113,04 cm³"],"statements":null,"answer":["D"],"explain":"V = 4/3 × 3,14 × 27 = 113,04 cm³. **(D)**","passage":null},{"n":7,"type":"PG","level":"L3","stem":"Sebuah bola dimasukkan ke dalam tabung sehingga bola tepat menyinggung alas, tutup, dan selimut tabung. Perbandingan volume bola dan volume tabung adalah ....","extra":[],"options":["2 : 3","1 : 2","3 : 4","1 : 3"],"statements":null,"answer":["A"],"explain":"Tinggi tabung = 2r. V bola = (4/3)πr³, V tabung = πr² × 2r = 2πr³. Perbandingan (4/3) : 2 = 2 : 3. **(A)**","passage":null},{"n":8,"type":"PGK","level":"L2","stem":"Pilih **semua** pasangan benda dan bentuk bangun ruang yang tepat.","extra":[],"options":["Kaleng susu – tabung","Topi ulang tahun – kerucut","Bola basket – bola","Kotak tisu – tabung"],"statements":null,"answer":["A","B","C"],"explain":"Kotak tisu umumnya berbentuk balok, bukan tabung. **(A, B, C)**","passage":null},{"n":9,"type":"PG","level":"L3","stem":"Sebuah tabung berjari-jari 10 cm berisi air setinggi 15 cm. Ke dalam tabung dimasukkan sebuah bola besi berjari-jari 5 cm hingga tenggelam seluruhnya. Kenaikan tinggi air adalah sekitar ....","extra":[],"options":["5 cm","1,25 cm","1,67 cm","2,5 cm"],"statements":null,"answer":["C"],"explain":"Volume air yang terdesak = V bola = (4/3)π × 125 = (500/3)π. Kenaikan = (500/3)π : (π × 100) = 5/3 ≈ 1,67 cm. **(C)**","passage":null},{"n":10,"type":"KAT","level":"L3","stem":"Sebuah kerucut memiliki jari-jari alas 6 cm dan tinggi 8 cm. Tentukan Benar atau Salah untuk setiap pernyataan.","extra":[],"options":null,"statements":["Panjang garis pelukisnya 10 cm.","Luas selimutnya 48π cm².","Luas permukaannya 96π cm².","Volumenya 288π cm³."],"answer":["B","S","B","S"],"explain":"s = √(36 + 64) = 10 (1 benar). Luas selimut = π × 6 × 10 = 60π, bukan 48π (2 salah). Luas permukaan = 60π + 36π = 96π (3 benar). V = 1/3 × π × 36 × 8 = 96π, bukan 288π (4 salah). **(B, S, B, S)**","passage":null},{"n":11,"type":"PG","level":"L2","stem":"Luas selimut tabung dengan jari-jari 14 cm dan tinggi 20 cm adalah .... (π = 22/7)","extra":[],"options":["880 cm²","1.760 cm²","2.992 cm²","3.520 cm²"],"statements":null,"answer":["B"],"explain":"L = 2 × 22/7 × 14 × 20 = 1.760 cm². **(B)**","passage":null},{"n":12,"type":"PG","level":"L3","stem":"Sebuah tangki minyak berbentuk tabung memiliki diameter 1,4 m dan tinggi 2 m. Volume tangki itu a
