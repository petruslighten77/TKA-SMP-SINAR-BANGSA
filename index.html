 = 7,375 (3 benar). Nilai lebih dari 7: 10 + 6 + 2 = 18 siswa = 45% (4 benar). **(B, S, B, B)**","passage":null},{"n":4,"type":"PG","level":"L2","stem":"Rata-rata nilai 5 siswa adalah 70. Seorang siswa lain yang nilainya 82 bergabung. Rata-rata nilai keenam siswa itu adalah ....","extra":[],"options":["72","76","71","74"],"statements":null,"answer":["A"],"explain":"Jumlah = 5 × 70 + 82 = 432. Rata-rata = 432 : 6 = 72. **(A)**","passage":null},{"n":5,"type":"PGK","level":"L3","stem":"Diketahui data 3, 5, 5, 6, 7, 8, 8, 8, 9. Pilih **semua** pernyataan yang benar.","extra":[],"options":["Modusnya 8.","Mediannya 7.","Jangkauannya 6.","Rata-ratanya 7."],"statements":null,"answer":["A","B","C"],"explain":"8 muncul 3 kali (modus). Data ke-5 = 7 (median). Jangkauan = 9 − 3 = 6. Rata-rata = 59 : 9 ≈ 6,56, bukan 7. **(A, B, C)**","passage":null},{"n":6,"type":"PG","level":"L2","stem":"Sebuah sekolah memiliki 360 siswa. Pada diagram lingkaran pilihan ekstrakurikuler, juring Pramuka memiliki sudut pusat 90°. Banyak siswa yang memilih Pramuka adalah ....","extra":[],"options":["120 siswa","60 siswa","180 siswa","90 siswa"],"statements":null,"answer":["D"],"explain":"90°/360° × 360 = 90 siswa. **(D)**","passage":null},{"n":7,"type":"PG","level":"L3","stem":"Rata-rata nilai 30 siswa adalah 72. Setelah diperiksa ulang, nilai 2 siswa masing-masing naik 15. Rata-rata nilai yang baru adalah ....","extra":[],"options":["72,5","73","74","87"],"statements":null,"answer":["B"],"explain":"Jumlah nilai bertambah 2 × 15 = 30, sehingga rata-rata bertambah 30 : 30 = 1. Rata-rata baru 73. **(B)**","passage":null},{"n":8,"type":"PGK","level":"L2","stem":"Pilih **semua** yang termasuk ukuran pemusatan data.","extra":[],"options":["Rata-rata (mean)","Median","Modus","Jangkauan"],"statements":null,"answer":["A","B","C"],"explain":"Mean, median, dan modus adalah ukuran pemusatan. Jangkauan adalah ukuran penyebaran. **(A, B, C)**","passage":null},{"n":9,"type":"PG","level":"L3","stem":"Rata-rata nilai 20 siswa putra adalah 70, sedangkan rata-rata nilai 30 siswa putri adalah 80. Rata-rata nilai seluruh siswa adalah ....","extra":[],"options":["75","74","76","78"],"statements":null,"answer":["C"],"explain":"(20 × 70 + 30 × 80) : 50 = (1.400 + 2.400) : 50 = 76. **(C)**","passage":null},{"n":10,"type":"KAT","level":"L3","stem":"Lima bilangan bulat positif memiliki rata-rata 6, median 5, dan modus 4 (hanya 4 yang muncul lebih dari sekali). Tentukan Benar atau Salah untuk setiap pernyataan.","extra":[],"options":null,"statements":["Jumlah kelima bilangan itu 30.","Dua bilangan terkecil adalah 4 dan 4.","Jumlah dua bilangan terbesar adalah 17.","Bilangan terbesar pasti 9."],"answer":["B","B","B","S"],"explain":"Jumlah = 5 × 6 = 30 (1 benar). Median 5 adalah data ke-3; dua data di bawahnya harus 4 dan 4 agar 4 menjadi modus (2 benar). Dua terbesar: 30 − 4 − 4 − 5 = 17 (3 benar). Pasangannya bisa 6 dan 11, 7 dan 10, atau 8 dan 9, jadi terbesar tidak pasti 9 (4 salah). **(B, B, B, S)**","passage":null},{"n":11,"type":"PG","level":"L2","stem":"Jangkauan dari data 12, 7, 15, 9, 20, 11 adalah ....","extra":[],"options":["8","20","13","12"],"statements":null,"answer":["C"],"explain":"20 − 7 = 13. **(C)**","passage":null},{"n":12,"type":"PG","level":"L3","stem":"Rata-rata 8 bilangan adalah 15. Jika satu bilangan dihapus, rata-ratanya menjadi 14. Bilangan yang dihapus adalah ....","extra":[],"options":["22","15","14","1"],"statements":null,"answer":["A"],"explain":"Jumlah awal 8 × 15 = 120, jumlah sisa 7 × 14 = 98. Bilangan yang dihapus = 22. **(A)**","passage":null},{"n":13,"type":"PGK","level":"L3","stem":"Perhatikan tabel nilai berikut.","extra":["| Nilai | 6 | 7 | 8 | 9 |\n| --- | --- | --- | --- | --- |\n| Frekuensi | 4 | 8 | 5 | 3 |","Pilih **semua** pernyataan yang benar."],"options":["Modusnya 7.","Mediannya 7,5.","Rata-ratanya 7,35.","Sebanyak 40% siswa mendapat nilai paling sedikit 8."],"statements":null,"answer":["A","C","D"],"explain":"Modus 7 (A). n = 20, data ke-10 dan ke-11 bernilai 7, jadi median 7 (B salah). Rata-rata = (24 + 56 + 40 + 27) : 20 = 7,35 (C). Nilai ≥ 8: 5 + 3 = 8 siswa = 40% (D). **(A, C, D)**","passage":null},{"n":14,"type":"PG","level":"L2","stem":"Modus dari data 3, 7, 5, 7, 3, 8, 7, 5 adalah ....","extra":[],"options":["3","5","8","7"],"statements":null,"answer":["D"],"explain":"7 muncul 3 kali, paling sering. **(D)**","passage":null},{"n":15,"type":"PG","level":"L3","stem":"Rata-rata tinggi 10 anak adalah 150 cm. Setelah 2 anak lain bergabung, rata-rata tinggi menjadi 151 cm. Rata-rata tinggi kedua anak yang baru bergabung adalah ....","extra":[],"options":["151 cm","156 cm","152 cm","160 cm"],"statements":null,"answer":["B"],"explain":"Jumlah 12 anak = 12 × 151 = 1.812. Jumlah 10 anak = 1.500. Dua anak baru = 312 cm, rata-rata 156 cm. **(B)**","passage":null},{"n":16,"type":"KAT","level":"L3","stem":"Diketahui data terurut 4, 6, 7, 7, 8, 9, 10, 12. Tentukan Benar atau Salah untuk setiap pernyataan.","extra":[],"options":null,"statements":["Mediannya 7,5.","Kuartil bawahnya 6,5.","Kuartil atasnya 10.","Jangkauan interkuartilnya 3."],"answer":["B","B","S","B"],"explain":"n = 8. Median = (7 + 8)/2 = 7,5 (1 benar). Q₁ = median 4, 6, 7, 7 = 6,5 (2 benar). Q₃ = median 8, 9, 10, 12 = 9,5, bukan 10 (3 salah). Q₃ − Q₁ = 3 (4 benar). **(B, B, S, B)**","passage":null},{"n":17,"type":"PG","level":"L2","stem":"Rata-rata dari x + 2, x + 4, x + 6, dan x + 8 adalah 12. Nilai x adalah ....","extra":[],"options":["5","6","7","12"],"statements":null,"answer":["C"],"explain":"Rata-rata = (4x + 20) : 4 = x + 5 = 12, x = 7. **(C)**","passage":null},{"n":18,"type":"PG","level":"L2","stem":"Rata-rata sekelompok data adalah 20. Jika setiap data dikalikan 2 lalu dikurangi 3, rata-rata yang baru adalah ....","extra":[],"options":["37","40","17","43"],"statements":null,"answer":["A"],"explain":"Rata-rata ikut berubah dengan operasi yang sama: 2 × 20 − 3 = 37. **(A)**","passage":null},{"n":19,"type":"PGK","level":"L3","stem":"Untuk data 8, 3, 9, 5, 7, Dodi menyatakan mediannya 9 karena 9 berada di tengah. Pilih **semua** pernyataan yang benar.","extra":[],"options":["Dodi lupa mengurutkan data terlebih dahulu.","Median yang benar adalah 7.","Median data itu sama dengan rata-ratanya.","Setelah diurutkan, median adalah data ke-3."],"statements":null,"answer":["A","B","D"],"explain":"Diurutkan: 3, 5, 7, 8, 9. Median adalah data ke-3, yaitu 7 (A, B, D). Rata-rata = 32 : 5 = 6,4, berbeda dengan median (C salah). **(A, B, D)**","passage":null},{"n":20,"type":"PG","level":"L3","stem":"Rata-rata lima bilangan bulat berurutan adalah 18. Bilangan terbesarnya adalah ....","extra":[],"options":["22","18","19","20"],"statements":null,"answer":["D"],"explain":"Pada bilangan berurutan, rata-rata = bilangan tengah = 18. Bilangannya 16, 17, 18, 19, 20. **(D)**","passage":null},{"n":21,"type":"KAT","level":"L3","stem":"Sebanyak 480 siswa disurvei tentang cara mereka berangkat ke sekolah. Hasilnya: jalan kaki 25%, sepeda 15%, motor 40%, dan angkutan umum 20%. Tentukan Benar atau Salah untuk setiap pernyataan.","extra":[],"options":null,"statements":["Siswa yang naik motor ada 192 orang.","Pada diagram lingkaran, besar sudut juring sepeda 54°.","Siswa yang jalan kaki dua kali lebih banyak daripada yang bersepeda.","Selisih banyak siswa yang naik motor dan angkutan umum 96 orang."],"answer":["B","B","S","B"],"explain":"Motor 40% × 480 = 192 (1 benar). Sudut sepeda 15% × 360° = 54° (2 benar). 25% bukan dua kali 15% (3 salah). Selisih 20% × 480 = 96 (4 benar). **(B, B, S, B)**","passage":null},{"n":22,"type":"PG","level":"L2","stem":"Rata-rata nilai 32 siswa di sebuah kelas adalah 70. Jumlah seluruh nilai siswa di kelas itu adalah ....","extra":[],"options":["2.100","2.240","102","2.400"],"statements":null,"answer":["B"],"explain":"32 × 70 = 2.240. **(B)**","passage":null},{"n":23,"type":"PG","level":"L2","stem":"Rata-rata dari data 5, 6, 6, 7, 8, 8, 8, 9 adalah ....","extra":[],"options":["7","8","7,125","7,5"],"statements":null,"answer":["C"],"explain":"Jumlah = 57, rata-rata 57 : 8 = 7,125. **(C)**","passage":null},{"n":24,"type":"PGK","level":"L2","stem":"Pilih **semua** data yang paling tepat disajikan dengan diagram garis.","extra":[],"options":["Suhu udara harian selama seminggu","Tinggi tanaman yang diukur setiap minggu","Persentase warna favorit siswa dari seluruh kelas","Jumlah penduduk sebuah kota setiap tahun dari 2015 sampai 2025"],"statements":null,"answer":["A","B","D"],"explain":"Diagram garis cocok untuk data yang berubah menurut waktu (A, B, D). Persentase bagian dari keseluruhan lebih tepat dengan diagram lingkaran. **(A, B, D)**","passage":null},{"n":25,"type":"PG","level":"L3","stem":"Rata-rata nilai empat kali ulangan Dimas adalah 76. Agar rata-rata lima kali ulangannya menjadi 80, nilai ulangan kelima harus ....","extra":[],"options":["84","80","100","96"],"statements":null,"answer":["D"],"explain":"Jumlah lima nilai harus 400. Jumlah empat nilai 304. Nilai kelima = 96. **(D)**","passage":null},{"n":26,"type":"KAT","level":"L3","stem":"Nilai lima siswa kelas A: 60, 70, 70, 80, 95. Nilai lima siswa kelas B: 72, 74, 75, 76, 78. Tentukan Benar atau Salah untuk setiap pernyataan.","extra":[],"options":null,"statements":["Rata-rata nilai kedua kelompok sama.","Median kelas A lebih kecil daripada median kelas B.","Nilai kelas B lebih menyebar daripada nilai kelas A.","Jangkauan nilai kelas A adalah 35."],"answer":["B","B","S","B"],"explain":"Rata-rata A = 375 : 5 = 75 dan B = 375 : 5 = 75 (1 benar). Median A = 70, median B = 75 (2 benar). Jangkauan A = 35, jangkauan B = 6, jadi A yang lebih menyebar (3 salah, 4 benar). **(B, B, S, B)**","passage":null},{"n":27,"type":"PG","level":"L2","stem":"Perhatikan tabel berikut.","extra":["| Nilai | 5 | 6 | 7 | 8 |\n| --- | --- | --- | --- | --- |\n| Frekuensi | 2 | 5 | 8 | 5 |","Median data itu adalah ...."],"options":["7","6","6,5","7,5"],"statements":null,"answer":["A"],"explain":"n = 20. Data ke-10 dan ke-11: frekuensi kumulatif 2, 7, 15, keduanya bernilai 7. **(A)**","passage":null},{"n":28,"type":"PG","level":"L3","stem":"Rata-rata berat 6 karung beras adalah 50 kg. Setelah satu karung lagi ditambahkan, rata-ratanya menjadi 52 kg. Berat karung yang ditambahkan adalah ....","extra":[],"options":["52 kg","64 kg","62 kg","54 kg"],"statements":null,"answer":["B"],"explain":"Jumlah 7 karung = 364 kg, jumlah 6 karung = 300 kg. Karung baru = 64 kg. **(B)**","passage":null},{"n":29,"type":"PGK","level":"L3","stem":"Setiap nilai dalam sekelompok data ditambah 5. Pilih **semua** pernyataan yang benar.","extra":[],"options":["Rata-ratanya bertambah 5.","Mediannya bertambah 5.","Jangkauannya bertambah 5.","Modusnya bertambah 5."],"statements":null,"answer":["A","B","D"],"explain":"Rata-rata, median, dan modus ikut bertambah 5. Jangkauan (selisih terbesar dan terkecil) tidak berubah. **(A, B, D)**","passage":null},{"n":30,"type":"PG","level":"L3","stem":"Rata-rata data 7, 9, x, 6, 8 adalah 8. Median data itu adalah ....","extra":[],"options":["7","9","7,5","8"],"statements":null,"answer":["D"],"explain":"30 + x = 40, x = 10. Data terurut 6, 7, 8, 9, 10, median 8. **(D)**","passage":null}]},{"id":"MTK15","title":"MTK 15 · Peluang dan Campuran","intro":"Materi: ruang sampel dan titik sampel, peluang teoretik dan empirik, kejadian pasti dan mustahil, komplemen kejadian, frekuensi harapan, peluang pada dadu, koin, kartu, dan kantong, serta soal campuran dari seluruh elemen (bilangan, aljabar, geometri, dan data) sebagai latihan menjelang TKA.","passages":[],"questions":[{"n":1,"type":"PG","level":"L1","stem":"Sebuah dadu dilempar sekali. Peluang muncul mata dadu 4 adalah ....","extra":[],"options":["1/6","1/4","4/6","1/2"],"statements":null,"answer":["A"],"explain":"Ada 6 kemungkinan dan hanya 1 yang bermata 4: P = 1/6. **(A)**","passage":null},{"n":2,"type":"PG","level":"L2","stem":"Dua keping uang logam dilempar bersamaan. Peluang muncul tepat satu gambar adalah ....","extra":[],"options":["1/4","1/2","3/4","1/3"],"statements":null,"answer":["B"],"explain":"Ruang sampel {AA, AG, GA, GG}. Tepat satu gambar: AG dan GA, P = 2/4 = 1/2. **(B)**","passage":null},{"n":3,"type":"KAT","level":"L3","stem":"Perhatikan roda putar berikut. Bagian yang berwarna adalah bagian bernomor bilangan prima.","extra":["[[FIG:a2f73073-9c03|Roda putar bernomor 1 sampai 8; bagian 2, 3, 5, dan 7 berwarna]]","Tentukan Benar atau Salah untuk setiap pernyataan."],"options":null,"statements":["Peluang jarum berhenti di bagian berwarna adalah 1/2.","Peluang jarum berhenti di bilangan genap adalah 1/2.","Peluang jarum berhenti di bilangan yang prima sekaligus genap adalah 1/8.","Jika roda diputar 80 kali, frekuensi harapan jarum berhenti di kelipatan 3 adalah 30 kali."],"answer":["B","B","B","S"],"explain":"Bagian berwarna (2, 3, 5, 7) ada 4 dari 8: P = 1/2 (1 benar). Genap: 2, 4, 6, 8, P = 1/2 (2 benar). Prima dan genap hanya 2: P = 1/8 (3 benar). Kelipatan 3: 3 dan 6, P = 2/8; frekuensi harapan = 2/8 × 80 = 20 kali, bukan 30 (4 salah). **(B, B, B, S)**","passage":null},{"n":4,"type":"PG","level":"L2","stem":"Sebuah kantong berisi 5 bola merah, 3 bola biru, dan 2 bola hijau. Diambil satu bola secara acak. Peluang terambil bola yang bukan merah adalah ....","extra":[],"options":["3/10","1/5","1/2","1/3"],"statements":null,"answer":["C"],"explain":"Bukan merah = 3 + 2 = 5 bola dari 10: P = 1/2. **(C)**","passage":null},{"n":5,"type":"PGK","level":"L3","stem":"Dua dadu dilempar bersamaan. Pilih **semua** pernyataan yang benar.","extra":[],"options":["Banyak titik sampelnya 36.","Peluang jumlah mata dadu 7 adalah 1/6.","Peluang jumlah mata dadu 12 adalah 1/36.","Peluang jumlah mata dadu 2 lebih besar daripada peluang jumlah mata dadu 7."],"statements":null,"answer":["A","B","C"],"explain":"6 × 6 = 36 titik sampel (A). Jumlah 7: (1,6), (2,5), (3,4), (4,3), (5,2), (6,1), P = 6/36 = 1/6 (B). Jumlah 12 hanya (6,6), P = 1/36 (C). Jumlah 2 hanya (1,1), P = 1/36, lebih kecil dari 1/6 (D salah). **(A, B, C)**","passage":null},{"n":6,"type":"PG","level":"L2","stem":"Sebuah paku payung dilempar 200 kali. Paku payung mendarat dengan posisi terlentang sebanyak 120 kali. Peluang empirik paku payung mendarat terlentang adalah ....","extra":[],"options":["2/5","1/2","3/4","3/5"],"statements":null,"answer":["D"],"explain":"Peluang empirik = 120/200 = 3/5. **(D)**","passage":null},{"n":7,"type":"PG","level":"L3","stem":"Peluang turun hujan setiap hari di sebuah kota pada bulan Desember adalah 0,7. Frekuensi harapan hari tidak hujan selama 30 hari adalah ....","extra":[],"options":["21 hari","9 hari","7 hari","3 hari"],"statements":null,"answer":["B"],"explain":"P(tidak hujan) = 1 − 0,7 = 0,3. Frekuensi harapan = 0,3 × 30 = 9 hari. **(B)**","passage":null},{"n":8,"type":"PGK","level":"L2","stem":"Pilih **semua** kejadian yang peluangnya 0 (mustahil).","extra":[],"options":["Muncul mata dadu 7 pada pelemparan sebuah dadu biasa","Matahari terbit dari timur","Terambil bola hitam dari kantong yang hanya berisi bola putih","Muncul angka pada pelemparan sebuah uang logam"],"statements":null,"answer":["A","C"],"explain":"Mata dadu 7 dan bola hitam dari kantong berisi bola putih saja tidak mungkin terjadi. Matahari terbit dari timur adalah kejadian pasti (peluang 1), dan angka pada uang logam berpeluang 1/2. **(A, C)**","passage":null},{"n":9,"type":"PG","level":"L3","stem":"Dari angka 1, 2, 3, 4, dan 5 dibentuk bilangan dua angka tanpa pengulangan angka. Satu bilangan dipilih secara acak. Peluang bilangan itu genap adalah ....","extra":[],"options":["1/2","3/5","2/5","1/5"],"statements":null,"answer":["C"],"explain":"Banyak bilangan = 5 × 4 = 20. Genap: angka satuan 2 atau 4 (2 pilihan), angka puluhan 4 pilihan, jadi 8 bilangan. P = 8/20 = 2/5. **(C)**","passage":null},{"n":10,"type":"KAT","level":"L3","stem":"Dua puluh kartu diberi nomor 1 sampai 20. Satu kartu diambil secara acak. Tentukan Benar atau Salah untuk setiap pernyataan.","extra":[],"options":null,"statements":["Peluang terambil kartu bernomor bilangan prima adalah 2/5.","Peluang terambil kartu bernomor kelipatan 4 adalah 1/5.","Peluang terambil kartu bernomor kelipatan 3 atau kelipatan 5 adalah 9/20.","Peluang terambil kartu bernomor lebih dari 20 adalah 1/20."],"answer":["B","S","B","S"],"explain":"Bilangan prima 2, 3, 5, 7, 11, 13, 17, 19: P = 8/20 = 2/5 (1 benar). Kelipatan 4: 4, 8, 12, 16, 20, P = 5/20 = 1/4 (2 salah). Kelipatan 3 ada 6, kelipatan 5 ada 4, keduanya (15) ada 1: 6 + 4 − 1 = 9, P = 9/20 (3 benar). Lebih dari 20 tidak ada, P = 0 (4 salah). **(B, S, B, S)**","passage":null},{"n":11,"type":"PG","level":"L2","stem":"Hasil dari 2⁻³ × 4² adalah ....","extra":[],"options":["1/2","8","4","2"],"statements":null,"answer":["D"],"explain":"2⁻³ = 1/8 dan 4² = 16. 16/8 = 2. **(D)**","passage":null},{"n":12,"type":"PG","level":"L3","stem":"Sebuah kotak berisi x bola merah dan 6 bola putih. Peluang terambil bola merah adalah 2/5. Nilai x adalah ....","extra":[],"options":["6","4","3","9"],"statements":null,"answer":["B"],"explain":"x/(x + 6) = 2/5, 5x = 2x + 12, x = 4. **(B)**","passage":null},{"n":13,"type":"PGK","level":"L3","stem":"Tiga keping uang logam dilempar bersamaan. Pilih **semua** pernyataan yang benar.","extra":[],"options":["Banyak titik sampelnya 8.","Peluang muncul tepat dua gambar adalah 3/8.","Peluang muncul paling sedikit satu angka adalah 7/8.","Peluang muncul ketiganya gambar adalah 1/3."],"statements":null,"answer":["A","B","C"],"explain":"2³ = 8 titik sampel (A). Tepat dua gambar: GGA, GAG, AGG, P = 3/8 (B). Paling sedikit satu angka = 1 − P(GGG) = 7/8 (C). P(GGG) = 1/8, bukan 1/3 (D salah). **(A, B, C)**","passage":null},{"n":14,"type":"PG","level":"L2","stem":"Luas sebuah persegi 81 cm². Keliling persegi itu adalah ....","extra":[],"options":["18 cm","81 cm","36 cm","27 cm"],"statements":null,"answer":["C"],"explain":"Sisi = √81 = 9 cm. Keliling = 4 × 9 = 36 cm. **(C)**","passage":null},{"n":15,"type":"PG","level":"L3","stem":"Sebuah barang seharga Rp400.000 mendapat diskon 25%, lalu dikenai PPN 10% dari harga setelah diskon. Harga yang harus dibayar adalah ....","extra":[],"options":["Rp330.000","Rp340.000","Rp300.000","Rp310.000"],"statements":null,"answer":["A"],"explain":"Setelah diskon: 400.000 × 75% = 300.000. Ditambah PPN 10%: 300.000 × 1,1 = Rp330.000. **(A)**","passage":null},{"n":16,"type":"KAT","level":"L3","stem":"Dua dadu dilempar bersamaan. Tentukan Benar atau Salah untuk setiap pernyataan.","extra":[],"options":null,"statements":["Peluang muncul mata dadu kembar adalah 1/6.","Peluang jumlah mata dadu kurang dari 5 adalah 1/6.","Peluang jumlah mata dadu genap adalah 1/2.","Peluang hasil kali mata dadu ganjil adalah 1/2."],"answer":["B","B","B","S"],"explain":"Kembar ada 6: P = 6/36 = 1/6 (1 benar). Jumlah kurang dari 5 (jumlah 2, 3, 4): 1 + 2 + 3 = 6 kejadian, P = 1/6 (2 benar). Jumlah genap: kedua mata sama-sama ganjil atau sama-sama genap, 9 + 9 = 18, P = 1/2 (3 benar). Hasil kali ganjil jika keduanya ganjil: 9/36 = 1/4 (4 salah). **(B, B, B, S)**","passage":null},{"n":17,"type":"PG","level":"L2","stem":"Peluang kejadian A adalah 0,35. Peluang kejadian bukan A adalah ....","extra":[],"options":["0,65","0,35","1,35","0,5"],"statements":null,"answer":["A"],"explain":"P(bukan A) = 1 − 0,35 = 0,65. **(A)**","passage":null},{"n":18,"type":"PG","level":"L2","stem":"Penyelesaian dari 3(x − 4) = x + 6 adalah ....","extra":[],"options":["x = 3","x = 6","x = 5","x = 9"],"statements":null,"answer":["D"],"explain":"3x − 12 = x + 6, 2x = 18, x = 9. **(D)**","passage":null},{"n":19,"type":"PGK","level":"L3","stem":"Toni berkata, \"Peluang muncul angka pada uang logam 1/2, jadi jika dilempar 10 kali pasti muncul angka tepat 5 kali.\" Pilih **semua** pernyataan yang benar.","extra":[],"options":["Pendapat Toni salah.","Frekuensi harapan muncul angka dalam 10 kali lemparan adalah 5 kali.","Hasil percobaan sebenarnya bisa berbeda dari frekuensi harapan.","Jika dilempar 1.000 kali, angka pasti muncul tepat 500 kali."],"statements":null,"answer":["A","B","C"],"explain":"Frekuensi harapan = 1/2 × 10 = 5, tetapi itu perkiraan, bukan kepastian. Hasil nyata bisa 4, 6, atau lainnya, berapa pun banyak lemparannya. **(A, B, C)**","passage":null},{"n":20,"type":"PG","level":"L3","stem":"Dari 40 siswa, 25 siswa suka basket, 18 siswa suka voli, dan 8 siswa suka keduanya. Seorang siswa dipilih secara acak. Peluang terpilih siswa yang tidak suka basket maupun voli adalah ....","extra":[],"options":["3/8","1/5","1/8","7/40"],"statements":null,"answer":["C"],"explain":"Suka minimal satu = 25 + 18 − 8 = 35. Tidak suka keduanya = 5. P = 5/40 = 1/8. **(C)**","passage":null},{"n":21,"type":"KAT","level":"L3","stem":"Peluang seorang pemain basket berhasil memasukkan lemparan bebas adalah 0,8. Dalam satu pertandingan ia melakukan 15 lemparan bebas. Tentukan Benar atau Salah untuk setiap pernyataan.","extra":[],"options":null,"statements":["Frekuensi harapan lemparan yang masuk adalah 12 kali.","Peluang sebuah lemparan gagal adalah 0,2.","Frekuensi harapan lemparan yang gagal adalah 3 kali.","Pemain itu pasti memasukkan paling sedikit 12 lemparan."],"answer":["B","B","B","S"],"explain":"0,8 × 15 = 12 (1 benar). P(gagal) = 1 − 0,8 = 0,2 (2 benar). 0,2 × 15 = 3 (3 benar). Frekuensi harapan bukan jaminan (4 salah). **(B, B, B, S)**","passage":null},{"n":22,"type":"PG","level":"L2","stem":"Diketahui f(x) = 4x − 7 dan f(a) = 13. Nilai a adalah ....","extra":[],"options":["5","45","1,5","4"],"statements":null,"answer":["A"],"explain":"4a − 7 = 13, 4a = 20, a = 5. **(A)**","passage":null},{"n":23,"type":"PG","level":"L2","stem":"Setiap huruf pada kata MATEMATIKA ditulis pada sebuah kartu, lalu satu kartu diambil secara acak. Peluang terambil kartu berhuruf A adalah ....","extra":[],"options":["1/10","3/10","1/5","1/3"],"statements":null,"answer":["B"],"explain":"MATEMATIKA terdiri atas 10 huruf, huruf A ada 3. P = 3/10. **(B)**","passage":null},{"n":24,"type":"PGK","level":"L2","stem":"Pilih **semua** bilangan yang mungkin menjadi nilai peluang suatu kejadian.","extra":[],"options":["0","0,75","1,2","−0,3"],"statements":null,"answer":["A","B"],"explain":"Nilai peluang selalu di antara 0 dan 1 (termasuk 0 dan 1). 1,2 dan −0,3 tidak mungkin. **(A, B)**","passage":null},{"n":25,"type":"PG","level":"L3","stem":"Suku ke-3 sebuah barisan aritmetika adalah 11 dan suku ke-8 adalah 31. Suku ke-15 barisan itu adalah ....","extra":[],"options":["63","55","60","59"],"statements":null,"answer":["D"],"explain":"5b = 31 − 11 = 20, b = 4. U₁ = 11 − 8 = 3. U₁₅ = 3 + 14 × 4 = 59. **(D)**","passage":null},{"n":26,"type":"KAT","level":"L3","stem":"Sebuah kantong berisi 4 kelereng merah dan 6 kelereng biru. Satu kelereng diambil, dicatat warnanya, lalu dikembalikan. Kemudian diambil lagi satu kelereng. Tentukan Benar atau Salah untuk setiap pernyataan.","extra":[],"options":null,"statements":["Peluang pengambilan pertama berwarna merah adalah 2/5.","Peluang kedua pengambilan berwarna merah adalah 4/25.","Peluang pengambilan pertama merah dan kedua biru adalah 6/25.","Jika kelereng pertama tidak dikembalikan, peluang kedua pengambilan berwarna merah tetap 4/25."],"answer":["B","B","B","S"],"explain":"P(merah) = 4/10 = 2/5 (1 benar). Dengan pengembalian: 2/5 × 2/5 = 4/25 (2 benar), dan merah lalu biru: 2/5 × 3/5 = 6/25 (3 benar). Tanpa pengembalian: 4/10 × 3/9 = 2/15, berbeda dari 4/25 (4 salah). **(B, B, B, S)**","passage":null},{"n":27,"type":"PG","level":"L2","stem":"Luas permukaan sebuah kubus 150 cm². Volume kubus itu adalah ....","extra":[],"options":["150 cm³","25 cm³","125 cm³","625 cm³"],"statements":null,"answer":["C"],"explain":"6s² = 150, s² = 25, s = 5 cm. V = 5³ = 125 cm³. **(C)**","passage":null},{"n":28,"type":"PG","level":"L3","stem":"Sebuah huruf dipilih secara acak dari kata INDONESIA. Peluang terpilih huruf vokal adalah ....","extra":[],"options":["5/9","4/9","1/2","5/8"],"statements":null,"answer":["A"],"explain":"INDONESIA terdiri atas 9 huruf. Vokal: I, O, E, I, A = 5 huruf. P = 5/9. **(A)**","passage":null},{"n":29,"type":"PGK","level":"L3","stem":"Pilih **semua** pernyataan yang benar tentang peluang.","extra":[],"options":["Untuk setiap kejadian A berlaku 0 ≤ P(A) ≤ 1.","P(A) + P(bukan A) = 1.","Kejadian yang pasti terjadi memiliki peluang 1.","Peluang empirik selalu sama dengan peluang teoretik."],"statements":null,"answer":["A","B","C"],"explain":"A, B, dan C adalah sifat dasar peluang. Peluang empirik bisa berbeda dari peluang teoretik, terutama jika percobaannya sedikit. **(A, B, C)**","passage":null},{"n":30,"type":"PG","level":"L3","stem":"Persamaan garis yang melalui titik (2, 3) dan sejajar dengan garis 2x − y = 4 adalah ....","extra":[],"options":["y = 2x + 3","y = −2x + 7","y = x/2 + 2","y = 2x − 1"],"statements":null,"answer":["D"],"explain":"2x − y = 4 berarti y = 2x − 4, gradien 2. Garis sejajar melalui (2, 3): y − 3 = 2(x − 2), y = 2x − 1. **(D)**","passage":null}]}]</script>

<script>
"use strict";
const PKTS = JSON.parse(document.getElementById('data').textContent);
const FIGS = JSON.parse(document.getElementById('figs').textContent);
const BYID = Object.fromEntries(PKTS.map(p=>[p.id,p]));
const $app = document.getElementById('app');
const $bar = document.getElementById('bar'), $barIn = document.getElementById('barIn');
const SIM_MENIT = {MTK:90, BI:90};
/* Tempel URL Web App Google Apps Script di sini (berakhiran /exec): */
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbyCii2ITk5IkZ0JGxwebJWf3Knr7ZxdEn1_CY7HbK0ZT8l9_sj26uJFOo9D10vK-4lC/exec';

/* ---------- storage (local, best-effort) ---------- */
const LS = {
  get(k,d){try{const v=localStorage.getItem('tka9.'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('tka9.'+k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem('tka9.'+k)}catch(e){}}
};
let ME = LS.get('me', null);            // {nama, kelas}
let HIST = LS.get('hist', []);          // attempts (local)
let SESSION = LS.get('session', null);  // in-progress
let CLOUD = 'off';

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function inline(s){
  s = esc(s);
  s = s.replace(/\*\*\*(.+?)\*\*\*/g,'<b><i>$1</i></b>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*?)\*/g,'$1<i>$2</i>');
  return s;
}
function fig(id,cap){
  const svg = FIGS[id];
  if(!svg) return `<p class="muted">[Gambar: ${esc(cap)}]</p>`;
  return `<figure class="fig">${svg}<figcaption>${esc(cap)}</figcaption></figure>`;
}
function md(src){
  if(!src) return '';
  const lines = src.split('\n'); let out=[], i=0;
  const isTable = l => /^\s*\|/.test(l);
  while(i<lines.length){
    let l = lines[i];
    if(!l.trim()){i++;continue}
    const f = l.match(/^\[\[FIG:([0-9a-f-]+)\|(.*)\]\]$/);
    if(f){out.push(fig(f[1],f[2]));i++;continue}
    if(/^>/.test(l)){
      let buf=[]; while(i<lines.length && /^>/.test(lines[i])){buf.push(lines[i].replace(/^>\s?/,''));i++}
      out.push('<blockquote>'+md(buf.join('\n'))+'</blockquote>');continue;
    }
    if(isTable(l)){
      let rows=[]; while(i<lines.length && isTable(lines[i])){rows.push(lines[i]);i++}
      const cells = r => r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      let h = cells(rows[0]), body = rows.slice(1).filter(r=>!/^\s*\|\s*-/.test(r));
      out.push('<table><thead><tr>'+h.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>'+
        body.map(r=>'<tr>'+cells(r).map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>');
      continue;
    }
    if(/^\d+\.\s/.test(l)){
      let it=[]; while(i<lines.length && /^\d+\.\s/.test(lines[i])){it.push(lines[i].replace(/^\d+\.\s/,''));i++}
      out.push('<ol>'+it.map(x=>'<li>'+inline(x)+'</li>').join('')+'</ol>');continue;
    }
    if(/^[-*]\s/.test(l)){
      let it=[]; while(i<lines.length && /^[-*]\s/.test(lines[i])){it.push(lines[i].replace(/^[-*]\s/,''));i++}
      out.push('<ul>'+it.map(x=>'<li>'+inline(x)+'</li>').join('')+'</ul>');continue;
    }
    let buf=[]; while(i<lines.length && lines[i].trim() && !/^(>|\s*\||\[\[FIG|\d+\.\s|[-*]\s)/.test(lines[i])){buf.push(lines[i]);i++}
    if(!buf.length){buf.push(lines[i]);i++}
    out.push('<p>'+buf.map(x=>inline(x.replace(/\\$/,''))+(/\\$/.test(x)?'<br>':' ')).join('')+'</p>');
  }
  return out.join('');
}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function modal(html, buttons){
  return new Promise(res=>{
    const m=document.createElement('div');m.className='modal';
    m.innerHTML=`<div class="card">${html}<div class="row" style="justify-content:flex-end;margin-top:16px">${buttons.map((b,i)=>`<button class="btn ${b.pri?'pri':''}" data-i="${i}">${esc(b.t)}</button>`).join('')}</div></div>`;
    m.addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(b){m.remove();res(buttons[+b.dataset.i].v)}});
    document.body.appendChild(m);
  });
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);toast('Tersalin')}catch(e){toast('Tidak dapat menyalin otomatis. Pilih teks lalu salin manual.')}
}
const subj = id => id.startsWith('MTK')?'MTK':'BI';
const fmtDate = t => {try{return new Date(t).toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}catch(e){return ''}};
const fmtDur = s => {s=Math.max(0,Math.round(s));const m=Math.floor(s/60),x=s%60;return m+':'+String(x).padStart(2,'0')};
const typeName = {PG:'Pilihan ganda',PGK:'Pilihan ganda kompleks',KAT:'Benar / Salah'};

/* ---------- scoring ---------- */
function grade(q, a){
  // returns {pts 0..1, status 'ok'|'bad'|'part'|'empty'}
  if(q.type==='KAT'){
    const arr = a||[]; if(!arr.some(Boolean)) return {pts:0,status:'empty'};
    let c=0; q.answer.forEach((k,i)=>{if(arr[i]===k)c++});
    const pts=c/q.answer.length; return {pts,status:pts===1?'ok':pts===0?'bad':'part'};
  }
  if(q.type==='PGK'){
    const s=(a||[]).slice().sort().join(','); if(!s) return {pts:0,status:'empty'};
    const ok = s===q.answer.slice().sort().join(','); return {pts:ok?1:0,status:ok?'ok':'bad'};
  }
  if(!a) return {pts:0,status:'empty'};
  const ok = a===q.answer[0]; return {pts:ok?1:0,status:ok?'ok':'bad'};
}
function answered(q,a){ if(q.type==='KAT') return (a||[]).filter(Boolean).length===q.statements.length; if(q.type==='PGK') return (a||[]).length>0; return !!a }

/* ---------- Google Sheets ---------- */
async function initCloud(){
  if(!SHEET_URL) return;
  CLOUD='ok'; if(pendingSync()) syncCloud();
  window.addEventListener('online',()=>{if(pendingSync())syncCloud()});
}
const pendingSync = () => HIST.some(h=>!h.synced);
let syncing=false;
async function postSheet(rows){
  const r=await fetch(SHEET_URL,{method:'POST',body:JSON.stringify({action:'add',rows})});
  const j=await r.json(); if(!j.ok) throw new Error(j.error||'gagal'); return j;
}
async function syncCloud(){
  if(!SHEET_URL||syncing||!ME) return false; syncing=true;
  const todo=HIST.filter(h=>!h.synced);
  try{
    await postSheet(todo.map(compact));
    todo.forEach(h=>h.synced=true); LS.set('hist',HIST.map(stripAns)); syncing=false; return true;
  }catch(e){ syncing=false; return false }
}
const stripAns = (x,i,arr) => {const y=Object.assign({},x); if(arr && i<arr.length-20) delete y.ans; return y};
const compact = h => ({id:h.id,p:h.p,m:h.m,s:h.s,b:h.b,n:h.n,dur:h.dur,t:h.t,d:h.d,nama:h.nama,kelas:h.kelas});
function resultCode(h){
  const o=compact(h); const j=JSON.stringify(o);
  return 'TKA9.'+btoa(unescape(encodeURIComponent(j))).replace(/=+$/,'');
}
function parseCode(c){
  try{c=c.trim(); if(!c.startsWith('TKA9.')) return null; const j=decodeURIComponent(escape(atob(c.slice(5)))); const o=JSON.parse(j); if(!o.p||!BYID[o.p]) return null; return o}catch(e){return null}
}

/* ---------- routing ---------- */
let route={name:'home'}; let tabSubj = LS.get('tab','MTK');
function go(name, args={}){ route=Object.assign({name},args); window.scrollTo(0,0); render(); }
document.getElementById('btnUser').onclick=()=>go('profil');

function render(){
  stopTimer();
  $bar.classList.add('hide'); $barIn.innerHTML='';
  const bu=document.getElementById('btnUser');
  if(ME){bu.textContent=ME.nama.split(' ')[0]+' · '+ME.kelas;bu.classList.remove('hide')} else bu.classList.add('hide');
  if(!ME && route.name!=='guru') return renderLogin();
  ({home:renderHome,mode:renderMode,quiz:renderQuiz,result:renderResult,profil:renderProfil,guru:renderGuru})[route.name]();
}

/* ---------- login / profil ---------- */
function renderLogin(edit){
  $app.innerHTML=`
  <h1>Selamat datang</h1>
  <p class="muted">Latihan soal TKA HOTS kelas 9: 15 paket Matematika dan 15 paket Bahasa Indonesia, masing-masing 30 soal lengkap dengan pembahasan.</p>
  <div class="card" style="margin-top:14px">
    <label class="f" for="nm">Nama lengkap</label><input class="t" id="nm" autocomplete="name" value="${esc(ME?.nama||'')}">
    <label class="f" for="kl">Kelas</label><input class="t" id="kl" placeholder="misalnya 9A" value="${esc(ME?.kelas||'')}">
    <div class="row" style="margin-top:16px"><button class="btn pri" id="go">${edit?'Simpan':'Mulai'}</button>${edit?'<button class="btn" id="cancel">Batal</button>':''}</div>
    <p class="small muted" id="err"></p>
  </div>`;
  document.getElementById('go').onclick=()=>{
    const n=document.getElementById('nm').value.trim().replace(/\s+/g,' '), k=document.getElementById('kl').value.trim().toUpperCase().replace(/\s+/g,'');
    if(n.length<2||!k){document.getElementById('err').textContent='Isi nama dan kelas terlebih dahulu.';return}
    ME={nama:n,kelas:k}; LS.set('me',ME);
    LS.set('hist',HIST.map(stripAns));
    go('home');
  };
  if(edit) document.getElementById('cancel').onclick=()=>go('profil');
}
function renderProfil(){
  const n=HIST.length, avg=n?Math.round(HIST.reduce((a,h)=>a+h.s,0)/n):0;
  $app.innerHTML=`
  <div class="row"><button class="btn sm" id="back">← Kembali</button></div>
  <h1>${esc(ME.nama)}</h1><p class="muted">Kelas ${esc(ME.kelas)}</p>
  <div class="stats"><div class="stat"><b>${n}</b><span class="small muted">percobaan</span></div><div class="stat"><b>${avg}</b><span class="small muted">nilai rata-rata</span></div>
  <div class="stat"><b>${new Set(HIST.map(h=>h.p)).size}/30</b><span class="small muted">paket dicoba</span></div></div>
  <p class="small muted" style="margin-top:12px">${cloudNote()}</p>
  <h2>Riwayat</h2>
  ${n?`<div class="scroll"><table class="rk"><thead><tr><th>Waktu</th><th>Paket</th><th>Mode</th><th>Nilai</th><th></th></tr></thead><tbody>
  ${HIST.slice().reverse().map(h=>`<tr><td>${fmtDate(h.t)}</td><td>${esc(h.p)}</td><td>${h.m==='sim'?'Simulasi':'Latihan'}</td><td><b>${h.s}</b></td><td><button class="btn sm" data-code="${h.id}">Kode hasil</button></td></tr>`).join('')}
  </tbody></table></div>`:'<p class="muted">Belum ada riwayat.</p>'}
  <div class="row" style="margin-top:18px"><button class="btn" id="edit">Ubah nama/kelas</button></div>`;
  document.getElementById('back').onclick=()=>go('home');
  document.getElementById('edit').onclick=()=>renderLogin(true);
  $app.querySelectorAll('[data-code]').forEach(b=>b.onclick=()=>showCode(HIST.find(h=>h.id===b.dataset.code)));
}
function cloudNote(){
  if(CLOUD==='ok') return pendingSync()?'Sebagian hasil belum terkirim ke guru (mungkin sedang offline). Akan dikirim otomatis saat tersambung internet.':'Hasil sudah terkirim ke guru.';
  return 'Hasil tersimpan di perangkat ini. Agar guru dapat melihatnya, kirim "kode hasil" kepada guru.';
}
async function showCode(h){
  const c=resultCode(h);
  const r=await modal(`<b>Kode hasil ${esc(h.p)} · nilai ${h.s}</b><p class="small muted">Salin kode ini dan kirimkan kepada guru (misalnya lewat WhatsApp). Guru menempelkannya di halaman Rekap Guru.</p><div class="code-box">${esc(c)}</div>`,[{t:'Tutup',v:0},{t:'Salin kode',v:1,pri:true}]);
  if(r) copyText(c);
}

/* ---------- home ---------- */
function best(pid){ const hs=HIST.filter(h=>h.p===pid); if(!hs.length) return null; return Math.max(...hs.map(h=>h.s)) }
function renderHome(){
  const list=PKTS.filter(p=>subj(p.id)===tabSubj).sort((a,b)=>a.id.localeCompare(b.id));
  const resume = SESSION && BYID[SESSION.p];
  $app.innerHTML=`
  <h1>Halo, ${esc(ME.nama.split(' ')[0])}</h1>
  <p class="muted">Pilih paket. <b>Latihan</b>: jawaban langsung diperiksa beserta pembahasannya. <b>Simulasi</b>: ${SIM_MENIT.MTK} menit, nilai muncul di akhir.</p>
  ${resume?`<div class="card row" style="margin-top:12px;border-color:var(--accent)"><div class="grow"><b>Lanjutkan ${esc(SESSION.p)}</b> <span class="small muted">(${SESSION.m==='sim'?'Simulasi':'Latihan'}, ${Object.keys(SESSION.ans).length}/30 dijawab)</span></div><button class="btn pri sm" id="resume">Lanjutkan</button><button class="btn sm" id="drop">Hapus</button></div>`:''}
  <div class="tabs" role="tablist"><button class="${tabSubj==='MTK'?'on':''}" data-s="MTK">Matematika</button><button class="${tabSubj==='BI'?'on':''}" data-s="BI">Bahasa Indonesia</button></div>
  <div class="grid">${list.map(p=>{const b=best(p.id);const name=p.title.split('·')[1]?.trim()||p.title;
    return `<button class="card pkt" data-p="${p.id}"><span class="code">${p.id.replace(/(\D+)(\d+)/,'$1 $2')}</span><span class="tt">${esc(name)}</span>
    <span>${b===null?'<span class="badge">Belum dicoba</span>':`<span class="badge ${b>=75?'ok':b>=50?'warn':'bad'}">Terbaik: ${b}</span>`}</span></button>`}).join('')}</div>`;

let timerId=null;
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function save(){LS.set('session',SESSION)}
function renderQuiz(){
  const S=SESSION, p=BYID[S.p]; if(!p){go('home');return}
  const q=p.questions[S.i], a=S.ans[q.n], lat=S.m==='lat', checked=lat&&S.checked[q.n];
  const g=checked?grade(q,a):null;
  const pas = q.passage!=null && q.passage>=0 ? p.passages[q.passage] : null;
  let body='';
  if(q.type==='KAT'){
    body=`<table class="kat"><thead><tr><th>Pernyataan</th><th class="bs">Benar</th><th class="bs">Salah</th></tr></thead><tbody>${q.statements.map((st,i)=>{
      const sel=(a||[])[i];
      const cls=v=>{let c='bsb'; if(checked){ if(sel===v) c+= (q.answer[i]===v?' right':' wrong'); else if(q.answer[i]===v && sel!==v) c+=' miss'} else if(sel===v) c+=' sel'; return c};
      return `<tr><td>${inline(`(${i+1}) `+st)}</td><td class="bs"><button class="${cls('B')}" data-k="${i}" data-v="B" aria-label="Benar">B</button></td><td class="bs"><button class="${cls('S')}" data-k="${i}" data-v="S" aria-label="Salah">S</button></td></tr>`}).join('')}</tbody></table>`;
  } else {
    const multi=q.type==='PGK', L='ABCDE';
    body=`<div class="opts">${q.options.map((o,i)=>{const k=L[i]; const on=multi?(a||[]).includes(k):a===k;
      let c='opt'+(multi?' multi':''); if(checked){c+=' lock'; if(q.answer.includes(k)) c+=' right'; else if(on) c+=' wrong'} else if(on) c+=' sel';
      return `<div class="${c}" data-o="${k}" role="button" tabindex="0"><span class="k">${k}</span><span class="md">${inline(o)}</span></div>`}).join('')}</div>`;
  }
  const fbCls = g? (g.status==='ok'?'ok':g.status==='part'?'part':'bad'):'';
  const fbHead = g? (g.status==='ok'?'Benar!':g.status==='part'?`Sebagian benar (${Math.round(g.pts*4)}/4 pernyataan)`:'Belum tepat'):'';
  $app.innerHTML=`
  ${pas?`<details class="passage card" ${S.openPas===false?'':'open'} id="pas"><summary>Teks bacaan untuk soal nomor ${pasRange(p,q.passage)}</summary><div class="md">${md(pas)}</div></details>`:''}
  <div class="card">
    <div class="qhead"><span class="qno">Soal ${q.n}</span><span class="badge">${typeName[q.type]}</span><span class="lvl">${q.level}</span>
      ${!lat?`<button class="btn sm ghost" id="flag" style="margin-left:auto">${S.flag[q.n]?'★ Ditandai':'☆ Tandai ragu'}</button>`:''}</div>
    <div class="md">${md(q.stem)}${q.extra.map(md).join('')}</div>
    ${q.type==='PGK'&&!checked?'<p class="small muted">Pilih semua jawaban yang benar (bisa lebih dari satu).</p>':''}
    ${body}
    ${g?`<div class="fb ${fbCls}"><b class="h">${fbHead}</b>Kunci: <b>${q.answer.join(', ')}</b><div class="md small">${md(q.explain.replace(/\s*\*\*\([^)]*\)\*\*\s*$/,''))}</div></div>`:''}
  </div>
  <div class="navgrid">${p.questions.map(x=>{let c=''; if(lat&&S.checked[x.n]){const s=grade(x,S.ans[x.n]).status;c=s==='ok'?'ok':s==='part'?'part':'bad'} else if(answered(x,S.ans[x.n])) c='ans'; if(!lat&&S.flag[x.n]) c+=' flag'; if(x.n===q.n) c+=' cur'; return `<button class="${c}" data-n="${x.n-1}">${x.n}</button>`}).join('')}</div>
  <div class="row" style="margin-top:14px"><button class="btn sm" id="quit">Keluar (tersimpan)</button></div>`;
  // bar
  $bar.classList.remove('hide');
  $barIn.innerHTML=`${!lat?'<span class="timer" id="tm">--:--</span>':`<span class="small muted">${Object.keys(S.checked).length}/30 diperiksa</span>`}
    <span class="grow"></span>
    <button class="btn" id="prev" ${S.i===0?'disabled':''}>‹</button>
    ${lat&&!checked?`<button class="btn pri" id="check" ${answered(q,a)?'':'disabled'}>Periksa</button>`:''}
    ${S.i<29?`<button class="btn ${(lat&&!checked)?'':'pri'}" id="next">Berikutnya ›</button>`:''}
    <button class="btn ${S.i===29&&(!lat||checked)?'pri':''}" id="fin">Selesai</button>`;
  // events
  if(pas) document.getElementById('pas').addEventListener('toggle',e=>{S.openPas=e.target.open;save()});
  if(!checked){
    $app.querySelectorAll('[data-o]').forEach(el=>{const h=()=>{const k=el.dataset.o; if(q.type==='PGK'){let s=new Set(S.ans[q.n]||[]); s.has(k)?s.delete(k):s.add(k); S.ans[q.n]=[...s].sort(); if(!S.ans[q.n].length) delete S.ans[q.n]} else S.ans[q.n]=k; save(); renderQuiz()};
      el.onclick=h; el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();h()}}});
    $app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const arr=(S.ans[q.n]||new Array(q.statements.length).fill(null)).slice(); const i=+b.dataset.k; arr[i]=arr[i]===b.dataset.v?null:b.dataset.v; S.ans[q.n]=arr; if(!arr.some(Boolean)) delete S.ans[q.n]; save(); renderQuiz()});

  document.getElementById('quit').onclick=()=>go('home');

  const ck=document.getElementById('check'); if(ck) ck.onclick=()=>{S.checked[q.n]=true;save();renderQuiz()};
  document.getElementById('fin').onclick=()=>finishAsk();

function pasRange(p,idx){ const ns=p.questions.filter(x=>x.passage===idx).map(x=>x.n); return ns.length?ns[0]+'–'+ns[ns.length-1]:'' }
function startTimer(){
  stopTimer(); const tick=()=>{const left=(SESSION.end-Date.now())/1000; const el=document.getElementById('tm'); if(el){el.textContent=fmtDur(left);el.classList.toggle('low',left<300)} if(left<=0){stopTimer();finish(true)}};

}

    const n=Object.keys(S.checked).length;

    if(ok) finish(false);

    if(ok) finish(false);

}
function finish(auto){

  p.questions.forEach(q=>{const a=(S.m==='lat'&&!S.checked[q.n])?undefined:S.ans[q.n]; const g=grade(q,a); pts+=g.pts; if(g.status==='ok')b++; d.push(g.status==='ok'?'1':g.status==='part'?'h':'0')});

    const r=await fetch(SHEET_URL+'?action=list&pin='+encodeURIComponent(G.pin),{signal:ctl.signal}); clearTimeout(tm);

    if(!j.ok){ G.err=j.error==='pin'?'PIN salah.':'Gagal membaca data: '+(j.error||''); if(j.error==='pin'){G.pin='';LS.del('pin')} G.rows=j.error==='pin'?null:[] }

  <h2>Semua percobaan</h2>
  ${sorted.length?`<div class="scroll card"><table class="rk"><thead><tr>${[['t','Waktu'],['nama','Nama'],['kelas','Kelas'],['p','Paket'],['m','Mode'],['s','Nilai'],['b','Benar'],['dur','Durasi']].map(([k,l])=>`<th data-s="${k}">${l}${G.sort===k?(G.dir>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>
  ${sorted.map(r=>`<tr><td>${fmtDate(r.t)}</td><td>${esc(r.nama||'?')}</td><td>${esc(r.kelas||'')}</td><td>${esc(r.p)}</td><td>${r.m==='sim'?'Simulasi':'Latihan'}</td><td><b>${r.s}</b></td><td>${r.b}/30</td><td>${fmtDur(r.dur||0)}</td></tr>`).join('')}</tbody></table></div>
  <div class="row" style="margin-top:10px"><button class="btn" id="csv">Salin sebagai CSV (untuk Excel)</button></div>`:''}
  <h2>Tempel kode hasil</h2>
  <div class="card"><p class="small muted" style="margin-top:0">Untuk siswa yang hasilnya tidak terkirim otomatis (misalnya mengerjakan tanpa internet): tempel satu atau beberapa kode (satu per baris), lalu tekan Tambahkan. Hasilnya ikut masuk ke Google Sheet.</p>
  <textarea class="t" id="codes" placeholder="TKA9.…"></textarea><div class="row" style="margin-top:8px"><button class="btn pri" id="addc">Tambahkan</button><span class="small muted" id="cmsg"></span></div></div>`;
  document.getElementById('back').onclick=()=>{location.hash='';go('home')};
  document.getElementById('logout').onclick=()=>{G.pin='';G.rows=null;LS.del('pin');renderGuru()};
  document.getElementById('reload').onclick=()=>{G.rows=null;loadGuru()};
  document.getElementById('fk').onchange=e=>{G.kelas=e.target.value;renderGuru()};
  document.getElementById('fp').onchange=e=>{G.pkt=e.target.value;renderGuru()};
  document.getElementById('fm').onchange=e=>{G.mode=e.target.value;renderGuru()};
  $app.querySelectorAll('th[data-s]').forEach(th=>th.onclick=()=>{const k=th.dataset.s; if(G.sort===k)G.dir*=-1; else {G.sort=k;G.dir=k==='t'||k==='s'?-1:1} renderGuru()});
  const csv=document.getElementById('csv'); if(csv) csv.onclick=()=>{
    const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
    const t=['Waktu,Nama,Kelas,Paket,Mode,Nilai,Benar,Durasi (menit)'].concat(sorted.map(r=>[new Date(r.t).toISOString().slice(0,16).replace('T',' '),r.nama,r.kelas,r.p,r.m==='sim'?'Simulasi':'Latihan',r.s,r.b,Math.round((r.dur||0)/60)].map(q).join(','))).join('\n');
    copyText(t);
  };
  document.getElementById('addc').onclick=async()=>{
    const lines=document.getElementById('codes').value.split(/\s+/).filter(Boolean); let add=[],bad=0,dup=0;
    lines.forEach(l=>{const o=parseCode(l); if(!o){bad++;return} if((G.rows||[]).some(r=>r.id===o.id)||add.some(r=>r.id===o.id)){dup++;return} add.push(o)});
    let msg='';
    if(add.length){ try{ await postSheet(add); (G.rows=G.rows||[]).push(...add); msg=`${add.length} kode ditambahkan ke Google Sheet` }catch(e){ msg='Gagal mengirim ke Google Sheet. Coba lagi.' } }
    renderGuru();
    document.getElementById('cmsg').textContent=(msg||'Tidak ada kode baru')+(dup?`, ${dup} sudah ada`:'')+(bad?`, ${bad} tidak valid`:'');
  };
}

/* ---------- boot ---------- */
if(SESSION && !BYID[SESSION.p]) {SESSION=null;LS.del('session')}
if(location.hash==='#rekap-guru') route={name:'guru'};
render();
initCloud();
window.addEventListener('hashchange',()=>{if(location.hash==='#rekap-guru') go('guru')});
</script>
</body>
</html>
