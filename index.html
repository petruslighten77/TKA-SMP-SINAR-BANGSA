*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}

.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
h1{font-size:24px;margin:8px 0 4px}h2{font-size:19px;margin:20px 0 10px}
.muted{color:var(--muted)}.small{font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
label.f{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px}
input.t,select.t{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.tabs{display:flex;gap:6px;margin:14px 0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;padding:9px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.pkt{cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left}
.pkt .code{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.5px}

.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600}

<script id="data" type="application/json">[{"id":"BI01","title":"BI 01 · Artikel Ilmiah Populer","intro":"Fokus: menemukan informasi tersurat, ide pokok, makna kata sesuai konteks, hubungan antarparagraf, fakta dan opini, tujuan penulis, serta menarik simpulan dari artikel ilmiah populer tentang lingkungan, tubuh manusia, dan bencana alam. Setiap teks dipakai untuk 5 soal.","passages":["> **Mikroplastik: Plastik Kecil, Masalah Besar**\n>\n> (1) Plastik yang dibuang ke laut tidak benar-benar hilang. Akibat sinar matahari, gesekan ombak, dan perubahan suhu, plastik perlahan pecah menjadi kepingan yang makin kecil. Kepingan berukuran kurang dari 5 milimeter disebut mikroplastik. Sebagian mikroplastik bahkan sengaja dibuat kecil, misalnya butiran scrub pada sabun pembersih wajah.\n>\n> (2) Ukurannya yang sangat kecil membuat mikroplastik mudah tertelan oleh plankton, kerang, dan ikan kecil. Hewan-hewan itu kemudian dimakan oleh hewan yang lebih besar. Dengan cara ini, mikroplastik berpindah dari satu makhluk ke makhluk lain melalui rantai makanan, hingga akhirnya dapat sampai ke piring makan manusia.\n>\n> (3) Sejumlah penelitian juga menemukan mikroplastik dalam garam laut dan air minum kemasan. Para ilmuwan masih meneliti seberapa besar dampaknya bagi kesehatan manusia. Namun, mereka sepakat bahwa cara paling efektif untuk mengatasinya adalah mengurangi penggunaan plastik sekali pakai sejak dari sumbernya.","> **Mengapa Kita Mengantuk pada Siang Hari?**\n>\n> (1) Banyak orang merasa mengantuk sekitar pukul satu sampai tiga siang, terutama setelah makan. Rasa kantuk ini sering disalahkan pada makanan yang terlalu banyak. Padahal, makan hanyalah salah satu penyebab.\n>\n> (2) Tubuh manusia memiliki jam biologis yang disebut ritme sirkadian. Jam ini mengatur kapan kita merasa segar dan kapan kita merasa lelah dalam siklus sekitar 24 jam. Selain kantuk besar pada malam hari, ritme ini juga menimbulkan penurunan kewaspadaan yang lebih kecil pada siang hari. Karena itu, orang yang tidak makan siang pun dapat merasa mengantuk pada jam tersebut.\n>\n> (3) Makanan memang dapat memperkuat rasa kantuk, khususnya makanan tinggi karbohidrat sederhana dalam porsi besar. Untuk mengurangi kantuk, para ahli menyarankan makan siang dengan porsi secukupnya, memperbanyak sayur dan protein, cukup minum air, serta tidur cukup pada malam hari. Tidur singkat sekitar 15–20 menit juga dapat membantu memulihkan kesegaran.","> **Mangrove, Penjaga Pantai Penyimpan Karbon**\n>\n> (1) Hutan mangrove tumbuh di pantai berlumpur, tempat air laut dan air tawar bertemu. Akar-akarnya yang rapat dan mencuat dari lumpur membuat mangrove tampak berbeda dari hutan lain. Indonesia termasuk negara dengan hutan mangrove terluas di dunia.\n>\n> (2) Mangrove menyimpan karbon dalam jumlah besar. Karbon itu tidak hanya tersimpan di batang dan daun, tetapi juga di lumpur di bawahnya, yang dapat menyimpannya selama ratusan tahun. Karbon yang tersimpan di ekosistem pesisir seperti ini disebut karbon biru. Semakin banyak karbon yang tersimpan, semakin sedikit karbon dioksida yang tersisa di udara dan memperparah pemanasan global.\n>\n> (3) Selain itu, akar mangrove meredam kekuatan ombak sehingga mengurangi abrasi pantai. Di sela akarnya, ikan, udang, dan kepiting muda menemukan tempat berlindung. Sayangnya, banyak mangrove ditebang untuk tambak dan permukiman. Jika mangrove rusak, karbon yang tersimpan di lumpur dapat terlepas kembali ke udara.","> **Lebah, Si Kecil Penjaga Pangan**\n>\n> (1) Saat hinggap di bunga untuk mengisap nektar, tubuh lebah yang berbulu ditempeli serbuk sari. Ketika lebah berpindah ke bunga lain, sebagian serbuk sari itu jatuh ke kepala putik. Peristiwa ini disebut penyerbukan. Tanpa penyerbukan, banyak tanaman tidak dapat menghasilkan buah atau biji.\n>\n> (2) Lebah termasuk penyerbuk paling penting di dunia. Banyak tanaman pangan, seperti tomat, mentimun, semangka, dan kopi, sangat terbantu oleh kunjungan lebah dan serangga lain. Artinya, sebagian makanan yang kita konsumsi setiap hari bergantung pada kerja makhluk kecil ini.\n>\n> (3) Di berbagai negara, jumlah lebah dilaporkan menurun. Penyebabnya antara lain penggunaan pestisida yang berlebihan, hilangnya lahan berbunga, penyakit, dan perubahan iklim. Petani dapat membantu dengan memakai pestisida secara bijak, sedangkan masyarakat dapat menanam bunga di pekarangan sebagai sumber makanan lebah.","> **Hidup di Atas Cincin Api**\n>\n> (1) Indonesia terletak di pertemuan beberapa lempeng bumi, yaitu Lempeng Indo-Australia, Lempeng Eurasia, dan Lempeng Pasifik. Lempeng-lempeng itu terus bergerak sangat lambat, hanya beberapa sentimeter per tahun. Ketika lempeng saling bertumbukan atau bergesekan, tegangan menumpuk di dalam batuan. Saat tegangan itu lepas secara tiba-tiba, terjadilah gempa bumi.\n>\n> (2) Pertemuan lempeng juga membentuk deretan gunung api. Karena itu, Indonesia disebut berada di Cincin Api Pasifik, kawasan berbentuk tapal kuda yang dikelilingi banyak gunung api aktif dan sering mengalami gempa.\n>\n> (3) Gempa yang terjadi di dasar laut dapat mengangkat atau menurunkan dasar laut secara tiba-tiba sehingga memicu tsunami. Tanda alami tsunami antara lain guncangan kuat yang lama dan air laut yang surut tiba-tiba. Jika merasakan tanda itu saat berada di pantai, segeralah menjauh ke tempat yang tinggi tanpa menunggu peringatan resmi.","> **Gawai, Tidur, dan Otak Remaja**\n>\n> (1) Remaja membutuhkan tidur sekitar 8–10 jam setiap malam. Selama tidur, otak menyusun ulang ingatan dan menyimpan hal-hal yang dipelajari pada siang hari. Karena itu, kurang tidur dapat membuat seseorang sulit berkonsentrasi dan mudah lupa.\n>\n> (2) Kebiasaan memakai gawai sebelum tidur dapat mengganggu proses itu. Cahaya dari layar dapat menekan hormon melatonin, yaitu hormon yang memberi sinyal kepada tubuh bahwa sudah waktunya tidur. Selain itu, konten yang menarik membuat otak tetap aktif sehingga kita terus menunda tidur.\n>\n> (3) Menurut saya, aturan sederhana sudah cukup membantu: matikan gawai sekitar satu jam sebelum tidur dan letakkan di luar kamar. Waktu itu dapat diganti dengan membaca buku cetak atau mengobrol dengan keluarga. Kebiasaan kecil ini mungkin terasa berat pada awalnya, tetapi manfaatnya akan terasa di kelas keesokan harinya."],"questions":[{"n":1,"type":"PG","level":"L1","stem":"Menurut paragraf (1), yang dimaksud mikroplastik adalah ....","extra":[],"options":["semua plastik yang dibuang ke laut","kepingan plastik yang berukuran kurang dari 5 milimeter","butiran scrub pada sabun pembersih wajah saja","plastik yang hancur karena sinar matahari"],"statements":null,"answer":["B"],"explain":"Kalimat ketiga paragraf (1) mendefinisikan mikroplastik sebagai kepingan berukuran kurang dari 5 milimeter. Pilihan C hanya contoh, bukan pengertian. **(B)**","passage":0},{"n":2,"type":"PG","level":"L2","stem":"Ide pokok paragraf (2) adalah ....","extra":[],"options":["plankton memakan mikroplastik","ikan kecil dimakan hewan yang lebih besar","mikroplastik berpindah melalui rantai makanan hingga dapat sampai ke manusia","ukuran mikroplastik sangat kecil"],"statements":null,"answer":["C"],"explain":"Seluruh kalimat paragraf (2) menjelaskan perpindahan mikroplastik dari hewan kecil ke hewan besar hingga ke manusia. **(C)**","passage":0},{"n":3,"type":"KAT","level":"L3","stem":"Tentukan Benar atau Salah setiap pernyataan berdasarkan teks.","extra":[],"options":null,"statements":["Semua mikroplastik berasal dari plastik besar yang pecah.","Gesekan ombak termasuk penyebab plastik pecah menjadi kecil.","Dampak mikroplastik bagi kesehatan manusia sudah diketahui sepenuhnya.","Penulis mendorong pengurangan plastik sekali pakai."],"answer":["S","B","S","B"],"explain":"Sebagian mikroplastik sengaja dibuat kecil, jadi tidak semuanya berasal dari plastik yang pecah (1 salah). Gesekan ombak disebut sebagai penyebab (2 benar). Ilmuwan masih meneliti dampaknya (3 salah). Penulis menyebut pengurangan plastik sekali pakai sebagai cara paling efektif (4 benar). **(S, B, S, B)**","passage":0},{"n":4,"type":"PG","level":"L2","stem":"Hubungan isi paragraf (3) dengan paragraf (2) adalah paragraf (3) ....","extra":[],"options":["membantah isi paragraf (2)","menjelaskan proses pecahnya plastik","memberi contoh hewan yang menelan mikroplastik","memperluas pembahasan dengan temuan mikroplastik pada garam dan air minum serta cara mengatasinya"],"statements":null,"answer":["D"],"explain":"Paragraf (3) menambah informasi baru (temuan pada garam dan air minum) dan menutup dengan cara mengatasinya, tidak membantah paragraf (2). **(D)**","passage":0},{"n":5,"type":"PG","level":"L3","stem":"Simpulan yang paling tepat berdasarkan teks adalah ....","extra":[],"options":["Masalah mikroplastik paling efektif dicegah dengan mengurangi plastik sekali pakai sejak dari sumbernya.","Mikroplastik hanya berbahaya bagi hewan laut.","Garam laut sudah pasti tidak aman dikonsumsi.","Para ilmuwan belum sepakat tentang cara mengatasi mikroplastik."],"statements":null,"answer":["A"],"explain":"Kalimat terakhir teks menegaskan cara paling efektif. Pilihan C dan D bertentangan dengan teks (dampak masih diteliti, ilmuwan justru sepakat soal cara mengatasinya). **(A)**","passage":0},{"n":6,"type":"PG","level":"L2","stem":"Pernyataan yang sesuai dengan isi paragraf (1) adalah ....","extra":[],"options":["Makan siang adalah satu-satunya penyebab kantuk.","Kantuk pada siang hari jarang dialami orang.","Kantuk pada siang hari sering dianggap hanya disebabkan oleh makanan.","Orang biasanya mengantuk pukul satu sampai tiga dini hari."],"statements":null,"answer":["C"],"explain":"Kalimat kedua paragraf (1): rasa kantuk \"sering disalahkan pada makanan\", lalu dibantah dengan \"makan hanyalah salah satu penyebab\". **(C)**","passage":1},{"n":7,"type":"PG","level":"L2","stem":"Makna kata *kewaspadaan* pada paragraf (2) adalah ....","extra":[],"options":["kesiagaan dan kesadaran terhadap keadaan sekitar","rasa takut terhadap bahaya","sikap curiga kepada orang lain","rasa lelah setelah bekerja"],"statements":null,"answer":["A"],"explain":"*Kewaspadaan* berarti kesiagaan atau kesadaran terhadap keadaan sekitar; penurunannya membuat orang mengantuk. **(A)**","passage":1},{"n":8,"type":"PGK","level":"L3","stem":"Pilih **semua** saran yang disampaikan dalam teks untuk mengurangi kantuk.","extra":[],"options":["Makan siang dengan porsi secukupnya.","Tidak makan siang sama sekali.","Tidur singkat sekitar 15–20 menit.","Cukup minum air."],"statements":null,"answer":["A","C","D"],"explain":"Saran ahli: porsi secukupnya, sayur dan protein, cukup minum, tidur cukup, dan tidur singkat. Teks tidak menyarankan tidak makan siang. **(A, C, D)**","passage":1},{"n":9,"type":"PG","level":"L3","stem":"Bukti dalam teks yang menunjukkan bahwa makanan bukan satu-satunya penyebab kantuk pada siang hari adalah ....","extra":[],"options":["Ritme sirkadian berlangsung sekitar 24 jam.","Karbohidrat sederhana dapat memperkuat kantuk.","Tidur singkat dapat memulihkan kesegaran.","Orang yang tidak makan siang pun dapat mengantuk pada jam tersebut."],"statements":null,"answer":["D"],"explain":"Jika orang yang tidak makan pun mengantuk, berarti ada penyebab lain selain makanan, yaitu ritme sirkadian. **(D)**","passage":1},{"n":10,"type":"KAT","level":"L3","stem":"Tentukan Benar atau Salah setiap pernyataan berdasarkan teks.","extra":[],"options":null,"statements":["Ritme sirkadian adalah jam biologis tubuh.","Ritme sirkadian hanya menimbulkan rasa kantuk pada malam hari.","Makanan tinggi karbohidrat sederhana dalam porsi besar dapat memperkuat kantuk.","Tidur cukup pada malam hari termasuk saran para ahli."],"answer":["B","S","B","B"],"explain":"(1) benar sesuai paragraf (2). (2) salah: ritme ini juga menimbulkan penurunan kewaspadaan pada siang hari. (3) dan (4) sesuai paragraf (3). **(B, S, B, B)**","passage":1},{"n":11,"type":"PG","level":"L1","stem":"Menurut teks, istilah *karbon biru* berarti ....","extra":[],"options":["karbon yang terdapat di laut dalam","karbon yang tersimpan di ekosistem pesisir seperti mangrove","karbon dioksida yang ada di udara","karbon di dalam batang pohon hutan hujan"],"statements":null,"answer":["B"],"explain":"Paragraf (2): karbon yang tersimpan di ekosistem pesisir disebut karbon biru. **(B)**","passage":2},{"n":12,"type":"PG","level":"L2","stem":"Ide pokok paragraf (3) adalah ....","extra":[],"options":["akar mangrove meredam kekuatan ombak","kepiting muda berlindung di sela akar mangrove","mangrove bermanfaat bagi pantai dan hewan, tetapi terancam oleh penebangan","mangrove banyak ditebang untuk tambak"],"statements":null,"answer":["C"],"explain":"Paragraf (3) membahas manfaat akar mangrove (ombak, tempat berlindung) lalu ancaman penebangan. Pilihan lain hanya bagian kecil. **(C)**","passage":2},{"n":13,"type":"PGK","level":"L3","stem":"Pilih **semua** manfaat mangrove yang disebutkan dalam teks.","extra":[],"options":["Menyimpan karbon dalam jumlah besar.","Mengurangi abrasi pantai.","Menjadi tempat berlindung hewan muda.","Menambah luas lahan tambak."],"statements":null,"answer":["A","B","C"],"explain":"A disebut di paragraf (2), B dan C di paragraf (3). Tambak justru penyebab mangrove ditebang, bukan manfaat mangrove. **(A, B, C)**","passage":2},{"n":14,"type":"PG","level":"L3","stem":"Akibat kerusakan mangrove yang dapat disimpulkan dari paragraf (2) dan (3) adalah ....","extra":[],"options":["karbon yang tersimpan dapat terlepas ke udara sehingga memperparah pemanasan global","ombak di pantai menjadi makin lemah","jumlah ikan di pesisir bertambah","lumpur menyimpan karbon lebih banyak"],"statements":null,"answer":["A"],"explain":"Paragraf (3) menyebut karbon dapat terlepas ke udara, dan paragraf (2) menjelaskan bahwa karbon di udara memperparah pemanasan global. **(A)**","passage":2},{"n":15,"type":"PG","level":"L2","stem":"Makna kata *meredam* pada paragraf (3) adalah ....","extra":[],"options":["menghentikan sama sekali","memantulkan kembali","memperbesar","mengurangi kekuatan"],"statements":null,"answer":["D"],"explain":"*Meredam* ombak berarti mengurangi kekuatannya, bukan menghentikan sama sekali. **(D)**","passage":2},{"n":16,"type":"KAT","level":"L3","stem":"Tentukan Benar atau Salah setiap pernyataan berdasarkan teks.","extra":[],"options":null,"statements":["Serbuk sari menempel pada tubuh lebah karena tubuhnya berbulu.","Penyerbukan terjadi ketika serbuk sari jatuh ke kepala putik.","Kopi termasuk tanaman yang terbantu penyerbukannya oleh lebah.","Menurut teks, penurunan jumlah lebah hanya disebabkan oleh pestisida."],"answer":["B","B","B","S"],"explain":"(1), (2), dan (3) sesuai paragraf (1) dan (2). Paragraf (3) menyebut beberapa penyebab: pestisida, hilangnya lahan berbunga, penyakit, dan perubahan iklim (4 salah). **(B, B, B, S)**","passage":3},{"n":17,"type":"PG","level":"L2","stem":"Makna kata *bergantung* pada paragraf (2) adalah ....","extra":[],"options":["menempel di atas sesuatu","keberadaannya ditentukan oleh","menolak","menunggu"],"statements":null,"answer":["B"],"explain":"*Bergantung pada* berarti keberadaannya ditentukan atau sangat dipengaruhi oleh sesuatu. **(B)**","passage":3},{"n":18,"type":"PG","level":"L3","stem":"Tujuan penulis menulis paragraf (3) adalah ....","extra":[],"options":["menjelaskan cara beternak lebah","menghibur pembaca dengan cerita tentang lebah","menolak semua penggunaan pestisida","menyampaikan masalah penurunan jumlah lebah beserta cara ikut mengatasinya"],"statements":null,"answer":["D"],"explain":"Paragraf (3) memuat masalah (lebah menurun), penyebabnya, dan cara petani serta masyarakat membantu. Teks tidak menolak semua pestisida, hanya meminta dipakai secara bijak. **(D)**","passage":3},{"n":19,"type":"PGK","level":"L3","stem":"Pilih **semua** pernyataan yang sesuai dengan isi teks.","extra":[],"options":["Tanpa penyerbukan, banyak tanaman tidak dapat menghasilkan buah.","Lebah mengisap nektar dari kepala putik.","Masyarakat dapat membantu lebah dengan menanam bunga di pekarangan.","Lebah adalah satu-satunya hewan penyerbuk."],"statements":null,"answer":["A","C"],"explain":"A dan C tersurat. Lebah mengisap nektar dari bunga, sedangkan kepala putik adalah tempat serbuk sari jatuh (B salah). Teks menyebut \"lebah dan serangga lain\" (D salah). **(A, C)**","passage":3},{"n":20,"type":"PG","level":"L2","stem":"Judul lain yang paling sesuai untuk teks tersebut adalah ....","extra":[],"options":["Lebah Penghasil Madu","Bahaya Sengatan Lebah","Lebah, Penyerbuk Kecil Penentu Ketersediaan Pangan","Cara Menanam Bunga di Pekarangan"],"statements":null,"answer":["C"],"explain":"Teks membahas peran lebah sebagai penyerbuk yang menentukan banyak tanaman pangan. Madu dan sengatan tidak dibahas. **(C)**","passage":3},{"n":21,"type":"KAT","level":"L3","stem":"Tentukan Benar atau Salah setiap pernyataan berdasarkan teks.","extra":[],"options":null,"statements":["Gempa terjadi saat tegangan di dalam batuan lepas secara tiba-tiba.","Lempeng bumi bergerak beberapa meter per tahun.","Setiap gempa bumi pasti memicu tsunami.","Air laut yang surut tiba-tiba merupakan salah satu tanda alami tsunami."],"answer":["B","S","S","B"],"explain":"(1) dan (4) tersurat. Lempeng bergerak beberapa sentimeter, bukan meter, per tahun (2 salah). Gempa di dasar laut \"dapat\" memicu tsunami, tidak setiap gempa (3 salah). **(B, S, S, B)**","passage":4},{"n":22,"type":"PG","level":"L2","stem":"Ide pokok paragraf (1) adalah ....","extra":[],"options":["gempa terjadi karena pergerakan lempeng yang melepaskan tegangan secara tiba-tiba","Indonesia terletak di pertemuan tiga lempeng","lempeng bumi bergerak sangat lambat","batuan dapat menyimpan tegangan"],"statements":null,"answer":["A"],"explain":"Paragraf (1) menjelaskan proses terjadinya gempa akibat pergerakan lempeng. Pilihan B, C, dan D adalah rincian pendukung. **(A)**","passage":4},{"n":23,"type":"PG","level":"L2","stem":"Ungkapan *berbentuk tapal kuda* pada paragraf (2) menggambarkan ....","extra":[],"options":["warna gunung api","ukuran kawasan","jumlah gunung api","bentuk kawasan yang melengkung seperti ladam kuda"],"statements":null,"answer":["D"],"explain":"Tapal kuda (ladam) berbentuk melengkung seperti huruf U, menggambarkan bentuk kawasan Cincin Api. **(D)**","passage":4},{"n":24,"type":"PGK","level":"L3","stem":"Seseorang sedang berada di pantai dan merasakan guncangan kuat yang lama. Pilih **semua** tindakan yang sesuai dengan saran teks.","extra":[],"options":["Segera menjauh ke tempat yang tinggi.","Menunggu peringatan resmi terlebih dahulu.","Mendekati bibir pantai untuk melihat air yang surut.","Menyelamatkan diri tanpa menunggu bunyi sirene."],"statements":null,"answer":["A","D"],"explain":"Teks meminta segera menjauh ke tempat tinggi tanpa menunggu peringatan resmi. Mendekati pantai justru berbahaya. **(A, D)**","passage":4},{"n":25,"type":"PG","level":"L3","stem":"Hubungan sebab-akibat yang sesuai dengan isi teks adalah ....","extra":[],"options":["Gunung api menyebabkan lempeng bergerak.","Tsunami menyebabkan gempa di dasar laut.","Pergerakan lempeng menyebabkan gempa dan terbentuknya deretan gunung api.","Air laut yang surut menyebabkan guncangan kuat."],"statements":null,"answer":["C"],"explain":"Pertemuan dan pergerakan lempeng menimbulkan gempa (paragraf 1) dan membentuk deretan gunung api (paragraf 2). Pilihan lain membalik hubungan sebab-akibat. **(C)**","passage":4},{"n":26,"type":"KAT","level":"L3","stem":"Tentukan Benar atau Salah setiap pernyataan berdasarkan teks.","extra":[],"options":null,"statements":["Remaja membutuhkan tidur sekitar 8–10 jam setiap malam.","Hormon melatonin memberi sinyal bahwa sudah waktunya bangun.","Paragraf (3) berisi pendapat penulis.","Konten yang menarik di gawai membuat otak tetap aktif."],"answer":["B","S","B","B"],"explain":"(1) dan (4) tersurat. Melatonin memberi sinyal waktunya tidur, bukan bangun (2 salah). Paragraf (3) diawali \"Menurut saya\", menandakan pendapat (3 benar). **(B, S, B, B)**","passage":5},{"n":27,"type":"PG","level":"L2","stem":"Kalimat yang merupakan opini adalah ....","extra":[],"options":["Remaja membutuhkan tidur sekitar 8–10 jam setiap malam.","Menurut saya, aturan sederhana sudah cukup membantu.","Selama tidur, otak menyusun ulang ingatan.","Cahaya dari layar dapat menekan hormon melatonin."],"statements":null,"answer":["B"],"explain":"Ungkapan \"menurut saya\" menunjukkan pendapat pribadi penulis. Pilihan lain berisi informasi yang dapat dibuktikan. **(B)**","passage":5},{"n":28,"type":"PG","level":"L3","stem":"Simpulan yang paling tepat berdasarkan teks adalah ....","extra":[],"options":["Membatasi gawai sebelum tidur membantu remaja tidur cukup sehingga belajar lebih efektif.","Gawai harus dilarang bagi semua remaja.","Membaca buku cetak menghasilkan hormon melatonin.","Kurang tidur hanya menyebabkan rasa mengantuk."],"statements":null,"answer":["A"],"explain":"Teks menjelaskan pentingnya tidur bagi belajar dan menyarankan membatasi gawai, bukan melarangnya sama sekali. **(A)**","passage":5},{"n":29,"type":"PGK","level":"L3","stem":"Pilih **semua** akibat kurang tidur yang disebutkan dalam teks.","extra":[],"options":["Sulit berkonsentrasi.","Mudah lupa.","Berat badan bertambah.","Otak menyusun ingatan dengan lebih baik."],"statements":null,"answer":["A","B"],"explain":"Paragraf (1) menyebut sulit berkonsentrasi dan mudah lupa. Berat badan tidak dibahas, dan D justru terjadi saat tidur cukup. **(A, B)**","passage":5},{"n":30,"type":"PG","level":"L3","stem":"Urutan isi teks tersebut adalah ....","extra":[],"options":["saran – penyebab – akibat","penyebab – pentingnya tidur – saran","gangguan – saran – pentingnya tidur","pentingnya tidur – gangguan akibat gawai – saran mengatasinya"],"statements":null,"answer":["D"],"explain":"Paragraf (1) pentingnya tidur, paragraf (2) gangguan akibat gawai, paragraf (3) saran. **(D)**","passage":5}]},{"id":"BI02","title":"BI 02 · Teks Eksplanasi","intro":"Fokus: struktur teks eksplanasi (pernyataan umum, deretan penjelas, interpretasi), urutan proses, hubungan sebab-akibat, konjungsi kronologis dan kausal, istilah teknis, serta simpulan dari teks yang menjelaskan proses alam dan sosial. Setiap teks dipakai untuk 5 soal.","passages":["> **Bagaimana Hujan Terjadi?**\n>\n> (1) Hujan merupakan bagian dari siklus air yang terus berlangsung di bumi. Proses ini melibatkan matahari, laut, udara, dan daratan.\n>\n> (2) Mula-mula, panas matahari menguapkan air dari laut, sungai, danau, dan permukaan daun tumbuhan. Uap air itu naik ke udara. Makin tinggi, suhu udara makin rendah sehingga uap air mendingin dan berubah menjadi titik-titik air yang sangat kecil. Proses ini disebut kondensasi. Kumpulan titik air inilah yang tampak sebagai awan.\n>\n> (3) Selanjutnya, titik-titik air di dalam awan saling bergabung menjadi butiran yang lebih besar. Ketika butiran itu terlalu berat untuk ditahan udara, butiran jatuh ke bumi sebagai hujan. Air hujan kemudian mengalir ke sungai dan laut atau meresap ke dalam tanah, lalu menguap kembali.\n>\n> (4) Dengan demikian, air di bumi tidak pernah benar-benar habis, melainkan terus berpindah tempat dan berubah wujud.","> **Mengapa Pelangi Muncul?**\n>\n> (1) Pelangi adalah lengkungan warna-warni yang muncul di langit setelah hujan. Fenomena ini terjadi karena interaksi antara cahaya matahari dan titik-titik air di udara.\n>\n> (2) Cahaya matahari tampak putih, padahal sebenarnya tersusun atas berbagai warna. Ketika cahaya masuk ke titik air, cahaya dibelokkan atau dibiaskan. Setiap warna dibiaskan dengan sudut yang sedikit berbeda sehingga cahaya terurai menjadi merah, jingga, kuning, hijau, biru, nila, dan ungu. Cahaya itu lalu dipantulkan oleh bagian belakang titik air dan dibiaskan lagi saat keluar.\n>\n> (3) Pelangi hanya dapat dilihat jika matahari berada di belakang pengamat dan titik-titik air berada di depannya. Oleh karena itu, pelangi biasanya terlihat pada pagi atau sore hari, ketika posisi matahari masih rendah.","> **Banjir di Perkotaan**\n>\n> (1) Banjir di kota besar sering terjadi setiap musim hujan. Banjir ini tidak hanya disebabkan oleh curah hujan yang tinggi, tetapi juga oleh perubahan lingkungan akibat ulah manusia.\n>\n> (2) Di kota, sebagian besar tanah tertutup aspal, beton, dan bangunan. Akibatnya, air hujan tidak dapat meresap ke dalam tanah dan langsung mengalir di permukaan. Air itu seharusnya ditampung saluran drainase, tetapi banyak saluran tersumbat sampah atau ukurannya terlalu kecil. Selain itu, sungai menyempit karena bantarannya dipenuhi permukiman.\n>\n> (3) Ketika hujan deras turun dalam waktu lama, volume air melebihi daya tampung saluran dan sungai. Air pun meluap ke jalan dan permukiman. Jika bersamaan dengan pasang air laut, air sungai sulit mengalir ke laut sehingga banjir bertahan lebih lama.\n>\n> (4) Banjir perkotaan dapat dikurangi dengan membuat sumur resapan, memperbanyak ruang terbuka hijau, dan tidak membuang sampah ke saluran air.","> **Rahasia Roti yang Mengembang**\n>\n> (1) Adonan roti yang semula padat dapat mengembang hingga dua kali lipat setelah didiamkan. Perubahan ini terjadi berkat ragi, yaitu jamur bersel satu yang dicampurkan ke dalam adonan.\n>\n> (2) Setelah tercampur dengan tepung, air, dan sedikit gula, ragi mulai aktif. Ragi memakan gula dan menghasilkan gas karbon dioksida. Proses ini disebut fermentasi. Gas karbon dioksida terperangkap oleh jaringan gluten, yaitu protein dalam tepung terigu yang bersifat lentur seperti karet. Gelembung-gelembung gas inilah yang membuat adonan mengembang.\n>\n> (3) Ragi bekerja paling baik pada suhu hangat. Jika air yang dipakai terlalu panas, ragi akan mati sehingga adonan tidak mengembang. Sebaliknya, pada suhu dingin ragi bekerja lambat.\n>\n> (4) Saat dipanggang, gelembung gas mengembang lagi karena panas, sementara adonan mengeras. Hasilnya adalah roti yang berongga dan empuk.","> **Ketika Bulan Masuk ke Bayangan Bumi**\n>\n> (1) Gerhana bulan terjadi ketika Bulan masuk ke dalam bayangan Bumi. Peristiwa ini hanya dapat terjadi pada malam bulan purnama.\n>\n> (2) Bulan tidak memancarkan cahaya sendiri. Bulan tampak terang karena memantulkan cahaya Matahari. Pada saat purnama, Matahari, Bumi, dan Bulan hampir berada pada satu garis lurus dengan Bumi di tengah. Jika ketiganya benar-benar segaris, Bumi menghalangi cahaya Matahari yang menuju Bulan sehingga Bulan menjadi gelap.\n>\n> (3) Gerhana bulan tidak terjadi setiap purnama karena orbit Bulan sedikit miring terhadap orbit Bumi. Akibatnya, Bulan sering lewat sedikit di atas atau di bawah bayangan Bumi.\n>\n> (4) Saat gerhana bulan total, Bulan biasanya tampak merah tembaga. Warna ini muncul karena sebagian cahaya Matahari dibelokkan oleh atmosfer Bumi dan sampai ke permukaan Bulan. Berbeda dengan gerhana matahari, gerhana bulan aman diamati dengan mata telanjang.","> **Cara Vaksin Melindungi Tubuh**\n>\n> (1) Tubuh manusia memiliki sistem kekebalan yang bertugas melawan kuman penyebab penyakit. Ketika suatu kuman masuk untuk pertama kalinya, sistem kekebalan membutuhkan waktu untuk mengenalinya. Selama waktu itu, seseorang bisa jatuh sakit.\n>\n> (2) Vaksin bekerja dengan \"melatih\" sistem kekebalan sebelum kuman yang sebenarnya datang. Vaksin berisi kuman yang sudah dilemahkan, dimatikan, atau hanya bagian kecil dari kuman. Bahan ini tidak menyebabkan penyakit, tetapi cukup untuk dikenali tubuh. Sistem kekebalan lalu membentuk antibodi dan \"mengingat\" ciri-ciri kuman tersebut.\n>\n> (3) Apabila suatu saat kuman yang sebenarnya masuk, tubuh sudah siap. Antibodi dapat dibentuk dengan cepat sehingga kuman dilawan sebelum sempat menimbulkan sakit yang berat.\n>\n> (4) Jika sebagian besar warga suatu daerah sudah divaksin, penyebaran penyakit menjadi sulit. Orang yang belum dapat divaksin, misalnya bayi yang terlalu kecil, ikut terlindungi. Perlindungan bersama ini disebut kekebalan kelompok."],"questions":[{"n":1,"type":"PG","level":"L1","stem":"Menurut teks, proses berubahnya uap air menjadi titik-titik air disebut ....","extra":[],"options":["penguapan","kondensasi","peresapan","pembekuan"],"statements":null,"answer":["B"],"explain":"Paragraf (2): perubahan uap air menjadi titik air \"disebut kondensasi\". **(B)**","passage":0},{"n":2,"type":"PG","level":"L2","stem":"Perhatikan tahapan berikut. (a) uap air naik ke udara; (b) panas matahari menguapkan air; (c) butiran air jatuh sebagai hujan; (d) uap air mendingin dan membentuk awan; (e) titik-titik air bergabung menjadi butiran besar. Urutan proses yang sesuai dengan teks adalah ....","extra":[],"options":["(b) – (a) – (d) – (e) – (c)","(a) – (b) – (d) – (c) – (e)","(b) – (d) – (a) – (e) – (c)","(a) – (d) – (b) – (e) – (c)"],"statements":null,"answer":["A"],"explain":"Air menguap (b), uap naik (a), mendingin membentuk awan (d), titik air bergabung (e), lalu jatuh sebagai hujan (c). **(A)**","passage":0},{"n":3,"type":"KAT","level":"L3","stem":"Tentukan Benar atau Salah setiap pernyataan berdasarkan teks.","extra":[],"options":null,"statements":["Paragraf (1) merupakan pernyataan umum teks eksplanasi.","Uap air mendingin karena suhu udara makin rendah di tempat yang tinggi.","Air hujan hanya mengalir ke laut.","Paragraf (4) berisi interpretasi atau simpulan penulis."],"answer":["B","B","S","B"],"explain":"Paragraf (1) memperkenalkan fenomena secara umum (1 benar). (2) sesuai paragraf (2). Air hujan juga mengalir ke sungai dan meresap ke tanah (3 salah). Paragraf (4) diawali \"dengan demikian\" dan berisi simpulan (4 benar). **(B, B, S, B)**","passage":0},{"n":4,"type":"PG","level":"L2","stem":"Kata penghubung yang menyatakan urutan waktu dalam teks adalah ....","extra":[],"options":["makin, sehingga","ketika, inilah","dengan demikian, melainkan","mula-mula, selanjutnya"],"statements":null,"answer":["D"],"explain":"\"Mula-mula\" dan \"selanjutnya\" menandai urutan tahapan. \"Sehingga\" dan \"dengan demikian\" menyatakan akibat atau simpulan. **(D)**","passage":0},{"n":5,"type":"PG","level":"L3","stem":"Maksud kalimat \"air di bumi tidak pernah benar-benar habis\" pada paragraf (4) adalah ....","extra":[],"options":["jumlah air di bumi selalu bertambah","air laut tidak dapat diminum","air terus berputar dalam siklus sehingga tetap ada meskipun berpindah tempat dan berubah wujud","hujan turun setiap hari"],"statements":null,"answer":["C"],"explain":"Air tidak hilang, hanya berpindah tempat dan berubah wujud dalam siklus. **(C)**","passage":0},{"n":6,"type":"PG","level":"L2","stem":"Menurut teks, cahaya matahari dapat terurai menjadi berbagai warna karena ....","extra":[],"options":["titik air memiliki banyak warna","matahari berada di posisi rendah","cahaya dipantulkan oleh langit","setiap warna dibiaskan dengan sudut yang berbeda"],"statements":null,"answer":["D"],"explain":"Paragraf (2): \"Setiap warna dibiaskan dengan sudut yang sedikit berbeda sehingga cahaya terurai.\" **(D)**","passage":1},{"n":7,"type":"PG","level":"L2","stem":"Makna kata *dibiaskan* pada paragraf (2) adalah ....","extra":[],"options":["dibelokkan arah rambatnya","dipantulkan kembali","diserap seluruhnya","diberi warna"],"statements":null,"answer":["A"],"explain":"Teks sendiri menjelaskan \"dibelokkan atau dibiaskan\", jadi dibiaskan berarti dibelokkan arah rambatnya. **(A)**","passage":1},{"n":8,"type":"PGK","level":"L3","stem":"Pilih **semua** kondisi yang diperlukan agar pelangi dapat terlihat menurut teks.","extra":[],"options":["Matahari berada di belakang pengamat.","Titik-titik air berada di depan pengamat.","Matahari berada tepat di atas kepala.","Ada titik-titik air di udara."],"statements":null,"answer":["A","B","D"],"explain":"Paragraf (3) menyebut matahari di belakang pengamat dan titik air di depan; paragraf (1) menyebut titik-titik air di udara. Matahari tinggi justru membuat pelangi sulit terlihat. **(A, B, D)**","passage":1},{"n":9,"type":"PG","level":"L3","stem":"Berdasarkan teks, alasan pelangi jarang terlihat pada tengah hari adalah ....","extra":[],"options":["tidak pernah turun hujan pada tengah hari","matahari berada tinggi sehingga susunan matahari–pengamat–titik air sulit terpenuhi","cahaya matahari pada tengah hari tidak tersusun atas warna","titik air langsung menguap"],"statements":null,"answer":["B"],"explain":"Pelangi biasanya terlihat saat matahari rendah. Pada tengah hari matahari tinggi, sehingga syarat posisi sulit terpenuhi. **(B)**","passage":1},{"n":10,"type":"KAT","level":"L3","stem":"Tentukan Benar atau Salah setiap pernyataan berdasarkan teks.","extra":[],"options":null,"statements":["Cahaya matahari tersusun atas berbagai warna.","Cahaya dipantulkan oleh bagian depan titik air.","Teks ini termasuk eksplanasi karena menjelaskan proses terjadinya suatu fenomena.","Ungkapan \"oleh karena itu\" pada paragraf (3) menyatakan hubungan akibat."],"answer":["B","S","B","B"],"explain":"(1) benar. Cahaya dipantulkan oleh bagian belakang titik air (2 salah). (3) benar karena teks menjelaskan proses terjadinya pelangi. \"Oleh karena itu\" mengantar akibat (4 benar). **(B, S, B, B)**","passage":1},{"n":11,"type":"PG","level":"L1","stem":"Menurut paragraf (2), air hujan di kota tidak dapat meresap ke dalam tanah karena ....","extra":[],"options":["curah hujan sangat tinggi","terjadi pasang air laut","tanah tertutup aspal, beton, dan bangunan","sungai menyempit"],"statements":null,"answer":["C"],"explain":"Kalimat pertama dan kedua paragraf (2) menyatakan sebab tersebut dengan konjungsi \"akibatnya\". **(C)**","passage":2},{"n":12,"type":"PG","level":"L2","stem":"Gagasan utama paragraf (2) adalah ....","extra":[],"options":["bangunan di kota sangat banyak","berbagai kondisi kota yang membuat air hujan tidak tertampung dengan baik","saluran drainase tersumbat sampah","bantaran sungai dipenuhi permukiman"],"statements":null,"answer":["B"],"explain":"Paragraf (2) memuat beberapa kondisi: tanah tertutup, saluran tersumbat atau kecil, dan sungai menyempit. Pilihan C dan D hanya bagian. **(B)**","passage":2},{"n":13,"type":"PGK","level":"L3","stem":"Pilih **semua** penyebab banjir dalam teks yang berasal dari ulah manusia.","extra":[],"options":["Membuang sampah sehingga saluran tersumbat.","Menutup tanah dengan aspal dan beton.","Pasang air laut.","Mendirikan permukiman di bantaran sungai."],"statements":null,"answer":["A","B","D"],"explain":"Sampah di saluran, tanah tertutup beton, dan permukiman di bantaran adalah ulah manusia. Pasang air laut adalah peristiwa alam. **(A, B, D)**","passage":2},{"n":14,"type":"PG","level":"L3","stem":"Menurut teks, banjir dapat bertahan lebih lama jika terjadi bersamaan dengan pasang air laut karena ....","extra":[],"options":["air laut masuk ke rumah warga","hujan menjadi makin deras","saluran drainase makin kecil","air sungai sulit mengalir ke laut"],"statements":null,"answer":["D"],"explain":"Paragraf (3): saat pasang, \"air sungai sulit mengalir ke laut sehingga banjir bertahan lebih lama\". **(D)**","passage":2},{"n":15,"type":"PG","level":"L2","stem":"Dalam struktur teks eksplanasi, paragraf (4) berfungsi sebagai ....","extra":[],"options":["pernyataan umum","deretan penjelas proses","penutup yang berisi upaya mengurangi banjir","orientasi cerita"],"statements":null,"answer":["C"],"explain":"Paragraf (4) menutup teks dengan cara mengurangi banjir, sesuai fungsi interpretasi atau penutup. Orientasi adalah bagian teks narasi. **(C)**","passage":2},{"n":16,"type":"KAT","level":"L3","stem":"Tentukan Benar atau Salah setiap pernyataan berdasarkan teks.","extra":[],"options":null,"statements":["Ragi adalah jamur bersel satu.","Fermentasi oleh ragi menghasilkan gas oksigen.","Gluten berperan menahan gas di dalam adonan.","Air yang sangat panas membuat ragi bekerja lebih cepat."],"answer":["B","S","B","S"],"explain":"(1) dan (3) tersurat. Fermentasi menghasilkan karbon dioksida, bukan oksigen (2 salah). Air terlalu panas membuat ragi mati (4 salah). **(B, S, B, S)**","passage":3},{"n":17,"type":"PG","level":"L2","stem":"Makna kata *terperangkap* pada paragraf (2) adalah ....","extra":[],"options":["tertahan dan tidak dapat keluar","terbuang ke udara","terbakar habis","tercampur rata"],"statements":null,"answer":["A"],"explain":"Gas terperangkap oleh gluten, artinya tertahan di dalam adonan dan tidak keluar sehingga adonan mengembang. **(A)**","passage":3},{"n":18,"type":"PG","level":"L3","stem":"Rina membuat adonan roti dengan air mendidih. Berdasarkan teks, akibat yang paling mungkin adalah ....","extra":[],"options":["adonan mengembang lebih cepat","roti menjadi lebih empuk","ragi mati sehingga adonan tidak mengembang","gluten menjadi lebih lentur"],"statements":null,"answer":["C"],"explain":"Paragraf (3): air terlalu panas membuat ragi mati sehingga adonan tidak mengembang. **(C)**","passage":3},{"n":19,"type":"PGK","level":"L3","stem":"Pilih **semua** hal yang membantu adonan mengembang menurut teks.","extra":[],"options":["Gula sebagai makanan ragi.","Suhu yang hangat.","Air yang mendidih.","Gluten dari tepung terigu."],"statements":null,"answer":["A","B","D"],"explain":"Gula menjadi makanan ragi, suhu hangat membuat ragi bekerja baik, dan gluten menahan gas. Air mendidih justru mematikan ragi. **(A, B, D)**","passage":3},{"n":20,"type":"PG","level":"L2","stem":"Kata *sebaliknya* pada paragraf (3) menyatakan hubungan ....","extra":[],"options":["sebab","waktu","tujuan","pertentangan"],"statements":null,"answer":["D"],"explain":"\"Sebaliknya\" mempertentangkan suhu panas (ragi mati) dengan suhu dingin (ragi lambat). **(D)**","passage":3},{"n":21,"type":"KAT","level":"L3","stem":"Tentukan Benar atau Salah setiap pernyataan berdasarkan teks.","extra":[],"options":null,"statements":["Gerhana bulan hanya dapat terjadi pada malam bulan purnama.","Saat gerhana bulan, Bulan berada di antara Matahari dan Bumi.","Orbit Bulan yang miring menyebabkan gerhana tidak terjadi setiap purnama.","Gerhana bulan berbahaya diamati tanpa pelindung mata."],"answer":["B","S","B","S"],"explain":"(1) dan (3) tersurat. Saat gerhana bulan, Bumi yang berada di tengah (2 salah). Gerhana bulan aman diamati dengan mata telanjang (4 salah). **(B, S, B, S)**","passage":4},{"n":22,"type":"PG","level":"L2","stem":"Menurut teks, Bulan tampak merah tembaga saat gerhana total karena ....","extra":[],"options":["Bulan memancarkan cahaya merah","sebagian cahaya Matahari dibelokkan atmosfer Bumi hingga sampai ke Bulan","permukaan Bulan terbakar","bayangan Bumi berwarna merah"],"statements":null,"answer":["B"],"explain":"Paragraf (4): cahaya Matahari dibelokkan atmosfer Bumi sampai ke Bulan. Bulan tidak memancarkan cahaya sendiri. **(B)**","passage":4},{"n":23,"type":"PG","level":"L2","stem":"Informasi yang terdapat pada paragraf (2) adalah ....","extra":[],"options":["posisi Matahari, Bumi, dan Bulan ketika gerhana terjadi","warna Bulan saat gerhana total","kemiringan orbit Bulan","keamanan mengamati gerhana"],"statements":null,"answer":["A"],"explain":"Paragraf (2) menjelaskan posisi ketiga benda langit saat purnama dan gerhana. Warna dan keamanan dibahas di paragraf (4), kemiringan orbit di paragraf (3). **(A)**","passage":4},{"n":24,"type":"PGK","level":"L3","stem":"Pilih **semua** kalimat dari teks yang menunjukkan hubungan sebab-akibat.","extra":[],"options":["Bulan tampak terang karena memantulkan cahaya Matahari.","Peristiwa ini hanya dapat terjadi pada malam bulan purnama.","Orbit Bulan miring, akibatnya Bulan sering lewat di atas atau di bawah bayangan Bumi.","Bumi menghalangi cahaya Matahari sehingga Bulan menjadi gelap."],"statements":null,"answer":["A","C","D"],"explain":"A (karena), C (akibatnya), dan D (sehingga) menunjukkan sebab-akibat. B hanya menyatakan waktu terjadinya. **(A, C, D)**","passage":4},{"n":25,"type":"PG","level":"L3","stem":"Perbedaan gerhana bulan dengan gerhana matahari yang disebutkan dalam teks adalah ....","extra":[],"options":["waktu terjadinya","warna Bulan","lamanya gerhana","gerhana bulan aman diamati dengan mata telanjang"],"statements":null,"answer":["D"],"explain":"Kalimat terakhir paragraf (4) membandingkan keduanya dari segi keamanan pengamatan. **(D)**","passage":4},{"n":26,"type":"KAT","level":"L3","stem":"Tentukan Benar atau Salah setiap pernyataan berdasarkan teks.","extra":[],"options":null,"statements":["Vaksin dapat berisi kuman yang sudah dilemahkan atau dimatikan.","Bahan dalam vaksin dimaksudkan untuk membuat seseorang sakit ringan.","Setelah tubuh \"mengingat\" kuman, antibodi dapat dibentuk lebih cepat.","Kekebalan kelompok juga melindungi orang yang belum dapat divaksin."],"answer":["B","S","B","B"],"explain":"(1), (3), dan (4) tersurat. Teks menegaskan bahan vaksin \"tidak menyebabkan penyakit\" (2 salah). **(B, S, B, B)**","passage":5},{"n":27,"type":"PG","level":"L2","stem":"Tanda petik pada kata \"melatih\" di paragraf (2) menunjukkan bahwa kata itu ....","extra":[],"options":["kata serapan dari bahasa asing","judul sebuah tulisan","bermakna kiasan, bukan makna sebenarnya","kutipan langsung ucapan tokoh"],"statements":null,"answer":["C"],"explain":"Sistem kekebalan tidak benar-benar dilatih seperti atlet; tanda petik menandai makna kiasan. **(C)**","passage":5},{"n":28,"type":"PG","level":"L3","stem":"Simpulan yang paling tepat berdasarkan teks adalah ....","extra":[],"options":["Vaksin menyembuhkan penyakit yang sedang diderita.","Vaksin mempersiapkan sistem kekebalan sehingga tubuh cepat melawan kuman dan masyarakat ikut terlindungi.","Bayi tidak perlu dilindungi dari penyakit.","Antibodi hanya dapat dibentuk oleh vaksin."],"statements":null,"answer":["B"],"explain":"Teks menjelaskan cara vaksin menyiapkan kekebalan (paragraf 2–3) dan manfaat kekebalan kelompok (paragraf 4). Vaksin bersifat mencegah, bukan menyembuhkan. **(B)**","passage":5},{"n":29,"type":"PGK","level":"L3","stem":"Pilih **semua** pernyataan yang sesuai dengan isi teks.","extra":[],"options":["Sistem kekebalan membutuhkan waktu untuk mengenali kuman yang baru pertama kali masuk.","Vaksin selalu berisi kuman hidup yang kuat.","Bayi yang terlalu kecil termasuk orang yang mungkin belum dapat divaksin.","Kekebalan kelompok membuat penyakit makin mudah menyebar."],"statements":null,"answer":["A","C"],"explain":"A dan C tersurat. Vaksin berisi kuman yang dilemahkan atau dimatikan, bukan kuman kuat (B salah). Kekebalan kelompok justru membuat penyebaran sulit (D salah). **(A, C)**","passage":5},{"n":30,"type":"PG","level":"L2","stem":"Kata *apabila* pada paragraf (3) dapat diganti dengan kata ....","extra":[],"options":["jika","karena","sehingga","meskipun"],"statements":null,"answer":["A"],"explain":"*Apabila* menyatakan syarat, sama dengan *jika*. **(A)**","passage":5}]},{"id":"BI03","title":"BI 03 · Berita dan Laporan","intro":"Fokus: unsur berita (5W + 1H), teras berita, judul yang tepat, fakta dan opini, kutipan langsung dan tidak langsung, struktur laporan hasil observasi, serta laporan kegiatan. Semua nama tempat dan tokoh dalam teks bersifat rekaan. Setiap teks dipakai untuk 5 soal.","passages":["> **Tim Robotik SMP Negeri 3 Tanjung Harapan Raih Juara Nasional**\n>\n> (1) TANJUNG HARAPAN – Tim robotik SMP Negeri 3 Tanjung Harapan meraih juara pertama dalam Lomba Robot Pelajar Tingkat Nasional yang digelar di Bandung, Sabtu (7/11). Tim yang beranggotakan tiga siswa kelas 9 itu mengalahkan 42 tim dari berbagai provinsi.\n>\n> (2) Robot buatan mereka dirancang untuk memilah sampah plastik dan kertas secara otomatis. Menurut ketua tim, Nadia Putri, ide itu muncul karena tumpukan sampah di kantin sekolah. \"Kami ingin robot yang bermanfaat untuk lingkungan sekolah sendiri,\" ujarnya.\n>\n> (3) Kepala sekolah, Hendra Saputra, mengatakan bahwa tim berlatih hampir setiap sore selama tiga bulan. Ia berharap prestasi ini memotivasi siswa lain. \"Menurut saya, ini prestasi terbaik sekolah kami dalam sepuluh tahun terakhir,\" katanya.","> **Banjir Rob Kembali Rendam Desa Pantai Lestari**\n>\n> (1) Desa Pantai Lestari, Kecamatan Sukaramai, kembali dilanda banjir rob pada Selasa (10/11) pagi. Air laut pasang setinggi 40–60 sentimeter merendam sekitar 150 rumah warga dan jalan utama desa.\n>\n> (2) Banjir rob terjadi ketika air laut pasang lebih tinggi daripada daratan di sekitarnya. Kepala Desa Pantai Lestari, Sumarni, menyebutkan bahwa rob makin sering terjadi dalam lima tahun terakhir. Menurutnya, hal itu disebabkan oleh penurunan permukaan tanah dan rusaknya hutan mangrove di sepanjang pantai.\n>\n> (3) Warga terpaksa meninggikan lantai rumah dan memindahkan barang ke tempat yang lebih tinggi. Pemerintah kecamatan berencana membangun tanggul sementara dan mengajak warga menanam kembali mangrove pada bulan depan.","> **Tanaman Padi**\n>\n> (1) Padi adalah tanaman pangan yang menghasilkan beras, makanan pokok sebagian besar penduduk Indonesia. Padi termasuk tumbuhan rumput-rumputan dan biasanya ditanam di sawah yang tergenang air.\n>\n> (2) Tanaman padi terdiri atas akar, batang, daun, dan malai. Akarnya berupa akar serabut. Batangnya beruas-ruas dan berongga. Daunnya panjang dan sempit dengan tulang daun sejajar. Malai adalah kumpulan bulir padi yang tumbuh di ujung batang.\n>\n> (3) Padi dapat dipanen sekitar tiga sampai empat bulan setelah tanam, tergantung varietasnya. Bulir yang siap panen berwarna kuning keemasan dan merunduk karena berat.\n>\n> (4) Selain beras, tanaman padi menghasilkan jerami yang dapat dimanfaatkan sebagai pakan ternak, pupuk, atau media tanam jamur.","> **Harga Cabai Rawit Melonjak, Pemkot Siapkan Pasar Murah**\n>\n> (1) Harga cabai rawit di Pasar Induk Kota Sejahtera melonjak dalam dua minggu terakhir. Jika pada akhir Oktober harganya Rp45.000 per kilogram, kini mencapai Rp80.000 per kilogram.\n>\n> (2) Menurut pedagang, kenaikan harga terjadi karena pasokan dari petani berkurang. Hujan deras yang turun terus-menerus membuat banyak tanaman cabai busuk sebelum dipanen. \"Barang sedikit, pembeli tetap banyak. Jadi harga naik,\" kata Darto, salah seorang pedagang.\n>\n> (3) Dinas Perdagangan Kota Sejahtera akan menggelar pasar murah di lima kecamatan mulai pekan depan. Warga diimbau tidak membeli cabai secara berlebihan. Sebagai alternatif, warga dapat menanam cabai di pot atau memakai cabai kering.","> **SMP Harapan Bangsa Resmikan Bank Sampah Sekolah**\n>\n> (1) SMP Harapan Bangsa meresmikan bank sampah sekolah pada Senin (9/11). Melalui bank sampah ini, siswa dapat menyetorkan sampah anorganik yang sudah dipilah, seperti botol plastik, kardus, dan kaleng.\n>\n> (2) Setiap sampah yang disetor ditimbang dan dicatat dalam buku tabungan. Nilainya dihitung berdasarkan jenis dan berat sampah. Saldo tabungan dapat ditukarkan dengan alat tulis atau digunakan untuk membayar kegiatan sekolah.\n>\n> (3) Guru pembina, Ratna Dewi, menjelaskan bahwa program ini bertujuan menumbuhkan kebiasaan memilah sampah. Dalam minggu pertama, sudah terkumpul 85 kilogram sampah. \"Anak-anak sangat antusias. Bahkan ada yang membawa sampah dari rumah,\" ujarnya.","> **Laporan Kunjungan ke Museum Sejarah Kota**\n>\n> (1) Pada Kamis, 5 November 2026, siswa kelas 9 SMP Tunas Muda mengunjungi Museum Sejarah Kota. Kegiatan ini bertujuan menambah pemahaman siswa tentang sejarah perjuangan daerah.\n>\n> (2) Rombongan berangkat pukul 07.30 dan tiba pukul 08.45. Di museum, siswa dibagi menjadi empat kelompok. Setiap kelompok dipandu oleh petugas museum untuk melihat koleksi senjata tradisional, foto-foto perjuangan, dan diorama pertempuran.\n>\n> (3) Setelah berkeliling, siswa mengikuti sesi tanya jawab dan mencatat informasi penting untuk tugas laporan. Kegiatan berakhir pukul 12.00.\n>\n> (4) Melalui kunjungan ini, siswa memperoleh pengalaman belajar langsung yang tidak didapat di kelas. Sebaiknya kegiatan serupa diadakan setiap semester."],"questions":[{"n":1,"type":"PG","level":"L1","stem":"Lomba Robot Pelajar Tingkat Nasional diselenggarakan di ....","extra":[],"options":["Tanjung Harapan","Bandung","kantin sekolah","SMP Negeri 3 Tanjung Harapan"],"statements":null,"answer":["B"],"explain":"Paragraf (1): lomba \"digelar di Bandung\". Tanjung Harapan adalah asal sekolah. **(B)**","passage":0},{"n":2,"type":"PG","level":"L2","stem":"Kalimat yang merupakan opini dalam berita tersebut adalah ....","extra":[],"options":["Tim itu mengalahkan 42 tim dari berbagai provinsi.","Robot itu dirancang untuk memilah sampah plastik dan kertas.","\"Menurut saya, ini prestasi terbaik sekolah kami dalam sepuluh tahun terakhir.\"","Tim berlatih hampir setiap sore selama tiga bulan."],"statements":null,"answer":["C"],"explain":"Ungkapan \"menurut saya\" dan penilaian \"terbaik\" menunjukkan pendapat. Pilihan lain adalah fakta yang dapat dibuktikan. **(C)**","passage":0},{"n":3,"type":"KAT","level":"L3","stem":"Tentukan Benar atau Salah setiap pernyataan berdasarkan berita.","extra":[],"options":null,"statements":["Lomba diadakan pada hari Sabtu.","Tim robotik terdiri atas tiga siswa kelas 9.","Ide robot muncul dari tumpukan sampah di kantin sekolah.","Paragraf (3) menjelaskan cara kerja robot."],"answer":["B","B","B","S"],"explain":"(1), (2), dan (3) tersurat di paragraf (1) dan (2). Paragraf (3) berisi latihan tim dan harapan kepala sekolah, bukan cara kerja robot (4 salah). **(B, B, B, S)**","passage":0},{"n":4,"type":"PG","level":"L2","stem":"Bagian teras berita (bagian yang memuat inti peristiwa) terdapat pada ....","extra":[],"options":["paragraf (1)","paragraf (2)","paragraf (3)","judul saja"],"statements":null,"answer":["A"],"explain":"Teras berita adalah paragraf pertama yang memuat inti peristiwa: siapa, apa, di mana, dan kapan. **(A)**","passage":0},{"n":5,"type":"PG","level":"L3","stem":"Perubahan kutipan langsung Nadia pada paragraf (2) menjadi kalimat tidak langsung yang tepat adalah ....","extra":[],"options":["Nadia mengatakan, \"Mereka ingin robot yang bermanfaat.\"","Nadia berkata bahwa kami ingin robot yang bermanfaat untuk lingkungan sekolah sendiri.","\"Mereka ingin robot yang bermanfaat,\" kata Nadia.","Nadia mengatakan bahwa mereka ingin robot yang bermanfaat untuk lingkungan sekolah sendiri."],"statements":null,"answer":["D"],"explain":"Pada
